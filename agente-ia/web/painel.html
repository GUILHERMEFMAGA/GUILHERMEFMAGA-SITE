<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NÚCLEO — Agente de IA local</title>
<style>
  :root{
    --fundo:#0b1020; --fundo2:#131a33; --borda:#243055; --texto:#e8ecff;
    --suave:#9aa6d4; --verde:#39d98a; --azul:#5b8cff; --roxo:#a06bff; --amarelo:#ffcc66;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 600px at 15% -10%, #1b2450 0%, var(--fundo) 55%);
    color:var(--texto); min-height:100vh; display:flex; flex-direction:column;
  }
  header{
    padding:14px 20px; border-bottom:1px solid var(--borda); display:flex;
    align-items:center; gap:12px; background:rgba(11,16,32,.75); backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:10;
  }
  header h1{margin:0; font-size:18px; letter-spacing:.5px}
  header .tag{font-size:11px; padding:3px 8px; border-radius:999px;
    background:linear-gradient(90deg,var(--azul),var(--roxo)); font-weight:600}
  header .off{font-size:12px; color:var(--suave); margin-left:auto}
  .layout{display:flex; flex:1; min-height:0}
  aside{
    width:300px; padding:16px; border-right:1px solid var(--borda);
    background:rgba(19,26,51,.55); overflow-y:auto;
  }
  aside h2{font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--suave); margin:16px 0 8px}
  .cartao{background:var(--fundo2); border:1px solid var(--borda); border-radius:12px; padding:12px; margin-bottom:10px}
  .cartao .num{font-size:20px; font-weight:700}
  .cartao .rot{font-size:11px; color:var(--suave)}
  .grade{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  button{
    font-family:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--borda);
    background:#1b2450; color:var(--texto); padding:9px 12px; font-size:13px; transition:.15s;
  }
  button:hover{border-color:var(--azul); background:#22305f}
  button.principal{background:linear-gradient(90deg,var(--azul),var(--roxo)); border:none; font-weight:600}
  button:disabled{opacity:.5; cursor:wait}
  .fluxo{display:flex; align-items:center; gap:8px; justify-content:space-between;
    padding:8px 10px; border:1px solid var(--borda); border-radius:10px; margin-bottom:6px; font-size:13px}
  .fluxo small{display:block; color:var(--suave); font-size:11px}
  .fluxo button{padding:5px 9px; font-size:12px}
  pre.arquivos{font-size:11px; color:var(--suave); white-space:pre-wrap; margin:0;
    max-height:180px; overflow:auto}
  main{flex:1; display:flex; flex-direction:column; min-width:0}
  #conversa{flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:14px}
  .msg{max-width:min(760px,85%); padding:12px 14px; border-radius:14px; line-height:1.5;
    white-space:pre-wrap; word-wrap:break-word; font-size:14.5px}
  .humano{align-self:flex-end; background:linear-gradient(135deg,#2b47a8,#5b3fa8); border-bottom-right-radius:4px}
  .agente{align-self:flex-start; background:var(--fundo2); border:1px solid var(--borda); border-bottom-left-radius:4px}
  .meta{font-size:11px; color:var(--suave); margin-top:8px; border-top:1px dashed var(--borda); padding-top:6px}
  .meta b{color:var(--verde)}
  .digitando{align-self:flex-start; color:var(--suave); font-size:13px; font-style:italic}
  footer{border-top:1px solid var(--borda); padding:14px; display:flex; gap:10px; align-items:center;
    background:rgba(11,16,32,.85)}
  #entrada{flex:1; background:var(--fundo2); border:1px solid var(--borda); color:var(--texto);
    border-radius:12px; padding:13px 14px; font-size:14.5px; font-family:inherit; resize:none; min-height:48px; max-height:150px}
  #entrada:focus{outline:none; border-color:var(--azul)}
  label.caixa{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--suave); white-space:nowrap}
  .exemplos{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
  .exemplos button{font-size:12px; padding:6px 10px; background:#141c39}
  @media (max-width:860px){
    .layout{flex-direction:column}
    aside{width:auto; border-right:none; border-bottom:1px solid var(--borda); max-height:44vh}
    .msg{max-width:95%}
  }
</style>
</head>
<body>
<header>
  <h1>NÚCLEO</h1>
  <span class="tag">IA local · sem API · sem Ollama</span>
  <span class="off" id="estado">carregando…</span>
</header>

<div class="layout">
  <aside>
    <button class="principal" style="width:100%" onclick="treinar()" id="btnTreinar">🧠 Treinar a rede agora</button>

    <h2>Estado do cérebro</h2>
    <div class="grade">
      <div class="cartao"><div class="num" id="sIntencoes">–</div><div class="rot">intenções</div></div>
      <div class="cartao"><div class="num" id="sPalavras">–</div><div class="rot">palavras no vocabulário</div></div>
      <div class="cartao"><div class="num" id="sPesos">–</div><div class="rot">parâmetros (pesos)</div></div>
      <div class="cartao"><div class="num" id="sTopicos">–</div><div class="rot">tópicos de conhecimento</div></div>
      <div class="cartao"><div class="num" id="sFatos">–</div><div class="rot">fatos sobre você</div></div>
      <div class="cartao"><div class="num" id="sFerramentas">–</div><div class="rot">ferramentas</div></div>
    </div>

    <h2>Fluxos de automação</h2>
    <div id="listaFluxos"></div>

    <h2>Arquivos criados</h2>
    <pre class="arquivos" id="arquivos">–</pre>

    <h2>Exemplos para testar</h2>
    <div class="exemplos">
      <button onclick="enviarRapido('oi, tudo bem?')">saudação</button>
      <button onclick="enviarRapido('quanto é (25 * 4) + 10')">conta</button>
      <button onclick="enviarRapido('meu nome é Guilherme')">memória</button>
      <button onclick="enviarRapido('o que você sabe sobre mim?')">lembrar</button>
      <button onclick="enviarRapido('salve uma nota chamada diario.txt com: hoje eu avancei no projeto')">salvar arquivo</button>
      <button onclick="enviarRapido('o que é backpropagation?')">conhecimento</button>
      <button onclick="enviarRapido('invente uma frase')">criativo</button>
      <button onclick="enviarRapido('conte uma piada')">humor</button>
    </div>
  </aside>

  <main>
    <div id="conversa"></div>
    <footer>
      <textarea id="entrada" rows="1" placeholder="Escreva aqui e aperte Enter (Shift+Enter quebra linha)…"></textarea>
      <label class="caixa"><input type="checkbox" id="raiox" /> raio-x</label>
      <button class="principal" onclick="enviar()" id="btnEnviar">Enviar</button>
    </footer>
  </main>
</div>

<script>
const conversa = document.getElementById('conversa');
const entrada = document.getElementById('entrada');

function escapeHtml(t){
  return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function bolha(papel, texto, meta){
  const div = document.createElement('div');
  div.className = 'msg ' + papel;
  div.innerHTML = escapeHtml(texto) + (meta ? '<div class="meta">' + meta + '</div>' : '');
  conversa.appendChild(div);
  conversa.scrollTop = conversa.scrollHeight;
  return div;
}

async function enviar(){
  const texto = entrada.value.trim();
  if(!texto) return;
  entrada.value = '';
  entrada.style.height = 'auto';
  bolha('humano', texto);
  const digitando = bolha('digitando', 'NÚCLEO está pensando…');
  const raiox = document.getElementById('raiox').checked;
  try{
    const resposta = await fetch('api/conversar', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({texto, raio_x: raiox})
    });
    const dados = await resposta.json();
    digitando.remove();
    let meta = 'rota: <b>' + escapeHtml(dados.rota) + '</b>' +
               ' · confiança: ' + (dados.confianca ?? 0) +
               ' · ' + dados.tempo_ms + ' ms';
    if(dados.intencao){ meta += ' · intenção: ' + escapeHtml(dados.intencao); }
    if(raiox){
      meta += '<br>decisão: ' + escapeHtml(dados.detalhe_da_decisao || '');
      if(dados.ranking_intencoes && dados.ranking_intencoes.length){
        meta += '<br>top intenções: ' + dados.ranking_intencoes.map(
          p => escapeHtml(p[0]) + ' (' + p[1] + ')').join(', ');
      }
    }
    bolha('agente', dados.resposta, meta);
    atualizarPainel();
  }catch(erro){
    digitando.remove();
    bolha('agente', 'Erro de comunicação com o servidor Python: ' + erro);
  }
}

function enviarRapido(t){ entrada.value = t; enviar(); }

entrada.addEventListener('keydown', (evento) => {
  if(evento.key === 'Enter' && !evento.shiftKey){ evento.preventDefault(); enviar(); }
});
entrada.addEventListener('input', () => {
  entrada.style.height = 'auto';
  entrada.style.height = Math.min(150, entrada.scrollHeight) + 'px';
});

async function atualizarPainel(){
  try{
    const r = await fetch('api/estado');
    const d = await r.json();
    document.getElementById('sIntencoes').textContent = d.intencoes;
    document.getElementById('sPalavras').textContent = d.vocabulario;
    document.getElementById('sPesos').textContent = d.pesos;
    document.getElementById('sTopicos').textContent = d.topicos;
    document.getElementById('sFatos').textContent = d.fatos;
    document.getElementById('sFerramentas').textContent = d.ferramentas;
    document.getElementById('arquivos').textContent = d.arquivos || 'nenhum ainda';
    document.getElementById('estado').textContent =
      'ligado · ' + d.hora + (d.decisoes ? ' · ' + d.decisoes + ' decisões nesta sessão' : '');

    const fluxos = await (await fetch('api/fluxos')).json();
    const alvo = document.getElementById('listaFluxos');
    alvo.innerHTML = '';
    fluxos.fluxos.forEach(f => {
      const div = document.createElement('div');
      div.className = 'fluxo';
      div.innerHTML = '<div><b>' + escapeHtml(f.nome) + '</b><small>' + escapeHtml(f.quando) + '</small></div>' +
                      '<button onclick="rodarFluxo(\'' + escapeHtml(f.nome) + '\')">rodar</button>';
      alvo.appendChild(div);
    });
  }catch(erro){ /* silencioso */ }
}

async function rodarFluxo(nome){
  const digitando = bolha('digitando', 'Executando o fluxo ' + nome + '…');
  try{
    const r = await fetch('api/fluxo', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({nome})});
    const d = await r.json();
    digitando.remove();
    bolha('agente', d.resposta, 'rota: <b>fluxo</b> · ' + d.tempo_ms + ' ms');
    atualizarPainel();
  }catch(erro){ digitando.remove(); bolha('agente', 'Erro ao rodar o fluxo: ' + erro); }
}

async function treinar(){
  const botao = document.getElementById('btnTreinar');
  botao.disabled = true; botao.textContent = 'treinando…';
  const aviso = bolha('digitando', 'Treinando a rede neural do zero (alguns segundos)…');
  try{
    const r = await fetch('api/treinar', {method:'POST'});
    const d = await r.json();
    aviso.remove();
    bolha('agente', 'Treino concluído!\n' + d.mensagem, 'rota: <b>treino</b> · ' + d.tempo_ms + ' ms');
    atualizarPainel();
  }catch(erro){ aviso.remove(); bolha('agente', 'Erro no treino: ' + erro); }
  botao.disabled = false; botao.textContent = '🧠 Treinar a rede agora';
}

bolha('agente',
  'Olá! Eu sou o NÚCLEO, seu agente de IA rodando 100% dentro do seu computador.\n\n' +
  'Sem API paga, sem Ollama, sem nuvem: rede neural escrita à mão em Python puro.\n\n' +
  'Experimente:\n' +
  '  • "quanto é (25 * 4) + 10"\n' +
  '  • "salve uma nota chamada diario.txt com: hoje eu criei um agente"\n' +
  '  • "meu nome é ..." e depois "o que você sabe sobre mim?"\n' +
  '  • "o que é backpropagation?"\n' +
  '  • clique em "rodar" em um dos fluxos ao lado (estilo n8n)');
atualizarPainel();
setInterval(atualizarPainel, 15000);
</script>
</body>
</html>
