name: Publish Rua Vermelha

on:
  push:
    branches:
      - arena/01a0fadb-guilhermefmaga-site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the game
        uses: actions/upload-pages-artifact@v3
        with:
          path: jogo
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
