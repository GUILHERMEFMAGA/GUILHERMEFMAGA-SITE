name: Baixar GIF do visual.md

# Este workflow existe só para buscar o binário do GIF anexado no GitHub
# (o sandbox da sessão não alcança o CDN de anexos). Ele roda uma vez quando
# este arquivo é enviado ao branch e confirma o GIF no repositório.

on:
  push:
    branches:
      - arena/01a0eb26-guilhermefmaga-site
    paths:
      - '.github/workflows/baixar-gif.yml'

permissions:
  contents: write

jobs:
  baixar-gif:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar o GIF
        env:
          DEST: images/21232817-6d27-44b0-a6b5-5fc85144cafb.gif
          ASSET: https://github.com/user-attachments/assets/21232817-6d27-44b0-a6b5-5fc85144cafb
          PAGE: https://github.com/GUILHERMEFMAGA/GUILHERMEFMAGA-SITE/blob/main/visual.md
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$DEST")"
          ok() { [ -f "$1" ] && [ "$(head -c 3 "$1")" = "GIF" ]; }

          echo "Tentativa 1: anexo direto do GitHub..."
          curl -sSL --fail --max-time 180 -o "$DEST" "$ASSET" || echo "anexo direto falhou"

          if ! ok "$DEST"; then
            echo "Tentativa 2: extrair a URL assinada da pagina do visual.md..."
            curl -sSL --fail --max-time 60 "$PAGE" -o /tmp/pagina.html || true
            URL=$(grep -o 'https://private-user-images\.githubusercontent\.com/[^"\\ ]*\.gif?[^"\\ ]*' /tmp/pagina.html | head -1 || true)
            echo "URL assinada: ${URL:0:120}"
            if [ -n "$URL" ]; then
              curl -sSL --fail --max-time 180 -o "$DEST" "$URL" || echo "URL assinada falhou"
            fi
          fi

          if ! ok "$DEST"; then
            echo "::error::Nao foi possivel baixar o GIF"
            exit 1
          fi
          echo "OK: $(ls -la "$DEST") magic=$(head -c 6 "$DEST")"

      - name: Confirmar o GIF no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "images/21232817-6d27-44b0-a6b5-5fc85144cafb.gif"
          if git diff --cached --quiet; then
            echo "O GIF ja esta no repositorio; nada a confirmar."
          else
            git commit -m "Adiciona GIF do visual.md (anexo do GitHub)"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
