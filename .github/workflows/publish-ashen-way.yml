name: Publish The Ashen Way

on:
  push:
    branches:
      - arena/01a0fd4b-guilhermefmaga-site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare the static game site
        run: |
          mkdir -p _site/src
          cp game/index.html game/styles.css _site/
          cp game/src/*.js _site/src/

      - name: Upload the game site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
