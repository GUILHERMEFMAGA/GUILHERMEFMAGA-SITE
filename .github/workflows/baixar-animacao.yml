name: Baixar animacao do iPhone (anexo do GitHub)

# Este workflow existe só para buscar o binário do GIF anexado no GitHub
# (o sandbox da sessão não alcança o CDN de anexos; o runner do Actions alcança).
# Ele roda uma vez quando este arquivo é enviado ao branch e confirma o GIF
# no repositório. Depois, o arquivo é removido.

on:
  push:
    branches:
      - arena/01a0eb56-guilhermefmaga-site
    paths:
      - '.github/workflows/baixar-animacao.yml'

permissions:
  contents: write

jobs:
  baixar-animacao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar o GIF
        env:
          DEST: images/animacao-iphone.gif
          ASSET: https://github.com/user-attachments/assets/a73e7bcd-c59c-463b-8b60-aae618b7e519
          PAGE: https://github.com/GUILHERMEFMAGA/GUILHERMEFMAGA-SITE/blob/main/visual.md
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$DEST")"
          ok() { [ -f "$1" ] && [ "$(head -c 3 "$1")" = "GIF" ]; }

          echo "Tentativa 1: anexo direto do GitHub..."
          curl -sSL --fail --max-time 300 -o "$DEST" "$ASSET" || echo "anexo direto falhou"

          if ! ok "$DEST"; then
            echo "Tentativa 2: extrair a URL assinada da pagina do visual.md..."
            curl -sSL --fail --max-time 60 "$PAGE" -o /tmp/pagina.html || true
            URL=$(grep -o 'https://private-user-images\.githubusercontent\.com/[^"\\ ]*\.gif?[^"\\ ]*' /tmp/pagina.html | head -1 || true)
            echo "URL assinada: ${URL:0:120}"
            if [ -n "$URL" ]; then
              curl -sSL --fail --max-time 300 -o "$DEST" "$URL" || echo "URL assinada falhou"
            fi
          fi

          if ! ok "$DEST"; then
            echo "::error::Nao foi possivel baixar o GIF"
            exit 1
          fi

          echo "OK: $(ls -la "$DEST")"
          python3 - "$DEST" <<'PY'
          import struct, sys
          d = open(sys.argv[1], 'rb').read()
          w, h = struct.unpack('<HH', d[6:10])
          pos = 13
          if d[10] & 0x80:
              pos += 3 * (1 << ((d[10] & 7) + 1))
          def sub(b, i):
              while b[i] != 0:
                  i += b[i] + 1
              return i + 1
          frames = delay = 0
          while pos < len(d):
              t = d[pos]
              if t == 0x3B:
                  break
              if t == 0x21:
                  lbl = d[pos + 1]; pos += 2
                  if lbl == 0xF9:
                      delay += struct.unpack('<H', d[pos + 2:pos + 4])[0]
                  pos = sub(d, pos)
              elif t == 0x2C:
                  frames += 1; pos += 1
                  fl = d[pos + 8]; pos += 9
                  if fl & 0x80:
                      pos += 3 * (1 << ((fl & 7) + 1))
                  pos += 1; pos = sub(d, pos)
              else:
                  break
          print(f"GIF: {w}x{h} | {frames} quadros | {delay/100:.2f}s | {len(d)} bytes")
          assert (w, h) == (800, 450), f"dimensoes inesperadas: {w}x{h}"
          assert len(d) > 200_000, f"arquivo pequeno demais: {len(d)} bytes"
          print("Conferido: 800x450 e maior que 200 KB (nao e o placeholder).")
          PY

      - name: Confirmar o GIF no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- images/animacao-iphone.gif
          if git diff --cached --quiet; then
            echo "O GIF ja esta no repositorio; nada a confirmar."
          else
            git commit -m "Adiciona a animacao do iPhone (anexo do GitHub) em images/animacao-iphone.gif"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
