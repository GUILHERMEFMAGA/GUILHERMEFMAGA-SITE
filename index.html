<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080907">
  <title>Rua Vermelha · Nova Aurora</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080907; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #080907; }
    .direct-link { position: fixed; z-index: 5; top: 9px; right: 10px; padding: 7px 10px; border: 1px solid rgba(232, 224, 204, .35); color: #e9e1cd; background: rgba(12, 15, 13, .78); font: 10px "Courier New", monospace; letter-spacing: .07em; text-decoration: none; opacity: .45; transition: opacity .15s ease; }
    .direct-link:hover, .direct-link:focus-visible { opacity: 1; }
    .fallback { position: fixed; z-index: 6; left: 50%; bottom: 15px; display: none; transform: translateX(-50%); padding: 9px 12px; color: #eee6d2; background: rgba(12, 15, 13, .92); font: 11px "Courier New", monospace; }
    .fallback a { color: #e6c267; }
  </style>
</head>
<body>
  <iframe id="gameFrame" src="./jogo/" title="Rua Vermelha — jogo em visão de cima" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <a class="direct-link" href="./jogo/" target="_blank" rel="noopener">ABRIR DIRETO ↗</a>
  <div id="fallback" class="fallback">Se o quadro não carregar, <a href="./jogo/">abra o jogo diretamente</a>.</div>
  <noscript><div class="fallback" style="display:block">Abra <a href="./jogo/">o jogo diretamente</a>.</div></noscript>
  <script>
    const frame = document.querySelector('#gameFrame');
    const fallback = document.querySelector('#fallback');
    let loaded = false;
    frame.addEventListener('load', () => { loaded = true; });
    window.setTimeout(() => { if (!loaded) fallback.style.display = 'block'; }, 5000);
  </script>
</body>
</html>
