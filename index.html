<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Site do Guilherme F. Maga com animação em destaque." />
  <title>Guilherme F. Maga</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --texto: #b9b1aa;
      --fraco: #6b645e;
      --brilho: 255, 255, 255;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: #000000;
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 40px 24px 8px;
    }

    header h1 {
      font-size: 20px;
      font-weight: normal;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ded8d3;
    }

    header p {
      margin-top: 10px;
      font-size: 13px;
      color: var(--fraco);
      letter-spacing: 0.5px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 64px;
    }

    /* ---------- A animação ---------- */
    figure {
      margin-top: 36px;
    }

    .moldura {
      position: relative;
      width: 100%;
      max-width: 768px;      /* largura nativa do GIF: sem borrar */
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      background-color: #0a0a0a;
      box-shadow:
        0 0 60px rgba(var(--brilho), 0.10),
        0 0 140px rgba(var(--brilho), 0.04);
    }

    .moldura img {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .moldura img.carregou { opacity: 1; }

    /* Enquanto o GIF não chega, mostra um brilho suave no lugar do vazio */
    .carregando {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #4a453f;
      background: radial-gradient(circle at 50% 45%, #141414 0%, #000 70%);
      transition: opacity 0.4s ease;
    }

    .carregando.some { opacity: 0; }

    figcaption {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--fraco);
    }

    footer {
      padding: 32px 24px 48px;
      font-size: 12px;
      color: #4a453f;
      border-top: 1px solid #141414;
    }

    footer a { color: #7d766f; text-decoration: none; }
    footer a:hover { color: #d8d2cc; }

    .aviso {
      display: none;
      border: 1px solid #2a2a2a;
      background-color: #0d0d0d;
      color: #9a9a9a;
      border-radius: 10px;
      padding: 18px;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 20px;
    }

    .aviso code { word-break: break-all; color: #c9c9c9; }

    @media (max-width: 520px) {
      header { padding-top: 28px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Guilherme F. Maga</h1>
    <p>Animações e projetos</p>
  </header>

  <main>
    <!-- A animação, em loop, direto do arquivo local do repositório -->
    <figure>
      <div class="moldura" id="moldura">
        <div class="carregando" id="carregando">Carregando animação…</div>
        <img
          id="animacao"
          src="images/21232817-6d27-44b0-a6b5-5fc85144cafb.gif"
          width="768"
          height="768"
          alt="Animação 3D cinematográfica em estúdio"
        />
      </div>
      <figcaption>
        768 × 768 · 101 quadros
      </figcaption>
    </figure>

    <div class="aviso" id="aviso">
      <strong>Não consegui abrir a animação.</strong><br />
      Confira se o arquivo está em<br />
      <code>images/21232817-6d27-44b0-a6b5-5fc85144cafb.gif</code>
    </div>
  </main>

  <footer>
    <a href="https://github.com/GUILHERMEFMAGA/GUILHERMEFMAGA-SITE">github.com/GUILHERMEFMAGA</a>
  </footer>

  <script>
    (function () {
      var img = document.getElementById('animacao');
      var carregando = document.getElementById('carregando');
      var moldura = document.getElementById('moldura');
      var aviso = document.getElementById('aviso');

      function pronto() {
        img.classList.add('carregou');
        if (carregando) {
          carregando.classList.add('some');
          setTimeout(function () { carregando.style.display = 'none'; }, 450);
        }
      }

      function falhou() {
        if (carregando) carregando.style.display = 'none';
        moldura.style.display = 'none';
        aviso.style.display = 'block';
      }

      if (img.complete && img.naturalWidth > 0) {
        pronto();
      } else {
        img.addEventListener('load', pronto);
        img.addEventListener('error', falhou);
      }
    })();
  </script>
</body>
</html>
