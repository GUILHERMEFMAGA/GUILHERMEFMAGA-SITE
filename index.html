<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Site do Guilherme F. Maga." />
  <title>Guilherme F. Maga</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* Fundo da animação da gota: a tela inteira combina com o GIF, sem emenda */
      --creme: #f9f4f2;
      --navy: #2b3446;
      --navy-fraco: #6d7789;
      --texto: #b9b1aa;
      --fraco: #6b645e;
    }

    html, body { height: 100%; }

    body {
      background-color: #000000;
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;                 /* enquanto carrega, sem rolagem */
    }

    body.pronto { overflow: auto; }

    /* ================= TELA DE CARREGAMENTO ================= */
    #tela-carregando {
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: var(--creme);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    #tela-carregando.saiu {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* A animação da gota preenche a tela sem cortar nada (contain);
       as sobras ficam na mesma cor do fundo do GIF, então não aparecem. */
    #gif-carregando {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #gif-carregando.carregou { opacity: 1; }

    /* ---------- textos ---------- */
    .topo, .rodape {
      position: relative;
      z-index: 2;
      padding: 34px 24px;
    }

    .topo .marca {
      font-size: 14px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--navy);
    }

    .topo .linha {
      width: 46px;
      height: 1px;
      margin: 14px auto 0;
      background-color: rgba(43, 52, 70, 0.35);
    }

    .rodape .mensagem {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--navy-fraco);
    }

    /* barra fina de progresso */
    .barra {
      width: min(230px, 62vw);
      height: 2px;
      margin: 20px auto 0;
      background-color: rgba(43, 52, 70, 0.16);
      border-radius: 2px;
      overflow: hidden;
    }

    .barra span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #9aa4b8, var(--navy));
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .pular {
      margin-top: 24px;
      display: none;
      background: none;
      border: 1px solid rgba(43, 52, 70, 0.3);
      color: var(--navy);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 10px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.3s ease, background-color 0.3s ease;
    }

    .pular:hover { border-color: var(--navy); background-color: rgba(43, 52, 70, 0.06); }
    .pular.mostrar { display: inline-block; }

    /* ================= CONTEÚDO DO SITE ================= */
    #site {
      opacity: 0;
      transition: opacity 1s ease;
    }

    #site.visivel { opacity: 1; }

    header { padding: 40px 24px 8px; }

    header h1 {
      font-size: 20px;
      font-weight: normal;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ded8d3;
    }

    header p {
      margin-top: 10px;
      font-size: 13px;
      color: var(--fraco);
      letter-spacing: 0.5px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 64px;
    }

    figure { margin-top: 36px; }

    .moldura {
      position: relative;
      width: 100%;
      max-width: 768px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      background-color: #0a0a0a;
      box-shadow:
        0 0 60px rgba(255, 255, 255, 0.10),
        0 0 140px rgba(255, 255, 255, 0.04);
    }

    .moldura img {
      width: 100%;
      height: auto;
      display: block;
    }

    figcaption {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--fraco);
    }

    footer {
      padding: 32px 24px 48px;
      font-size: 12px;
      color: #4a453f;
      border-top: 1px solid #141414;
    }

    footer a { color: #7d766f; text-decoration: none; }
    footer a:hover { color: #d8d2cc; }

    @media (max-width: 520px) {
      header { padding-top: 28px; }
      .topo, .rodape { padding: 24px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #tela-carregando, #gif-carregando, #site { transition-duration: 0.01s; }
    }
  </style>
</head>
<body>

  <!-- ============ TELA DE CARREGAMENTO ============ -->
  <div id="tela-carregando" role="status" aria-live="polite">
    <!-- Roda UMA VEZ: o arquivo não tem a extensão de loop, então ele não repete -->
    <img id="gif-carregando" src="images/loading-gota.gif" width="768" height="768" alt="" aria-hidden="true" />

    <div class="topo">
      <div class="marca">Guilherme F. Maga</div>
      <div class="linha"></div>
    </div>

    <div class="rodape">
      <div class="mensagem" id="mensagem">Carregando</div>
      <div class="barra"><span id="progresso"></span></div>
      <button class="pular" id="pular" type="button">Pular</button>
    </div>
  </div>

  <!-- ============ SITE ============ -->
  <div id="site" aria-hidden="true">
    <header>
      <h1>Guilherme F. Maga</h1>
      <p>Animações e projetos</p>
    </header>

    <main>
      <figure>
        <div class="moldura">
          <img
            src="images/21232817-6d27-44b0-a6b5-5fc85144cafb.gif"
            width="768"
            height="768"
            alt="Animação 3D cinematográfica em estúdio"
          />
        </div>
        <figcaption>768 × 768 · 101 quadros</figcaption>
      </figure>
    </main>

    <footer>
      <a href="https://github.com/GUILHERMEFMAGA/GUILHERMEFMAGA-SITE">github.com/GUILHERMEFMAGA</a>
    </footer>
  </div>

  <script>
    (function () {
      var tela      = document.getElementById('tela-carregando');
      var gif       = document.getElementById('gif-carregando');
      var mensagem  = document.getElementById('mensagem');
      var progresso = document.getElementById('progresso');
      var pular     = document.getElementById('pular');
      var site      = document.getElementById('site');

      var DURACAO_FALLBACK = 10100;   // 101 quadros x 10 centésimos = 10,1s
      var FADE = 900;                 // precisa bater com o transition do CSS
      var LIMITE_ESPERA = 25000;      // trava de segurança: nunca passa disso
      var jaAbriu = false;

      function abrir() {
        if (jaAbriu) return;
        jaAbriu = true;

        tela.classList.add('saiu');
        site.classList.add('visivel');
        site.setAttribute('aria-hidden', 'false');
        document.body.classList.add('pronto');

        setTimeout(function () { tela.style.display = 'none'; }, FADE + 60);
      }

      /* Lê a duração real do GIF (soma dos atrasos dos quadros) */
      function duracaoDoGif(buffer) {
        var b = new Uint8Array(buffer);
        if (String.fromCharCode(b[0], b[1], b[2]) !== 'GIF') throw new Error('nao e GIF');

        var pos = 13;
        if (b[10] & 0x80) pos += 3 * (1 << ((b[10] & 7) + 1));

        var centesimos = 0;

        function pularSubBlocos(p) {
          while (b[p] !== 0) p += b[p] + 1;
          return p + 1;
        }

        while (pos < b.length) {
          var tipo = b[pos];
          if (tipo === 0x3B) break;

          if (tipo === 0x21) {
            var rotulo = b[pos + 1];
            pos += 2;
            if (rotulo === 0xF9) centesimos += b[pos + 2] | (b[pos + 3] << 8);
            pos = pularSubBlocos(pos);
          } else if (tipo === 0x2C) {
            pos += 1;
            var flags = b[pos + 8];
            pos += 9;
            if (flags & 0x80) pos += 3 * (1 << ((flags & 7) + 1));
            pos += 1;
            pos = pularSubBlocos(pos);
          } else {
            break;
          }
        }
        return centesimos * 10;
      }

      function animarBarra(ms) {
        var inicio = Date.now();
        var id = setInterval(function () {
          var t = Math.min((Date.now() - inicio) / ms, 1);
          progresso.style.width = (t * 100).toFixed(1) + '%';
          if (t >= 1 || jaAbriu) clearInterval(id);
        }, 60);
        return function () { clearInterval(id); };
      }

      function esperar(ms) {
        return new Promise(function (r) { setTimeout(r, ms); });
      }

      function tocar() {
        var pararBarra = animarBarra(DURACAO_FALLBACK);
        var sinal = setTimeout(function () { pular.classList.add('mostrar'); }, 2500);

        fetch(gif.getAttribute('src'))
          .then(function (r) { return r.arrayBuffer(); })
          .then(function (buf) {
            var ms = duracaoDoGif(buf);       // duração exata, lida do arquivo
            pararBarra();
            animarBarra(ms);
            return esperar(ms);               // toca exatamente uma vez
          })
          .catch(function () {
            pararBarra();
            animarBarra(DURACAO_FALLBACK);
            return esperar(DURACAO_FALLBACK);
          })
          .then(function () {
            clearTimeout(sinal);
            abrir();
          });
      }

      function semGif() {
        mensagem.textContent = 'Abrindo o site';
        pular.classList.add('mostrar');
        setTimeout(abrir, 1200);
      }

      gif.addEventListener('error', semGif);
      setTimeout(function () { if (!jaAbriu) pular.classList.add('mostrar'); }, 4000);
      setTimeout(function () { if (!jaAbriu) abrir(); }, LIMITE_ESPERA);

      pular.addEventListener('click', abrir);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') abrir(); });

      gif.addEventListener('load', function () { gif.classList.add('carregou'); });

      if (document.readyState === 'complete') {
        tocar();
      } else {
        window.addEventListener('load', tocar);
      }
    })();
  </script>
</body>
</html>
