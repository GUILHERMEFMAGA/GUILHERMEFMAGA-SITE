<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site - GIF</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #888888;
      text-align: center;
    }

    .gif-container {
      width: 100%;
      max-width: 800px;
      padding: 16px;
    }

    .gif-container img {
      width: 100%;
      height: auto;
      max-width: 800px;
      border-radius: 8px;
      display: inline-block;
    }

    .placeholder {
      border: 1px dashed #444444;
      border-radius: 8px;
      padding: 48px 24px;
      max-width: 800px;
      margin: 0 auto;
    }

    .placeholder strong {
      color: #cccccc;
      display: block;
      font-size: 1.2rem;
      margin-bottom: 12px;
    }

    .placeholder code {
      color: #66ccff;
      font-size: 0.85rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="gif-container">
    <img
      id="gif"
      src="images/638574332-a73e7bcd-c59c-463b-8b60-aae618b7e519.gif"
      alt="b_deixe_um_pouco_mais_-ezgif com-video-to-gif-converter"
      width="800"
      height="450"
      onerror="document.getElementById('fallback').style.display='block'; this.style.display='none';"
    />
    <div id="fallback" class="placeholder" style="display:none;">
      <strong>GIF não encontrado</strong>
      <p>Adicione o arquivo abaixo na pasta <code>images/</code> para exibir a animação:</p>
      <p><code>images/638574332-a73e7bcd-c59c-463b-8b60-aae618b7e519.gif</code></p>
    </div>
  </div>
</body>
</html>
