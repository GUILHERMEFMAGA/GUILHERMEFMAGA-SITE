<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOBRENATURAL — TESTE DE IA (engine v3.0)</title>
<style>
  html, body { margin: 0; background: #07060a; color: #ffd27a; font-family: "Courier New", monospace; }
  header { padding: 10px 16px; border-bottom: 2px solid #5a1010; }
  header b { color: #ff5050; }
  #wrap { display: flex; gap: 12px; padding: 12px; align-items: flex-start; flex-wrap: wrap; }
  canvas { max-width: min(72vw, 1100px); border: 2px solid #5a1010; image-rendering: pixelated; background: #000; }
  #panel { width: 360px; background: #120b0e; border: 1px solid #5a1010; padding: 12px; font-size: 12px; line-height: 1.55; }
  #panel h3 { margin: 0 0 8px; color: #ff5050; font-size: 13px; }
  #stats span { color: #e8e8e8; }
  #decisao { margin: 8px 0; padding: 6px; background: #1d1114; color: #8fd0ff; min-height: 18px; }
  #log { height: 300px; overflow-y: auto; border-top: 1px solid #3a2a2a; margin-top: 8px; padding-top: 6px; white-space: pre-wrap; font-size: 11px; }
  .ok { color: #7cfc9b; } .bad { color: #ff6b6b; } .warn { color: #ffd75e; }
  #parecer { margin-top: 8px; padding: 8px; border: 1px dashed #5a1010; display: none; }
</style>
</head>
<body>
<header>🤖 <b>IA JOGANDO SOZINHA</b> — SOBRENATURAL engine v3.0 · a política decide 60×/s, ninguém toca no teclado</header>
<div id="wrap">
  <canvas id="game" width="1536" height="1024"></canvas>
  <div id="panel">
    <h3>▸ PAINEL DE TELEMETRIA DA IA</h3>
    <div id="stats">iniciando…</div>
    <div id="decisao">decisão: —</div>
    <h3>▸ LOG DE EVENTOS</h3>
    <div id="log"></div>
    <div id="parecer"></div>
  </div>
</div>
<script src="game.js"></script>
<script>
(function () {
  var G = window.__G;
  var statsEl = document.getElementById("stats");
  var logEl = document.getElementById("log");
  var decEl = document.getElementById("decisao");
  var parecerEl = document.getElementById("parecer");
  var M = { tempo: 0, kills: 0, mortes: 0, tiros: 0, dano: 0, pickups: 0, bossDano: 0, venceu: false };
  var prev = { ammo: 6, kills: 0, hearts: 3, boss: 160, points: 0 };
  var decisao = "—";

  function log(s, cls) {
    var d = document.createElement("div");
    if (cls) d.className = cls;
    d.textContent = "[" + Math.floor(M.tempo) + "s] " + s;
    logEl.insertBefore(d, logEl.firstChild);
    while (logEl.childNodes.length > 120) logEl.removeChild(logEl.lastChild);
  }

  var strafeDir = 1, strafeT = 0;
  function think(dt) {
    var g = G.game, d = g.dante, K = G.keys, S = G.ST;
    if (S.state === "title" || S.state === "cut") { G.onPress("Enter"); decisao = "avançar intro"; return; }
    if (S.state === "dead") {
      M.mortes++; log("💀 MORREU (" + M.mortes + "ª vez)", "bad");
      G.onPress("Enter"); decisao = "respawn"; return;
    }
    if (S.state === "end") {
      if (!M.venceu) { M.venceu = true; log("🏆 VENCEU! pontos " + g.points, "ok"); showParecer(); }
      decisao = "fim de jogo"; return;
    }
    if (S.paused) return;

    var alvo = null, best = 1e9, i, dd;
    for (i = 0; i < g.ghosts.length; i++) {
      var gh = g.ghosts[i];
      if (gh.dying) continue;
      dd = Math.hypot(gh.x - d.x, gh.y - d.y);
      if (dd < best) { best = dd; alvo = gh; }
    }
    var m = g.malphas;
    var agachar = g.bossOn && !g.bossDead && m.atkAnim > 0 && Math.hypot(m.x - d.x, m.y + 260 - d.y) < 340;
    K.KeyC = agachar;
    var cao = g.ghosts.some(function (x) { return !x.dying && x.kind === "cao" && Math.hypot(x.x - d.x, x.y - d.y) < 230; });
    if (cao && g.jumpT <= 0) { G.onPress("KeyK"); }

    var pick = null, pd = 1e9;
    for (i = 0; i < g.pickups.length; i++) {
      dd = Math.hypot(g.pickups[i].x - d.x, g.pickups[i].y - d.y);
      if (dd < pd) { pd = dd; pick = g.pickups[i]; }
    }
    var tx = null, ty = null;
    if (pick && pd < 340) { tx = pick.x; ty = pick.y; decisao = "coletar " + pick.kind; }
    else if (alvo) {
      strafeT -= dt;
      if (strafeT <= 0) { strafeDir *= -1; strafeT = 1.2; }
      var dx = d.x - alvo.x, dy = d.y - alvo.y, dl = Math.hypot(dx, dy) || 1;
      var aproxi = best > 380 ? -1 : best < 240 ? 1 : 0;
      tx = d.x + (dx / dl) * 100 * aproxi;
      ty = d.y + strafeDir * 80;
      decisao = (agachar ? "AGACHAR do golpe · " : "") + (best > 380 ? "aproximar" : best < 240 ? "recuar" : "strafear") + " (alvo a " + Math.round(best) + "px)";
    } else decisao = "varrer área";

    K.ArrowLeft = tx !== null && tx < d.x - 20;
    K.ArrowRight = tx !== null && tx > d.x + 20;
    K.ArrowUp = ty !== null && ty < d.y - 20;
    K.ArrowDown = ty !== null && ty > d.y + 20;
    K.ShiftLeft = !!(alvo && best > 520);

    K.Space = !!alvo && best < 560 && !agachar && g.ammo > 0;
    if (g.bossOn && !g.bossDead && m.vuln > 0 && Math.abs(d.y - (m.y + 60)) < 300 && g.ammo > 0) {
      K.Space = true; decisao = "FOGO no Malphas vulnerável!";
    }
    if (g.ammo === 0 && g.reloadT <= 0 && (!alvo || best > 260)) { G.onPress("KeyR"); decisao = "recarregar"; }
  }

  function telemetry() {
    var g = G.game;
    if (g.ammo < prev.ammo && g.reloadT <= 0) M.tiros += prev.ammo - g.ammo;
    if (g.kills > prev.kills) { M.kills += g.kills - prev.kills; log("👻 abate #" + g.kills, "ok"); }
    if (g.hearts < prev.hearts) { M.dano += prev.hearts - g.hearts; log("💢 levou dano (" + g.hearts + "♥)", "warn"); }
    if (g.boss < prev.boss) M.bossDano += prev.boss - g.boss;
    if (g.points - prev.points === 500) { M.pickups++; log("📓 diário coletado (+500)", "ok"); }
    if (g.reserve > prev.reserve && g.reloadT <= 0) { M.pickups++; log("🧂 sal coletado", "ok"); }
    prev = { ammo: g.ammo, kills: g.kills, hearts: g.hearts, boss: g.boss, points: g.points };
    if (g.bossOn && !M.bossLog) { M.bossLog = true; log("🐐 MALPHAS DESPERTOU", "bad"); }
  }

  function showParecer() {
    var g = G.game;
    var precisao = M.tiros > 0 ? ((M.kills * 2 + M.bossDano) / (M.tiros * 3) * 100).toFixed(1) : 0;
    var bom = M.mortes <= 3;
    parecerEl.style.display = "block";
    parecerEl.className = bom ? "ok" : "bad";
    parecerEl.innerHTML =
      "<b>PARECER DA IA: " + (bom ? "BOM ✔" : "RUIM ✘") + "</b><br>" +
      "tempo " + Math.floor(M.tempo) + "s · mortes " + M.mortes + " · precisão ~" + precisao + "%<br>" +
      "dano sofrido " + M.dano + " · itens " + M.pickups + " · pontos " + g.points;
  }

  setInterval(function () {
    M.tempo += 1 / 60;
    think(1 / 60);
    telemetry();
    var g = G.game;
    statsEl.innerHTML =
      "estado: <span>" + G.ST.state + "</span> · corações: <span>" + g.hearts + "♥</span><br>" +
      "munição: <span>" + g.ammo + "/" + g.reserve + "</span> · abates: <span>" + g.kills + "</span><br>" +
      "pontos: <span>" + g.points + "</span> · chefe: <span>" + (g.bossOn ? (g.bossDead ? "MORTO" : g.boss + "/160") : "—" ) + "</span><br>" +
      "tiros: <span>" + M.tiros + "</span> · mortes: <span>" + M.mortes + "</span> · itens: <span>" + M.pickups + "</span>";
    decEl.textContent = "decisão: " + decisao;
  }, 16);
})();
</script>
</body>
</html>
