<script>
/* =====================================================================
   VIDA.JS — as pessoas da cidade têm FAMÍLIA, NOME e ROTINA
     • cada casa tem uma família (pai, mãe, filhos, às vezes um avô ou avó)
     • a rotina muda com a HORA do jogo: dormir, café, trabalho, escola, TV...
     • aqui ficam as regras. Quem desenha as salas usa G.vida.
   Hora do jogo: 0 do "dia" = amanhecer (6h). Um dia dura uns 7 minutos.
   ===================================================================== */
(function (G) {
  'use strict';
  const SP = G.sprites;
  const NOMES_M = ['João', 'Pedro', 'Carlos', 'Marcos', 'Rafael', 'Lucas', 'Paulo', 'Bruno', 'André', 'Tiago', 'Gustavo', 'Fábio', 'Renato', 'Davi', 'Eduardo'];
  const NOMES_F = ['Maria', 'Ana', 'Juliana', 'Fernanda', 'Patrícia', 'Camila', 'Luciana', 'Sandra', 'Beatriz', 'Aline', 'Renata', 'Carla', 'Larissa', 'Marta', 'Vera'];
  const SOBRENOMES = ['Silva', 'Souza', 'Oliveira', 'Santos', 'Pereira', 'Lima', 'Costa', 'Ribeiro', 'Almeida', 'Carvalho', 'Rocha', 'Barbosa', 'Gomes', 'Martins', 'Araújo'];
  const mulberry = G.world.mulberry32;
  const pick = (r, a) => a[Math.floor(r() * a.length)];

  // ---------- gera a família de uma casa (sempre a mesma para a mesma casa) ----------
  function gerarFamilia(casa) {
    const r = mulberry(casa.seed * 7 + 3), sob = pick(r, SOBRENOMES), m = [];
    const look = (fem, o) => Object.assign(SP.randomLook(), { fem, dress: fem && r() < 0.4, acc: 'none' }, o || {});
    const adulto = (fem, papel, extra) => ({ papel, fem, nome: pick(r, fem ? NOMES_F : NOMES_M) + ' ' + sob, p: look(fem, extra), dinheiro: Math.round((30 + r() * 150) / 5) * 5 });
    const tipo = r();
    if (tipo < 0.12) { m.push(adulto(r() < 0.5, 'sozinho')); m[0].trab = r() < 0.7; }
    else {
      m.push(adulto(false, 'pai')); m[0].trab = true;
      m.push(adulto(true, r() < 0.5 ? 'mae' : 'mae_trab')); m[1].trab = m[1].papel === 'mae_trab';
      const filhos = r() < 0.7 ? 1 + Math.floor(r() * 2) : 0;
      for (let i = 0; i < filhos; i++) {
        const fem = r() < 0.5, idade = 4 + Math.floor(r() * 13), esc = idade < 9 ? 0.72 : idade < 13 ? 0.82 : 0.93;
        m.push({ papel: 'filho', fem, idade, nome: pick(r, fem ? NOMES_F : NOMES_M) + ' ' + sob, crianca: idade < 13, p: look(fem, { esc, acc: 'none', hairStyle: fem ? 'rabo' : 'curto', sleeve: 'curta' }), dinheiro: Math.round(r() * 8) });
      }
      if (r() < 0.25) { const fem = r() < 0.5; m.push({ papel: 'idoso', fem, nome: (fem ? 'Vó ' : 'Vô ') + pick(r, fem ? NOMES_F : NOMES_M), p: look(fem, { hair: '#d8d8d8', hairStyle: fem ? 'coque' : 'careca', esc: 0.96, dress: fem }), dinheiro: Math.round(r() * 60) }); }
    }
    m.forEach((x, i) => { x.i = i; x.loc = null; x.n = null; });
    return { sob, membros: m };
  }

  // ---------- rotina: o que cada um está fazendo a esta hora ----------
  // devolve 'dorme' | 'cozinha' | 'tv' | 'casa' | 'brinca' | 'fora' | 'banho'
  function atividade(m, h) {
    const entre = (a, b) => a <= b ? (h >= a && h < b) : (h >= a || h < b);
    switch (m.papel) {
      case 'pai': case 'sozinho':
        if (!m.trab) return entre(23, 8) ? 'dorme' : entre(8, 9) ? 'cozinha' : entre(9, 12) ? 'casa' : entre(12, 13.5) ? 'cozinha' : entre(13.5, 23) ? 'tv' : 'casa';
        if (entre(22, 6)) return 'dorme'; if (entre(6, 7.2)) return 'cozinha'; if (entre(7.2, 18)) return 'fora'; if (entre(18, 19.5)) return 'casa'; if (entre(19.5, 22)) return 'tv'; return 'casa';
      case 'mae': // dona de casa
        if (entre(22.5, 5.5)) return 'dorme'; if (entre(5.5, 8)) return 'cozinha'; if (entre(8, 11)) return 'casa'; if (entre(11, 13)) return 'cozinha'; if (entre(13, 17)) return 'tv'; if (entre(17, 19.5)) return 'cozinha'; return 'tv';
      case 'mae_trab':
        if (entre(22, 6)) return 'dorme'; if (entre(6, 7.5)) return 'cozinha'; if (entre(7.5, 17.5)) return 'fora'; if (entre(17.5, 19.5)) return 'cozinha'; return 'tv';
      case 'filho':
        if (entre(21, 6.5)) return 'dorme'; if (entre(6.5, 7.2)) return 'cozinha'; if (m.idade > 6 && entre(7.2, 12.5)) return 'fora'; if (entre(12.5, 13.3)) return 'cozinha'; if (entre(13.3, 19)) return 'brinca'; return 'tv';
      case 'idoso':
        if (entre(21, 5.5)) return 'dorme'; if (entre(5.5, 7)) return 'cozinha'; if (entre(7, 12)) return 'casa'; if (entre(12, 13)) return 'cozinha'; if (entre(13, 15)) return 'tv'; return entre(15, 21) ? 'tv' : 'casa';
    }
    return 'casa';
  }
  const TXT_ATIV = { dorme: 'dormindo', cozinha: 'na cozinha', tv: 'vendo TV', casa: 'em casa', brinca: 'brincando', fora: 'fora de casa' };

  // frases de rotina para quem está na rua (conforme a hora)
  function fraseRua(h) {
    const e = (a, b) => h >= a && h < b;
    if (e(5, 8)) return ['Tô indo trabalhar, o ônibus não pode passar!', 'Preciso de um café antes de tudo.', 'Levando as crianças pra escola.', 'Acordei cedo para correr um pouco.'];
    if (e(8, 11.5)) return ['Fui ao mercado comprar pão.', 'Hoje é dia de fazer compras.', 'Estou indo ao banco.', 'Dia cheio de coisas pra resolver.'];
    if (e(11.5, 14)) return ['Hora do almoço! Vou comer no restaurante do hotel.', 'Estou com fome. Vou a uma padaria.', 'Meu intervalo é curto, tenho que correr.'];
    if (e(14, 18)) return ['Saí do trabalho mais cedo hoje.', 'Estou voltando da academia.', 'Tarde boa para passear no parque.', 'Vou buscar meu filho na escola.'];
    if (e(18, 22)) return ['Estou indo pra casa, o dia foi longo.', 'Hoje é noite de pizza!', 'Vou tomar uma cerveja no Pinguim.', 'Jantar em família hoje.'];
    return ['Que horas são? Já é tarde...', 'Essas ruas à noite me dão medo.', 'Estou voltando da balada.', 'Insônia, só consigo andar pela cidade.'];
  }

  G.vida = { gerarFamilia, atividade, TXT_ATIV, fraseRua, NOMES_M, NOMES_F, SOBRENOMES };
})(window.G = window.G || {});

</script>
<script>
/* =====================================================================
   CASAS.JS — TODAS as casas da cidade têm porta: dá para entrar!
     • cada casa tem uma família com rotina (dorme à noite, trabalha de dia...)
     • você pode INVADIR: mexer na geladeira, no armário, abrir o cofre...
     • com uma arma na mão, aperte F perto de um morador para AMEAÇAR e levar o dinheiro
     • mas cuidado: os vizinhos chamam a polícia!
     • algumas casas estão À VENDA: dá para comprar (placa vermelha na calçada)
     • casa sua = cama (salva o jogo), geladeira cheia, e ninguém te incomoda
   ===================================================================== */
(function (G) {
  'use strict';
  const L = G.lugares, K = L.kit, V = G.vida, W = G.world;
  const O = K.O, pick = K.pick, rand = K.rand, TAU = Math.PI * 2;
  const money = v => Math.round(v);

  W.casas.forEach(c => { if (c.b.place) { c.semPorta = true; c.venda = false; } });
  const dono = (S, c) => !!(S.save.casas && S.save.casas[c.id]);
  const aVenda = (S, c) => c.venda && !dono(S, c);
  const placeDe = c => c.pl || (c.pl = { id: 'casa:' + c.id, tipo: 'casa', casa: c, nome: 'CASA', x: c.x, y: c.y, r: 24, cor: '#9dff9d' });
  const nivel = c => c.area < 14 ? 'simples' : c.area < 34 ? 'media' : 'rica';

  // ---------- por fora: entrar, placa de venda ----------
  L.extrasAcao.push((S, P) => {
    for (const c of W.casas) {
      if (c.semPorta || Math.abs(c.x - P.x) > 26 || Math.abs(c.y - P.y) > 26) continue;
      const s = aVenda(S, c) ? 'E: ENTRAR — CASA À VENDA ($' + c.preco + ')' : dono(S, c) ? 'E: ENTRAR — SUA CASA' : 'E: ENTRAR NA CASA';
      placeDe(c).livre = dono(S, c);
      return { t: 'lugar', s, run: () => L.entrar(S, placeDe(c)) };
    }
    return null;
  });
  L.extrasDesenho.push((ctx, S, inV) => {
    W.casas.forEach(c => {
      if (c.semPorta || !inV(c)) return;
      const v = aVenda(S, c), d = dono(S, c); if (!v && !d) return;
      ctx.save(); ctx.translate(c.x + 26, c.y - 10);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(-9, 4, 22, 10);
      ctx.fillStyle = '#7a5a3a'; ctx.fillRect(-1, 2, 2, 12);
      ctx.fillStyle = v ? '#d9242a' : '#2e8b3e'; ctx.fillRect(-12, -8, 24, 12); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(-11.5, -7.5, 23, 11);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 5.5px Arial'; ctx.textAlign = 'center'; ctx.fillText(v ? 'VENDE-SE' : 'SUA CASA', 0, -0.5);
      ctx.restore();
    });
  });

  // ---------- família: cria, sincroniza com a hora ----------
  const BED = [{ x: 150, y: 232 }, { x: 205, y: 232 }, { x: 328, y: 232 }, { x: 418, y: 232 }, { x: 508, y: 232 }];
  const SOFA = [{ x: 190, y: 392 }, { x: 250, y: 392 }, { x: 310, y: 392 }];
  const COZ = [{ x: 535, y: 226 }, { x: 472, y: 226 }];
  const PASSEIO = [{ x: 300, y: 270 }, { x: 420, y: 285 }, { x: 250, y: 320 }, { x: 380, y: 345 }, { x: 330, y: 250 }];
  const PASSEIO_Q = [{ x: 330, y: 320 }, { x: 400, y: 345 }, { x: 270, y: 330 }];

  function iniciaFamilia(S, lg) {
    const c = lg.casa;
    if (aVenda(S, c) || dono(S, c)) return;
    if (!c.fam) {
      c.fam = V.gerarFamilia(c); let k = 0;
      c.fam.membros.forEach(m => { m.cama = m.papel === 'pai' || m.papel === 'sozinho' ? 0 : m.papel === 'mae' || m.papel === 'mae_trab' ? 1 : m.papel === 'idoso' ? 4 : 2 + (k++ % 2); });
    }
    c.fam.membros.forEach(m => { m.sala = null; m.n = null; m.at = null; });
    sincroniza(S, lg, true);
  }
  function destino(m, at) {
    switch (at) {
      case 'fora': return null;
      case 'dorme': return Object.assign({ sala: 'quartos', dorme: true, h: 1.57 }, BED[m.cama]);
      case 'cozinha': return Object.assign({ sala: 'entrada', h: 0 }, COZ[m.i % 2]);
      case 'tv': return Object.assign({ sala: 'entrada', sentado: true, h: 0 }, SOFA[m.i % 3]);
      case 'brinca': return Object.assign({ sala: 'quartos', corre: m.i % 2 === 0 }, PASSEIO_Q[m.i % 3]);
      default: return Object.assign({ sala: m.papel === 'filho' ? 'quartos' : 'entrada' }, (m.papel === 'filho' ? PASSEIO_Q : PASSEIO)[Math.floor(Math.random() * 3)]);
    }
  }
  function falasDe(m) {
    const a = m.at, f = [];
    if (m.crianca) f.push('Você é amigo do papai?', 'Estou brincando! Quer brincar também?', 'Mamãe disse para não falar com estranhos...');
    else if (m.papel === 'idoso') f.push('No meu tempo, a rua era mais segura.', 'Meu neto não larga a TV!', 'Vai um cafezinho, meu filho?');
    else f.push('Quem é você? Como entrou aqui?', 'Eu vou chamar a polícia!', 'Aqui é a casa da família ' + (m.nome.split(' ').pop()) + '.');
    if (a === 'cozinha') f.push('Estou fazendo o almoço!', 'Cuidado, a panela está quente.');
    if (a === 'tv') f.push('Shhh! Estou vendo a novela.', 'Esse programa é o melhor.');
    return f;
  }
  const gente = (m, x, y, d) => {
    const n = { x, y, p: m.p, nome: m.nome, dinheiro: m.dinheiro, crianca: m.crianca, falas: falasDe(m), h: d && d.h != null ? d.h : Math.PI, m, v: 58, rendido: m.rendido };
    m.n = n; return n;
  };
  function poeNoFim(n, d) { n.dorme = !!d.dorme && !n.acordou; n.sentado = !!d.sentado; n.corre = !!d.corre; if (d.h != null) n.h = d.h; if (n.dorme) { n.label = 'DORMINDO'; n.act = (S, R, nn) => G.say(nn.nome.split(' ')[0] + ' dorme profundamente. Zzz...', 2.5); n.semColisao = true; } else { n.label = undefined; n.act = undefined; n.semColisao = n.sentado; } }
  // atualiza o dado de cada morador; se a sala visível mudar, mexe nos NPCs
  function sincroniza(S, lg, snap) {
    const c = lg.casa, fam = c.fam; if (!fam) return;
    const h = L.hora(S), R = S.inside && S.inside.lugar === lg ? S.inside : null;
    fam.membros.forEach(m => {
      const at = V.atividade(m, h); if (m.at === at && !(at === 'casa' && m.n && m.n.parado && Math.random() < 0.01)) return;
      if (m.at !== at) m.acordou = false;
      m.at = at; const d = destino(m, at); m.dest = d;
      const antes = m.sala; m.sala = d ? d.sala : null;
      if (m.n) m.n.falas = falasDe(m);
      if (!R || snap) { if (!snap) m.n = null; return; }
      const idxAntiga = R.npcs.indexOf(m.n);
      if (antes === R.id && m.sala !== R.id) { if (idxAntiga >= 0) R.npcs.splice(idxAntiga, 1); m.n = null; return; }   // saiu da sala
      if (m.sala === R.id) {
        let n = m.n;
        if (!n || idxAntiga < 0) { n = gente(m, R.portaX, R.y1 - 50, d); if (antes === null) { n.x = R.portaX; n.y = R.y1 - 20; } R.npcs.push(n); n.dorme = false; }
        const lane = R.id === 'entrada' ? 250 : 312;
        n.dorme = false; n.sentado = false; n.act = undefined; n.label = undefined;
        K.rota(n, [{ x: n.x, y: lane }, { x: d.x, y: lane }, { x: d.x, y: d.y }], nn => poeNoFim(nn, d));
      }
    });
  }
  K.rota = L.rota;
  // monta os NPCs de uma sala (já na posição final)
  function povoar(S, R) {
    R.npcs.length = 0; const fam = R.lugar.casa.fam; if (!fam) return;
    fam.membros.forEach(m => { if (m.sala === R.id && m.dest) { const n = gente(m, m.dest.x, m.dest.y, m.dest); poeNoFim(n, m.dest); R.npcs.push(n); } else m.n = null; });
  }
  function ruido(S, R, p) {
    const lg = R.lugar, c = lg.casa, fam = c.fam; if (!fam || lg.alarmeFeito) return;
    if (Math.random() > p) return;
    const dorm = fam.membros.filter(m => m.n && m.n.dorme);
    if (dorm.length) { const m = pick(dorm); m.n.dorme = false; m.n.acordou = true; m.n.semColisao = false; K.bolha(m.n.p, 'Quem está aí?! LADRÃO! Socorro!', 4); K.chamaPolicia(S, R, 14); G.say(m.nome.split(' ')[0] + ' acordou com o barulho!', 3); }
  }

  // ---------- as salas ----------
  const ESTILOS = {
    simples: { piso: 'ladrilho', pc: ['#d8d0bc', '#c4bba4'], parede: '#c8c0a8', q: 'ladrilho', qc: ['#cfc6b0', '#bdb49e'] },
    media: { piso: 'madeira', pc: ['#9a7650', '#7e5c3a'], parede: '#d8cdb0', q: 'carpete', qc: ['#8a9ab8', '#7a8aa8'] },
    rica: { piso: 'madeira', pc: ['#5a3a24', '#47301c'], parede: '#e6dcc4', q: 'carpete', qc: ['#7a2a3a', '#6a2232'] }
  };
  function nomeCasa(S, c) { return dono(S, c) ? 'SUA CASA' : aVenda(S, c) ? 'CASA À VENDA' : c.fam ? 'CASA DA FAMÍLIA ' + c.fam.sob.toUpperCase() : 'CASA'; }

  function loot(S, R, o, chave, min, max, msg, ruidoP, extra) {
    const lg = R.lugar, c = lg.casa; c.achados = c.achados || {};
    if (c.achados[chave]) { G.say('Já vasculhei isso aqui. Nada de novo.', 2.2); return; }
    c.achados[chave] = true; const v = money(rand(min, max));
    if (v) { S.save.money += v; G.save(); G.snd.cash(); }
    G.say(msg.replace('$$', '$' + v), 3.5); if (extra) extra(); ruido(S, R, ruidoP);
    if (c.fam && !lg.alarmeFeito) { const acordado = c.fam.membros.find(m => m.n && !m.n.dorme && m.sala === R.id); if (acordado && Math.hypot(acordado.n.x - o.x, acordado.n.y - o.y) < 160) { K.bolha(acordado.n.p, 'EI! O que você está fazendo?! Largue isso!', 4); K.chamaPolicia(S, R, 9); } }
  }

  function salaCasa(S, lg, c) {
    const est = ESTILOS[nivel(c)], v = aVenda(S, c), d = dono(S, c);
    const R = L.novaSala({ w: 600, h: 380, nome: nomeCasa(S, c), cor: d ? '#2e8b3e' : v ? '#d9242a' : '#c8a060', piso: est.piso, pisoCores: est.pc, parede: est.parede });
    R.porta = null; R.casa = c;
    R.spots = {};
    const add = (...a) => R.objs.push(...a);
    add(O('porta', 342, 96, 56, 54, { solid: false, k: 10, label: d || !v ? 'IR PARA OS QUARTOS' : 'VER OS QUARTOS', r: 50, placa: 'QUARTOS', act: S => L.irSala(S, 'quartos', 330, 440, Math.PI) }));
    if (v) {
      // casa vazia, à venda
      add(O('placa_venda', 300, 300, 120, 50, { e: 0, solid: true, label: 'COMPRAR ESTA CASA — $' + c.preco, r: 56, act: (S, R2) => comprar(S, R2) }));
      add(O('pilha_caixas', 520, 180, 50, 40, { e: 24 }), O('pilha_caixas', 150, 400, 44, 36, { e: 22 }));
      R.deco = x => { x.fillStyle = 'rgba(255,255,255,0.05)'; x.fillRect(70, 150, 600, 380); };
    } else {
      add(O('tapete', 110, 270, 240, 120, { solid: false, k: -50 }));
      add(O('tv', 150, 175, 110, 34, { e: 34, label: d ? 'LIGAR A TV' : 'ROUBAR A TV', act: (S, R2, o) => { if (d) { G.say(pick(['Noticiário: a polícia procura um motorista de fuga vermelho...', 'Novela das 8: ela descobriu tudo!']), 4); return; } loot(S, R2, o, 'tv', 70, 200, 'Você levou a TV nos braços e vendeu na hora: $$.', 0.85); } }));
      add(O('sofa', 140, 372, 180, 46, { e: 18, r: 30, label: 'SENTAR NO SOFÁ', act: S => { K.cura(S, 8); G.say('Você relaxou no sofá. (+8 vida)', 2.5); } }));
      add(O('poltrona', 380, 300, 50, 50, { e: 20, r: 28, label: 'SENTAR NA POLTRONA', act: S => { K.cura(S, 5); G.say('Poltrona confortável. (+5 vida)', 2.5); } }));
      add(O('geladeira', 590, 165, 60, 44, { e: 56, label: d ? 'ABRIR A GELADEIRA' : 'MEXER NA GELADEIRA', act: (S, R2) => {
        const st = c.est = c.est || {}; const dia = Math.floor(S.dayT);
        if (d) { if (st.dia === dia) { G.say('Você já pegou comida hoje. Volte amanhã!', 2.8); return; } st.dia = dia; const a = pick(['marmita', 'pao', 'maca', 'guarana', 'linguica']); L.dar(S, a, 2); G.save(); G.say('Você pegou ' + L.ALIM[a].n + ' (x2) na geladeira. Aperte X para comer.', 3.5); return; }
        if (st.lootDia === dia) { G.say('A geladeira já foi esvaziada.', 2.2); return; } st.lootDia = dia; const a = pick(['pao', 'maca', 'banana', 'marmita', 'coxinha', 'guarana', 'cerveja']); L.dar(S, a, 1); G.save(); G.say('Você roubou: ' + L.ALIM[a].n + '. (X para comer)', 3); ruido(S, R2, 0.2);
      } }));
      add(O('fogao', 520, 170, 56, 40, { e: 30, ligado: true }), O('pia', 440, 170, 70, 40, { e: 30 }));
      add(O('mesa_rest', 470, 330, 110, 80, { e: 16, solid: true, toalha: '#f4ecd8', cor: '#c8302a', prato: '#d8a040' }));
      add(O('cadeira_rest', 430, 335, 22, 26, {}), O('cadeira_rest', 590, 335, 22, 26, {}), O('cadeira_rest', 505, 405, 26, 22, {}));
      add(O('planta', 90, 440, 40, 50, {}), O('planta', 610, 440, 40, 50, {}), O('planta', 90, 170, 40, 50, {}));
      if (!d) add(O('bloco', 280, 175, 70, 26, { e: 26, top: '#7a5230', front: '#5a3a22', label: 'VASCULHAR O APARADOR', r: 36, act: (S, R2, o) => loot(S, R2, o, 'aparador', 8, 70, 'Achou trocados na gaveta: $$.', 0.3) }));
      if (nivel(c) === 'rica') add(O('estante', 80, 300, 60, 60, { e: 44 }));
      R.deco = x => {
        K.janela(x, 170, 80, 70, 54); K.janela(x, 470, 80, 70, 54);
        x.fillStyle = 'rgba(0,0,0,0.2)'; x.fillRect(70, 138, 600, 6);
        K.cartaz(x, 560, 76, 40, 52, '#e8d8b0', c.fam ? ['FAMÍLIA', c.fam.sob.toUpperCase().slice(0, 7)] : ['LAR', 'DOCE LAR']);
      };
    }
    R.luzes.push({ x: 250, y: 330, r: 280 }, { x: 520, y: 260, r: 240 });
    R.aoEntrar = (S2, R2) => {
      povoar(S2, R2);
      const lg2 = R2.lugar; if (lg2.avisou || v || d) return; lg2.avisou = true;
      lg2.avisoT = K.armado(S2) ? 1.5 : 4.5;
    };
    R.onUpdate = onUpdate;
    return R;
  }

  function quartosCasa(S, lg, c) {
    const est = ESTILOS[nivel(c)], v = aVenda(S, c), d = dono(S, c);
    const R = L.novaSala({ w: 520, h: 340, nome: nomeCasa(S, c) + ' — QUARTOS', cor: d ? '#2e8b3e' : '#c8a060', piso: est.q, pisoCores: est.qc, parede: est.parede });
    R.casa = c; R.porta = { para: 'entrada', px: 370, py: 200, ph: Math.PI, label: 'VOLTAR PARA A SALA', rotulo: 'SALA' };
    R.portaX = 330; R.px = 330; R.py = R.y1 - 40;
    const add = (...a) => R.objs.push(...a);
    if (v) { add(O('pilha_caixas', 120, 180, 60, 44, { e: 26 })); }
    else {
      add(O('tapete', 220, 300, 200, 90, { solid: false, k: -50 }));
      add(O('cama2', 110, 185, 130, 90, { cor: d ? '#2e8b5e' : '#4a78c8', e: 0, label: d ? 'DORMIR ATÉ AMANHECER (SALVA O JOGO)' : 'DESCANSAR NA CAMA', r: 40, act: S => {
        if (!d) { K.cura(S, 5); G.say('Você deitou na cama dos outros. Que sem-vergonha! (+5 vida)', 3); ruido(S, R, 0.5); return; }
        L.trans(S, () => { S.dayT = Math.floor(S.dayT) + 1.02; S.player.hp = 100; S.heat = 0; S.heatLevel = 0; G.save(); G.say('Bom dia! Você dormiu na SUA casa. Vida cheia e jogo salvo.', 5); });
      } }));
      if (!d) {
        const nf = c.fam ? c.fam.membros.length : 0;
        add(O('cama2', 290, 185, 76, 80, { cor: '#e8a040' }), O('cama2', 380, 185, 76, 80, { cor: '#40b8a0' }), O('cama2', 470, 185, 76, 80, { cor: '#b84a8a' }));
        add(O('bloco', 248, 190, 30, 30, { e: 18, top: '#7a5230', front: '#5a3a22', label: 'PEGAR A CARTEIRA', r: 36, act: (S, R2, o) => loot(S, R2, o, 'carteira', 15, 90, 'Você pegou uma carteira: $$.', 0.4) }));
        add(O('armario', 110, 400, 110, 44, { e: 64, label: 'VASCULHAR O GUARDA-ROUPA', r: 40, act: (S, R2, o) => loot(S, R2, o, 'armario', 10, nivel(c) === 'rica' ? 160 : 70, 'Escondido entre as roupas: $$.', 0.5) }));
        if (nivel(c) !== 'simples') add(O('cofre', 520, 400, 52, 40, { e: 40, label: 'ARROMBAR O COFRE (TIMING)', r: 40, act: (S, R2, o) => {
          if (c.achados && c.achados.cofre) { G.say('O cofre já foi arrombado.', 2.2); return; }
          L.miniTiming(S, { titulo: 'ARROMBANDO O COFRE', reps: 3, v: 1.3, zona: 0.16, cb: (S3, R3, ok, tot) => {
            if (ok >= 2) { c.achados = c.achados || {}; c.achados.cofre = true; o.aberto = true; const v2 = money(nivel(c) === 'rica' ? rand(300, 900) : rand(120, 380)); S3.save.money += v2; G.save(); G.snd.cash(); G.say('COFRE ABERTO! Você levou $' + v2 + '.', 4); ruido(S3, R3, 0.6); }
            else { G.say('Você errou a combinação. O alarme do cofre disparou!', 3.5); G.snd.beep(); K.chamaPolicia(S3, R3, 8); }
          } });
        } }));
      } else {
        add(O('armario', 110, 400, 110, 44, { e: 64, label: 'ABRIR O GUARDA-ROUPA', act: S => G.say('Suas roupas estão aqui. (Mude o visual na barbearia ou no shopping.)', 3.5) }));
        add(O('bloco', 248, 190, 30, 30, { e: 18, top: '#7a5230', front: '#5a3a22' }));
      }
      add(O('planta', 540, 440, 36, 44, {}));
    }
    R.deco = x => { K.janela(x, 330, 80, 70, 54); x.fillStyle = 'rgba(0,0,0,0.2)'; x.fillRect(70, 138, 520, 6); };
    R.luzes.push({ x: 330, y: 330, r: 260 });
    R.aoEntrar = (S2, R2) => povoar(S2, R2);
    R.onUpdate = onUpdate;
    return R;
  }

  function onUpdate(S, R, dt) {
    const lg = R.lugar; lg.sinc = (lg.sinc || 0) - dt;
    if (lg.sinc <= 0) { lg.sinc = 1.2; sincroniza(S, lg, false); }
    if (lg.avisoT > 0) {
      lg.avisoT -= dt;
      if (lg.avisoT <= 0) {
        const acordado = lg.casa.fam && lg.casa.fam.membros.find(m => m.n && !m.n.dorme && m.sala);
        if (acordado) { K.bolha(acordado.n.p, pick(['QUEM É VOCÊ?! SOCORRO! LADRÃO!', 'O QUE VOCÊ FAZ NA MINHA CASA?! VOU CHAMAR A POLÍCIA!']), 4.5); K.chamaPolicia(S, R, 11); G.say('Os moradores viram você! A polícia vai ser chamada!', 4); G.snd.beep(); }
      }
    }
  }

  function comprar(S, R) {
    const c = R.lugar.casa;
    if (!K.gasta(S, c.preco)) return;
    S.save.casas = S.save.casas || {}; S.save.casas[c.id] = true; G.save();
    G.snd.win && G.snd.win(); G.say('PARABÉNS! Você comprou esta casa por $' + c.preco + '. Agora ela é SUA: durma na cama para salvar!', 6);
    const lg = R.lugar; lg.salas = {}; const R2 = lg.criar('entrada', lg); R2.lugar = lg; R2.id = 'entrada'; R2.place = lg.place; R2.px = R.px; R2.py = R.py; R2.aoEntrar && R2.aoEntrar(S, R2); S.inside = R2;
  }

  // tipos novos usados aqui
  K.tipos.placa_venda = (ctx, o, t) => {
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(o.x + 6, o.y + 14, o.w, 20); ctx.fillStyle = '#7a5a3a'; ctx.fillRect(o.x + 20, o.y + 10, 6, 34); ctx.fillRect(o.x + o.w - 26, o.y + 10, 6, 34);
    ctx.fillStyle = '#d9242a'; ctx.fillRect(o.x, o.y - 12, o.w, 34); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(o.x + 2, o.y - 10, o.w - 4, 30);

  function menuCardapio(S, R, cadeira, menu, pl) {
    const h = L.hora(S);
    L.abrirMenu(S, { titulo: 'CARDÁPIO — ' + pl.nome, info: () => R.pedido ? 'Seu pedido está sendo preparado...' : '', rodape: 'W/S escolher  ·  E pedir  ·  ESC fechar',
      itens: menu.map(it => ({ n: it.n, cor: it.cor, desc: (it.h ? it.desc + ' · ' : '') + 'recupera ' + it.hp + ' de vida' + (it.bebado ? ' (álcool)' : '') + (it.energia ? ' + energia' : ''), preco: it.preco, fn: (S2, R2) => {
        if (R2.pedido) { G.say('Calma! Seu pedido anterior ainda não chegou.', 2.5); return; }
        if (it.h && (h < it.h[0] || h >= it.h[1])) { G.say('O ' + it.n + ' é servido só até às ' + Math.floor(it.h[1]) + 'h.', 3); return; }
        if (S2.player.hp >= 100 && !it.bebado && !it.energia) { G.say('Você está com a vida cheia, mas pode pedir assim mesmo.', 2); }
        if (!K.gasta(S2, it.preco)) return;
        const g = R2.garcons.find(w => !w.ocupado) || R2.garcons[0]; g.ocupado = true;
        R2.pedido = { cad: cadeira, it, w: g, est: 'vindo', t: 0 };
        const cx = cadeira.x + cadeira.w / 2, cy = cadeira.y + cadeira.h + 18;
        K.rota(g, [{ x: g.x, y: 235 }, { x: cx, y: 235 }, { x: cx, y: cy }], () => { R2.pedido.est = 'anota'; R2.pedido.t = 1.5; g.h = Math.atan2(cadeira.x - g.x, 0); K.bolha(g.p, 'Boa escolha! Já volto com o seu pedido.', 3); });
        G.say('Pedido feito: ' + it.n + ' ($' + it.preco + '). O garçom já vem anotar...', 3.5); return 'fechar';
      } })) });
  }
  // máquina de estados do garçom: vindo -> anota -> cozinha -> prepara -> entrega -> servido
  function garcom(S, R, dt) {
    for (const w of R.garcons) if (!w.ocupado && (!w.rota || !w.rota.length) && !w.alvo && Math.hypot(w.x - w.home.x, w.y - w.home.y) > 6) K.rota(w, [{ x: w.x, y: 235 }, { x: w.home.x, y: 235 }, w.home]);
    const p = R.pedido; if (!p) return;
    const g = p.w, cad = p.cad; p.t -= dt;
    const cx = cad.x + cad.w / 2, cy = cad.y + cad.h + 18;
    if (p.est === 'anota' && p.t <= 0) { p.est = 'cozinha'; K.rota(g, [{ x: g.x, y: 235 }, { x: R.cozPt.x, y: 235 }, R.cozPt], () => { p.est = 'prepara'; p.t = 3.5; K.bolha(g.p, 'Mesa ' + (R.cadeiras.indexOf(cad) + 1) + ': ' + p.it.n + '!', 3); }); }
    else if (p.est === 'prepara' && p.t <= 0) { p.est = 'entrega'; g.leva = p.it.cor; K.rota(g, [{ x: g.x, y: 235 }, { x: cx, y: 235 }, { x: cx, y: cy }], () => { p.est = 'servido'; p.t = 0.5; }); }
    else if (p.est === 'servido' && p.t <= 0) {
      g.leva = null; g.h = Math.atan2(cad.x - g.x, 0);
      const sentado = R.sentado && R.sentado.o === cad;
      if (sentado) {
        const it = p.it; K.cura(S, it.hp); if (it.bebado) S.bebado = (S.bebado || 0) + it.bebado; if (it.energia) S.energia = (S.energia || 0) + it.energia;
        K.bolha(g.p, 'Aqui está! Bom apetite!', 3.5); G.say('Você comeu: ' + it.n + '  (+' + it.hp + ' vida)', 4); cad.mesa.prato = it.cor; cad.mesa.pratoAte = R.t + 14;
      } else { S.save.money += p.it.preco; G.save(); K.bolha(g.p, 'Ué, o cliente foi embora... valor devolvido.', 3.5); G.say('Você saiu da mesa: o pedido foi cancelado e devolvido ($' + p.it.preco + ').', 4); }
      g.ocupado = false; R.pedido = null;
    }
    R.mesas.forEach(m => { if (m.prato && R.t > m.pratoAte) m.prato = null; });
  }

(function (G) {

  G.say = function (text, secs) { S.msg = { text, t: secs || 5 }; };
  G.banner = function (title, sub, fail, dur) { S.ban = { title, sub, fail, t: dur || 2.6, dur: dur || 2.6 }; };

  G.particle = function (p) { if (S.particles.length > 420) S.particles.shift(); p.t = 0; p.max = p.life; S.particles.push(p); };

  // ---------- Batidas / explosões ----------
  G.carCrash = function (a, b, imp, x, y) {
    const P = S.player;
    const isP = c => c && c === P.car;
    if ((a.hitCool > 0 && (!b || b.hitCool > 0))) return;
    const dmg = Math.max(0, (imp - 60) * 0.085);
    a.hitCool = 0.12; if (b) b.hitCool = 0.12;
    if (dmg > 0) {
      const copHit = b && (a.kind === 'police' || b.kind === 'police') && (isP(a) || isP(b));
      G.carDamage(a, dmg * (copHit && isP(a) ? 0.35 : 1)); if (b) G.carDamage(b, dmg * (copHit && isP(b) ? 0.35 : 0.9));
    }
    sparks(x, y, Math.min(12, 3 + imp / 40));
    if (Math.hypot(x - P.x, y - P.y) < 600) G.snd.crash(Math.min(1, imp / 300));

  // ---------- Entrar / sair de carros ----------
  function enterCar(c) {
    const P = S.player;
    if (c.driver === 'ai') {
      // carjack: o motorista sai correndo
      const d = AI.makePed(c.x - Math.cos(c.a) * 38, c.y - Math.sin(c.a) * 38);
      d.state = 'flee'; d.fleeT = 3.5; d.threat = { x: P.x, y: P.y }; S.peds.push(d);
      const police = c.kind === 'police';
      if (police || copNear(c.x, c.y, 420)) G.addHeat(police ? 45 : 25);
      else if (c.mode === 'wander') G.addHeat(4);
    }
    c.driver = 'player'; c.mode = 'player'; c.hb = false; c.nav = null; c.siren = false; c.revT = 0; c.stuckT = 0;
    P.car = c; G.snd.door();
    if (G.snd.station() === 0 && !S.radioAuto) { S.radioAuto = true; G.snd.nextStation(); S.radioT = 3; }
  }
  function exitCar() {
    const P = S.player, c = P.car; if (!c) return;
    const side = [1, -1];
    let placed = false;
    for (const s of side) {
      const x = c.x + Math.cos(c.a) * s * (SP.CAR_W / 2 + 14), y = c.y + Math.sin(c.a) * s * (SP.CAR_W / 2 + 14);
      if (!W.isSolid(x, y) && !W.treeHit(x, y, 6)) { P.x = x; P.y = y; placed = true; break; }
    }
    if (!placed) { P.x = c.x; P.y = c.y; }
    P.h = c.a; P.vx = P.vy = 0;
    c.driver = 'none'; c.mode = 'parked'; c.thr = 0; c.steer = 0; c.hb = true; P.car = null; G.snd.door();
  }

  // ---------- Entrada (teclado) ----------
  const keys = {}, pressed = {};
  function onKey(e, down) {
    const k = e.code;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(k)) e.preventDefault();
    if (down && !keys[k]) pressed[k] = true;
    keys[k] = down;
  }
  window.addEventListener('keydown', e => { onKey(e, true); G.snd.init(); });
  window.addEventListener('keyup', e => onKey(e, false));
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (S.mode === 'play') S.mode = 'paused'; });
  const K = (...c) => c.some(x => keys[x]);
  const Kp = (...c) => c.some(x => pressed[x]);

  // ---------- Atualização ----------
  function nearestCar(x, y, r) {
    let best = null, bd = r;
    for (const c of S.cars) { if (c.dead) continue; const d = Math.hypot(c.x - x, c.y - y); if (d < bd) { bd = d; best = c; } }
    return best;
  }

  function updatePlayer(dt) {
    const P = S.player; S.prompt = '';
    if (P.iframes > 0) P.iframes -= dt;
    const pc = P.car;
    if (pc) {
      pc.thr = K('KeyW', 'ArrowUp') ? 1 : K('KeyS', 'ArrowDown') ? -1 : 0;
      pc.steer = (K('KeyD', 'ArrowRight') ? 1 : 0) - (K('KeyA', 'ArrowLeft') ? 1 : 0);
      pc.hb = K('Space');
      S.hornDown = K('KeyH');
      P.x = pc.x; P.y = pc.y; P.vx = pc.vx; P.vy = pc.vy; P.h = pc.a;
      const oF = M.POI.oficina;
      if (Math.hypot(pc.x - oF.x, pc.y - oF.y) < oF.r && pc.speed < 90) S.prompt = 'E: CONSERTAR E REPINTAR ($150)';
      else if (pc.speed < 220) S.prompt = 'E: SAIR DO CARRO';
      if (Kp('KeyE')) {
        if (Math.hypot(pc.x - oF.x, pc.y - oF.y) < oF.r && pc.speed < 90) {
          if (S.save.money >= 150) {
            S.save.money -= 150; pc.hp = 100; pc.dead = false; P.hp = 100; S.heat = 0; S.save.paint++;
            pc.color = PAINTS[S.save.paint % PAINTS.length]; G.save(); G.snd.cash();
            G.say('Carro consertado e repintado! A polícia não te reconhece mais.', 4);
          } else G.say('Dinheiro insuficiente. Conserto custa $150.', 3);
        } else if (pc.speed < 220) exitCar();
      }
    } else {
      // a pé
      const run = K('ShiftLeft', 'ShiftRight');
      const sp = (run ? 175 : 108) * (1 + 0.05 * (S.save.folego || 0)) * (S.energia > 0 ? 1.3 : 1);   // fôlego (academia) e energético deixam você mais rápido
      let dx = (K('KeyD', 'ArrowRight') ? 1 : 0) - (K('KeyA', 'ArrowLeft') ? 1 : 0), dy = (K('KeyS', 'ArrowDown') ? 1 : 0) - (K('KeyW', 'ArrowUp') ? 1 : 0);
      const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      if (S.sentado || S.trans) { dx = 0; dy = 0; }
      if (S.bebado > 0) { const b = Math.min(1, S.bebado / 3); dx += Math.sin(S.time * 2.7) * 0.55 * b; dy += Math.cos(S.time * 2.1) * 0.55 * b; }
      // empurrão de carro / explosão
      P.x += 0; let mvx = dx * sp + P.vx, mvy = dy * sp + P.vy; P.vx *= 0.88; P.vy *= 0.88;
      const okp = (x, y) => !W.isSolid(x, y) && !W.treeHit(x, y, 4);
      if (okp(P.x + mvx * dt + Math.sign(mvx) * 6, P.y)) P.x += mvx * dt;
      if (okp(P.x, P.y + mvy * dt + Math.sign(mvy) * 6)) P.y += mvy * dt;
      if (dx || dy) { P.h += wrap(Math.atan2(dy, dx) + Math.PI / 2 - P.h) * Math.min(1, 14 * dt); P.walk += sp * dt * 0.2; }
      if (P.punchT > 0) P.punchT -= dt;
      // armas: Espaço ataca/atira • Q troca de arma • 1-6 escolhem a arma
      if (Kp('KeyQ')) G.combat.cycle(S, 1);
      if (Kp('KeyX')) G.lugares.comer(S);   // comer algo da mochila
      G.combat.ORDER.forEach((id, i) => { if (Kp('Digit' + (i + 1))) { if (!G.combat.select(S, id)) G.say('Você não tem essa arma (ou está sem munição).', 2); else G.snd.beep(); } });
      if (!S.sentado && !S.trans) G.combat.playerUpdate(S, dt, K('Space'), Kp('Space'));
      // o que dá para fazer aqui?
      let action = null;
      const car = S.sentado ? null : nearestCar(P.x, P.y, 62);
      if (S.sentado) action = G.lugares.acao(S);
      else if (car) { action = { t: 'car', car, s: 'E: ENTRAR NO CARRO' + (car.driver === 'ai' ? ' (ROUBAR)' : '') }; }
      else {
        for (const ph of M.PHONES) if (Math.hypot(ph.x - P.x, ph.y - P.y) < 50) action = { t: 'phone', s: M.active ? 'TELEFONE (MISSÃO EM ANDAMENTO)' : 'E: ATENDER TELEFONE', ph };
        const gg = M.POI.garage, hh = M.POI.hospital;
        if (!action && Math.hypot(gg.x - P.x, gg.y - P.y) < gg.r + 10) action = { t: 'garage', s: 'E: BUSCAR MEU CARRO VERMELHO' };
        if (!action && Math.hypot(hh.x - P.x, hh.y - P.y) < hh.r + 10) action = { t: 'hospital', s: P.hp < 100 ? 'E: TRATAR FERIMENTOS (GRÁTIS)' : 'HOSPITAL' };
        const ar = M.POI.armas;
        if (!action && Math.hypot(ar.x - P.x, ar.y - P.y) < ar.r + 10) action = { t: 'shop', s: 'E: LOJA DE ARMAS' };
      }
      if (!action) action = G.lugares.acao(S);
      if (action) S.prompt = action.s;
      if (action && Kp('KeyE')) {
        if (action.t === 'lugar') action.run();
        else if (action.t === 'car') enterCar(action.car);
        else if (action.t === 'phone') { if (!M.active) M.startNext(S, action.ph); else G.say('Termine a missão atual primeiro.', 3); }
        else if (action.t === 'garage') {
          const g = M.POI.garage; let r = S.redCar;
          if (!r || r.dead || !S.cars.includes(r)) {
            r = new G.Car({ x: g.x + 110, y: g.y, a: Math.PI / 2, kind: 'coupe', color: PAINTS[S.save.paint % PAINTS.length], driver: 'none', mode: 'parked', owned: true });
            S.cars.push(r); S.redCar = r; G.say('Seu carro foi entregue novamente na garagem.', 4);
          } else if (Math.hypot(r.x - g.x, r.y - g.y) > 300) {
            if (S.save.money >= 50) { S.save.money -= 50; r.x = g.x + 110; r.y = g.y; r.a = Math.PI / 2; r.vx = r.vy = 0; G.say('Guincho trouxe seu carro vermelho ($50).', 4); G.snd.cash(); }
            else G.say('Guincho custa $50.', 3);
          } else G.say('Seu carro vermelho já está aqui perto!', 3);
        } else if (action.t === 'shop') { S.mode = 'shop'; G.snd.door(); }
        else if (action.t === 'hospital') { P.hp = 100; G.say('Ferimentos tratados.', 3); }
      }
    }
    if (Kp('KeyR')) { G.snd.nextStation(); S.radioT = 3; }
    if (Kp('KeyM')) G.say(G.snd.mute() ? 'Som desligado' : 'Som ligado', 2);
    if (Kp('KeyV')) G.say(G.luz.alternar(), 2);
    // morte
    if (P.hp <= 0 && S.mode === 'play') goWasted();
  }

  function goWasted() {
    S.sentado = null;
    S.mode = 'wasted'; S.modeT = 0;
    if (M.active) M.fail(S, 'você foi levado ao hospital');
    if (S.player.car) exitCar();
    G.snd.fail();
  }
  function goBusted() {
    S.sentado = null;
    S.mode = 'busted'; S.modeT = 0;
    if (M.active) M.fail(S, 'você foi preso');
    if (S.player.car) exitCar();
    G.snd.fail();
  }
  function respawn(where, loss) {
    const P = S.player;
    S.save.money = Math.floor(S.save.money * (1 - loss)); G.save();
    P.hp = 100; P.armor = 0; P.car = null; P.x = where.x; P.y = where.y + 4; P.vx = P.vy = 0; P.iframes = 2;
    const jail = where === M.POI.delegacia;
    const hadGuns = Object.keys(G.combat.arms(S).own).length > 1;
    if (jail) G.combat.confiscate(S);
    S.lastHp = 100;
    S.heat = 0; S.heatLevel = 0; S.heli = null; S.bustT = 0;
    S.cars = S.cars.filter(c => !(c.kind === 'police' && (c.mode === 'chase' || c.mode === 'block' || c.mode === 'leave')));
    if (S.redCar && S.redCar.dead) { S.cars = S.cars.filter(c => c !== S.redCar); S.redCar = null; }
    S.mode = 'play';
    G.say(where === M.POI.hospital ? 'Você sobreviveu por pouco e acordou no hospital. Perdeu ' + Math.round(loss * 100) + '% do dinheiro.' : 'Solto da delegacia. A fiança custou ' + Math.round(loss * 100) + '% do dinheiro' + (hadGuns ? ' e suas armas foram confiscadas.' : '.'), 6);
  }

  // ---------- Carros (IA, física, colisões) ----------
  function updateCars(dt) {
    const P = S.player;
    for (const c of S.cars) {
      if (c.mode === 'script') { if (G.mercadosScript) G.mercadosScript(c, dt); continue; }   // carros do estacionamento (mercados.js)
      if (c.driver === 'ai') {
        if (c.mode === 'wander' || c.mode === 'race') AI.driveTraffic(c, dt, S);
        else if (c.mode === 'chase' || c.mode === 'leave') AI.driveChase(c, dt, S);
      } else if (c.driver !== 'player') { c.thr = 0; c.steer = 0; c.hb = true; }
      G.updateCar(c, dt);
    }
    // carro x carro
    const n = S.cars.length;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { if (S.cars[i].mode === 'script' || S.cars[j].mode === 'script') continue; G.carVsCar(S.cars[i], S.cars[j]); }
    // pedestres
    const hitPed = (p, c) => {
      const cc = G.carCircles(c);
      for (let k = 0; k < 2; k++) {
        const dx = p.x - cc[k][0], dy = p.y - cc[k][1], r = cc[k][2] + 3, d = Math.hypot(dx, dy);
        if (d < r) return { dx, dy, d, r };
      }
      return null;
    };
    for (const c of S.cars) {
      if (c.dead) continue;
      const sp = c.speed;
      for (const p of S.peds) {
        if (p.state === 'down' || p.state === 'dead' || Math.abs(p.x - c.x) > 70 || Math.abs(p.y - c.y) > 70) continue;
        const h = hitPed(p, c); if (!h) continue;
        if (sp > 55) {
          G.combat.carHit(S, p, c, sp);
          c.vx *= 0.97; c.vy *= 0.97;
          if (c === P.car) { G.addHeat(9); const m = M.active; if (m && m.type === 'taxi' && m.stage === 1) m.comfort -= m.def.vip ? 25 : 12; }
          else if (c.driver === 'ai' && c.kind === 'police') { }
        } else { const d = h.d || 1; p.x += h.dx / d * (h.r - h.d + 1); p.y += h.dy / d * (h.r - h.d + 1); }
      }
      // jogador a pé
      if (!P.car && S.mode === 'play') {
        const h = hitPed(P, c);
        if (h) {
          if (sp > 110 && P.iframes <= 0) { P.hp -= 10 + sp * 0.06; P.iframes = 0.9; P.vx = h.dx / (h.d || 1) * 220; P.vy = h.dy / (h.d || 1) * 220; G.snd.bonk(); S.shake = 5; G.combat.spray(S, P.x, P.y, Math.atan2(h.dy, h.dx), 6, 160); }
          else { const d = h.d || 1; P.x += h.dx / d * (h.r - h.d + 1); P.y += h.dy / d * (h.r - h.d + 1); }
        }
      }
    }
  }

  // ---------- Polícia ----------
  function updatePolice(dt) {
    const P = S.player, ref = P.car || P;
    const lvlBefore = S.heatLevel;
    S.heatLevel = lvlOf(S.heat);
    const chasers = S.cars.filter(c => c.kind === 'police' && c.mode === 'chase' && !c.dead);
    const copPeds = S.peds.filter(p => p.kind === 'cop' && p.state !== 'dead');
    S.chasers = chasers.length + copPeds.length;
    // esfriar
    if (S.heat > 0) {
      const near = chasers.some(c => Math.hypot(c.x - ref.x, c.y - ref.y) < 520) || copPeds.some(p => Math.hypot(p.x - ref.x, p.y - ref.y) < 520);
      const heliSees = S.heli && Math.hypot(S.heli.x - ref.x, S.heli.y - ref.y) < 300;
      if (!near) S.heat = Math.max(0, S.heat - dt * (heliSees ? 1.2 : 2.6));
    }
    if (M.active && M.active.type === 'escape' && S.heat <= 0 && false) { }
    S.heatLevel = lvlOf(S.heat);
    if (S.heatLevel === 0 && lvlBefore > 0) {
      S.cars.forEach(c => { if (c.kind === 'police' && c.mode === 'chase') c.mode = 'leave'; });
      S.heli = S.heli ? Object.assign(S.heli, { life: 0.1 }) : null;
      if (!M.active || M.active.type !== 'escape') G.say('Você despistou a polícia.', 4);
    }
    if (S.heatLevel > lvlBefore && lvlBefore === 0) G.say('A polícia está atrás de você!', 4);
    // reforços
    const target = [0, 2, 3, 4, 5, 6][S.heatLevel];
    S.copT -= dt;
    if (chasers.length < target && S.copT <= 0) { S.copT = 1.6; AI.spawnPolice(S, 1); }
    if (S.heatLevel >= 3) { S.blockT -= dt; if (S.blockT <= 0) { S.blockT = 30; AI.spawnRoadblock(S); } } else S.blockT = 8;
    if (S.heatLevel >= 4 && !S.heli) S.heli = { x: ref.x + 900, y: ref.y - 700, vx: 0, vy: 0, rot: 0, a: 0, life: 45 };
    AI.updateHeli(S, dt);
    // preso?
    if (S.mode === 'play' && S.heatLevel > 0) {
      const close = chasers.filter(c => Math.hypot(c.x - ref.x, c.y - ref.y) < (P.car ? 120 : 90));
      // policiais a pé que querem prender (só quando não estão em tiroteio) também contam
      const cuff = copPeds.filter(p => p.arresting && Math.hypot(p.x - ref.x, p.y - ref.y) < (P.car ? 55 : 42));
      const ok = P.car ? (P.car.speed < 70 && close.length + cuff.length >= 2) : (close.length >= 1 || cuff.length >= 1);
      if (ok) S.bustT += dt * (P.car ? 1 : 1.6); else S.bustT = Math.max(0, S.bustT - dt * 1.5);
      if (S.bustT > 3) goBusted();
    } else S.bustT = 0;
  }

  // ---------- Tráfego / pedestres: nascer e sumir ----------
  function managePopulation(dt) {
    const P = S.player, ref = P.car || P;
    // carros
    S.spawnT -= dt;
    const civ = S.cars.filter(c => c.driver === 'ai' && (c.mode === 'wander'));
    const fd = S.dayT - Math.floor(S.dayT), capCarros = (fd > 0.3 && fd < 0.4) || (fd > 0.68 && fd < 0.78) ? 22 : (fd < 0.16 || fd > 0.88) ? 11 : 16;   // hora do rush tem mais carros, madrugada menos
    if (civ.length < capCarros && S.spawnT <= 0) { S.spawnT = 0.5; AI.spawnTraffic(S, Math.random() < 0.06 ? 'police' : null); }
    for (const c of S.cars) { if (c.driver === 'ai' && c.mode === 'wander') { if (c.speed < 8) c.idleT += dt; else c.idleT = 0; } }
    S.cars = S.cars.filter(c => {
      if (c.idleT > 14 && Math.hypot(c.x - ref.x, c.y - ref.y) > 650) return false;
      if (c === P.car || c.owned || c.tag === 'mission' || (M.active && M.active.rivals && M.active.rivals.some(r => r.car === c))) return true;
      const d = Math.hypot(c.x - ref.x, c.y - ref.y);
      if (c.mode === 'block') return d < 1700 && S.time - c.born < 70;
      if (c.mode === 'chase') return d < 1800;
      if (c.mode === 'leave') return d < 900;
      if (c.mode === 'parked' || c.mode === 'wreck') return d < 1800 || c.owned;
      return d < 1500 && !(c.dead && c.burnT > 25 && d > 700);
    });
    // pedestres
    S.pedSpawnT -= dt;
    const alive = S.peds.filter(p => !p.mission && !p.target && p.state !== 'dead').length;
    const hr = G.lugares.hora(S), capPeds = (hr >= 22 || hr < 5) ? 14 : (hr >= 6 && hr < 9) || (hr >= 12 && hr < 14) || (hr >= 17 && hr < 20) ? 40 : 30;   // a rua enche na hora do rush e esvazia de madrugada
    if (alive < capPeds && S.pedSpawnT <= 0) { S.pedSpawnT = 0.25; AI.spawnPed(S); }
    S.peds = S.peds.filter(p => !p.dead && (p.mission || p.target || Math.hypot(p.x - ref.x, p.y - ref.y) < 1150));
    for (const p of S.peds) if (p.state === 'wait') { p.walk = 0; } else AI.updatePed(p, dt, S);
  }

  // ---------- Partículas ----------
  function updateParticles(dt) {
    for (const p of S.particles) {
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.col === 'smoke') { p.size += 10 * dt; p.vx *= 0.98; } else if (p.col === 'ring') p.size += 330 * dt; else if (p.col === 'fire') { p.size -= 4 * dt; p.vy -= 10 * dt; } else { p.vx *= 0.92; p.vy *= 0.92; }
    }
    S.particles = S.particles.filter(p => p.t < p.max && p.size > 0.5);
  }

  // ---------- Câmera ----------
  function updateCamera(dt) {
    const P = S.player, ref = P.car || P;
    const sp = P.car ? P.car.speed : 0;
    const zt = P.car ? 1.6 - 0.5 * Math.min(1, sp / 380) : 1.85;
    S.cam.z += (zt - S.cam.z) * Math.min(1, 2.2 * dt);
    const tx = ref.x + (ref.vx || 0) * 0.28, ty = ref.y + (ref.vy || 0) * 0.28;
    S.cam.x += (tx - S.cam.x) * Math.min(1, 6 * dt); S.cam.y += (ty - S.cam.y) * Math.min(1, 6 * dt);
    S.shake = Math.max(0, S.shake - dt * 18);
  }

  function update(dt) {
    S.time += dt; S.dayT += dt / 420;
    if (S.msg) { S.msg.t -= dt; if (S.msg.t <= 0) S.msg = null; }
    if (S.ban) { S.ban.t -= dt; if (S.ban.t <= 0) S.ban = null; }
    if (S.radioT > 0) S.radioT -= dt;
    if (S.mode === 'play') {
      updatePlayer(dt);
      updateCars(dt);
      managePopulation(dt);
      G.detalhes.update(S, W, dt);
      G.lugares.atualizar(S, dt);
      updatePolice(dt);
      G.combat.update(S, dt);
      M.update(S, dt);
    } else if (S.mode === 'wasted' || S.mode === 'busted') {
      S.modeT += dt; updateCars(dt); managePopulation(dt); G.combat.update(S, dt);
      if (S.modeT > 3.2) respawn(S.mode === 'wasted' ? M.POI.hospital : M.POI.delegacia, S.mode === 'wasted' ? 0.1 : 0.15);
    }
    updateParticles(dt);
    updateCamera(dt);
    // som
    const ref = S.player.car || S.player;
    let sv = 0; for (const c of S.cars) if (c.kind === 'police' && c.siren && !c.dead) { const d = Math.hypot(c.x - ref.x, c.y - ref.y); sv = Math.max(sv, clamp(1 - d / 900, 0, 1)); }
    G.snd.update({ inCar: !!S.player.car, car: S.player.car, horn: S.hornDown && !!S.player.car, sirenVol: S.mode === 'play' ? sv : 0 });
  }

  // ---------- Desenho ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const darkC = document.createElement('canvas'); darkC.width = VW; darkC.height = VH;
  const dctx = darkC.getContext('2d');

  function darkness() {
    const f = ((S.dayT % 1) + 1) % 1;
    if (f < 0.55) return 0; if (f < 0.65) return (f - 0.55) / 0.1; if (f < 0.92) return 1; return 1 - (f - 0.92) / 0.08;
  }

  function drawWorld() {
    const cam = S.cam, z = cam.z;
    const sx = S.shake ? rand(-S.shake, S.shake) * 0.5 : 0, sy = S.shake ? rand(-S.shake, S.shake) * 0.5 : 0;
    ctx.save();
    ctx.translate(VW / 2 + sx, VH / 2 + sy); ctx.scale(z, z); ctx.translate(-cam.x, -cam.y);
    const vx0 = cam.x - VW / 2 / z - 40, vy0 = cam.y - VH / 2 / z - 40, vx1 = cam.x + VW / 2 / z + 40, vy1 = cam.y + VH / 2 / z + 40;
    W.drawChunks(ctx, vx0, vy0, vx1, vy1);
    W.drawWaterFx(ctx, S.time, vx0, vy0, vx1, vy1);   // brilhos na água
    const inV = o => o.x > vx0 - 80 && o.x < vx1 + 80 && o.y > vy0 - 80 && o.y < vy1 + 80;
    G.combat.drawDecals(ctx, S, inV);       // sangue, marcas de pneu e chamuscado
    M.drawWorld(ctx, S, S.time);
    G.combat.drawPickups(ctx, S, inV, S.time);
    const vis = S.peds.filter(inV);
    vis.forEach(p => { if (p.state === 'dead') SP.drawPed(ctx, p, S.time); }); // corpos ficam embaixo dos carros
    // destroços e estacionados primeiro
    const cars = S.cars.filter(inV).sort((a, b) => (a.dead ? 0 : 1) - (b.dead ? 0 : 1));
    cars.forEach(c => SP.drawCar(ctx, c, S.time));
    vis.forEach(p => { if (p.state !== 'dead') SP.drawPed(ctx, p, S.time); });
    if (!S.player.car && S.mode !== 'title') { if (S.player.iframes > 0 && Math.floor(S.time * 14) % 2 === 0) { } else SP.drawPed(ctx, S.player, S.time); }
    G.detalhes.draw(ctx, S, inV);            // pombos
    G.lugares.desenhar(ctx, S, inV);         // marcadores dos lugares, balões de fala, seta do guia
    AI.drawLights(ctx, vx0, vy0, vx1, vy1, S.time);
    G.combat.drawAir(ctx, S, inV);          // balas e granadas
    // partículas
    S.particles.forEach(p => {
      if (!inV(p)) return;
      const k = 1 - p.t / p.max;
      ctx.save(); ctx.translate(p.x, p.y);
      if (p.col === 'smoke') { ctx.globalAlpha = (p.a || 0.55) * k; ctx.fillStyle = p.tint || '#3a3a3f'; ctx.beginPath(); ctx.arc(0, 0, p.size, 0, TAU); ctx.fill(); }
      else if (p.col === 'ring') { ctx.globalAlpha = k * 0.7; ctx.strokeStyle = '#ffe2b0'; ctx.lineWidth = 2 + 6 * k; ctx.beginPath(); ctx.arc(0, 0, p.size, 0, TAU); ctx.stroke(); }
      else if (p.col === 'fire') { ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = k > 0.6 ? '#ffe15a' : k > 0.3 ? '#ff8a1e' : '#d8321a'; ctx.beginPath(); ctx.arc(0, 0, p.size, 0, TAU); ctx.fill(); }
      else if (p.col === 'blood') { ctx.globalAlpha = Math.min(1, k * 1.8); ctx.fillStyle = '#8c0b10'; ctx.beginPath(); ctx.arc(0, 0, p.size, 0, TAU); ctx.fill(); }
      else if (p.col === 'flash') { ctx.globalAlpha = 0.95; const g = ctx.createRadialGradient(0, 0, 1, 0, 0, p.size * 2.2); g.addColorStop(0, 'rgba(255,250,200,1)'); g.addColorStop(0.5, 'rgba(255,170,50,0.7)'); g.addColorStop(1, 'rgba(255,120,0,0)'); ctx.fillStyle = g; ctx.fillRect(-p.size * 2.2, -p.size * 2.2, p.size * 4.4, p.size * 4.4); }
      else { ctx.globalAlpha = k; ctx.fillStyle = '#ffd86a'; ctx.fillRect(-1.5, -1.5, 3, 3); }
      ctx.restore();
    });
    // helicóptero
    const h = S.heli;
    if (h) {
      const ref = S.player.car || S.player;
      ctx.save(); ctx.translate(h.x + 50, h.y + 70); ctx.rotate(h.a); ctx.fillStyle = 'rgba(0,0,10,0.3)'; ctx.beginPath(); ctx.ellipse(0, 0, 14, 34, 0, 0, TAU); ctx.fill(); ctx.restore();
      // holofote
      const g = ctx.createRadialGradient(ref.x, ref.y, 10, ref.x, ref.y, 110); g.addColorStop(0, 'rgba(255,255,220,0.45)'); g.addColorStop(1, 'rgba(255,255,220,0)');
      ctx.fillStyle = g; ctx.fillRect(ref.x - 110, ref.y - 110, 220, 220);
      ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.a);
      ctx.fillStyle = '#20232b'; ctx.beginPath(); ctx.ellipse(0, 0, 12, 26, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#9ec8ff'; ctx.beginPath(); ctx.ellipse(0, -10, 8, 10, 0, 0, TAU); ctx.fill();
      ctx.fillRect(-2, 22, 4, 26); ctx.fillStyle = '#2a2d36'; ctx.fillRect(-10, 46, 20, 3);
      ctx.rotate(h.rot); ctx.strokeStyle = 'rgba(20,20,25,0.75)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-58, 0); ctx.lineTo(58, 0); ctx.moveTo(0, -58); ctx.lineTo(0, 58); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    // noite
    const dk = G.luz.nivel > 0 ? 0 : darkness();   // com luz.js ligada, a noite vem de lá
    if (dk > 0.02) {
      dctx.globalCompositeOperation = 'source-over'; dctx.clearRect(0, 0, VW, VH);
      dctx.fillStyle = 'rgba(6,8,40,' + (0.62 * dk) + ')'; dctx.fillRect(0, 0, VW, VH);
      dctx.globalCompositeOperation = 'destination-out';
      const toS = (x, y) => [(x - cam.x) * z + VW / 2, (y - cam.y) * z + VH / 2];
      const glow = (x, y, r, a) => { const [px, py] = toS(x, y); if (px < -r || px > VW + r || py < -r || py > VH + r) return; const g = dctx.createRadialGradient(px, py, 2, px, py, r); g.addColorStop(0, 'rgba(0,0,0,' + a + ')'); g.addColorStop(1, 'rgba(0,0,0,0)'); dctx.fillStyle = g; dctx.beginPath(); dctx.arc(px, py, r, 0, TAU); dctx.fill(); };
      W.lamps.forEach(l => glow(l.x, l.y, 120 * z, 0.75));
      S.particles.forEach(p => { if (p.col === 'flash') glow(p.x, p.y, 100 * z, 0.9); });
      const cone = (x, y, ang, len, spread, a) => {
        const [px, py] = toS(x, y), L = len * z; if (px < -L || px > VW + L || py < -L || py > VH + L) return;
        const g = dctx.createRadialGradient(px, py, 4, px, py, L); g.addColorStop(0, 'rgba(0,0,0,' + a + ')'); g.addColorStop(1, 'rgba(0,0,0,0)');
        dctx.fillStyle = g; dctx.beginPath(); dctx.moveTo(px, py); dctx.arc(px, py, L, ang - spread, ang + spread); dctx.closePath(); dctx.fill();
      };
      S.particles.forEach(p => { if (p.col === 'ring') glow(p.x, p.y, 280 * z, 0.9); else if (p.col === 'fire' && p.size > 8) glow(p.x, p.y, p.size * 5 * z, 0.45); });
      S.cars.forEach(c => {
        if (c.dead || !inV(c)) return;
        if (c.lights !== false) cone(c.x + c.fx * 36, c.y + c.fy * 36, Math.atan2(c.fy, c.fx), 270, 0.34, 0.95);
        glow(c.x + c.fx * 85, c.y + c.fy * 85, 130 * z, 0.9); glow(c.x + c.fx * 40, c.y + c.fy * 40, 70 * z, 0.8); glow(c.x, c.y, 50 * z, 0.5);
      });
      const ref = S.player.car || S.player; glow(ref.x, ref.y, 70 * z, 0.5);
      dctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(darkC, 0, 0);
    }
    if (G.luz.desenhar(ctx, S, W, cam, z, inV)) { /* visual cinematográfico (luz.js) */ } else {
      const vg = ctx.createRadialGradient(400, 300, 240, 400, 300, 580); vg.addColorStop(0, 'rgba(0,0,10,0)'); vg.addColorStop(1, 'rgba(0,0,12,0.34)');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);   // vinheta (efeito de câmera)
    }
    G.combat.drawScreen(ctx, S);            // tela vermelha ao levar dano
  }

  // ---------- Telas ----------
  function drawTitle(time) {
    const H = G.hud;
    ctx.fillStyle = 'rgba(10,6,30,0.55)'; ctx.fillRect(0, 0, VW, VH);
    ctx.save(); ctx.translate(400, 130); ctx.rotate(-0.04);
    H.txt(ctx, 'RUA VERMELHA', 4, 6, 80, '#000', 'center', '#000');
    H.txt(ctx, 'RUA VERMELHA', 0, 0, 80, '#ff2a2a', 'center', '#200');
    ctx.restore();
    H.txt(ctx, 'mundo aberto, tiroteio e perseguições • estilo GTA antigo', 400, 172, 20, '#ffe04a', 'center');
    const saved = hasSave() && S.save.done + S.save.money > 0;
    H.txt(ctx, saved ? 'ENTER: CONTINUAR (Missão ' + Math.min(S.save.done + 1, M.TOTAL) + ' • $' + S.save.money + ')' : 'ENTER: COMEÇAR', 400, 255, 24, Math.floor(time * 2) % 2 ? '#fff' : '#ffe04a', 'center');
    if (saved) H.txt(ctx, 'N: NOVO JOGO (apaga o progresso)', 400, 285, 16, '#ff9a9a', 'center');
    const L = [
      ['A PÉ', 'WASD / Setas andar  Shift correr  Espaço atacar/atirar  Q ou 1-6 trocam de arma  E usar'],
      ['DE CARRO', 'W/↑ acelera  S/↓ freio e ré  A D ←→ virar  Espaço freio de mão  H buzina  E sair'],
      ['OUTROS', 'R rádio   M som   P pausa   V gráficos'],
      ['OBJETIVO', 'Faça as 12 missões nos telefones amarelos e vire o REI DA CIDADE. Arme-se na loja rosa!'],
      ['POLÍCIA', 'Crime na frente da polícia dá PROCURADO. Eles descem e atiram. Fuja ou lute!'],
    ];
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(40, 320, 720, 230);
    L.forEach((l, i) => { H.txt(ctx, l[0], 60, 352 + i * 42, 16, '#ffe04a'); H.txt(ctx, l[1], 160, 352 + i * 42, 13, '#fff'); });
    H.txt(ctx, 'Clique na tela para ativar o teclado • ATENÇÃO: violência explícita, sangue e armas (+16) • HTML5 Canvas', 400, 580, 13, '#bbb', 'center');
  }
  function drawOverlay(title, sub, col) {
    const H = G.hud;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, VW, VH);
    H.txt(ctx, title, 400, 300, 90, col, 'center'); H.txt(ctx, sub, 400, 350, 22, '#fff', 'center');
  }

  let last = 0, titleCam = 0;
  function startGame(fresh) {
    if (fresh) { S.save = { money: 0, done: 0, paint: 0, king: false, arms: { own: { fist: 1 }, ammo: {} } }; G.save(); }
    G.snd.init(); newWorld(); S.mode = 'play';
  }
  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    if (S.mode === 'loading') {
      const pr = W.buildSome(3);
      ctx.fillStyle = '#14101f'; ctx.fillRect(0, 0, VW, VH);
      G.hud.txt(ctx, 'CARREGANDO A CIDADE...', 400, 290, 28, '#ffe04a', 'center');
      ctx.fillStyle = '#000'; ctx.fillRect(250, 310, 300, 22); ctx.fillStyle = '#ff2a2a'; ctx.fillRect(253, 313, 294 * pr, 16);
      if (pr >= 1) { loadSave(); S.mode = 'title'; newWorld(); S.cam.z = 1.4; }
      return;
    }
    if (S.mode === 'title') {
      titleCam += dt * 60;
      S.time += dt; S.dayT += dt / 300;
      const ang = titleCam / 400;
      S.cam.x = W.nodeX(2) + Math.cos(ang) * 500 + 300; S.cam.y = W.nodeY(1) + Math.sin(ang * 0.7) * 380; S.cam.z = 1.3;
      S.player.x = -9999; S.player.y = -9999; S.player.iframes = 0;
      // o tráfego corre em volta da câmera
      const fake = S.player; fake.x = S.cam.x; fake.y = S.cam.y;
      updateCars(dt); managePopulation(dt); G.detalhes.update(S, W, dt); updateParticles(dt);
      fake.x = -9999; fake.y = -9999;
      drawWorld(); drawTitle(S.time);
      if (Kp('Enter')) startGame(false);
      else if (Kp('KeyN') && hasSave()) startGame(true);
      for (const k in pressed) delete pressed[k];
      return;
    }
    G.lugares.atualizarTrans(S, dt);
    if (S.mode === 'inside') {
      // dentro de um lugar (barbearia, teatro, casa...): outra tela, outro mundo
      if (S.msg) { S.msg.t -= dt; if (S.msg.t <= 0) S.msg = null; }
      if (S.radioT > 0) S.radioT -= dt;
      G.lugares.atualizarDentro(S, dt, K, Kp);
      if (Kp('KeyR')) { G.snd.nextStation(); S.radioT = 3; }
      if (Kp('KeyM')) G.say(G.snd.mute() ? 'Som desligado' : 'Som ligado', 2);
      G.snd.update({ inCar: false, car: null, horn: false, sirenVol: 0 });
      if (S.mode === 'inside') G.lugares.desenharDentro(ctx, S);
      else { updateCamera(dt); drawWorld(); G.hud.draw(ctx, S, S.time); G.lugares.hudMochila(ctx, S); }
      G.lugares.desenharTrans(ctx, S);
      for (const k in pressed) delete pressed[k];
      return;
    }
    if (Kp('KeyP', 'Escape')) { if (S.mode === 'play') S.mode = 'paused'; else if (S.mode === 'paused') S.mode = 'play'; }
    if (S.mode === 'paused' && Kp('Enter')) S.mode = 'play';
    if (S.mode === 'shop') { for (const k in pressed) if (G.combat.shopKey(S, k)) { S.mode = 'play'; G.snd.door(); break; } }
    else if (S.mode !== 'paused') update(dt);
    drawWorld();
    G.hud.draw(ctx, S, S.time);
    if (S.mode === 'play' || S.mode === 'paused') G.lugares.hudMochila(ctx, S);
    if (S.mode === 'wasted') drawOverlay('VOCÊ MORREU', 'Os médicos te trouxeram de volta...', '#ff4a4a');
    if (S.mode === 'busted') drawOverlay('PRESO!', 'A polícia te pegou...', '#6a8bff');
    if (S.mode === 'shop') G.combat.drawShop(ctx, S);
    if (S.mode === 'paused') drawOverlay('PAUSADO', 'P ou ENTER para continuar', '#ffe04a');
    G.lugares.desenharTrans(ctx, S);
    for (const k in pressed) delete pressed[k];
  }

  // ---------- Tela cheia proporcional ----------
  function fit() {
    const r = Math.min(window.innerWidth / VW, window.innerHeight / VH);
    canvas.style.width = Math.floor(VW * r) + 'px'; canvas.style.height = Math.floor(VH * r) + 'px';
  }
  window.addEventListener('resize', fit); fit();
  canvas.addEventListener('mousedown', () => { G.snd.init(); if (S.mode === 'title') startGame(false); });
  requestAnimationFrame(frame);

})(window.G = window.G || {});

</script>
