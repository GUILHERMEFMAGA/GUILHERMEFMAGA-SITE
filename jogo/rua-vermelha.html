    { type: 'steal', name: 'O Fusca Verde', pay: 350, car: { kind: 'sedan', color: '#2f8a3c', label: 'sedã verde' }, brief: 'Um cliente quer um sedã verde. Encontre o carro marcado e leve até o desmanche. Cuidado com a polícia!' },
    { type: 'race', name: 'Racha da Avenida', pay: 500, cps: 5, rivals: 2, brief: 'Racha valendo grana! Vá até a linha de largada, passe pelos cruzamentos marcados e chegue antes dos rivais.' },
    { type: 'escape', name: 'Deu Ruim', pay: 400, level: 3, brief: 'Fizeram alguma coisa e a polícia quer você! Despiste as viaturas e volte para a garagem!' },
    { type: 'delivery', name: 'Entrega Relâmpago', pay: 450, slack: 1.25, brief: 'Entrega urgente do Seu Zé. Dessa vez o tempo é curto. Pé embaixo!' },
    { type: 'taxi', name: 'Passageiro VIP', pay: 500, vip: true, brief: 'Um figurão quer chegar inteiro. Dirija suave: qualquer batida estraga a corrida.' },
    { type: 'steal', name: 'Táxi Amarelo', pay: 550, car: { kind: 'taxi', color: '#f2c42a', label: 'táxi amarelo' }, wanted: 1, brief: 'Preciso de um táxi amarelo com urgência. Pegue o marcado e entregue no desmanche.' },
    { type: 'race', name: 'Grande Prêmio', pay: 700, cps: 7, rivals: 3, brief: 'Grande Prêmio da cidade! Sete pontos, três rivais. Só o primeiro leva a bolada.' },
    { type: 'escape', name: 'Fuga Final', pay: 650, level: 4, brief: 'A cidade inteira está atrás de você. Sobreviva à perseguição e chegue à garagem!' },
  ];
  const RANKS = ['Motorista Novato', 'Entregador', 'Piloto de Fuga', 'Mestre do Asfalto', 'Lenda da Rua', 'Rei da Cidade'];
  const GOAL = 3000;
  const rankIdx = done => Math.min(5, Math.floor(done / 2) + (done >= 10 ? 0 : 0));

  function randSpot(S, minD, maxD, from) {
    const f = from || S.player;
    const c = W.spots.filter(p => { const d = Math.hypot(p.x - f.x, p.y - f.y); return d >= minD && d <= maxD; });
    const arr = c.length ? c : W.spots;
    const p = arr[Math.floor(Math.random() * arr.length)];
    return { x: p.x, y: p.y };
  }

  const M = { POI, PHONES, DEFS, RANKS, GOAL, active: null };

  M.rank = done => RANKS[rankIdx(done)];
  M.mult = done => 1 + 0.1 * rankIdx(done);

  M.startNext = function (S, ph) {
    if (M.active) return;
    const n = S.save.done;
    const def = DEFS[n % DEFS.length];
    const m = { def, type: def.type, stage: 0, markers: [], timeLeft: null, hint: '', n };
    const from = ph || S.player;
    if (def.type === 'delivery') {
      m.A = randSpot(S, 500, 1100, from); m.B = randSpot(S, 900, 1900, m.A);
      m.markers = [{ x: m.A.x, y: m.A.y, r: 48, label: 'PACOTE' }];
      m.hint = 'Pegue o pacote';
    } else if (def.type === 'taxi') {
      m.A = randSpot(S, 500, 1100, from); m.B = randSpot(S, 900, 1900, m.A);
      const p = G.ai.makePed(m.A.x, m.A.y); p.state = 'wait'; p.mission = true; p.shirt = def.vip ? '#111' : '#e8d8f0'; p.h = rand(0, TAU);
      S.peds.push(p); m.ped = p; m.comfort = 100;
      m.markers = [{ x: m.A.x, y: m.A.y, r: 52, label: 'PASSAGEIRO' }];
      m.hint = 'Busque o passageiro (de carro!)';
    } else if (def.type === 'steal') {
      const pt = G.ai.randomRoadPoint(from.x, from.y, 600, 1200);
      const c = new G.Car({ x: pt.x, y: pt.y, a: pt.a, kind: def.car.kind, color: def.car.color, driver: 'none', mode: 'parked', tag: 'mission' });
      S.cars.push(c); m.car = c; m.B = randSpot(S, 900, 1900, pt);
      m.markers = [{ x: c.x, y: c.y, r: 60, label: def.car.label.toUpperCase(), follow: c }];
      m.hint = 'Encontre o ' + def.car.label;
    } else if (def.type === 'race') {
      const i0 = 1 + Math.floor(Math.random() * (W.COLS - 1)), j0 = 1 + Math.floor(Math.random() * (W.ROWS - 1));
      m.start = { i: i0, j: j0 }; m.cps = []; let ci = i0, cj = j0;
      for (let k = 0; k < def.cps; k++) {
        let t = 0, ni, nj;
        do { ni = ci + (Math.floor(Math.random() * 5) - 2); nj = cj + (Math.floor(Math.random() * 3) - 1); t++; }
        while (t < 30 && (ni < 0 || nj < 0 || ni > W.COLS || nj > W.ROWS || (ni === ci && nj === cj) || Math.abs(ni - ci) + Math.abs(nj - cj) < 2));
        if (ni < 0 || nj < 0 || ni > W.COLS || nj > W.ROWS) { ni = ci; nj = cj === 0 ? 2 : cj - 2; }
        m.cps.push({ i: ni, j: nj }); ci = ni; cj = nj;
      }
      m.cp = 0; m.cd = 0; m.rivals = []; m.racing = false; m.placed = 0;
      m.markers = [{ x: W.nodeX(i0), y: W.nodeY(j0), r: 80, label: 'LARGADA' }];
      m.hint = 'Vá até a linha de largada';
    } else if (def.type === 'escape') {
      S.heat = def.level * 20 - 4; m.hint = 'Despiste a polícia! Volte à garagem';
      m.markers = [{ x: POI.garage.x, y: POI.garage.y, r: 70, label: 'GARAGEM' }];
    }
    M.active = m;
    G.say(def.brief, 9);
    G.banner('MISSÃO ' + (n + 1), def.name.toUpperCase());
    G.snd.pick();
  };

  M.fail = function (S, why) {
    const m = M.active; if (!m) return;
    if (m.ped) m.ped.dead = true;
    M.cleanup(S, m);
    M.active = null;
    G.say('MISSÃO FALHOU: ' + why, 6);
    G.banner('MISSÃO FALHOU', why.toUpperCase(), true);
    G.snd.fail();
  };
  M.cleanup = function (S, m) {
    if (m.rivals) m.rivals.forEach(r => { r.car.mode = 'wander'; r.car.nav.mode = 'wander'; r.car.ignoreLights = false; r.car.cruise = rand(170, 230); r.car.hold = 0; });
    if (m.car && m.car.mode !== 'player') m.car.tag = '';
  };
  M.complete = function (S, pay, extra) {
    const m = M.active; if (!m) return;
    const total = Math.round(pay * M.mult(S.save.done));
    S.save.money += total; S.save.done++;
    G.save();
    M.cleanup(S, m);
    M.active = null;
    G.snd.win(); setTimeout(() => G.snd.cash(), 500);
    const king = S.save.done >= 10 && S.save.money >= GOAL;
    G.banner(king ? 'REI DA CIDADE!' : 'MISSÃO CUMPRIDA', '+$' + total + (extra ? '  ' + extra : ''));
    let msg = m.def.name + ' concluída! +$' + total + '.';
    if (king && !S.save.king) { S.save.king = true; G.save(); msg = 'VOCÊ É O REI DA CIDADE! Campanha completa. Continue no modo livre!'; }
    else if (S.save.done >= 10 && S.save.money < GOAL) msg += ' Faltam $' + (GOAL - S.save.money) + ' para ser o Rei da Cidade.';
    else msg += ' Ligue em outro telefone para a próxima.';
    G.say(msg, 8);
  };

  const inCircle = (p, mk, extra) => Math.hypot(p.x - mk.x, p.y - mk.y) < mk.r + (extra || 0);

  M.update = function (S, dt) {
    const m = M.active; if (!m) return;
    const P = S.player, pc = P.car, ref = pc || P;
    m.markers.forEach(mk => { if (mk.follow) { mk.x = mk.follow.x; mk.y = mk.follow.y; } });
    if (m.timeLeft != null) {
      m.timeLeft -= dt;
      if (m.timeLeft <= 0) return M.fail(S, 'acabou o tempo');
    }
    const slow = v => !pc || pc.speed < v;
    if (m.type === 'delivery') {
      if (m.stage === 0 && inCircle(ref, m.markers[0])) {
        m.stage = 1; G.snd.pick();
        m.timeLeft = (Math.abs(m.A.x - m.B.x) + Math.abs(m.A.y - m.B.y)) / 190 * m.def.slack + 12;
        m.markers = [{ x: m.B.x, y: m.B.y, r: 52, label: 'DESTINO' }]; m.hint = 'Entregue o pacote a tempo'; G.say('Pacote na mão! Leve ao destino antes do tempo acabar.', 5);
      } else if (m.stage === 1 && inCircle(ref, m.markers[0])) M.complete(S, m.def.pay, m.timeLeft > 20 ? '(+ gorjeta)' : '');
    } else if (m.type === 'taxi') {
      if (m.stage === 0) {
        if (inCircle(ref, m.markers[0])) {
          if (!pc) { m.warn = (m.warn || 0) - dt; if (m.warn <= 0) { G.say('Você precisa estar de carro para o passageiro embarcar!', 3); m.warn = 4; } }
          else if (pc.speed < 220) {
            m.ped.dead = true; m.stage = 1; G.snd.pick(); m.comfort = 100;
            m.markers = [{ x: m.B.x, y: m.B.y, r: 55, label: 'DESTINO' }]; m.hint = 'Leve o passageiro sem bater'; G.say('Passageiro a bordo! Cuidado com as batidas.', 5);
          }
        }
      } else {
        if (!pc) { m.leaveT = (m.leaveT || 0) + dt; if (m.leaveT > 12) return M.fail(S, 'você abandonou o passageiro'); } else m.leaveT = 0;
        if (m.comfort <= 0) return M.fail(S, 'passageiro furioso');
        if (pc && inCircle(ref, m.markers[0]) && pc.speed < 250) M.complete(S, m.def.pay * (0.6 + 0.4 * m.comfort / 100), m.comfort > 80 ? '(ótima direção!)' : '');
      }
    } else if (m.type === 'steal') {
      if (m.car.dead) return M.fail(S, 'o carro foi destruído');
      if (m.stage === 0) {
        if (pc === m.car) {
          m.stage = 1; G.snd.pick();
          m.markers = [{ x: m.B.x, y: m.B.y, r: 60, label: 'DESMANCHE' }]; m.hint = 'Leve o carro ao desmanche';
          G.say('Boa! Agora leve o carro ao desmanche.', 5);
          if (m.def.wanted) G.addHeat(m.def.wanted * 20);
        }
      } else {
        if (Math.hypot(m.car.x - m.B.x, m.car.y - m.B.y) < 70 && Math.hypot(ref.x - m.B.x, ref.y - m.B.y) < 160) M.complete(S, m.def.pay);
      }
    } else if (m.type === 'race') {
      updateRace(S, m, dt);
    } else if (m.type === 'escape') {
      const g = POI.garage;
      if (inCircle(ref, m.markers[0])) {
        const cop = S.cars.some(c => c.kind === 'police' && c.mode === 'chase' && Math.hypot(c.x - ref.x, c.y - ref.y) < 300);
        if (!cop && slow(300)) { S.heat = 0; M.complete(S, m.def.pay); }
        else { m.warn = (m.warn || 0) - dt; if (m.warn <= 0) { G.say('Eles ainda estão na sua cola! Despiste as viaturas primeiro.', 3); m.warn = 4; } }
      }
    }
  };

  function updateRace(S, m, dt) {
    const P = S.player, pc = P.car, ref = pc || P;
    if (!m.racing) {
      const mk = m.markers[0];
      if (inCircle(ref, mk) && !m.done) {
        if (!m.rivals.length) spawnRivals(S, m);
        const before = Math.ceil(m.cd);
        m.cd += dt;
        const sec = 3 - Math.floor(m.cd);
        if (sec !== m.lastSec && sec > 0) { m.lastSec = sec; G.snd.count(); G.banner(String(sec), 'PREPARAR', false, 0.9); }
        if (m.cd >= 3) { m.racing = true; m.cp = 0; G.snd.go(); G.banner('VAI!', 'CORRA!', false, 1); m.t0 = S.time; m.hint = 'Passe pelos pontos!'; setCps(m); m.rivals.forEach(r => { r.car.hold = 0; r.car.mode = 'race'; }); }
      } else { m.cd = Math.max(0, m.cd - dt * 2); m.lastSec = 0; }
      if (!m.racing) m.rivals.forEach(r => { r.car.hold = 1; });
      return;
    }
    // corrida em andamento
    const cp = m.cps[m.cp];
    const cx = W.nodeX(cp.i), cy = W.nodeY(cp.j);
    if (Math.hypot(ref.x - cx, ref.y - cy) < 100) {
      m.cp++; G.snd.pick();
      if (m.cp >= m.cps.length) {
        const place = 1 + m.rivals.filter(r => r.finished).length;
        if (place === 1) M.complete(S, m.def.pay, '(1º lugar!)');
        else M.fail(S, 'você chegou em ' + place + 'º lugar');
        return;
      }
      setCps(m);
    }
    // rivais
    m.rivals.forEach(r => {
      if (r.finished) return;
      const c = m.cps[r.cp]; const x = W.nodeX(c.i), y = W.nodeY(c.j);
      if (Math.hypot(r.car.x - x, r.car.y - y) < 120) {
        r.cp++;
        if (r.cp >= m.cps.length) { r.finished = true; r.car.nav.mode = 'wander'; r.car.cruise = 200; G.say(r.name + ' cruzou a chegada!', 3); if (m.cp < m.cps.length) { const place = 1 + m.rivals.filter(q => q.finished).length; if (place > m.rivals.length) return M.fail(S, 'você foi o último'); } return; }
        const nc = m.cps[r.cp]; r.car.nav.target = { i: nc.i, j: nc.j };
      }
      // elástico para manter a corrida disputada
      const dn = Math.hypot(r.car.x - W.nodeX(m.cps[Math.min(r.cp, m.cps.length - 1)].i), r.car.y - W.nodeY(m.cps[Math.min(r.cp, m.cps.length - 1)].j));
      const pn = Math.hypot(ref.x - W.nodeX(cp.i), ref.y - W.nodeY(cp.j));
      const rp = r.cp * 900 - dn, pp = m.cp * 900 - pn;
      r.car.cruise = r.base * (rp > pp + 700 ? 0.82 : rp < pp - 700 ? 1.1 : 1);
    });
  }
  function setCps(m) {
    const cp = m.cps[m.cp], nx = m.cps[m.cp + 1];
    m.markers = [{ x: W.nodeX(cp.i), y: W.nodeY(cp.j), r: 100, label: 'PONTO ' + (m.cp + 1) + '/' + m.cps.length }];
    if (nx) m.markers.push({ x: W.nodeX(nx.i), y: W.nodeY(nx.j), r: 60, label: '', small: true });
  }
  function spawnRivals(S, m) {
    const names = ['Juninho', 'Tico', 'Dani Turbo'], cols = ['#1f9d3a', '#2b59c4', '#d8d04a'];
    const i = m.start.i, j = m.start.j;
    for (let k = 0; k < m.def.rivals; k++) {
      const dir = 1, off = 90 + k * 100;
      const lane = k % 2 === 0 ? 1 : -1;
      const x = lane > 0 ? W.laneV(i, 1) : W.laneV(i, -1) , y = W.nodeY(j) - 110 - k * 90;
      // os rivais ficam na faixa descendo (dir=1) antes do cruzamento
      const c = new G.Car({ x: W.laneV(i, 1), y: W.nodeY(j) - 120 - k * 92, a: Math.PI, kind: 'coupe', color: cols[k % 3], driver: 'ai', mode: 'race', mass: 1.1 });
      c.max = 330 + k * 10; c.nav = G.ai.initNav('v', i, 1, c.y); c.nav.mode = 'goto'; c.nav.target = { i: m.cps[0].i, j: m.cps[0].j };
      c.ignoreLights = true; c.cruise = 270 + k * 12; c.hold = 1;
      S.cars.push(c); m.rivals.push({ car: c, cp: 0, base: 270 + k * 12, name: names[k % 3], finished: false });
    }
  }

  // desenha os marcadores no mundo
  M.drawWorld = function (ctx, S, time) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 5);
    const ring = (x, y, r, col, label, fill) => {
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = col; ctx.setLineDash([14, 10]); ctx.lineDashOffset = -time * 30; ctx.stroke();
      ctx.restore();
    };
    // lugares
    Object.keys(POI).forEach(k => {
      const p = POI[k];
      const col = k === 'oficina' ? '#ff9a3d' : k === 'garage' ? '#6fd0ff' : k === 'hospital' ? '#ff6b6b' : '#7a9bff';
      ring(p.x, p.y, p.r, col, '', 'rgba(255,255,255,0.10)');
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.fillStyle = col; ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
      if (k === 'hospital') { ctx.fillStyle = '#fff'; ctx.fillRect(-16, -16, 32, 32); ctx.fillStyle = '#e03030'; ctx.fillRect(-4, -12, 8, 24); ctx.fillRect(-12, -4, 24, 8); ctx.strokeRect(-16, -16, 32, 32); }
      else if (k === 'garage') { ctx.beginPath(); ctx.moveTo(-18, 6); ctx.lineTo(0, -16); ctx.lineTo(18, 6); ctx.lineTo(18, 16); ctx.lineTo(-18, 16); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#223'; ctx.fillRect(-8, 2, 16, 14); }
      else if (k === 'oficina') { ctx.rotate(0.8); ctx.fillRect(-3, -16, 6, 32); ctx.beginPath(); ctx.arc(0, -16, 8, 0, TAU); ctx.fill(); ctx.fillStyle = '#6a3a10'; ctx.beginPath(); ctx.arc(0, -16, 3, 0, TAU); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, 15, 0, TAU); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('★', 0, 7); }
      ctx.restore();
    });
    // telefones
    PHONES.forEach(p => {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(p.x - 6, p.y - 6, 18, 18);
      ctx.fillStyle = '#2a64c8'; ctx.fillRect(p.x - 9, p.y - 9, 18, 18);
      ctx.fillStyle = '#9fd0ff'; ctx.fillRect(p.x - 6, p.y - 6, 12, 12);
      ctx.fillStyle = '#111'; ctx.fillRect(p.x - 3, p.y - 3, 6, 4); ctx.strokeStyle = '#0a1a3a'; ctx.lineWidth = 2; ctx.strokeRect(p.x - 9, p.y - 9, 18, 18);
      if (!M.active) { // anel amarelo: missão disponível
        ctx.save(); ctx.strokeStyle = 'rgba(255,220,40,' + (0.5 + 0.5 * pulse) + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, 26 + pulse * 6, 0, TAU); ctx.stroke(); ctx.restore();
      }
    });
    // marcadores da missão
    const m = M.active; if (!m) return;
    m.markers.forEach(mk => {
      const col = mk.small ? 'rgba(255,255,255,0.8)' : '#ffd21f';
      ring(mk.x, mk.y, mk.r * (mk.small ? 1 : 0.9 + 0.1 * pulse), col, mk.label, mk.small ? 'rgba(255,255,255,0.08)' : 'rgba(255,210,30,0.20)');
    });
  };

  // ---------- Reações do jogo ----------
  M.onCrashPlayerCar = function (imp) {
    const m = M.active; if (m && m.type === 'taxi' && m.stage === 1) m.comfort -= imp * (m.def.vip ? 0.28 : 0.14);
  };

  G.missions = M;
})(window.G = window.G || {});

</script>
<script>
/* ==== hud.js ==== */
/* ============================================================
   hud.js — interface no estilo dos GTA antigos:
   dinheiro, policiais (procurado), vida, legenda amarela com pager,
   minimapa, setas de missão, avisos na tela
   ============================================================ */
(function (G) {
  'use strict';
  const W = G.world, TAU = Math.PI * 2;
  const FONT = '"Trebuchet MS","Arial Black",Impact,sans-serif';
  let mini = null; const MINI_SCALE = 12;

  function txt(ctx, s, x, y, size, col, align, stroke) {
    ctx.font = 'bold ' + size + 'px ' + FONT;
    ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 4); ctx.strokeStyle = stroke || '#000';
    ctx.strokeText(s, x, y); ctx.fillStyle = col || '#ffe04a'; ctx.fillText(s, x, y);
  }
  function wrapText(ctx, s, maxW, size) {
    ctx.font = 'bold ' + size + 'px ' + FONT;
    const words = s.split(' '), lines = []; let cur = '';
    words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
    if (cur) lines.push(cur); return lines;
  }
  const money = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  function heart(ctx, x, y, s, full) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-12, -2, -6, -10, 0, -4); ctx.bezierCurveTo(6, -10, 12, -2, 0, 6);
    ctx.fillStyle = full ? '#e3262e' : '#3a1a1e'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#000'; ctx.stroke();
    if (full) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(-5, -4, 3, 2); }
    ctx.restore();
  }
  function cop(ctx, x, y, col) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = col; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 2, 13, 0, TAU); ctx.fillStyle = '#e8b890'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1c2f6b'; ctx.fillRect(-14, -8, 28, 9); ctx.strokeRect(-14, -8, 28, 9);
    ctx.beginPath(); ctx.arc(0, -8, 11, Math.PI, 0); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f2c231'; ctx.fillRect(-3, -14, 6, 6);
    ctx.fillStyle = '#000'; ctx.fillRect(-7, 3, 4, 3); ctx.fillRect(3, 3, 4, 3); ctx.fillRect(-3, 10, 6, 2);
    ctx.restore();
  }
  function pager(ctx, x, y) {
    ctx.fillStyle = '#16181c'; ctx.fillRect(x, y, 40, 30); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(x, y, 40, 30);
    ctx.fillStyle = '#7bb35a'; ctx.fillRect(x + 4, y + 4, 32, 12);
    ctx.fillStyle = '#2b4a22'; for (let k = 0; k < 4; k++) ctx.fillRect(x + 6 + k * 7, y + 8, 5, 4);
    ctx.fillStyle = '#444'; for (let a = 0; a < 3; a++) for (let b = 0; b < 4; b++) ctx.fillRect(x + 5 + b * 8, y + 19 + a * 3.5, 6, 2.5);
  }

  function drawMini(ctx, S, time) {
    if (!mini) mini = W.makeMini(MINI_SCALE);
    const w = 170, h = 120, x = 800 - w - 10, y = 600 - h - 10;
    const P = S.player, ref = P.car || P;
    const cx = ref.x / MINI_SCALE, cy = ref.y / MINI_SCALE;
    ctx.save();
    ctx.fillStyle = '#000'; ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.fillStyle = '#111'; ctx.fillRect(x, y, w, h);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(mini, cx - w / 2, cy - h / 2, w, h, x, y, w, h);
    const tm = (wx, wy) => [x + w / 2 + (wx - ref.x) / MINI_SCALE, y + h / 2 + (wy - ref.y) / MINI_SCALE];
    const dot = (wx, wy, col, r) => { const [px, py] = tm(wx, wy); if (px < x || px > x + w || py < y || py > y + h) return false; ctx.fillStyle = col; ctx.fillRect(px - r, py - r, r * 2, r * 2); ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(px - r, py - r, r * 2, r * 2); return true; };
    G.missions.PHONES.forEach(p => dot(p.x, p.y, G.missions.active ? '#4a88ff' : '#ffe04a', 2.5));
    const po = G.missions.POI; dot(po.garage.x, po.garage.y, '#6fd0ff', 2.5); dot(po.oficina.x, po.oficina.y, '#ff9a3d', 2.5); dot(po.hospital.x, po.hospital.y, '#ff6b6b', 2.5);
    S.cars.forEach(c => { if (c.kind === 'police' && !c.dead && c.mode !== 'wander') dot(c.x, c.y, Math.floor(time * 6) % 2 ? '#ff3030' : '#3a5bff', 2); });
    const m = G.missions.active;
    if (m) m.markers.forEach(mk => {
      if (mk.small) return;
      const [px, py] = tm(mk.x, mk.y);
      const ex = Math.max(x + 5, Math.min(x + w - 5, px)), ey = Math.max(y + 5, Math.min(y + h - 5, py));
      ctx.fillStyle = Math.floor(time * 3) % 2 ? '#ffd21f' : '#fff'; ctx.beginPath(); ctx.arc(ex, ey, 4, 0, TAU); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
    });
    // jogador
    ctx.translate(x + w / 2, y + h / 2); ctx.rotate(P.car ? P.car.a : (P.h || 0));
    ctx.fillStyle = Math.floor(time * 4) % 2 ? '#ff2b2b' : '#ffffff';
    ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(4, 4); ctx.lineTo(-4, 4); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }

  // seta apontando para o objetivo
  function drawArrow(ctx, S, time) {
    const m = G.missions.active; if (!m || !m.markers.length) return;
    const mk = m.markers[0], cam = S.cam;
    const sx = (mk.x - cam.x) * cam.z + 400, sy = (mk.y - cam.y) * cam.z + 300;
    const P = S.player, ref = P.car || P;
    const px = (ref.x - cam.x) * cam.z + 400, py = (ref.y - cam.y) * cam.z + 300;
    const d = Math.hypot(sx - px, sy - py);
    if (d < 140) return;
    const ang = Math.atan2(sy - py, sx - px);
    const r = 92 + Math.sin(time * 6) * 4;
    ctx.save(); ctx.translate(px + Math.cos(ang) * r, py + Math.sin(ang) * r); ctx.rotate(ang);
    ctx.fillStyle = '#ffd21f'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -11); ctx.lineTo(-3, 0); ctx.lineTo(-8, 11); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function draw(ctx, S, time) {
    drawArrow(ctx, S, time);
    const P = S.player;
    // --- dinheiro ---
    const mult = G.missions.mult(S.save.done);
    const ms = money(S.save.money), mm = 'x' + (Math.round(mult * 10) / 10);
    ctx.font = 'bold 22px ' + FONT; const mw = ctx.measureText(mm).width;
    txt(ctx, mm, 790, 40, 22, '#ffe04a', 'right');
    ctx.font = 'bold 34px ' + FONT; const nw = ctx.measureText(ms).width;
    txt(ctx, ms, 790 - mw - 10, 40, 34, '#ffe04a', 'right');
    txt(ctx, '$', 790 - mw - 10 - nw - 8, 40, 34, '#3fdc4a', 'right');
    txt(ctx, G.missions.rank(S.save.done).toUpperCase(), 790, 62, 14, '#ffffff', 'right');
    if (S.save.done >= 10) txt(ctx, S.save.money >= G.missions.GOAL ? 'META CUMPRIDA' : 'META: $' + money(G.missions.GOAL), 790, 80, 13, '#9ff0ff', 'right');
    // --- corações ---
    const hearts = Math.ceil(P.hp / 20);
    for (let k = 0; k < 5; k++) heart(ctx, 26 + k * 28, 26, 1.25, k < hearts);
    // vida do carro
    if (P.car) { ctx.fillStyle = '#000'; ctx.fillRect(14, 44, 136, 12); ctx.fillStyle = P.car.hp > 50 ? '#3fdc4a' : P.car.hp > 25 ? '#ffd21f' : '#ff3030'; ctx.fillRect(16, 46, 132 * P.car.hp / 100, 8); txt(ctx, 'CARRO', 158, 55, 11, '#fff', 'left'); }
    // --- procurado ---
    const lv = S.heatLevel;
    for (let k = 0; k < 5; k++) {
      if (k < lv) { const blink = lv > 0 && (S.chasers > 0) && Math.floor(time * 4) % 2 === 0; cop(ctx, 400 - 2.5 * 34 + 17 + k * 34, 28, blink ? '#fff' : '#fff'); }
    }
    if (S.bustT > 0.2) { ctx.fillStyle = '#000'; ctx.fillRect(340, 56, 120, 10); ctx.fillStyle = '#3a6bff'; ctx.fillRect(342, 58, 116 * Math.min(1, S.bustT / 3), 6); txt(ctx, 'PRESO!', 400, 82, 13, '#9ab6ff', 'center'); }
    // --- missão ---
    const m = G.missions.active;
    let ty = 92;
    if (m) {
      txt(ctx, m.def.name.toUpperCase(), 12, ty, 15, '#ffd21f'); ty += 18;
      if (m.hint) { txt(ctx, m.hint, 12, ty, 13, '#fff'); ty += 16; }
      if (m.timeLeft != null) { const t = Math.max(0, m.timeLeft); txt(ctx, 'TEMPO ' + Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'), 12, ty, 18, t < 15 ? '#ff5555' : '#fff'); ty += 20; }
      if (m.type === 'taxi' && m.stage === 1) { txt(ctx, 'CONFORTO', 12, ty, 13, '#fff'); ctx.fillStyle = '#000'; ctx.fillRect(92, ty - 11, 104, 13); ctx.fillStyle = m.comfort > 50 ? '#3fdc4a' : '#ff6b3a'; ctx.fillRect(94, ty - 9, Math.max(0, m.comfort), 9); ty += 18; }
      if (m.type === 'race' && m.racing) {
        const place = 1 + m.rivals.filter(r => r.finished || r.cp > m.cp).length;
        txt(ctx, place + 'º LUGAR   PONTO ' + Math.min(m.cp + 1, m.cps.length) + '/' + m.cps.length, 12, ty, 15, '#fff'); ty += 18;
      }
    } else {
      txt(ctx, 'Procure um telefone amarelo no mapa', 12, ty, 13, '#ffffff');
    }
    // --- rádio ---
    if (S.radioT > 0) txt(ctx, '♪ ' + G.snd.stationName(), 400, 70, 16, '#ff9ae0', 'center');
    // --- mensagem (legenda) ---
    if (S.msg && S.msg.t > 0) {
      const a = Math.min(1, S.msg.t * 2);
      ctx.save(); ctx.globalAlpha = a;
      const lines = wrapText(ctx, S.msg.text.toUpperCase(), 520, 17);
      const bh = lines.length * 21 + 10;
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(60, 594 - bh, 560, bh);
      lines.forEach((l, i) => txt(ctx, l, 68, 594 - bh + 22 + i * 21, 17, '#ffe04a'));
      pager(ctx, 12, 594 - 30);
      ctx.restore();
    } else pager(ctx, 12, 594 - 30);
    // --- dica de interação ---
    if (S.prompt) txt(ctx, S.prompt, 400, 455, 18, '#ffffff', 'center');
    // --- minimapa ---
    drawMini(ctx, S, time);
    // --- faixa grande ---
    if (S.ban && S.ban.t > 0) {
      const b = S.ban, a = Math.min(1, b.t * 2.5, (b.dur - b.t) * 6 + 0.01);
      ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, a)); const sc = 1 + 0.15 * Math.max(0, 1 - (b.dur - b.t) * 5);
      ctx.translate(400, 250); ctx.scale(sc, sc);
      txt(ctx, b.title, 0, 0, 54, b.fail ? '#ff5a5a' : '#ffd21f', 'center');
      txt(ctx, b.sub, 0, 34, 24, '#fff', 'center');
      ctx.restore();
    }
  }

  G.hud = { draw, txt };
})(window.G = window.G || {});

</script>
<script>
/* ==== game.js ==== */
/* ============================================================
   game.js — laço principal, jogador, polícia, colisões, câmera e telas
   ============================================================ */
(function (G) {
  'use strict';
  const W = G.world, T = W.T, M = G.missions, AI = G.ai, SP = G.sprites;
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const wrap = AI.wrap;
  const VW = 800, VH = 600;
  const SAVE_KEY = 'ruaVermelha.v1';
  const PAINTS = ['#c4161c', '#1f4fd8', '#f0f0f0', '#15151a', '#e8a020', '#2fa84f', '#8a3fc2'];

  const S = G.S = {
    time: 0, dayT: 0.28, cars: [], peds: [], particles: [], heat: 0, heatLevel: 0, chasers: 0,
    player: null, save: { money: 0, done: 0, paint: 0, king: false }, cam: { x: 0, y: 0, z: 1.5 },
    msg: null, ban: null, radioT: 0, prompt: '', bustT: 0, heli: null, mode: 'loading', modeT: 0,
    copT: 0, blockT: 0, spawnT: 0, pedSpawnT: 0, hornDown: false, redCar: null, shake: 0, hitCool: 0,
  };

  // ---------- Salvar / carregar ----------
  G.save = function () { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S.save)); } catch (e) { } };
  function loadSave() { try { const j = JSON.parse(localStorage.getItem(SAVE_KEY)); if (j && typeof j.money === 'number') S.save = Object.assign({ money: 0, done: 0, paint: 0, king: false }, j); } catch (e) { } }
  const hasSave = () => { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } };

  // ---------- Mensagens ----------
  G.say = function (text, secs) { S.msg = { text, t: secs || 5 }; };
  G.banner = function (title, sub, fail, dur) { S.ban = { title, sub, fail, t: dur || 2.6, dur: dur || 2.6 }; };

  // ---------- Partículas ----------
  G.particle = function (p) { if (S.particles.length > 420) S.particles.shift(); p.t = 0; p.max = p.life; S.particles.push(p); };
  function sparks(x, y, n, col) { for (let k = 0; k < n; k++) { const a = rand(0, TAU), v = rand(60, 220); G.particle({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.2, 0.5), size: 2.5, col: col || 'spark' }); } }
  function stars(x, y) { for (let k = 0; k < 5; k++) { const a = rand(0, TAU); G.particle({ x, y, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60 - 20, life: 0.8, size: 7, col: 'star', rot: rand(0, 6) }); } }

  // ---------- Procurado ----------
  G.addHeat = function (n) { S.heat = clamp(S.heat + n, 0, 100); };
  const lvlOf = h => h <= 0 ? 0 : Math.min(5, Math.ceil(h / 20));
  function copNear(x, y, r) { for (const c of S.cars) if (c.kind === 'police' && !c.dead && Math.abs(c.x - x) < r && Math.abs(c.y - y) < r && Math.hypot(c.x - x, c.y - y) < r) return true; return false; }

  // ---------- Batidas / explosões ----------
  G.carCrash = function (a, b, imp, x, y) {
    const P = S.player;
    const isP = c => c && c === P.car;
    if ((a.hitCool > 0 && (!b || b.hitCool > 0))) return;
    const dmg = Math.max(0, (imp - 60) * 0.085);
    a.hitCool = 0.12; if (b) b.hitCool = 0.12;
    if (dmg > 0) {
      const copHit = b && (a.kind === 'police' || b.kind === 'police') && (isP(a) || isP(b));
      G.carDamage(a, dmg * (copHit && isP(a) ? 0.35 : 1)); if (b) G.carDamage(b, dmg * (copHit && isP(b) ? 0.35 : 0.9));
    }
    sparks(x, y, Math.min(12, 3 + imp / 40));
    if (Math.hypot(x - P.x, y - P.y) < 600) G.snd.crash(Math.min(1, imp / 300));
    if (imp > 160) S.shake = Math.min(10, S.shake + imp / 60);
    const pc = isP(a) ? a : isP(b) ? b : null;
    if (pc) {
      M.onCrashPlayerCar(imp);
      P.hp -= dmg * 0.4; if (P.hp <= 0 && !P.dead) P.hp = 0;
      const o = pc === a ? b : a;
      if (o && o.kind === 'police' && imp > 70) G.addHeat(o.mode === 'chase' ? 3 : 18);
      else if (o && imp > 110 && copNear(pc.x, pc.y, 450)) G.addHeat(8);
    }
  };
  G.explodeCar = function (c) {
    c.dead = true; c.hp = 0; c.thr = 0;
    G.snd.boom(); S.shake = 14;
    for (let k = 0; k < 26; k++) { const a = rand(0, TAU), v = rand(30, 190); G.particle({ x: c.x, y: c.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.5, 1.2), size: rand(9, 20), col: k % 3 === 0 ? 'smoke' : 'fire' }); }
    sparks(c.x, c.y, 18);
    const P = S.player;
    if (c.driver === 'player' || P.car === c) {
      P.car = null; P.x = c.x + c.fx * 10; P.y = c.y + 50; P.hp -= 45; P.iframes = 1.5; P.vx = rand(-90, 90); P.vy = rand(60, 120);
    } else {
      const d = Math.hypot(P.x - c.x, P.y - c.y);
      if (!P.car && d < 110) { P.hp -= 40; P.iframes = 1; }
      else if (P.car && P.car !== c && d < 100) G.carDamage(P.car, 35);
    }
    S.cars.forEach(o => { if (o !== c && Math.hypot(o.x - c.x, o.y - c.y) < 110) { G.carDamage(o, 40); const a = Math.atan2(o.y - c.y, o.x - c.x); o.vx += Math.cos(a) * 180; o.vy += Math.sin(a) * 180; } });
    S.peds.forEach(p => { if (p.state !== 'down' && Math.hypot(p.x - c.x, p.y - c.y) < 120) knockPed(p, c.x, c.y, 200); });
    c.driver = 'none'; c.mode = 'wreck';
  };

  function knockPed(p, fx, fy, force) {
    if (p.state === 'down' || p.mission) return;
    p.state = 'down'; p.downT = 0;
    const a = Math.atan2(p.y - fy, p.x - fx); p.vx = Math.cos(a) * force * 0.45; p.vy = Math.sin(a) * force * 0.45;
    stars(p.x, p.y - 6); G.snd.bonk();
  }

  // ---------- Criação do mundo ----------
  function newWorld() {
    S.cars = []; S.peds = []; S.particles = []; S.heat = 0; S.heatLevel = 0; S.heli = null; S.bustT = 0; S.time = 0;
    M.active = null;
    const g = M.POI.garage;
    const red = new G.Car({ x: g.x + 110, y: g.y, a: Math.PI / 2, kind: 'coupe', color: PAINTS[S.save.paint % PAINTS.length], driver: 'none', mode: 'parked', owned: true });
    S.cars.push(red); S.redCar = red;
    S.player = Object.assign({ x: g.x + 40, y: g.y + 4, vx: 0, vy: 0, h: 0, walk: 0, hp: 100, car: null, player: true, state: 'walk', punchT: 0, iframes: 0, dead: false }, { shirt: '#e8832a', skin: '#b9794a', hair: '#1a1208' });
    for (let k = 0; k < 10; k++) AI.spawnTraffic(S);
    for (let k = 0; k < 14; k++) AI.spawnPed(S);
    S.cam.x = S.player.x; S.cam.y = S.player.y;
    // saudação
    if (S.save.done === 0) G.say('Bem-vindo a Ribeirão Vermelha! Pressione E perto do seu carro vermelho para entrar. Depois procure um telefone amarelo para pegar missões.', 10);
    else G.say('Bem-vindo de volta! Missão ' + (S.save.done + 1) + ' de 10 esperando no telefone.', 6);
  }

  // ---------- Entrar / sair de carros ----------
  function enterCar(c) {
    const P = S.player;
    if (c.driver === 'ai') {
      // carjack: o motorista sai correndo
      const d = AI.makePed(c.x - Math.cos(c.a) * 38, c.y - Math.sin(c.a) * 38);
      d.state = 'flee'; d.fleeT = 3.5; d.threat = { x: P.x, y: P.y }; S.peds.push(d);
      const police = c.kind === 'police';
      if (police || copNear(c.x, c.y, 420)) G.addHeat(police ? 45 : 25);
      else if (c.mode === 'wander') G.addHeat(4);
    }
    c.driver = 'player'; c.mode = 'player'; c.hb = false; c.nav = null; c.siren = false; c.revT = 0; c.stuckT = 0;
    P.car = c; G.snd.door();
    if (G.snd.station() === 0 && !S.radioAuto) { S.radioAuto = true; G.snd.nextStation(); S.radioT = 3; }
  }
  function exitCar() {
    const P = S.player, c = P.car; if (!c) return;
    const side = [1, -1];
    let placed = false;
    for (const s of side) {
      const x = c.x + Math.cos(c.a) * s * (SP.CAR_W / 2 + 14), y = c.y + Math.sin(c.a) * s * (SP.CAR_W / 2 + 14);
      if (!W.isSolid(x, y) && !W.treeHit(x, y, 6)) { P.x = x; P.y = y; placed = true; break; }
    }
    if (!placed) { P.x = c.x; P.y = c.y; }
    P.h = c.a; P.vx = P.vy = 0;
    c.driver = 'none'; c.mode = 'parked'; c.thr = 0; c.steer = 0; c.hb = true; P.car = null; G.snd.door();
  }

  // ---------- Entrada (teclado) ----------
  const keys = {}, pressed = {};
  function onKey(e, down) {
    const k = e.code;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(k)) e.preventDefault();
    if (down && !keys[k]) pressed[k] = true;
    keys[k] = down;
  }
  window.addEventListener('keydown', e => { onKey(e, true); G.snd.init(); });
  window.addEventListener('keyup', e => onKey(e, false));
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (S.mode === 'play') S.mode = 'paused'; });
  const K = (...c) => c.some(x => keys[x]);
  const Kp = (...c) => c.some(x => pressed[x]);

  // ---------- Atualização ----------
  function nearestCar(x, y, r) {
    let best = null, bd = r;
    for (const c of S.cars) { if (c.dead) continue; const d = Math.hypot(c.x - x, c.y - y); if (d < bd) { bd = d; best = c; } }
    return best;
  }

  function updatePlayer(dt) {
    const P = S.player; S.prompt = '';
    if (P.iframes > 0) P.iframes -= dt;
    const pc = P.car;
    if (pc) {
      pc.thr = K('KeyW', 'ArrowUp') ? 1 : K('KeyS', 'ArrowDown') ? -1 : 0;
      pc.steer = (K('KeyD', 'ArrowRight') ? 1 : 0) - (K('KeyA', 'ArrowLeft') ? 1 : 0);
      pc.hb = K('Space');
      S.hornDown = K('KeyH');
      P.x = pc.x; P.y = pc.y; P.vx = pc.vx; P.vy = pc.vy; P.h = pc.a;
      const oF = M.POI.oficina;
      if (Math.hypot(pc.x - oF.x, pc.y - oF.y) < oF.r && pc.speed < 90) S.prompt = 'E: CONSERTAR E REPINTAR ($150)';
      else if (pc.speed < 220) S.prompt = 'E: SAIR DO CARRO';
      if (Kp('KeyE')) {
        if (Math.hypot(pc.x - oF.x, pc.y - oF.y) < oF.r && pc.speed < 90) {
          if (S.save.money >= 150) {
            S.save.money -= 150; pc.hp = 100; pc.dead = false; P.hp = 100; S.heat = 0; S.save.paint++;
            pc.color = PAINTS[S.save.paint % PAINTS.length]; G.save(); G.snd.cash();
            G.say('Carro consertado e repintado! A polícia não te reconhece mais.', 4);
          } else G.say('Dinheiro insuficiente. Conserto custa $150.', 3);
        } else if (pc.speed < 220) exitCar();
      }
    } else {
      // a pé
      const run = K('ShiftLeft', 'ShiftRight');
      const sp = run ? 175 : 108;
      let dx = (K('KeyD', 'ArrowRight') ? 1 : 0) - (K('KeyA', 'ArrowLeft') ? 1 : 0), dy = (K('KeyS', 'ArrowDown') ? 1 : 0) - (K('KeyW', 'ArrowUp') ? 1 : 0);
      const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      // empurrão de carro / explosão
      P.x += 0; let mvx = dx * sp + P.vx, mvy = dy * sp + P.vy; P.vx *= 0.88; P.vy *= 0.88;
      const okp = (x, y) => !W.isSolid(x, y) && !W.treeHit(x, y, 4);
      if (okp(P.x + mvx * dt + Math.sign(mvx) * 6, P.y)) P.x += mvx * dt;
      if (okp(P.x, P.y + mvy * dt + Math.sign(mvy) * 6)) P.y += mvy * dt;
      if (dx || dy) { P.h += wrap(Math.atan2(dy, dx) + Math.PI / 2 - P.h) * Math.min(1, 14 * dt); P.walk += sp * dt * 0.2; }
      if (P.punchT > 0) P.punchT -= dt;
      // soco
      if (Kp('Space') && P.punchT <= 0) {
        P.punchT = 0.3; G.snd.punch();
        const fx = Math.sin(P.h), fy = -Math.cos(P.h);
        for (const p of S.peds) {
          if (p.state === 'down' || p.mission) continue;
          const ddx = p.x - P.x, ddy = p.y - P.y, d = Math.hypot(ddx, ddy);
          if (d < 34 && (ddx * fx + ddy * fy) > 0) { knockPed(p, P.x, P.y, 160); if (copNear(P.x, P.y, 420)) G.addHeat(10); break; }
        }
      }
      // o que dá para fazer aqui?
      let action = null;
      const car = nearestCar(P.x, P.y, 62);
      if (car) { action = { t: 'car', car, s: 'E: ENTRAR NO CARRO' + (car.driver === 'ai' ? ' (ROUBAR)' : '') }; }
      else {
        for (const ph of M.PHONES) if (Math.hypot(ph.x - P.x, ph.y - P.y) < 50) action = { t: 'phone', s: M.active ? 'TELEFONE (MISSÃO EM ANDAMENTO)' : 'E: ATENDER TELEFONE', ph };
        const gg = M.POI.garage, hh = M.POI.hospital;
        if (!action && Math.hypot(gg.x - P.x, gg.y - P.y) < gg.r + 10) action = { t: 'garage', s: 'E: BUSCAR MEU CARRO VERMELHO' };
        if (!action && Math.hypot(hh.x - P.x, hh.y - P.y) < hh.r + 10) action = { t: 'hospital', s: P.hp < 100 ? 'E: TRATAR FERIMENTOS (GRÁTIS)' : 'HOSPITAL' };
      }
      if (action) S.prompt = action.s;
      if (action && Kp('KeyE')) {
        if (action.t === 'car') enterCar(action.car);
        else if (action.t === 'phone') { if (!M.active) M.startNext(S, action.ph); else G.say('Termine a missão atual primeiro.', 3); }
        else if (action.t === 'garage') {
          const g = M.POI.garage; let r = S.redCar;
          if (!r || r.dead || !S.cars.includes(r)) {
            r = new G.Car({ x: g.x + 110, y: g.y, a: Math.PI / 2, kind: 'coupe', color: PAINTS[S.save.paint % PAINTS.length], driver: 'none', mode: 'parked', owned: true });
            S.cars.push(r); S.redCar = r; G.say('Seu carro foi entregue novamente na garagem.', 4);
          } else if (Math.hypot(r.x - g.x, r.y - g.y) > 300) {
            if (S.save.money >= 50) { S.save.money -= 50; r.x = g.x + 110; r.y = g.y; r.a = Math.PI / 2; r.vx = r.vy = 0; G.say('Guincho trouxe seu carro vermelho ($50).', 4); G.snd.cash(); }
            else G.say('Guincho custa $50.', 3);
          } else G.say('Seu carro vermelho já está aqui perto!', 3);
        } else if (action.t === 'hospital') { P.hp = 100; G.say('Ferimentos tratados.', 3); }
      }
    }
    if (Kp('KeyR')) { G.snd.nextStation(); S.radioT = 3; }
    if (Kp('KeyM')) G.say(G.snd.mute() ? 'Som desligado' : 'Som ligado', 2);
    // morte
    if (P.hp <= 0 && S.mode === 'play') goWasted();
  }

  function goWasted() {
    S.mode = 'wasted'; S.modeT = 0;
    if (M.active) M.fail(S, 'você foi levado ao hospital');
    if (S.player.car) exitCar();
    G.snd.fail();
  }
  function goBusted() {
    S.mode = 'busted'; S.modeT = 0;
    if (M.active) M.fail(S, 'você foi preso');
    if (S.player.car) exitCar();
    G.snd.fail();
  }
  function respawn(where, loss) {
    const P = S.player;
    S.save.money = Math.floor(S.save.money * (1 - loss)); G.save();
    P.hp = 100; P.car = null; P.x = where.x; P.y = where.y + 4; P.vx = P.vy = 0; P.iframes = 2;
    S.heat = 0; S.heatLevel = 0; S.heli = null; S.bustT = 0;
    S.cars = S.cars.filter(c => !(c.kind === 'police' && (c.mode === 'chase' || c.mode === 'block' || c.mode === 'leave')));
    if (S.redCar && S.redCar.dead) { S.cars = S.cars.filter(c => c !== S.redCar); S.redCar = null; }
    S.mode = 'play';
    G.say(where === M.POI.hospital ? 'Você acordou no hospital. Perdeu ' + Math.round(loss * 100) + '% do dinheiro.' : 'Solto da delegacia. A fiança custou ' + Math.round(loss * 100) + '% do dinheiro.', 6);
  }

  // ---------- Carros (IA, física, colisões) ----------
  function updateCars(dt) {
    const P = S.player;
    for (const c of S.cars) {
      if (c.driver === 'ai') {
        if (c.mode === 'wander' || c.mode === 'race') AI.driveTraffic(c, dt, S);
        else if (c.mode === 'chase' || c.mode === 'leave') AI.driveChase(c, dt, S);
      } else if (c.driver !== 'player') { c.thr = 0; c.steer = 0; c.hb = true; }
      G.updateCar(c, dt);
    }
    // carro x carro
    const n = S.cars.length;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) G.carVsCar(S.cars[i], S.cars[j]);
    // pedestres
    const hitPed = (p, c) => {
      const cc = G.carCircles(c);
      for (let k = 0; k < 2; k++) {
        const dx = p.x - cc[k][0], dy = p.y - cc[k][1], r = cc[k][2] + 3, d = Math.hypot(dx, dy);
        if (d < r) return { dx, dy, d, r };
      }
      return null;
    };
    for (const c of S.cars) {
      if (c.dead) continue;
      const sp = c.speed;
      for (const p of S.peds) {
        if (p.state === 'down' || Math.abs(p.x - c.x) > 70 || Math.abs(p.y - c.y) > 70) continue;
        const h = hitPed(p, c); if (!h) continue;
        if (sp > 55) {
          knockPed(p, c.x - c.vx * 0.05, c.y - c.vy * 0.05, sp * 0.9 + 60);
          c.vx *= 0.97; c.vy *= 0.97;
          if (c === P.car) { G.addHeat(9); const m = M.active; if (m && m.type === 'taxi' && m.stage === 1) m.comfort -= m.def.vip ? 25 : 12; }
          else if (c.driver === 'ai' && c.kind === 'police') { }
        } else { const d = h.d || 1; p.x += h.dx / d * (h.r - h.d + 1); p.y += h.dy / d * (h.r - h.d + 1); }
      }
      // jogador a pé
      if (!P.car && S.mode === 'play') {
        const h = hitPed(P, c);
        if (h) {
          if (sp > 110 && P.iframes <= 0) { P.hp -= 10 + sp * 0.06; P.iframes = 0.9; P.vx = h.dx / (h.d || 1) * 220; P.vy = h.dy / (h.d || 1) * 220; G.snd.bonk(); S.shake = 5; stars(P.x, P.y - 6); }
          else { const d = h.d || 1; P.x += h.dx / d * (h.r - h.d + 1); P.y += h.dy / d * (h.r - h.d + 1); }
        }
      }
    }
  }

  // ---------- Polícia ----------
  function updatePolice(dt) {
    const P = S.player, ref = P.car || P;
    const lvlBefore = S.heatLevel;
    S.heatLevel = lvlOf(S.heat);
    const chasers = S.cars.filter(c => c.kind === 'police' && c.mode === 'chase' && !c.dead);
    S.chasers = chasers.length;
    // esfriar
    if (S.heat > 0) {
      const near = chasers.some(c => Math.hypot(c.x - ref.x, c.y - ref.y) < 520);
      const heliSees = S.heli && Math.hypot(S.heli.x - ref.x, S.heli.y - ref.y) < 300;
      if (!near) S.heat = Math.max(0, S.heat - dt * (heliSees ? 1.2 : 2.6));
    }
    if (M.active && M.active.type === 'escape' && S.heat <= 0 && false) { }
    S.heatLevel = lvlOf(S.heat);
    if (S.heatLevel === 0 && lvlBefore > 0) {
      S.cars.forEach(c => { if (c.kind === 'police' && c.mode === 'chase') c.mode = 'leave'; });
      S.heli = S.heli ? Object.assign(S.heli, { life: 0.1 }) : null;
      if (!M.active || M.active.type !== 'escape') G.say('Você despistou a polícia.', 4);
    }
    if (S.heatLevel > lvlBefore && lvlBefore === 0) G.say('A polícia está atrás de você!', 4);
    // reforços
    const target = [0, 2, 3, 4, 5, 6][S.heatLevel];
    S.copT -= dt;
    if (chasers.length < target && S.copT <= 0) { S.copT = 1.6; AI.spawnPolice(S, 1); }
    if (S.heatLevel >= 3) { S.blockT -= dt; if (S.blockT <= 0) { S.blockT = 30; AI.spawnRoadblock(S); } } else S.blockT = 8;
    if (S.heatLevel >= 4 && !S.heli) S.heli = { x: ref.x + 900, y: ref.y - 700, vx: 0, vy: 0, rot: 0, a: 0, life: 45 };
    AI.updateHeli(S, dt);
    // preso?
    if (S.mode === 'play' && S.heatLevel > 0) {
      const close = chasers.filter(c => Math.hypot(c.x - ref.x, c.y - ref.y) < (P.car ? 120 : 90));
      const ok = P.car ? (P.car.speed < 70 && close.length >= 2) : close.length >= 1;
      if (ok) S.bustT += dt * (P.car ? 1 : 1.6); else S.bustT = Math.max(0, S.bustT - dt * 1.5);
      if (S.bustT > 3) goBusted();
    } else S.bustT = 0;
  }

  // ---------- Tráfego / pedestres: nascer e sumir ----------
  function managePopulation(dt) {
    const P = S.player, ref = P.car || P;
    // carros
    S.spawnT -= dt;
    const civ = S.cars.filter(c => c.driver === 'ai' && (c.mode === 'wander'));
    if (civ.length < 16 && S.spawnT <= 0) { S.spawnT = 0.5; AI.spawnTraffic(S, Math.random() < 0.06 ? 'police' : null); }
    for (const c of S.cars) { if (c.driver === 'ai' && c.mode === 'wander') { if (c.speed < 8) c.idleT += dt; else c.idleT = 0; } }
    S.cars = S.cars.filter(c => {
      if (c.idleT > 14 && Math.hypot(c.x - ref.x, c.y - ref.y) > 650) return false;
      if (c === P.car || c.owned || c.tag === 'mission' || (M.active && M.active.rivals && M.active.rivals.some(r => r.car === c))) return true;
      const d = Math.hypot(c.x - ref.x, c.y - ref.y);
      if (c.mode === 'block') return d < 1700 && S.time - c.born < 70;
      if (c.mode === 'chase') return d < 1800;
      if (c.mode === 'leave') return d < 900;
      if (c.mode === 'parked' || c.mode === 'wreck') return d < 1800 || c.owned;
      return d < 1500 && !(c.dead && c.burnT > 25 && d > 700);
    });
    // pedestres
    S.pedSpawnT -= dt;
    const alive = S.peds.filter(p => !p.mission).length;
    if (alive < 34 && S.pedSpawnT <= 0) { S.pedSpawnT = 0.25; AI.spawnPed(S); }
    S.peds = S.peds.filter(p => !p.dead && (p.mission || Math.hypot(p.x - ref.x, p.y - ref.y) < 1150));
    for (const p of S.peds) if (p.state === 'wait') { p.walk = 0; } else AI.updatePed(p, dt, S);
  }

  // ---------- Partículas ----------
  function updateParticles(dt) {
    for (const p of S.particles) {
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.col === 'smoke') { p.size += 10 * dt; p.vx *= 0.98; } else if (p.col === 'fire') { p.size -= 4 * dt; p.vy -= 10 * dt; } else if (p.col === 'star') p.rot += dt * 8; else { p.vx *= 0.92; p.vy *= 0.92; }
    }
    S.particles = S.particles.filter(p => p.t < p.max && p.size > 0.5);
  }

  // ---------- Câmera ----------
  function updateCamera(dt) {
    const P = S.player, ref = P.car || P;
    const sp = P.car ? P.car.speed : 0;
    const zt = P.car ? 1.6 - 0.5 * Math.min(1, sp / 380) : 1.85;
    S.cam.z += (zt - S.cam.z) * Math.min(1, 2.2 * dt);
    const tx = ref.x + (ref.vx || 0) * 0.28, ty = ref.y + (ref.vy || 0) * 0.28;
    S.cam.x += (tx - S.cam.x) * Math.min(1, 6 * dt); S.cam.y += (ty - S.cam.y) * Math.min(1, 6 * dt);
    S.shake = Math.max(0, S.shake - dt * 18);
  }

  function update(dt) {
    S.time += dt; S.dayT += dt / 420;
    if (S.msg) { S.msg.t -= dt; if (S.msg.t <= 0) S.msg = null; }
    if (S.ban) { S.ban.t -= dt; if (S.ban.t <= 0) S.ban = null; }
    if (S.radioT > 0) S.radioT -= dt;
    if (S.mode === 'play') {
      updatePlayer(dt);
      updateCars(dt);
      managePopulation(dt);
      updatePolice(dt);
      M.update(S, dt);
    } else if (S.mode === 'wasted' || S.mode === 'busted') {
      S.modeT += dt; updateCars(dt); managePopulation(dt);
      if (S.modeT > 3.2) respawn(S.mode === 'wasted' ? M.POI.hospital : M.POI.delegacia, S.mode === 'wasted' ? 0.1 : 0.15);
    }
    updateParticles(dt);
    updateCamera(dt);
    // som
    const ref = S.player.car || S.player;
    let sv = 0; for (const c of S.cars) if (c.kind === 'police' && c.siren && !c.dead) { const d = Math.hypot(c.x - ref.x, c.y - ref.y); sv = Math.max(sv, clamp(1 - d / 900, 0, 1)); }
    G.snd.update({ inCar: !!S.player.car, car: S.player.car, horn: S.hornDown && !!S.player.car, sirenVol: S.mode === 'play' ? sv : 0 });
  }

  // ---------- Desenho ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const darkC = document.createElement('canvas'); darkC.width = VW; darkC.height = VH;
  const dctx = darkC.getContext('2d');

  function darkness() {
    const f = ((S.dayT % 1) + 1) % 1;
    if (f < 0.55) return 0; if (f < 0.65) return (f - 0.55) / 0.1; if (f < 0.92) return 1; return 1 - (f - 0.92) / 0.08;
  }

  function drawWorld() {
    const cam = S.cam, z = cam.z;
    const sx = S.shake ? rand(-S.shake, S.shake) * 0.5 : 0, sy = S.shake ? rand(-S.shake, S.shake) * 0.5 : 0;
    ctx.save();
    ctx.translate(VW / 2 + sx, VH / 2 + sy); ctx.scale(z, z); ctx.translate(-cam.x, -cam.y);
    const vx0 = cam.x - VW / 2 / z - 40, vy0 = cam.y - VH / 2 / z - 40, vx1 = cam.x + VW / 2 / z + 40, vy1 = cam.y + VH / 2 / z + 40;
    W.drawChunks(ctx, vx0, vy0, vx1, vy1);
    M.drawWorld(ctx, S, S.time);
    const inV = o => o.x > vx0 - 80 && o.x < vx1 + 80 && o.y > vy0 - 80 && o.y < vy1 + 80;
    // destroços e estacionados primeiro
    const cars = S.cars.filter(inV).sort((a, b) => (a.dead ? 0 : 1) - (b.dead ? 0 : 1));
    cars.forEach(c => SP.drawCar(ctx, c, S.time));
    S.peds.filter(inV).forEach(p => SP.drawPed(ctx, p, S.time));
    if (!S.player.car && S.mode !== 'title') { if (S.player.iframes > 0 && Math.floor(S.time * 14) % 2 === 0) { } else SP.drawPed(ctx, S.player, S.time); }
    AI.drawLights(ctx, vx0, vy0, vx1, vy1, S.time);
    // partículas
    S.particles.forEach(p => {
      if (!inV(p)) return;
      const k = 1 - p.t / p.max;
      ctx.save(); ctx.translate(p.x, p.y);
      if (p.col === 'smoke') { ctx.globalAlpha = 0.55 * k; ctx.fillStyle = '#3a3a3f'; ctx.beginPath(); ctx.arc(0, 0, p.size, 0, TAU); ctx.fill(); }
      else if (p.col === 'fire') { ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = k > 0.6 ? '#ffe15a' : k > 0.3 ? '#ff8a1e' : '#d8321a'; ctx.beginPath(); ctx.arc(0, 0, p.size, 0, TAU); ctx.fill(); }
      else if (p.col === 'star') { ctx.rotate(p.rot); ctx.globalAlpha = k; ctx.fillStyle = '#ffe04a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 3 : 7, a = i * Math.PI / 5; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill(); ctx.stroke(); }
      else { ctx.globalAlpha = k; ctx.fillStyle = '#ffd86a'; ctx.fillRect(-1.5, -1.5, 3, 3); }
      ctx.restore();
    });
    // helicóptero
    const h = S.heli;
    if (h) {
      const ref = S.player.car || S.player;
      ctx.save(); ctx.translate(h.x + 50, h.y + 70); ctx.rotate(h.a); ctx.fillStyle = 'rgba(0,0,10,0.3)'; ctx.beginPath(); ctx.ellipse(0, 0, 14, 34, 0, 0, TAU); ctx.fill(); ctx.restore();
      // holofote
      const g = ctx.createRadialGradient(ref.x, ref.y, 10, ref.x, ref.y, 110); g.addColorStop(0, 'rgba(255,255,220,0.45)'); g.addColorStop(1, 'rgba(255,255,220,0)');
      ctx.fillStyle = g; ctx.fillRect(ref.x - 110, ref.y - 110, 220, 220);
      ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.a);
      ctx.fillStyle = '#20232b'; ctx.beginPath(); ctx.ellipse(0, 0, 12, 26, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#9ec8ff'; ctx.beginPath(); ctx.ellipse(0, -10, 8, 10, 0, 0, TAU); ctx.fill();
      ctx.fillRect(-2, 22, 4, 26); ctx.fillStyle = '#2a2d36'; ctx.fillRect(-10, 46, 20, 3);
      ctx.rotate(h.rot); ctx.strokeStyle = 'rgba(20,20,25,0.75)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-58, 0); ctx.lineTo(58, 0); ctx.moveTo(0, -58); ctx.lineTo(0, 58); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    // noite
    const dk = darkness();
    if (dk > 0.02) {
      dctx.globalCompositeOperation = 'source-over'; dctx.clearRect(0, 0, VW, VH);
      dctx.fillStyle = 'rgba(6,8,40,' + (0.62 * dk) + ')'; dctx.fillRect(0, 0, VW, VH);
      dctx.globalCompositeOperation = 'destination-out';
      const toS = (x, y) => [(x - cam.x) * z + VW / 2, (y - cam.y) * z + VH / 2];
      const glow = (x, y, r, a) => { const [px, py] = toS(x, y); if (px < -r || px > VW + r || py < -r || py > VH + r) return; const g = dctx.createRadialGradient(px, py, 2, px, py, r); g.addColorStop(0, 'rgba(0,0,0,' + a + ')'); g.addColorStop(1, 'rgba(0,0,0,0)'); dctx.fillStyle = g; dctx.beginPath(); dctx.arc(px, py, r, 0, TAU); dctx.fill(); };
      W.lamps.forEach(l => glow(l.x, l.y, 120 * z, 0.75));
      S.cars.forEach(c => {
        if (c.dead || !inV(c)) return;
        glow(c.x + c.fx * 85, c.y + c.fy * 85, 130 * z, 0.9); glow(c.x + c.fx * 40, c.y + c.fy * 40, 70 * z, 0.8); glow(c.x, c.y, 50 * z, 0.5);
      });
      const ref = S.player.car || S.player; glow(ref.x, ref.y, 70 * z, 0.5);
      dctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(darkC, 0, 0);
    }
  }

  function drawOverlay(title, sub, col) {

  let last = 0, titleCam = 0;
  function startGame(fresh) {
    if (fresh) { S.save = { money: 0, done: 0, paint: 0, king: false }; G.save(); }
    G.snd.init(); newWorld(); S.mode = 'play';
  }
  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    if (S.mode === 'loading') {
      const pr = W.buildSome(3);
      ctx.fillStyle = '#14101f'; ctx.fillRect(0, 0, VW, VH);
      G.hud.txt(ctx, 'CARREGANDO A CIDADE...', 400, 290, 28, '#ffe04a', 'center');
      ctx.fillStyle = '#000'; ctx.fillRect(250, 310, 300, 22); ctx.fillStyle = '#ff2a2a'; ctx.fillRect(253, 313, 294 * pr, 16);
      if (pr >= 1) { loadSave(); S.mode = 'title'; newWorld(); S.cam.z = 1.4; }
      return;
    }
    if (S.mode === 'title') {
      titleCam += dt * 60;
      S.time += dt; S.dayT += dt / 300;
      const ang = titleCam / 400;
      S.cam.x = W.nodeX(2) + Math.cos(ang) * 500 + 300; S.cam.y = W.nodeY(1) + Math.sin(ang * 0.7) * 380; S.cam.z = 1.3;
      S.player.x = -9999; S.player.y = -9999; S.player.iframes = 0;
      // o tráfego corre em volta da câmera
      const fake = S.player; fake.x = S.cam.x; fake.y = S.cam.y;
      updateCars(dt); managePopulation(dt); updateParticles(dt);
      fake.x = -9999; fake.y = -9999;
      drawWorld(); drawTitle(S.time);
      if (Kp('Enter')) startGame(false);
      else if (Kp('KeyN') && hasSave()) startGame(true);
      for (const k in pressed) delete pressed[k];
      return;
    }
    if (Kp('KeyP', 'Escape')) { if (S.mode === 'play') S.mode = 'paused'; else if (S.mode === 'paused') S.mode = 'play'; }
    if (S.mode === 'paused' && Kp('Enter')) S.mode = 'play';
    if (S.mode !== 'paused') update(dt);
    drawWorld();
    G.hud.draw(ctx, S, S.time);
    if (S.mode === 'wasted') drawOverlay('VOCÊ CAIU', 'Levado ao hospital...', '#ff4a4a');
    if (S.mode === 'busted') drawOverlay('PRESO!', 'A polícia te pegou...', '#6a8bff');
    if (S.mode === 'paused') drawOverlay('PAUSADO', 'P ou ENTER para continuar', '#ffe04a');
    for (const k in pressed) delete pressed[k];
  }

  // ---------- Tela cheia proporcional ----------
  function fit() {
    const r = Math.min(window.innerWidth / VW, window.innerHeight / VH);
    canvas.style.width = Math.floor(VW * r) + 'px'; canvas.style.height = Math.floor(VH * r) + 'px';
  }
  window.addEventListener('resize', fit); fit();
  canvas.addEventListener('mousedown', () => { G.snd.init(); if (S.mode === 'title') startGame(false); });
  requestAnimationFrame(frame);

})(window.G = window.G || {});

</script>
