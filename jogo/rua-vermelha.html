<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rua Vermelha — jogo de mundo aberto estilo GTA antigo (+16)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0814; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #000; image-rendering: auto; box-shadow: 0 0 40px rgba(0,0,0,.8); }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
/* ============================================================
   world.js — o mapa da cidade (tiles, prédios, parques, rio)
   e o desenho do cenário no estilo GTA 1 / GTA 2.
   Tudo é desenhado por código; o cenário é "fotografado" em
   pedaços (chunks) uma vez só para o jogo ficar leve.
   ============================================================ */
(function (G) {
  'use strict';

  // ---------- Medidas do mapa ----------
  const T = 32;          // tamanho de um tile em pixels
  const ROAD = 8;        // largura da rua (tiles) = 2 faixas de 4 tiles (ruas largas)
  const BLOCK = 12;      // lado de uma quadra (tiles)
  const PITCH = ROAD + BLOCK;
  const COLS = 34, ROWS = 8;  // quadras na horizontal / vertical (mapa GIGANTE: 4 cidades separadas por mata, fazendas e rios)
  const RIVER = 3;       // o primeiro rio (o da cidade antiga)
  const RIVERS = [3, 9, 16, 23, 30];          // colunas de quadras ocupadas por rios
  // rio -> linhas de rua onde existe ponte ('todas' = uma ponte em cada rua). Os rios novos têm UMA ponte (com pedágio); novas pontes são construídas por cidade.js
  const PONTES = { 3: 'todas', 9: [3], 16: [5], 23: [4], 30: [3] };
  const CIDADES = [
    { id: 'ribeirao', nome: 'RIBEIRÃO PRETO', sub: 'a cidade', ate: 9, estilo: 'classica' },
    { id: 'mata', nome: 'MATA ESCURA', sub: 'floresta e fazendas de bilionários', ate: 17, estilo: 'mata' },
    { id: 'interior', nome: 'NOVO HORIZONTE', sub: 'interior — cidade em construção', ate: 23, estilo: 'moderna' },
    { id: 'vale', nome: 'VALE VERDE', sub: 'cidade ecológica e aeroporto', ate: 30, estilo: 'ecologica' },
    { id: 'porto', nome: 'PORTO DO SOL', sub: 'cidade portuária', ate: 99, estilo: 'portuaria' }
  ];
  const MG = 6;          // margem fora das ruas (calçada + prédios)
  const INNER_W = COLS * PITCH + ROAD;
  const INNER_H = ROWS * PITCH + ROAD;
  const TW = INNER_W + MG * 2, TH = INNER_H + MG * 2;
  const W = TW * T, H = TH * T;

  // tipos de tile
  const TILE = { ROAD: 0, SIDE: 1, BUILD: 2, GRASS: 3, WATER: 4, BRIDGE: 5, CROSS: 6, LOT: 7 };   // LOT = estacionamento

  const tiles = new Uint8Array(TW * TH).fill(TILE.BUILD);
  const setRect = (tx, ty, tw, th, type) => {
    for (let y = ty; y < ty + th; y++) for (let x = tx; x < tx + tw; x++) tiles[y * TW + x] = type;
  };

  // ---------- Aleatório com semente (a cidade é sempre a mesma) ----------
  // clareia (+) ou escurece (-) uma cor '#rrggbb'
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(k >= 0 ? c + (255 - c) * k : c * (1 + k))));
    return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(19970101);

  // ---------- Coordenadas úteis ----------
  const roadLeft = i => (MG + i * PITCH) * T;           // x da borda esquerda da rua vertical i
  const roadTop = j => (MG + j * PITCH) * T;            // y da borda de cima da rua horizontal j
  const nodeX = i => (MG + i * PITCH + ROAD / 2) * T;   // centro do cruzamento
  const nodeY = j => (MG + j * PITCH + ROAD / 2) * T;
  // faixas (mão direita, como no Brasil)
  const laneV = (i, dir) => roadLeft(i) + (dir > 0 ? ROAD * 0.25 : ROAD * 0.75) * T;  // dir>0 = descendo
  const laneH = (j, dir) => roadTop(j) + (dir > 0 ? ROAD * 0.75 : ROAD * 0.25) * T;   // dir>0 = indo p/ direita

  // ---------- Estilos de telhado ----------
  const ROOFS = [
    { kind: 'flat', base: '#7b5b3f', edge: '#a58665', dark: '#5a412d' },
    { kind: 'flat', base: '#8d8d98', edge: '#b9b9c4', dark: '#6b6b77' },
    { kind: 'flat', base: '#c7b38b', edge: '#e4d5b0', dark: '#a4906a' },
    { kind: 'tile', base: '#d9782d', edge: '#f39c52', dark: '#b05713' },
    { kind: 'tile', base: '#b5382b', edge: '#da5d4c', dark: '#89231a' },
    { kind: 'tile', base: '#4a7cb3', edge: '#6b9dd2', dark: '#33587f' },
    { kind: 'tile', base: '#c4622e', edge: '#e5844f', dark: '#9b4519' },
    { kind: 'flat', base: '#6d7d6b', edge: '#93a590', dark: '#506050' },
    { kind: 'tile', base: '#d8c25a', edge: '#efdc82', dark: '#a8923a' },
    { kind: 'flat', base: '#e6e8ee', edge: '#ffffff', dark: '#b4b8c4' },
    { kind: 'tile', base: '#3a7a6a', edge: '#5aa090', dark: '#25564a' },
    { kind: 'flat', base: '#4a4a58', edge: '#6a6a7c', dark: '#2e2e3a' },
  ];

  const buildings = [];
  const trees = [];
  const lamps = [];
  const ponds = [];
  const blocks = [];
  const hospitais = [];   // hospitais (ambulância leva ao mais próximo)

  // cria o objeto de um prédio (sem colocar no mapa). rg = gerador de números (para não mexer na cidade antiga)
  function mkBuilding(x, y, w, h, forceRoof, rg) {
    rg = rg || rnd;
    const p = ROOFS[forceRoof != null ? forceRoof : Math.floor(rg() * ROOFS.length)];
    const b = { x, y, w, h, p, ridge: w >= h ? 'h' : 'v', det: [] };
    if (p.kind === 'flat') {
      const n = 1 + Math.floor(rg() * 3);
      for (let k = 0; k < n; k++) {
        b.det.push({ fx: 0.2 + rg() * 0.6, fy: 0.2 + rg() * 0.6, t: ['ac', 'sky', 'tank', 'ac', 'solar', 'vent', 'ant'][Math.floor(rg() * 7)] });
      }
    } else if (rg() < 0.5) {
      b.det.push({ fx: 0.25 + rg() * 0.5, fy: 0.3 + rg() * 0.4, t: 'chim' });
    }
    return b;
  }
  function addBuilding(x, y, w, h, forceRoof) { buildings.push(mkBuilding(x, y, w, h, forceRoof)); }

  // divide uma área (em tiles) em prédios
  function partition(tx, ty, tw, th) {
    const r = rnd();
    const add = (a, b, c, d) => addBuilding(a * T + 5, b * T + 5, c * T - 10, d * T - 10);
    if (r < 0.2) add(tx, ty, tw, th);
    else if (r < 0.4) { add(tx, ty, tw / 2, th); add(tx + tw / 2, ty, tw / 2, th); }
    else if (r < 0.6) { add(tx, ty, tw, th / 2); add(tx, ty + th / 2, tw, th / 2); }
    else if (r < 0.8) { add(tx, ty, tw / 2, th / 2); add(tx + tw / 2, ty, tw / 2, th / 2); add(tx, ty + th / 2, tw / 2, th / 2); add(tx + tw / 2, ty + th / 2, tw / 2, th / 2); }
    else { add(tx, ty, tw, th / 2); add(tx, ty + th / 2, tw / 2, th / 2); add(tx + tw / 2, ty + th / 2, tw / 2, th / 2); }
  }

  // ---------- Montagem do mapa ----------
  // calçada em volta de tudo + ruas
  setRect(MG - 2, MG - 2, INNER_W + 4, INNER_H + 4, TILE.SIDE);
  setRect(MG, MG, INNER_W, INNER_H, TILE.ROAD);

  const PARKS = [[1, 1], [5, 3], [7, 3], [2, 7], [8, 5], [18, 2], [25, 6]];
  // as quadras novas (interior e cidade vizinha): obras (4 lotes pequenos), obra (1 lote grande), campo, aeroporto
  const NOVAS = {};
  (function gerarNovas() {
    const g = mulberry32(31337);
    const cidade = q => q < 0.40 ? 'obras' : q < 0.70 ? 'obra' : q < 0.82 ? 'campo' : 'obras';
    for (let by = 0; by < ROWS; by++) {
      for (let bx = 10; bx <= 15; bx++) NOVAS[bx + ',' + by] = g() < 0.30 ? 'fazenda' : 'floresta';             // Mata Escura
      for (let bx = 17; bx <= 19; bx++) NOVAS[bx + ',' + by] = cidade(g());                                       // Novo Horizonte
      for (let bx = 20; bx <= 22; bx++) NOVAS[bx + ',' + by] = g() < 0.45 ? 'campo' : g() < 0.5 ? 'fazenda' : 'floresta';
      for (let bx = 24; bx <= 26; bx++) NOVAS[bx + ',' + by] = cidade(g());                                       // Vale Verde
      for (let bx = 27; bx <= 29; bx++) NOVAS[bx + ',' + by] = g() < 0.6 ? 'floresta' : 'campo';
      for (let bx = 31; bx <= 32; bx++) NOVAS[bx + ',' + by] = cidade(g());                                       // Porto do Sol
      NOVAS['33,' + by] = 'porto';
    }
    NOVAS['26,4'] = 'aeroporto';
  })();
  const lotes = [];            // lotes de obra (cidade.js constrói neles)
  const places = [];          // lugares grandes e comércios (dá para entrar)
  const casas = [];           // todas as casas (dá para entrar em todas!)
  const mercados = [];        // supermercados com estacionamento
  const ESPECIAIS = { '6,1': 'mercado', '8,4': 'mercado', '1,4': 'hotel', '5,4': 'hotel', '0,5': 'hotel', '7,5': 'hotel', '1,6': 'prefeitura', '4,6': 'delegacia', '6,6': 'estadio', '7,7': 'hospital' };
  const MERCADOS_DEF = [
    { id: 'mercadao', nome: 'MERCADÃO', cor: '#2e8b3e', horario: [6, 22] },
    { id: 'atacadao', nome: 'ATACADÃO', cor: '#d9a40a', horario: [7, 21] }
  ];
  const HOTEIS_DEF = {
    '1,4': { id: 'hotel_grand', nome: 'GRAND HOTEL RIBEIRÃO', cor: '#c8a24a', nivel: 'luxo', estrelas: 5 },
    '5,4': { id: 'hotel_central', nome: 'HOTEL CENTRAL', cor: '#3a7ad3', nivel: 'medio', estrelas: 3 },
    '7,5': { id: 'hotel_estrela', nome: 'HOTEL ESTRELA', cor: '#7a8a3a', nivel: 'simples', estrelas: 2 },
    '0,5': { id: 'hotel_pensao', nome: 'PENSÃO DO ZÉ', cor: '#8a5a3a', nivel: 'feio', estrelas: 1 }
  };
  // a porta fica na calçada, embaixo da fachada: precisa de chão livre na frente
  const temFrente = b => {
    const cx = Math.floor((b.x + b.w / 2) / T);
    return tiles[Math.floor((b.y + b.h + 10) / T) * TW + cx] !== TILE.BUILD && tiles[Math.floor((b.y + b.h + 26) / T) * TW + cx] !== TILE.BUILD
      && tiles[Math.floor((b.y + b.h + 10) / T) * TW + cx] !== TILE.WATER;
  };
  function addCasa(b) {
    const n = casas.length, area = b.w * b.h / (T * T), hr = mulberry32(1000 + n * 37);
    const c = { id: 'c' + n, tipo: 'casa', nome: 'CASA', b, x: b.x + b.w / 2, y: b.y + b.h + 24, r: 30, seed: 1000 + n * 37, area: Math.round(area) };
    c.venda = hr() < 0.16; c.preco = Math.round((1200 + area * 26) / 100) * 100;
    b.casa = c; casas.push(c);
  }
  function criarBloco(bx, by) {
    const tx = MG + ROAD + bx * PITCH, ty = MG + ROAD + by * PITCH, key = bx + ',' + by;
    let kind = 'city';
    if (RIVERS.includes(bx)) kind = 'river';
    else if (PARKS.some(p => p[0] === bx && p[1] === by)) kind = 'park';
    else if (ESPECIAIS[key]) kind = ESPECIAIS[key];
    else if (NOVAS[key]) kind = NOVAS[key];
    else if ((bx >= 6 || by >= 4) && (bx * 5 + by * 3) % 4 !== 0) kind = 'vila';
    const blk = { bx, by, tx, ty, x: tx * T, y: ty * T, w: BLOCK * T, h: BLOCK * T, kind };
    blocks.push(blk);
    if (kind === 'river') { setRect(tx, ty, BLOCK, BLOCK, TILE.WATER); return; }
    setRect(tx, ty, BLOCK, BLOCK, TILE.SIDE);
    if (kind === 'city') {
      setRect(tx + 2, ty + 2, 8, 8, TILE.BUILD);
      const antes = buildings.length;
      partition(tx + 2, ty + 2, 8, 8);
      for (let k = antes; k < buildings.length; k++) { const b = buildings[k]; if (b.p.kind !== 'flat' && temFrente(b)) addCasa(b); }
    } else if (kind === 'vila') {
      // 4 casinhas separadas por vielas em cruz: todas têm porta para uma calçada
      [[0, 0], [5, 0], [0, 5], [5, 5]].forEach(([a, c]) => {
        setRect(tx + 2 + a, ty + 2 + c, 3, 3, TILE.BUILD);
        addBuilding((tx + 2 + a) * T + 5, (ty + 2 + c) * T + 5, 3 * T - 10, 3 * T - 10, 3 + Math.floor(rnd() * 4));
        addCasa(buildings[buildings.length - 1]);
      });
    } else if (kind === 'mercado') {
      const def = MERCADOS_DEF[mercados.length];
      setRect(tx + 1, ty + 1, 10, 5, TILE.BUILD);
      addBuilding((tx + 1) * T + 5, (ty + 1) * T + 5, 10 * T - 10, 5 * T - 10, 1);
      const b = buildings[buildings.length - 1]; b.det = [{ fx: 0.2, fy: 0.5, t: 'ac' }, { fx: 0.5, fy: 0.5, t: 'ac' }, { fx: 0.8, fy: 0.5, t: 'vent' }]; b.mercado = def;
      setRect(tx, ty + 6, 12, 6, TILE.LOT);
      const lotTop = (ty + 6) * T, vagas = [];
      for (let i = 0; i < 8; i++) { const x = blk.x + 24 + i * 40; vagas.push({ x, y: lotTop + 66, a: 0, fila: 'A', i }); vagas.push({ x, y: lotTop + 164, a: Math.PI, fila: 'B', i }); }
      const pl = Object.assign({}, def, { tipo: 'mercado', b, x: b.x + b.w / 2, y: b.y + b.h + 24, r: 40 });
      b.place = pl; places.push(pl);
      const m = { def, place: pl, blk, vagas, lotTop, gateX: blk.x + 354, aisleY: lotTop + 114, laneY: blk.y + blk.h + ROAD * 0.25 * T, j: by + 1 };
      blk.mercado = m; mercados.push(m);
      lamps.push({ x: blk.x + 14, y: lotTop + 14 }, { x: blk.x + blk.w - 14, y: lotTop + 14 }, { x: blk.x + 14, y: lotTop + 112 }, { x: blk.x + blk.w - 14, y: lotTop + 112 });
    } else if (kind === 'hotel') {
      const def = HOTEIS_DEF[key];
      setRect(tx + 1, ty + 1, 10, 9, TILE.BUILD);
      addBuilding((tx + 1) * T + 5, (ty + 1) * T + 5, 10 * T - 10, 9 * T - 10, def.nivel === 'feio' ? 0 : 1);
      const b = buildings[buildings.length - 1]; b.det = []; b.hotel = def; blk.hotel = def;
      const pl = Object.assign({}, def, { tipo: 'hotel', b, x: b.x + b.w / 2, y: b.y + b.h + 24, r: 40 });
      b.place = pl; places.push(pl);
    } else if (kind === 'obras') {
      // 4 lotes pequenos para construir (casas, lojas, escritórios...), separados por vielas em cruz
      [[0, 0], [5, 0], [0, 5], [5, 5]].forEach(([a, c], k) => {
        setRect(tx + 2 + a, ty + 2 + c, 3, 3, TILE.BUILD);
        lotes.push({ id: 'L' + bx + '_' + by + '_' + k, bx, by, kind, tam: 'p', x: (tx + 2 + a) * T + 5, y: (ty + 2 + c) * T + 5, w: 3 * T - 10, h: 3 * T - 10 });
      });
    } else if (kind === 'obra') {
      // 1 lote grande (hotel, hospital, escola, fábrica, empresa, shopping...)
      setRect(tx + 2, ty + 2, 8, 8, TILE.BUILD);
      lotes.push({ id: 'L' + bx + '_' + by + '_0', bx, by, kind, tam: 'g', x: (tx + 2) * T + 5, y: (ty + 2) * T + 5, w: 8 * T - 10, h: 8 * T - 10 });
    } else if (kind === 'aeroporto') {
      setRect(tx + 1, ty + 1, 10, 7, TILE.LOT);          // pista e pátio (dá para andar)
      setRect(tx + 3, ty + 8, 6, 2, TILE.BUILD);         // terminal
      setRect(tx + 10, ty + 8, 1, 2, TILE.BUILD);        // torre
      lotes.push({ id: 'L' + bx + '_' + by + '_0', bx, by, kind, tam: 'a', x: (tx + 3) * T + 5, y: (ty + 8) * T + 5, w: 6 * T - 10, h: 2 * T - 10, pista: { x: (tx + 1) * T, y: (ty + 1) * T, w: 10 * T, h: 7 * T }, torre: { x: (tx + 10) * T + 4, y: (ty + 8) * T + 4, w: T - 8, h: 2 * T - 8 } });
    } else if (kind === 'floresta') {
      // floresta fechada: sem calçada, árvores por todo lado, às vezes clareira com cabana ou lagoa
      setRect(tx, ty, BLOCK, BLOCK, TILE.GRASS);
      const fr = mulberry32(bx * 733 + by * 211 + 17);
      const clare = fr() < 0.5 ? { x: tx + 4 + fr() * 4, y: ty + 4 + fr() * 4, r: 2.3 + fr() * 1.2 } : null;
      const lago = !clare && fr() < 0.3 ? { x: tx + 5 + fr() * 2, y: ty + 5 + fr() * 2, rx: 2.4 + fr(), ry: 1.8 + fr() * 0.8 } : null;
      if (lago) { for (let y = ty; y < ty + BLOCK; y++) for (let x = tx; x < tx + BLOCK; x++) { const dx = (x + 0.5 - lago.x) / lago.rx, dy = (y + 0.5 - lago.y) / lago.ry; if (dx * dx + dy * dy <= 1) tiles[y * TW + x] = TILE.WATER; } ponds.push({ x: lago.x * T, y: lago.y * T, rx: lago.rx * T, ry: lago.ry * T }); }
      const nT = 52 + Math.floor(fr() * 30);
      for (let k = 0; k < nT; k++) {
        const x = (tx + 0.7 + fr() * 10.6), y = (ty + 0.7 + fr() * 10.6), q = fr();
        if (clare && Math.hypot(x - clare.x, y - clare.y) < clare.r) continue;
        if (lago && Math.pow((x - lago.x) / (lago.rx + 0.8), 2) + Math.pow((y - lago.y) / (lago.ry + 0.8), 2) < 1) continue;
        trees.push({ x: x * T, y: y * T, r: 17 + q * 13, mata: true });
      }
      if (clare) {
        const cx = Math.round(clare.x) - 1, cy = Math.round(clare.y) - 1;
        setRect(cx, cy, 2, 2, TILE.BUILD);
        const cb = mkBuilding(cx * T + 3, cy * T + 3, 2 * T - 6, 2 * T - 6, 0, fr); cb.cabana = true; cb.det = []; buildings.push(cb);
        blk.cabana = { x: cx * T + T, y: cy * T + 2 * T + 18 };
      }
    } else if (kind === 'fazenda') {
      // fazenda de bilionário: mansão grande, piscina, heliponto, estábulo e pastos cercados
      setRect(tx, ty, BLOCK, BLOCK, TILE.GRASS);
      const fr = mulberry32(bx * 389 + by * 97 + 5), lado = fr() < 0.5 ? 1 : 3;
      const mx = tx + lado, my = ty + 2;
      setRect(mx, my, 7, 3, TILE.BUILD);
      const mb = mkBuilding(mx * T + 4, my * T + 4, 7 * T - 8, 3 * T - 8, [3, 4, 6][Math.floor(fr() * 3)], fr); mb.det = []; mb.mansao = true; buildings.push(mb);
      addCasa(mb); mb.casa.rica = true; mb.casa.nome = 'MANSÃO'; mb.casa.venda = false; mb.casa.area = 120;
      const px = lado === 1 ? tx + 8 : tx + 1;
      setRect(px, ty + 6, 3, 2, TILE.WATER);                    // piscina
      setRect(tx + (lado === 1 ? 1 : 8), ty + 7, 3, 3, TILE.LOT);   // heliponto
      blk.heli = { x: (tx + (lado === 1 ? 1 : 8) + 1.5) * T, y: (ty + 8.5) * T };
      setRect(tx + 5, ty + 5, 2, 7, TILE.LOT);                  // alameda de entrada
      const sb = mkBuilding((tx + 8.2) * T, (ty + 9.5) * T, 3 * T, 2 * T, 0, fr); sb.det = []; sb.estabulo = true; if (lado === 3) { sb.x = (tx + 0.8) * T; } buildings.push(sb); setRect(Math.floor(sb.x / T), Math.floor(sb.y / T), 3, 2, TILE.BUILD);
      for (let k = 0; k < 9; k++) trees.push({ x: (tx + 0.8 + fr() * 10.4) * T, y: (ty + 5.2 + fr() * 6) * T, r: 17 + fr() * 8, mata: true });
      blk.fazenda = { dono: ['O MAGNATA DO CAFÉ', 'A BARONESA DO BOI', 'O REI DO AGRO', 'O DONO DO BANCO', 'A HERDEIRA DO PETRÓLEO', 'O MAGNATA DA SOJA'][(bx + by * 3) % 6] };
    } else if (kind === 'prefeitura' || kind === 'delegacia' || kind === 'hospital' || kind === 'estadio') {
      // prédios públicos grandes, com praça ou estacionamento na frente
      const dims = { prefeitura: [10, 6], delegacia: [10, 6], hospital: [10, 7], estadio: [10, 10] }[kind];
      setRect(tx + 1, ty + 1, dims[0], dims[1], TILE.BUILD);
      const nomes = { prefeitura: 'PREFEITURA DE RIBEIRÃO', delegacia: 'DELEGACIA GERAL', hospital: 'HOSPITAL SANTA CASA', estadio: 'ESTÁDIO MUNICIPAL' };
      const b = mkBuilding((tx + 1) * T + 5, (ty + 1) * T + 5, dims[0] * T - 10, dims[1] * T - 10, 1, rnd); b.det = []; b.publico = kind; b.custom = (ctx, bb) => drawPublico(ctx, bb); buildings.push(b);
      const pl = { tipo: kind, id: kind, nome: nomes[kind], cor: { prefeitura: '#1f4f8a', delegacia: '#16224a', hospital: '#d9363e', estadio: '#2a8a3a' }[kind], b, x: b.x + b.w / 2, y: b.y + b.h + 24, r: 42 };
      b.place = pl; places.push(pl); blk[kind] = pl;
      if (kind === 'hospital') hospitais.push({ x: pl.x, y: pl.y + 8, r: 44, nome: 'HOSPITAL SANTA CASA' });

    } else if (kind === 'obras' || kind === 'obra') {

    } else if (kind === 'prefeitura' || kind === 'delegacia' || kind === 'hospital' || kind === 'estadio') {

      if (kind === 'prefeitura') {

        ctx.beginPath(); ctx.arc(x + 6 * T, y + 9.4 * T, 52, 0, 7); ctx.fillStyle = '#d8d0b0'; ctx.fill(); ctx.strokeStyle = '#9a8a5a'; ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.arc(x + 6 * T, y + 9.4 * T, 28, 0, 7); ctx.fillStyle = ctx.createPattern(tex.water, 'repeat'); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#c8c8d0'; ctx.fillRect(x + 6 * T - 2, y + 9.4 * T - 12, 4, 24);
        ctx.fillStyle = '#6a6a72'; ctx.fillRect(x + 5.2 * T, y + 7.6 * T, 3, 40); ctx.fillStyle = '#2a8a3a'; ctx.fillRect(x + 5.2 * T + 3, y + 7.6 * T, 24, 8); ctx.fillStyle = '#f2d21a'; ctx.fillRect(x + 5.2 * T + 8, y + 7.6 * T + 1.5, 14, 5);

      }
    } else if (kind === 'campo') {

        for (let ly = 0; ly < 8 * T - 4; ly += 7) { if (gy + ly < gy + 5.6 * T && gx + k * T < gx + 6.2 * T && ly < 5.8 * T && k < 6 && ly < 70) continue; ctx.fillStyle = cc; ctx.fillRect(gx + k * T + 2, gy + ly, T - 5, 3); ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(gx + k * T + 2, gy + ly + 3, T - 5, 1); }
      }
      ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 3; ctx.strokeRect(gx + 2, gy + 2, 8 * T - 4, 8 * T - 4);
      ctx.strokeStyle = '#a07a4a'; ctx.lineWidth = 1; ctx.strokeRect(gx + 3.5, gy + 3.5, 8 * T - 7, 8 * T - 7);
      for (let k = 0; k <= 16; k++) { ctx.fillStyle = '#4a321a'; ctx.fillRect(gx + k * T / 2 - 1, gy - 1, 3, 6); ctx.fillRect(gx + k * T / 2 - 1, gy + 8 * T - 5, 3, 6); }
      for (let k = 0; k < 4; k++) { // vaquinhas
        const vx = gx + 2 * T + fr() * 5 * T, vy = gy + 5.7 * T + fr() * 2 * T; ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(vx + 3, vy + 4, 11, 6, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#f4f4f0'; ctx.beginPath(); ctx.ellipse(vx, vy, 10, 5.5, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#2a2a2a'; ctx.fillRect(vx - 5, vy - 3, 5, 4); ctx.fillRect(vx + 2, vy, 4, 3); ctx.beginPath(); ctx.arc(vx + 11, vy, 3.4, 0, 7); ctx.fill();
      }
    } else if (kind === 'aeroporto') {
      // pista de pouso, pátio e faixas do aeroporto (os aviões e as obras ficam em cidade.js)
      const pa = { x: x + T, y: y + T, w: 10 * T, h: 7 * T };
      ctx.fillStyle = ctx.createPattern(tex.grass, 'repeat'); ctx.fillRect(pa.x, pa.y, pa.w, pa.h);
    } else if (kind === 'mercado') {
      ctx.fillStyle = ctx.createPattern(tex.alley, 'repeat'); ctx.fillRect(x + T, y + T, 10 * T, 5 * T);
      const lt = y + 6 * T;
      ctx.fillStyle = ctx.createPattern(tex.asphalt, 'repeat'); ctx.fillRect(x, lt, w, 6 * T);
      ctx.fillStyle = 'rgba(15,10,30,0.28)'; ctx.fillRect(x, lt, w, 6 * T);
      ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(x, lt + 2, w, 3);                      // faixa junto da loja
      for (let k = 0; k < 8; k++) { for (const yy of [lt + 40, lt + 138]) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(x + 4 + k * 40, yy, 2, 50); } }
      for (const yy of [lt + 40, lt + 138]) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(x + 4 + 8 * 40, yy, 2, 50); }
      ctx.fillStyle = 'rgba(40,90,200,0.55)'; ctx.fillRect(x + 8, lt + 44, 32, 42);                      // vaga de deficiente
      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center'; ctx.fillText('♿', x + 24, lt + 72);
      ctx.fillStyle = 'rgba(255,224,74,0.7)'; ctx.font = 'bold 11px Arial'; ctx.fillText('ENTRADA / SAÍDA', x + 354, lt + 188 - 12); ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; for (let k = 0; k < 7; k++) { ctx.fillRect(x + 20 + k * 40, lt + 112, 18, 3); }   // seta/tracejado do corredor
      ctx.fillStyle = '#4a4e58'; ctx.fillRect(x + 332, lt + 12, 40, 18); ctx.fillStyle = '#c8ccd4'; for (let k = 0; k < 6; k++) ctx.fillRect(x + 336 + k * 6, lt + 14, 3, 14);   // abrigo dos carrinhos
    } else if (kind === 'park') {
      const gx = x + 2 * T, gy = y + 2 * T;
      rrect(ctx, gx, gy, 8 * T, 8 * T, 14); ctx.fillStyle = ctx.createPattern(tex.grass, 'repeat'); ctx.fill();

      ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(gx + 12, gy + 4 * T + 8); ctx.lineTo(gx + 8 * T - 12, gy + 4 * T + 8); ctx.stroke();
      ctx.lineCap = 'butt';
      const fr = mulberry32(blk.bx * 313 + blk.by * 71 + 9); // flores e tufos de mato
      for (let k = 0; k < 110; k++) {
        const fx = gx + 14 + fr() * (8 * T - 28), fy = gy + 14 + fr() * (8 * T - 28), cc = fr();

        if (cc < 0.35) { ctx.fillStyle = 'rgba(20,70,20,0.5)'; ctx.fillRect(fx, fy, 1, 3); ctx.fillRect(fx + 2, fy + 1, 1, 2); ctx.fillRect(fx - 2, fy + 1, 1, 2); }
        else { ctx.fillStyle = ['#f5e9ff', '#ffd84a', '#ff7a9a', '#ffffff', '#ff9a3c'][Math.floor(cc * 9) % 5]; ctx.beginPath(); ctx.arc(fx, fy, 1.5, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(fx + 1, fy + 1.5, 1.5, 1); }

  function drawTree(ctx, t) {
    // sombra suave
    ctx.save(); ctx.shadowColor = 'rgba(0,0,10,0.5)'; ctx.shadowBlur = 12; ctx.shadowOffsetX = 11; ctx.shadowOffsetY = 13;
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(t.x, t.y, t.r * 0.9, 0, 7); ctx.fill(); ctx.restore();
    // copa feita de várias folhagens sobrepostas
    const r = mulberry32(Math.floor(t.x * 13 + t.y * 7));
    const greens = ['#1d5c20', '#246b24', '#2f8a2a', '#3a9a31'];
    for (let k = 0; k < 9; k++) {
      const a = r() * 6.28, d = r() * t.r * 0.55, rad = t.r * (0.42 + r() * 0.22);
      ctx.fillStyle = greens[Math.floor(r() * 2)]; ctx.beginPath(); ctx.arc(t.x + Math.cos(a) * d, t.y + Math.sin(a) * d, rad, 0, 7); ctx.fill();
    }
    const g = ctx.createRadialGradient(t.x - t.r * 0.35, t.y - t.r * 0.35, 2, t.x, t.y, t.r);
    g.addColorStop(0, 'rgba(150,230,100,0.55)'); g.addColorStop(0.55, 'rgba(60,150,50,0.10)'); g.addColorStop(1, 'rgba(0,30,5,0.45)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 7); ctx.fill();
    for (let k = 0; k < 14; k++) { const a = r() * 6.28, d = r() * t.r * 0.8; ctx.fillStyle = r() < 0.6 ? 'rgba(190,255,140,0.22)' : 'rgba(0,40,0,0.22)'; ctx.beginPath(); ctx.arc(t.x + Math.cos(a) * d, t.y + Math.sin(a) * d, 2 + r() * 4, 0, 7); ctx.fill(); }
    ctx.strokeStyle = 'rgba(10,50,14,0.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 7); ctx.stroke();
  }

  function drawStatic(ctx, x0, y0, x1, y1) {
    const hit = (x, y, w, h) => x < x1 && x + w > x0 && y < y1 && y + h > y0;
    // 1) fundo (borda da cidade)
    ctx.fillStyle = ctx.createPattern(tex.rim, 'repeat'); ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    // calçada externa
    const ox = (MG - 2) * T, oy = (MG - 2) * T, ow = (INNER_W + 4) * T, oh = (INNER_H + 4) * T;
    if (hit(ox, oy, ow, oh)) {
      rrect(ctx, ox, oy, ow, oh, 60); ctx.fillStyle = '#ece1a2'; ctx.fill();
      ctx.save(); rrect(ctx, ox, oy, ow, oh, 60); ctx.clip();
      ctx.strokeStyle = 'rgba(150,130,70,0.45)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let gx = ox; gx <= ox + ow; gx += T) { ctx.moveTo(gx + 0.5, oy); ctx.lineTo(gx + 0.5, oy + oh); }
      for (let gy = oy; gy <= oy + oh; gy += T) { ctx.moveTo(ox, gy + 0.5); ctx.lineTo(ox + ow, gy + 0.5); }
      ctx.stroke(); ctx.restore();
    }
    // 2) asfalto das ruas
    const ap = ctx.createPattern(tex.asphalt, 'repeat');
    ctx.fillStyle = ap;
    const rx0 = MG * T, ry0 = MG * T, rh = INNER_H * T, rw = INNER_W * T;
    if (hit(rx0, ry0, rw, rh)) ctx.fillRect(rx0, ry0, rw, rh);
    // 3) marcas nas ruas: rastros de pneus e faixas amarelas
    ctx.save();
    ctx.strokeStyle = 'rgba(30,20,60,0.10)'; ctx.lineWidth = 5;
    for (let i = 0; i <= COLS; i++) for (const off of [1.4, 2.6, 5.4, 6.6]) {
      const xx = roadLeft(i) + off * T; if (xx < x0 - 8 || xx > x1 + 8) continue;
      ctx.beginPath(); ctx.moveTo(xx, Math.max(ry0, y0)); ctx.lineTo(xx, Math.min(ry0 + rh, y1)); ctx.stroke();
    }
    for (let j = 0; j <= ROWS; j++) for (const off of [1.4, 2.6, 5.4, 6.6]) {
      const yy = roadTop(j) + off * T; if (yy < y0 - 8 || yy > y1 + 8) continue;
      ctx.beginPath(); ctx.moveTo(Math.max(rx0, x0), yy); ctx.lineTo(Math.min(rx0 + rw, x1), yy); ctx.stroke();
    }
    ctx.restore();
    drawRoadDetail(ctx, x0, y0, x1, y1);
    // faixas amarelas tracejadas (param antes do cruzamento)
    ctx.fillStyle = '#f2c231';
    for (let i = 0; i <= COLS; i++) {
      const cx = nodeX(i);
      if (cx < x0 - 10 || cx > x1 + 10) continue;
      for (let j = 0; j < ROWS; j++) {
        const ya = nodeY(j) + (ROAD / 2 + 1.4) * T, yb = nodeY(j + 1) - (ROAD / 2 + 1.4) * T;
        for (let yy = ya; yy < yb - 30; yy += 96) if (yy + 56 > y0 && yy < y1) ctx.fillRect(cx - 3, yy, 6, 56);
      }
    }
    for (let j = 0; j <= ROWS; j++) {
      const cy = nodeY(j);
      if (cy < y0 - 10 || cy > y1 + 10) continue;
      for (let i = 0; i < COLS; i++) {
        const xa = nodeX(i) + (ROAD / 2 + 1.4) * T, xb = nodeX(i + 1) - (ROAD / 2 + 1.4) * T;
        for (let xx = xa; xx < xb - 30; xx += 96) if (xx + 56 > x0 && xx < x1) ctx.fillRect(xx, cy - 3, 56, 6);
      }
    }
    // 4) faixas de pedestre
    ctx.fillStyle = 'rgba(245,245,245,0.92)';
    crossings.forEach(c => {
      const cx = c.x * T, cy = c.y * T, cw = c.w * T, ch = c.h * T;
      if (!hit(cx, cy, cw, ch)) return;
      const cr = mulberry32(Math.floor(cx * 3 + cy * 5)), tinta = () => { ctx.fillStyle = 'rgba(' + (236 + cr() * 14 | 0) + ',' + (236 + cr() * 14 | 0) + ',' + (236 + cr() * 10 | 0) + ',' + (0.55 + cr() * 0.4) + ')'; }; // tinta gasta
      if (c.dir === 'h') { for (let xx = cx + 6; xx < cx + cw - 6; xx += 16) { tinta(); ctx.fillRect(xx, cy + 4, 9, ch - 8); } }
      else { for (let yy = cy + 6; yy < cy + ch - 6; yy += 16) { tinta(); ctx.fillRect(cx + 4, yy, ch > 0 ? cw - 8 : 9, 9); } }
    });
    // 5) quadras (chão)
    blocks.forEach(b => { if (hit(b.x - 8, b.y - 8, b.w + 16, b.h + 16)) drawBlockGround(ctx, b); });
    blocks.forEach(b => { if (b.kind !== 'river' && hit(b.x - 8, b.y - 8, b.w + 16, b.h + 16)) drawProps(ctx, b); });
    // 6) pontes (e água nas ruas sem ponte): proteção e pilares
    rios.forEach(rv => {
      for (let j = 0; j <= ROWS; j++) {
        const by = roadTop(j), bx = rv.x;
        if (!hit(bx, by - (BR_S + 4) * T, rv.w, (ROAD + 2 * BR_S + 8) * T)) continue;
        if (!temPonte(rv.bx, j)) {
          ctx.fillStyle = ctx.createPattern(tex.water, 'repeat'); ctx.fillRect(bx, by, rv.w, ROAD * T);
          ctx.fillStyle = 'rgba(180,220,255,0.10)'; for (let k = 0; k < 14; k++) ctx.fillRect(bx + ((k * 97) % rv.w), by + ((k * 41) % (ROAD * T)), 18, 2);
          ctx.fillStyle = '#3d4a3b'; ctx.fillRect(bx, by, 10, ROAD * T); ctx.fillRect(bx + rv.w - 10, by, 10, ROAD * T);
          ctx.fillStyle = '#6f7d6a'; ctx.fillRect(bx + 8, by, 3, ROAD * T); ctx.fillRect(bx + rv.w - 11, by, 3, ROAD * T);
          continue;
        }
        drawBridge(ctx, bx, by, rv.w, ROAD * T, { main: ehPrincipal(rv.bx) });
      }
    });
    // 7) sombras dos prédios e telhados
    const vis = buildings.filter(b => hit(b.x, b.y, b.w + 14, b.h + 14));
    vis.forEach(b => { // sombra suave (borrada) projetada para baixo e para a direita
      ctx.save();
      ctx.beginPath(); ctx.rect(b.x - 60, b.y - 60, b.w + 160, b.h + 160); ctx.clip();
      ctx.shadowColor = 'rgba(0,0,12,0.55)'; ctx.shadowBlur = 16; ctx.shadowOffsetX = 16; ctx.shadowOffsetY = 18;
      ctx.fillStyle = '#000'; ctx.fillRect(b.x + 4, b.y + 4, b.w - 4, b.h - 4);
      ctx.restore();
    });
    vis.forEach(b => drawRoof(ctx, b));
    // 8) árvores e postes
    trees.forEach(t => { if (hit(t.x - 50, t.y - 50, 100, 100)) drawTree(ctx, t); });
    lamps.forEach(l => {
      if (!hit(l.x - 14, l.y - 14, 28, 28)) return;
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(l.x + 4, l.y + 5, 5, 0, 7); ctx.fill();
      ctx.fillStyle = '#4a4a55'; ctx.beginPath(); ctx.arc(l.x, l.y, 4, 0, 7); ctx.fill();
      ctx.fillStyle = '#f7efb0'; ctx.beginPath(); ctx.arc(l.x, l.y, 2.5, 0, 7); ctx.fill();
    });
  }

  // ---------- Chunks (o cenário pré-desenhado) ----------
  const CH = 512, RS = 1.1;

<script>
/* ============================================================
   ai.js — tráfego, pedestres, polícia, helicóptero e semáforos
   ============================================================ */
(function (G) {
  'use strict';
  const W = G.world, T = W.T, ROWS = W.ROWS, COLS = W.COLS, MG = W.MG, PITCH = W.PITCH;
  const TAU = Math.PI * 2;
  const wrap = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // ---------- Semáforos ----------
  const CYCLE = 16.4; // verde 5,5s • amarelo 1,5s • todos vermelhos 1,2s (nos dois sentidos)
  function lightState(axis, time) {
    const t = time % CYCLE;
    if (axis === 'v') return t < 5.5 ? 'g' : t < 7 ? 'y' : 'r';
    return t < 8.2 ? 'r' : t < 13.7 ? 'g' : t < 15.2 ? 'y' : 'r';
  }
  // sinal de pedestre: quem atravessa uma rua de eixo 'v' (carros descendo/subindo) só vai quando o semáforo dela está VERMELHO
  // (e com tempo de sobra para chegar do outro lado)
  function pedPodeAtravessar(axisCarros, time) {
    const t = time % CYCLE;
    if (axisCarros === 'v') return t >= 7.2 && t < 11.8;                       // v fica vermelho de 7.0 a 16.4
    const u = (t - 15.4 + CYCLE) % CYCLE; return u < 4.6;                     // h fica vermelho de 15.2 até 8.2 do ciclo seguinte
  }
  function drawLights(ctx, x0, y0, x1, y1, time) {
    const cols = { g: '#3dff6a', y: '#ffe23d', r: '#ff3d3d' };
    const sv = lightState('v', time), sh = lightState('h', time);
    for (let i = 0; i <= COLS; i++) for (let j = 0; j <= ROWS; j++) {
      const cx = W.nodeX(i), cy = W.nodeY(j);
      if (cx < x0 - 200 || cx > x1 + 200 || cy < y0 - 200 || cy > y1 + 200) continue;
      const d = ROWS && (ROAD_HALF() + 14);
      [[-1, -1, sv], [1, 1, sv], [1, -1, sh], [-1, 1, sh]].forEach(([sx, sy, st]) => {
        const x = cx + sx * d, y = cy + sy * d;
        ctx.fillStyle = '#20202a'; ctx.fillRect(x - 6, y - 6, 12, 12);
        ctx.fillStyle = cols[st]; ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fill();
        const g = ctx.createRadialGradient(x, y, 1, x, y, 16); g.addColorStop(0, st === 'g' ? 'rgba(60,255,100,0.5)' : st === 'y' ? 'rgba(255,230,60,0.5)' : 'rgba(255,60,60,0.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.fillRect(x - 16, y - 16, 32, 32);
      });
    }
  }
  function ROAD_HALF() { return W.ROAD * T / 2; }

  // ---------- Navegação por faixas ----------
  const alongOf = (n, c) => n.axis === 'v' ? c.y : c.x;
  const nodeCoord = n => n.axis === 'v' ? W.nodeY(n.nj) : W.nodeX(n.ni);
  const laneCoord = n => n.axis === 'v' ? W.laneV(n.idx, n.dir) : W.laneH(n.idx, n.dir);
  const angFor = (axis, dir) => axis === 'v' ? (dir > 0 ? Math.PI : 0) : (dir > 0 ? Math.PI / 2 : -Math.PI / 2);

  function initNav(axis, idx, dir, along) {
    const k = (along / T - MG - W.ROAD / 2) / PITCH;
    let n = dir > 0 ? Math.ceil(k - 1e-6) : Math.floor(k + 1e-6);
    const nav = { axis, idx, dir, ni: 0, nj: 0, m: null, mode: 'wander', target: null };
    if (axis === 'v') { nav.ni = idx; nav.nj = clamp(n, 0, ROWS); } else { nav.nj = idx; nav.ni = clamp(n, 0, COLS); }
    return nav;
  }

  // rios sem ponte nessa rua: o carro não pode seguir naquele sentido (só as pontes ligam as margens)
  const okH = (i, j, hd) => W.cruzaOk(hd > 0 ? i : i - 1, j);
  // trecho de rua interditado? (axis 'v' = rua vertical idx, trecho a entre os nós a e a+1)
  const fech = (axis, idx, a) => W.fechado.size > 0 && W.fechado.has(axis + idx + ':' + a);
  function chooseManeuver(car) {
    const n = car.nav, i = n.ni, j = n.nj, d = n.dir; let opts = [];
    if (n.axis === 'v') {
      if (d > 0 ? j < ROWS : j > 0) opts.push({ k: 's', ni: i, nj: j + d });
      const rh = d > 0 ? -1 : 1;
      [[rh, 'r'], [-rh, 'l']].forEach(([hd, k]) => { if ((hd > 0 ? i < COLS : i > 0) && okH(i, j, hd)) opts.push({ k, axis: 'h', dir: hd, ni: i + hd, nj: j, trig: W.laneH(j, hd) }); });
    } else {
      if ((d > 0 ? i < COLS : i > 0) && okH(i, j, d)) opts.push({ k: 's', ni: i + d, nj: j });
      const rv = d > 0 ? 1 : -1;
      [[rv, 'r'], [-rv, 'l']].forEach(([vd, k]) => { if (vd > 0 ? j < ROWS : j > 0) opts.push({ k, axis: 'v', dir: vd, ni: i, nj: j + vd, trig: W.laneV(i, vd) }); });
    }
    // ruas interditadas por obra: o motorista escolhe outro caminho
    const todas = opts;
    opts = opts.filter(o => o.k === 's' ? !fech(n.axis, n.axis === 'v' ? i : j, Math.min(n.axis === 'v' ? j : i, (n.axis === 'v' ? j : i) + d)) : !(o.axis === 'h' ? fech('h', j, o.dir > 0 ? i : i - 1) : fech('v', i, o.dir > 0 ? j : j - 1)));
    if (!opts.length) opts = todas;      // tudo interditado: passa mesmo assim
    let m;
    if (n.mode === 'goto' && n.target) {
      let best = 1e9;
      opts.forEach(o => { const sc = Math.abs(o.ni - n.target.i) + Math.abs(o.nj - n.target.j) + Math.random() * 0.3; if (sc < best) { best = sc; m = o; } });
    } else {
      const wt = { s: 0.56, r: 0.22, l: 0.22 };
      let tot = 0; opts.forEach(o => tot += wt[o.k]);
      let r = Math.random() * tot;
      for (const o of opts) { r -= wt[o.k]; if (r <= 0) { m = o; break; } }
      if (!m) m = opts[0];
    }
    if (!m) m = { k: 's', ni: n.ni, nj: n.nj };   // sem opção: o carro fica parado até alguém resolver (o Olho de Deus vê isso)
    m = Object.assign({}, m);
    if (m.k === 's') m.trig = nodeCoord(n);
    return m;
  }
  function applyManeuver(car) {
    const n = car.nav, m = n.m;
    if (m.k === 's') { n.ni = m.ni; n.nj = m.nj; }
    else { n.axis = m.axis; n.dir = m.dir; n.idx = m.axis === 'v' ? n.ni : n.nj; n.ni = m.ni; n.nj = m.nj; }
    n.m = null;
  }

  function aheadGap(car, S, look) {
    const fx = car.fx, fy = car.fy, rx = Math.cos(car.a), ry = Math.sin(car.a);
    let best = 1e9;
    const test = (o, len, latMax) => {
      const dx = o.x - car.x, dy = o.y - car.y;
      if (dx > look + 120 || dx < -look - 120 || dy > look + 120 || dy < -look - 120) return;
      const al = dx * fx + dy * fy, lat = dx * rx + dy * ry;
      if (al > 10 && al < look + len && Math.abs(lat) < latMax) best = Math.min(best, al - len);
    };
    for (const o of S.cars) { if (o === car) continue; if (o.dead && car.stuckT > 5) continue; test(o, G.sprites.CAR_L * 0.55, 34); }
    for (const p of S.peds) if (p.state !== 'down' && p.state !== 'dead') test(p, 14, 26);
    if (!S.player.car) test(S.player, 14, 26);
    return best;
  }

  function driveTraffic(car, dt, S) {
    const n = car.nav; if (!n) return;
    const pos = alongOf(n, car);
    const nc = nodeCoord(n);
    const toNode = (nc - pos) * n.dir;
    if (!n.m && toNode < 340) n.m = chooseManeuver(car);
    if (n.m && (pos - n.m.trig) * n.dir >= -(n.m.k === 's' ? 0 : n.m.k === 'r' ? 34 : 70)) applyManeuver(car);
    // ponto de mira
    const lc = laneCoord(n);
    const tx = n.axis === 'v' ? lc : car.x + n.dir * 150, ty = n.axis === 'v' ? car.y + n.dir * 150 : lc;
    const want = Math.atan2(tx - car.x, -(ty - car.y));
    let steer = clamp(wrap(want - car.a) * 2.6, -1, 1);
    // velocidade desejada
    let v = car.cruise;
    if (n.m && n.m.k !== 's' && toNode < 260) v = Math.min(v, n.m.k === 'l' ? 105 : 95);
    // semáforo
    if (!car.ignoreLights) {
      const stopAt = (nc - n.dir * (ROAD_HALF() + 14));
      const rem = (stopAt - pos) * n.dir;
      const st = lightState(n.axis, S.time);
      if (st !== 'g' && rem > -6 && rem < 260) {
        const brakeD = Math.max(0, rem - 6);
        if (st === 'r' || brakeD > car.vf * car.vf / 500) v = Math.min(v, Math.sqrt(2 * 240 * brakeD));
      }
    }
    // cruzamento: não invadir se estiver ocupado e ceder na conversão à esquerda
    if (toNode > 70 && toNode < 330 && !car.ignoreLights) {
      const nx = W.nodeX(n.ni), ny = W.nodeY(n.nj), hb = ROAD_HALF() + 6;
      let block = false;
      for (const o of S.cars) {
        if (o === car) continue;
        const ox = o.x - nx, oy = o.y - ny, dot = o.fx * car.fx + o.fy * car.fy;
        if (Math.abs(ox) < hb && Math.abs(oy) < hb) {
          if (toNode > hb - 12 && (Math.abs(dot) < 0.5 || (dot < -0.7 && n.m && n.m.k === 'l') || o.speed < 40)) { block = true; break; }
        } else if (n.m && n.m.k === 'l' && dot < -0.7 && o.speed > 40 && Math.hypot(ox, oy) < 330 && toNode < 260) {
          if (!(o.nav && o.nav.m && o.nav.m.k === 'l') || o.id < car.id) { block = true; break; }
        }
      }
      if (block) v = Math.min(v, Math.max(0, toNode - (ROAD_HALF() + 14)) * 1.7);
    }
    // não entra no cruzamento se a saída está entupida (evita engarrafar a esquina)
    if (!car.ignoreLights && toNode > 10 && toNode < 150 && (!n.m || n.m.k === 's')) {
      for (const o of S.cars) {
        if (o === car || o.dead) continue;
        const ox = o.x - car.x, oy = o.y - car.y; if (Math.abs(ox) > 420 || Math.abs(oy) > 420) continue;
        const al = ox * car.fx + oy * car.fy, lat = ox * Math.cos(car.a) + oy * Math.sin(car.a);
        if (al > toNode + ROAD_HALF() && al < toNode + ROAD_HALF() + 150 && Math.abs(lat) < 34 && o.speed < 22 && o.fx * car.fx + o.fy * car.fy > 0.6) { v = Math.min(v, Math.max(0, toNode - (ROAD_HALF() + 14)) * 1.7); break; }
      }
    }
    // pedestre na faixa à frente (inclusive nas curvas): para
    if (toNode < ROAD_HALF() + 220 || (n.m && n.m.k !== 's')) for (const p of S.peds) {
      if (p.state === 'down' || p.state === 'dead') continue;
      const dx = p.x - car.x, dy = p.y - car.y; if (Math.abs(dx) > 240 || Math.abs(dy) > 240) continue;
      if (!W.isRoadTile(W.tileAt(p.x, p.y))) continue;   // pedestre em cima da faixa OU da pista: o carro espera
      const al = dx * car.fx + dy * car.fy, lat = dx * Math.cos(car.a) + dy * Math.sin(car.a);
      const dd = Math.hypot(dx, dy);
      if (al > -16 && ((al < 230 && Math.abs(lat) < 70) || dd < 120)) { v = Math.min(v, Math.max(0, dd - 52) * 0.95); break; }
    }
    // pisca-pisca: avisa antes de virar
    car.blink = (n.m && n.m.k !== 's' && toNode < 280) ? (n.m.k === 'r' ? 1 : -1) : 0;
    // ambulância/polícia de sirene atrás: reduz e deixa passar
    if (car.kind !== 'police') for (const o of S.cars) {
      if (o.kind !== 'police' || !o.siren || o.dead || o === car) continue;
      const dx = o.x - car.x, dy = o.y - car.y; if (Math.abs(dx) > 340 || Math.abs(dy) > 340) continue;
      const al = dx * car.fx + dy * car.fy, lat = dx * Math.cos(car.a) + dy * Math.sin(car.a);
      if (al < 0 && al > -320 && Math.abs(lat) < 70) { v = Math.min(v, 45); car.blink = 1; break; }
    }
    // carro / pessoa na frente (cada motorista tem seu jeito: calmo, normal ou apressado)
    const look = 70 + Math.max(0, car.vf) * 0.9;
    const gap = aheadGap(car, S, look);
    if (gap < 1e8) v = Math.min(v, Math.max(0, gap - 26 - (car.gapX || 0)) * 1.7);
    // buzina quando fica preso atrás de alguém por muito tempo
    if (gap < 70 && car.vf < 10 && lightState(n.axis, S.time) === 'g') car.blockT = (car.blockT || 0) + dt; else if (car.blockT > 0) car.blockT = 0; else if (car.blockT < 0) car.blockT = Math.min(0, car.blockT + dt);
    if (car.blockT > 2.6) {
      car.blockT = -4;
      const P = S.player, d = Math.hypot(car.x - P.x, car.y - P.y);
      if (d < 650 && G.snd.honk) G.snd.honk(1 - d / 650);
      car.honkFlash = 0.5;
    }
    // controle
    const vf = car.vf, err = v - vf;
    car.hb = false;
    if (car.hold > 0) { car.hold -= dt; v = 0; }
    if (err > 8) car.thr = clamp(err / 45, 0.3, 1);
    else if (err < -14) car.thr = -clamp(-err / 60, 0.35, 1);
    else car.thr = 0;
    if (v < 4 && Math.abs(vf) < 40) { car.thr = 0; car.hb = true; }
    // destravar
    if (v > 40 && Math.abs(vf) < 6) car.stuckT += dt; else if (car.revT <= 0) car.stuckT = Math.max(0, car.stuckT - dt);
    if (car.stuckT > 2.5 && car.revT <= 0) { car.revT = 1.1; car.stuckT = 0; }
    if (car.revT > 0) { car.revT -= dt; car.thr = -1; steer = -steer; car.hb = false; }
    car.steer = steer;
  }

  function directPursuit(car, dt, S) {
    const P = S.player, tg = P.car || P;
    const tvx = tg.vx || 0, tvy = tg.vy || 0;
    const dxp = tg.x + tvx * 0.4 - car.x, dyp = tg.y + tvy * 0.4 - car.y;
    const dist = Math.hypot(tg.x - car.x, tg.y - car.y);
    let want = Math.atan2(dxp, -dyp);
    if (car.mode === 'leave') want = Math.atan2(car.x - tg.x, -(car.y - tg.y));
    let diff = wrap(want - car.a);
    let bias = 0;
    const probe = ang => W.isSolid(car.x + Math.sin(ang) * 90, car.y - Math.cos(ang) * 90);
    if (probe(car.a + 0.5)) bias -= 0.9; if (probe(car.a - 0.5)) bias += 0.9;
    if (probe(car.a)) bias += (diff >= 0 ? 0.8 : -0.8);
    let steer = clamp(diff * 2.4 + bias, -1, 1);
    let thr = 1;
    if (car.mode !== 'leave') {
      if (dist < 90 && (!P.car || P.car.speed < 60)) thr = 0.15;
      if (Math.abs(diff) > 2.3 && dist < 350) thr = 0.5;
    }
    if (Math.abs(car.vf) < 14 && thr > 0.3 && car.revT <= 0) car.stuckT += dt; else if (car.revT <= 0) car.stuckT = 0;
    if (car.stuckT > 0.9 && car.revT <= 0) { car.revT = 0.9; car.stuckT = 0; }
    car.hb = false;
    if (car.revT > 0) { car.revT -= dt; thr = -1; steer = -steer; }
    car.thr = thr * (car.chaseScale || 1); if (thr < 0) car.thr = thr;
    car.steer = steer;
  }

  // a polícia segue as ruas e só parte direto para cima quando enxerga o alvo
  function lineClear(ax, ay, bx, by) {
    const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / 36);
    for (let k = 1; k < n; k++) { const t = k / n; if (W.isSolid(ax + (bx - ax) * t, ay + (by - ay) * t)) return false; }
    return true;
  }
  function resnap(car) {
    const cx = Math.round((car.x / T - MG - W.ROAD / 2) / PITCH), cy = Math.round((car.y / T - MG - W.ROAD / 2) / PITCH);
    const i = clamp(cx, 0, COLS), j = clamp(cy, 0, ROWS);
    const dv = Math.abs(car.x - W.nodeX(i)), dh = Math.abs(car.y - W.nodeY(j));
    if (Math.min(dv, dh) > 110) return false;
    if (dv <= dh) car.nav = initNav('v', i, car.fy > 0 ? 1 : -1, car.y); else car.nav = initNav('h', j, car.fx > 0 ? 1 : -1, car.x);
    return true;
  }
  function driveChase(car, dt, S) {
    const P = S.player, tg = P.car || P;
    const dist = Math.hypot(tg.x - car.x, tg.y - car.y);
    const direct = car.mode === 'chase' && dist < 650 && lineClear(car.x, car.y, tg.x, tg.y);
    if (direct) { car.navDirect = true; return directPursuit(car, dt, S); }
    if (car.navDirect || !car.nav) { car.navDirect = false; if (!resnap(car)) return directPursuit(car, dt, S); }
    const n = car.nav;
    if (car.mode === 'chase') {
      n.mode = 'goto'; n.target = { i: clamp(Math.round((tg.x / T - MG - W.ROAD / 2) / PITCH), 0, COLS), j: clamp(Math.round((tg.y / T - MG - W.ROAD / 2) / PITCH), 0, ROWS) };
      car.cruise = 300 * (car.chaseScale || 1);
    } else { n.mode = 'wander'; car.cruise = 250; }
    car.ignoreLights = true;
    driveTraffic(car, dt, S);
  }

  // ---------- Pontos aleatórios nas ruas ----------
  function randomRoadPoint(cx, cy, minD, maxD, tries) {
    for (let t = 0; t < (tries || 30); t++) {
      const axis = Math.random() < 0.5 ? 'v' : 'h', dir = Math.random() < 0.5 ? 1 : -1;
      let idx, along;
      const ang = Math.random() * TAU, d = rand(minD, maxD);
      const px = cx + Math.cos(ang) * d, py = cy + Math.sin(ang) * d;
      if (axis === 'v') {
        idx = clamp(Math.round((px / T - MG - W.ROAD / 2) / PITCH), 0, COLS);
        along = py;
        const k = clamp(Math.round((along / T - MG - W.ROAD / 2) / PITCH), 0, ROWS), nyy = W.nodeY(k);
        if (Math.abs(along - nyy) < 300) along = nyy + (along >= nyy ? 1 : -1) * 320;
        along = clamp(along, W.nodeY(0) + 200, W.nodeY(ROWS) - 200);
      } else {
        idx = clamp(Math.round((py / T - MG - W.ROAD / 2) / PITCH), 0, ROWS);
        along = px;
        const k = clamp(Math.round((along / T - MG - W.ROAD / 2) / PITCH), 0, COLS), nxx = W.nodeX(k);
        if (Math.abs(along - nxx) < 300) along = nxx + (along >= nxx ? 1 : -1) * 320;
        along = clamp(along, W.nodeX(0) + 200, W.nodeX(COLS) - 200);
      }
      const x = axis === 'v' ? W.laneV(idx, dir) : along, y = axis === 'v' ? along : W.laneH(idx, dir);
      const dd = Math.hypot(x - cx, y - cy);
      if (dd < minD * 0.8 || dd > maxD * 1.2) continue;
      if (W.isSolid(x, y)) continue;
      return { x, y, a: angFor(axis, dir), axis, idx, dir, along };
    }
    return null;
  }

  const CAR_COLORS = ['#2f8a3c', '#2e5fb5', '#e8e8ea', '#8a8a96', '#8a2a3a', '#2a8a8a', '#c47a1e', '#6a3fa0', '#d8d04a'];
  function spawnTraffic(S, kindForce) {
    const P = S.player;
    const pt = randomRoadPoint(P.x, P.y, 620, 1150);
    if (!pt) return null;
    for (const o of S.cars) if (Math.abs(o.x - pt.x) < 140 && Math.abs(o.y - pt.y) < 140) return null;
    let kind = kindForce || (Math.random() < 0.16 ? 'taxi' : 'sedan');
    if (kind === 'police' && S.cars.filter(c => c.kind === 'police' && c.mode === 'wander').length >= 2) kind = 'sedan';
    const car = new G.Car({ x: pt.x, y: pt.y, a: pt.a, kind, color: kind === 'police' ? '#ffffff' : kind === 'taxi' ? '#f2c42a' : pick(CAR_COLORS), driver: 'ai', mode: 'wander' });
    const jeito = Math.random();
    car.pers = jeito < 0.2 ? 'apressado' : jeito < 0.42 ? 'calmo' : 'normal';
    car.cruise = car.pers === 'apressado' ? rand(235, 280) : car.pers === 'calmo' ? rand(120, 160) : rand(160, 230);
    car.gapX = car.pers === 'apressado' ? -10 : car.pers === 'calmo' ? 16 : 0;
    car.nav = initNav(pt.axis, pt.idx, pt.dir, pt.along);
    car.vx = car.fx * 120; car.vy = car.fy * 120;
    S.cars.push(car); return car;
  }

  function spawnPolice(S, n) {
    const P = S.player, tg = P.car || P;
    for (let k = 0; k < n; k++) {
      const pt = randomRoadPoint(tg.x, tg.y, 650, 950);
      if (!pt) continue;
      let ok = true; for (const o of S.cars) if (Math.abs(o.x - pt.x) < 140 && Math.abs(o.y - pt.y) < 140) ok = false;
      if (!ok) continue;
      const c = new G.Car({ x: pt.x, y: pt.y, a: pt.a, kind: 'police', color: '#ffffff', driver: 'ai', mode: 'chase', mass: 1.15 });
      c.siren = true; c.chaseScale = 0.92 + S.heatLevel * 0.02; c.max = 330 + S.heatLevel * 18;
      c.nav = initNav(pt.axis, pt.idx, pt.dir, pt.along); c.cruise = 300;
      c.vx = c.fx * 150; c.vy = c.fy * 150;
      S.cars.push(c);
    }
  }
  function spawnRoadblock(S) {
    const P = S.player, tg = P.car || P;
    const pt = randomRoadPoint(tg.x + (tg.vx || 0) * 2, tg.y + (tg.vy || 0) * 2, 700, 1000);
    if (!pt) return;

    G.particle({ x, y, vx: 0, vy: 0, life: 0.45, size: 10, col: 'ring' });
    for (let k = 0; k < 24; k++) { const a = rand(0, TAU), v = rand(30, 190); G.particle({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.5, 1.1), size: rand(8, 18), col: k % 3 === 0 ? 'smoke' : 'fire' }); }
    for (let k = 0; k < 14; k++) { const a = rand(0, TAU), v = rand(80, 260); G.particle({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.2, 0.5), size: 2.5, col: 'spark' }); }
    scorch(S, x, y, R * 0.6);
    for (const p of S.peds) {
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < R && p.state !== 'dead') hurtPed(S, p, dmg * (1 - d / R * 0.7), x, y, 260, src);
    }
    for (const c of S.cars) {
      const d = Math.hypot(c.x - x, c.y - y);
      if (d < R * 1.15 && !c.dead) { G.carDamage(c, 75 * (1 - d / (R * 1.15))); const a = Math.atan2(c.y - y, c.x - x); c.vx += Math.cos(a) * 220; c.vy += Math.sin(a) * 220; }
    }
    const d = Math.hypot(P.x - x, P.y - y);
    if (d < R && !P.car && S.mode === 'play') { hurtPlayer(S, dmg * (1 - d / R * 0.6), x, y); const a = Math.atan2(P.y - y, P.x - x); P.vx += Math.cos(a) * 240; P.vy += Math.sin(a) * 240; }
    if (src === 'player' && copNear(S, x, y, 700)) G.addHeat(28);
  }

  // ---------- Balas ----------
  function fireBullet(S, o) {
    if (S.bullets.length > 160) S.bullets.shift();
    S.bullets.push({ x: o.x, y: o.y, px: o.x, py: o.y, vx: Math.cos(o.a) * o.speed, vy: Math.sin(o.a) * o.speed, dmg: o.dmg, own: o.own, left: o.range, car: o.car || null });
  }
  function flash(x, y) { G.particle({ x, y, vx: 0, vy: 0, life: 0.07, size: 10, col: 'flash' }); }
  function spark(x, y, n) { for (let k = 0; k < n; k++) { const a = rand(0, TAU), v = rand(40, 160); G.particle({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.12, 0.3), size: 2, col: 'spark' }); } }

  function bulletHit(S, b) {
    const P = S.player;
    if (b.own === 'player') {
      for (const p of S.peds) {
        if (p.state === 'dead' || p.mission) continue;
        if (Math.abs(p.x - b.x) > 10 || Math.abs(p.y - b.y) > 10) continue;
        if (Math.hypot(p.x - b.x, p.y - b.y) < 8.5) { hurtPed(S, p, b.dmg, b.x - b.vx * 0.02, b.y - b.vy * 0.02, 110, 'player'); return true; }
      }
    } else if (!P.car && S.mode === 'play' && Math.hypot(P.x - b.x, P.y - b.y) < 9) {
      hurtPlayer(S, b.dmg, b.px, b.py); return true;
    }
    for (const c of S.cars) {
      if (Math.abs(c.x - b.x) > 62 || Math.abs(c.y - b.y) > 62) continue;
      if (c === b.car || (b.own === 'player' && c === P.car) || (b.own === 'cop' && c.kind === 'police')) continue;
      const cc = G.carCircles(c);
      let hit = false;
      for (let k = 0; k < 2; k++) if (Math.hypot(b.x - cc[k][0], b.y - cc[k][1]) < cc[k][2] * 0.85) hit = true;
      if (!hit) continue;
      spark(b.x, b.y, 4);
      if (!c.dead) {
        const cs = Math.cos(c.a), sn = Math.sin(c.a), dx = b.x - c.x, dy = b.y - c.y;
        (c.holes = c.holes || []); if (c.holes.length < 16) c.holes.push({ x: dx * cs + dy * sn, y: -dx * sn + dy * cs });
        if (b.own === 'player') {
          G.carDamage(c, b.dmg * 0.35);
          if (c.driver === 'ai' && c.mode === 'wander') {
            if (c.kind === 'police') { c.mode = 'chase'; c.siren = true; c.chaseScale = 1; G.addHeat(30); S.copHostile = true; }
            else { c.cruise = Math.max(c.cruise, 300); c.ignoreLights = true; }
          }
        } else {
          G.carDamage(c, b.dmg * 0.5);
          if (c === P.car && Math.random() < 0.35) hurtPlayer(S, b.dmg * 0.6, b.px, b.py);
        }
      }
      return true;
    }
    return false;
  }
  function updateBullets(S, dt) {
    for (let i = S.bullets.length - 1; i >= 0; i--) {
      const b = S.bullets[i];
      const step = Math.hypot(b.vx, b.vy) * dt, n = Math.max(1, Math.ceil(step / 7));
      let dead = false;
      for (let s = 0; s < n && !dead; s++) {
        b.px = b.x; b.py = b.y; b.x += b.vx * dt / n; b.y += b.vy * dt / n; b.left -= step / n;
        if (b.left <= 0) { dead = true; break; }
        if (W.tileAt(b.x, b.y) === W.TILE.BUILD || (W.trees.length && W.treeHit(b.x, b.y, 0))) { spark(b.px, b.py, 3); dead = true; break; }
        dead = bulletHit(S, b);
      }
      if (dead) S.bullets.splice(i, 1);
    }
  }

  // ---------- Ataque do jogador ----------
  function aimAngle(S, P, range) {
    const fx = Math.sin(P.h), fy = -Math.cos(P.h);
    let best = null, bs = 1e9;
    for (const p of S.peds) {
      if (p.state === 'dead' || p.mission) continue;
      const dx = p.x - P.x, dy = p.y - P.y, d = Math.hypot(dx, dy);
      if (d > range || d < 4) continue;
      const da = Math.abs(wrap(Math.atan2(dy, dx) - Math.atan2(fy, fx)));
      if (da > 0.45) continue;
      const sc = d * (1 + da * 2.5);
      if (sc < bs) { bs = sc; best = p; }
    }
    if (best) return Math.atan2(best.y - P.y, best.x - P.x);
    return Math.atan2(fy, fx);
  }

  function melee(S, P, w) {
    P.punchT = w.id === 'bat' ? 0.4 : 0.3; P.cdT = w.cd;
    w.id === 'bat' ? G.snd.swing() : G.snd.punch();
    const fx = Math.sin(P.h), fy = -Math.cos(P.h);
    let hits = 0;
    for (const p of S.peds) {
      if (p.state === 'dead' || p.mission) continue;
      const dx = p.x - P.x, dy = p.y - P.y, d = Math.hypot(dx, dy);
      if (d < w.range && (dx * fx + dy * fy) > 0) {
        hurtPed(S, p, w.dmg * (1 + 0.18 * ((S.save && S.save.forca) || 0)) * rand(0.85, 1.25), P.x, P.y, w.id === 'bat' ? 230 : 140, 'player');
        if (w.id === 'bat') G.snd.thud();
        hits++; if (hits >= (w.id === 'bat' ? 2 : 1)) break;
      }
    }
  }

  function shoot(S, P, w) {
    const a = arms(S);
    const ang = aimAngle(S, P, w.range);
    P.h = ang + Math.PI / 2;
    const mx = P.x + Math.cos(ang) * 15, my = P.y + Math.sin(ang) * 15;
    for (let k = 0; k < w.pellets; k++) fireBullet(S, { x: mx, y: my, a: ang + rand(-1, 1) * w.spread, speed: w.speed * rand(0.92, 1.05), dmg: w.dmg, own: 'player', range: w.range });
    P.cdT = w.cd; P.flashT = 0.07; P.punchT = 0;
    a.ammo[w.id]--;
    flash(mx, my);
    G.snd.gun(w.snd, 1);
    S.shake = Math.max(S.shake, w.id === 'shotgun' ? 4 : 1.2);
    noise(S, P.x, P.y, 430);
    S.lastShot = S.time;
    if (S.time - S.shotHeatT > 1.2 && copNear(S, P.x, P.y, 650)) { G.addHeat(w.id === 'shotgun' ? 10 : 6); S.shotHeatT = S.time; }
    if (a.ammo[w.id] <= 0) { G.say(w.name + ' sem munição!', 2); P.weapon = bestFallback(S); G.save(); }
  }

  function throwGrenade(S, P, w) {
    const a = arms(S);
    const fx = Math.sin(P.h), fy = -Math.cos(P.h);
    S.grenades.push({ x: P.x + fx * 10, y: P.y + fy * 10, vx: fx * 300 + (P.vx || 0), vy: fy * 300 + (P.vy || 0), t: 1.8, spin: 0 });
    a.ammo.grenade--; P.cdT = w.cd; P.punchT = 0.25;
    G.snd.swing();
    if (a.ammo.grenade <= 0) { P.weapon = bestFallback(S); G.save(); }
  }

  function playerUpdate(S, dt, held, pressed) {
    const P = S.player;
    if (P.cdT > 0) P.cdT -= dt; if (P.flashT > 0) P.flashT -= dt;
    if (!arms(S).own[P.weapon] || !hasAmmo(S, P.weapon)) P.weapon = bestFallback(S);
    const w = WEAPONS[P.weapon];
    const want = w.auto ? held : pressed;
    if (!want || P.cdT > 0) return;
    if (w.melee) melee(S, P, w);
    else if (w.throw) throwGrenade(S, P, w);
    else shoot(S, P, w);
  }

  function updateGrenades(S, dt) {
    for (let i = S.grenades.length - 1; i >= 0; i--) {
      const g = S.grenades[i];
      g.t -= dt; g.spin += dt * 12;
      const nx = g.x + g.vx * dt, ny = g.y + g.vy * dt;
      if (W.isSolid(nx, g.y)) g.vx *= -0.4; else g.x = nx;
      if (W.isSolid(g.x, ny)) g.vy *= -0.4; else g.y = ny;
      const f = Math.pow(0.25, dt); g.vx *= f; g.vy *= f;
      if (g.t <= 0) { S.grenades.splice(i, 1); blast(S, g.x, g.y, 125, 150, 'player'); }
    }
  }

  // ---------- Itens no chão ----------
  function updatePickups(S, dt) {
    const P = S.player, ref = P.car || P, r = P.car ? 30 : 17;
    for (let i = S.pickups.length - 1; i >= 0; i--) {
      const k = S.pickups[i]; k.t += dt;
      if (k.t > 90) { S.pickups.splice(i, 1); continue; }
      if (S.mode !== 'play' || Math.hypot(k.x - ref.x, k.y - ref.y) > r) continue;
      if (k.type === 'cash') { S.save.money += k.n; G.save(); G.snd.cash(); }
      else if (k.type === 'gun') { if (P.car) continue; giveWeapon(S, k.id, k.n); G.snd.pick(); }
      else if (k.type === 'armor') { if (P.armor >= 100) continue; P.armor = Math.min(100, P.armor + k.n); G.say('Colete recolhido.', 2); G.snd.pick(); }
      else if (k.type === 'health') { if (P.hp >= 100) continue; P.hp = Math.min(100, P.hp + k.n); G.say('Kit médico: +' + k.n + ' de vida.', 2); G.snd.pick(); }
      S.pickups.splice(i, 1);
    }
  }

  // ---------- Marcas de pneu ----------
  function updateSkids(S, dt) {
    const P = S.player, ref = P.car || P;
    for (const c of S.cars) {
      if (c.dead || Math.abs(c.x - ref.x) > 700 || Math.abs(c.y - ref.y) > 700) { c._sk = null; continue; }
      const slide = !c.onGrass && c.speed > 60 && (Math.abs(c.vr) > 95 || (c.hb && c.speed > 120) || (c.thr < 0 && c.vf > 150));
      if (!slide) { c._sk = null; continue; }
      const rx = Math.cos(c.a), ry = Math.sin(c.a);
      const lx = c.x - c.fx * 24 - rx * 14, ly = c.y - c.fy * 24 - ry * 14, qx = c.x - c.fx * 24 + rx * 14, qy = c.y - c.fy * 24 + ry * 14;
      if (c._sk) {
        S.skids.push({ x1: c._sk[0], y1: c._sk[1], x2: lx, y2: ly, t: 0 }, { x1: c._sk[2], y1: c._sk[3], x2: qx, y2: qy, t: 0 });
      }
      if (Math.random() < 0.6) for (const [sx, sy] of [[lx, ly], [qx, qy]]) G.particle({ x: sx, y: sy, vx: rand(-14, 14), vy: rand(-14, 14), life: 0.9, size: 3.5, col: 'smoke', tint: '#dcdce4', a: 0.34 });
      c._sk = [lx, ly, qx, qy];
    }
    for (const s of S.skids) s.t += dt;
    if (S.skids.length > 600 || (S.skids.length && S.skids[0].t > 45)) S.skids = S.skids.filter(s => s.t < 45).slice(-600);
  }

  // ---------- Pedestres armados: atirar, perseguir, prender ----------
  const walkable = (x, y) => !W.isSolid(x, y) && !W.treeHit(x, y, 3);
  function moveToward(p, ang, sp, dt) {
    const tries = p.side ? [0, p.side * 0.7, -p.side * 0.7, p.side * 1.3, -p.side * 1.3] : [0, 0.7, -0.7, 1.3, -1.3];
    for (const off of tries) {
      const a = ang + off, nx = p.x + Math.cos(a) * sp * dt, ny = p.y + Math.sin(a) * sp * dt;
      const lx = p.x + Math.cos(a) * 12, ly = p.y + Math.sin(a) * 12;
      if (walkable(lx, ly) && walkable(nx, ny)) { p.x = nx; p.y = ny; if (off) p.side = off > 0 ? 1 : -1; p.walk += sp * dt * 0.22; return true; }
    }
    return false;
  }

  function enemyFire(S, p, tg, ang) {
    const wid = p.weapon || 'pistol', w = WEAPONS[wid], e = ENEMY[wid] || ENEMY.pistol;
    const d = Math.hypot(tg.x - p.x, tg.y - p.y);
    const lead = ang + clamp(((tg.vx || 0) * -Math.sin(ang) + (tg.vy || 0) * Math.cos(ang)) * 0.0009 * d, -0.25, 0.25);
    const sp = 0.07 + d / 3400 + (S.player.car ? 0.05 : 0);
    const mx = p.x + Math.cos(ang) * 12, my = p.y + Math.sin(ang) * 12;
    for (let k = 0; k < (w.pellets || 1); k++) fireBullet(S, { x: mx, y: my, a: lead + rand(-1, 1) * (w.pellets > 1 ? w.spread : sp), speed: w.speed * 0.72, dmg: e.dmg, own: p.kind === 'cop' ? 'cop' : 'thug', range: w.range + 60 });
    p.flashT = 0.07; flash(mx, my);
    G.snd.gun(w.snd, vol(S, p.x, p.y));
    p.burst = (p.burst || 0) + 1;
    p.fireT = wid === 'smg' ? (p.burst % 6 === 0 ? 0.9 : e.cd) : e.cd * rand(0.8, 1.3);
  }

  function fightPed(S, p, dt) {
    const P = S.player, tg = P.car || P;
    const dx = tg.x - p.x, dy = tg.y - p.y, d = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
    const wid = p.weapon || 'pistol';
    p.fireT = (p.fireT || 0) - dt; p.react = (p.react || 0) - dt;
    const wasIn = S.mode === 'play';
    const arrest = p.kind === 'cop' && S.heatLevel <= 2 && !S.copHostile && S.time - S.lastShot > 6;
    p.arresting = arrest;
    const los = d < 540 && G.ai.lineClear(p.x, p.y, tg.x, tg.y);
    p.h += wrap(ang + Math.PI / 2 - p.h) * Math.min(1, 10 * dt);
    const sp = p.kind === 'cop' ? (p.weapon === 'pistol' ? 96 : 88) : 84;
    let pref = arrest || wid === 'bat' ? 0 : wid === 'shotgun' ? 110 : wid === 'smg' ? 170 : 200;
    if (!los) pref = 0;
    let moved = false;
    if (d > pref + 26) moved = moveToward(p, ang, sp, dt);
    else if (d < pref - 60 && pref > 0) moved = moveToward(p, ang + Math.PI, sp * 0.6, dt);
    if (!moved) p.walk += 0;
    if (p.kind === 'cop' && d > 650 && P.car) { p.farT = (p.farT || 0) + dt; if (p.farT > 6) p.dead = true; } else p.farT = 0;
    if (!wasIn) return;
    if (wid === 'bat') {
      if (d < 30 && p.fireT <= 0) { p.fireT = 0.75; p.punchT = 0.35; G.snd.swing(); hurtPlayer(S, 11, p.x, p.y); }
    } else if (!arrest && los && d < (WEAPONS[wid].range + 40) && p.fireT <= 0 && p.react <= 0) enemyFire(S, p, tg, ang);
  }

  function guardPed(S, p, dt) {
    const P = S.player, tg = P.car || P;
    p.walk = 0;
    const d = Math.hypot(tg.x - p.x, tg.y - p.y);
    p.h += wrap(Math.atan2(tg.y - p.y, tg.x - p.x) + Math.PI / 2 - p.h) * Math.min(1, 2 * dt) * (d < 420 ? 1 : 0);
    if (S.thugAlert || (d < 300 && G.ai.lineClear(p.x, p.y, tg.x, tg.y)) || (S.time - S.lastShot < 1.2 && d < 600)) { p.state = 'fight'; p.react = rand(0.25, 0.7); S.thugAlert = true; }
  }

  // devolve true quando o pedestre foi tratado aqui
  function updatePed(p, dt, S) {
    if (p.script) return true;
    if (p.flashT > 0) p.flashT -= dt;
    if (p.state === 'dead') {
      p.corpseT = (p.corpseT || 0) + dt; p.pool = Math.min(1, p.corpseT / 3.5);
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      if (!W.isSolid(nx, p.y)) p.x = nx; else p.vx = 0;
      if (!W.isSolid(p.x, ny)) p.y = ny; else p.vy = 0;
      p.vx *= 0.9; p.vy *= 0.9;
      if (p.corpseT > 80) p.dead = true;
      return true;
    }
    if (p.state === 'down') {
      p.downT += dt;
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      if (!W.isSolid(nx, p.y)) p.x = nx; else p.vx = 0;
      if (!W.isSolid(p.x, ny)) p.y = ny; else p.vy = 0;
      p.vx *= 0.9; p.vy *= 0.9;
      if (p.downT > 1.6) { if (p.armed || p.kind !== 'civ') { p.state = 'fight'; p.react = 0.4; } else { p.state = 'flee'; p.fleeT = rand(3, 5); p.threat = p.threat || { x: S.player.x, y: S.player.y }; } }
      return true;
    }
    if (p.punchT > 0) p.punchT -= dt;
    if (p.state === 'guard') { guardPed(S, p, dt); return true; }
    if (p.state === 'fight') { fightPed(S, p, dt); return true; }
    if (p.vx || p.vy) { // empurrão de tiro / pancada
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      if (!W.isSolid(nx, p.y)) p.x = nx; if (!W.isSolid(p.x, ny)) p.y = ny;
      p.vx *= 0.85; p.vy *= 0.85; if (Math.abs(p.vx) + Math.abs(p.vy) < 4) p.vx = p.vy = 0;
    }
    return false;
  }

  // ---------- Polícia a pé e tiros das viaturas ----------
  function makeCop(S, x, y, lvl) {
    const swat = lvl >= 4;
    const p = G.ai.makePed(x, y);
    Object.assign(p, {
      kind: 'cop', hp: swat ? 120 : 70, weapon: swat ? (lvl >= 5 ? 'shotgun' : 'smg') : 'pistol', armed: true,
      shirt: swat ? '#15171c' : '#1c2f6b', cap: swat ? 'swat' : 'cop', state: 'fight', react: rand(0.5, 1.1), fireT: rand(0.4, 1), vx: 0, vy: 0,
    });
    S.peds.push(p); return p;
  }
  const copCount = S => S.peds.reduce((n, p) => n + (p.kind === 'cop' && p.state !== 'dead' && !p.dead ? 1 : 0), 0);

  function dismount(S, c, lvl) {
    const n = lvl >= 3 ? 2 : 1, CW = G.sprites.CAR_W;
    for (let k = 0; k < n; k++) {
      const side = k % 2 === 0 ? 1 : -1;
      let x = c.x + Math.cos(c.a) * side * (CW / 2 + 14), y = c.y + Math.sin(c.a) * side * (CW / 2 + 14);
      if (!walkable(x, y)) { x = c.x; y = c.y; }
      makeCop(S, x, y, lvl);
    }
    c.mode = 'parked'; c.driver = 'none'; c.thr = 0; c.steer = 0; c.hb = true; c.nav = null;
  }

  function roadblockCops(S, cars) {
    const lvl = Math.max(3, S.heatLevel);
    cars.forEach(c => {
      if (copCount(S) >= 7) return;
      const x = c.x + rand(-26, 26), y = c.y + rand(-26, 26);
      makeCop(S, walkable(x, y) ? x : c.x, walkable(x, y) ? y : c.y, lvl);
    });
  }

  function copLogic(S, dt) {
    const P = S.player, tg = P.car || P, lvl = S.heatLevel;
    if (lvl === 0) {
      S.copHostile = false;
      for (const p of S.peds) if (p.kind === 'cop' && p.state === 'fight') { p.state = 'walk'; p.arresting = false; }
      return;
    }
    let cops = copCount(S);
    const slow = P.car ? P.car.speed < 110 : true;
    for (const c of S.cars) {
      if (c.kind !== 'police' || c.mode !== 'chase' || c.driver !== 'ai' || c.dead) continue;
      const d = Math.hypot(tg.x - c.x, tg.y - c.y);
      c.fireT = (c.fireT || 0) - dt;
      if (d < 240 && slow && cops < 5 && S.mode === 'play') { dismount(S, c, lvl); cops += lvl >= 3 ? 2 : 1; continue; }
      if (lvl >= 3 && d < 460 && d > 70 && c.fireT <= 0 && S.mode === 'play' && G.ai.lineClear(c.x, c.y, tg.x, tg.y)) {
        const ang = Math.atan2(tg.y + (tg.vy || 0) * 0.3 - c.y, tg.x + (tg.vx || 0) * 0.3 - c.x) + rand(-0.17, 0.17);
        fireBullet(S, { x: c.x + Math.cos(ang) * 30, y: c.y + Math.sin(ang) * 30, a: ang, speed: 640, dmg: 6, own: 'cop', range: 560, car: c });
        flash(c.x + Math.cos(ang) * 30, c.y + Math.sin(ang) * 30);
        G.snd.gun('pistol', vol(S, c.x, c.y)); c.fireT = rand(0.5, 0.95);
      }
    }
    const h = S.heli;
    if (h && lvl >= 5 && S.mode === 'play') {
      h.fireT = (h.fireT || 0) - dt;
      const d = Math.hypot(tg.x - h.x, tg.y - h.y);
      if (d < 560 && h.fireT <= 0) {
        const ang = Math.atan2(tg.y - h.y, tg.x - h.x) + rand(-0.2, 0.2);
        fireBullet(S, { x: h.x, y: h.y, a: ang, speed: 700, dmg: 4, own: 'cop', range: 620 });
        G.snd.gun('smg', vol(S, h.x, h.y) * 0.8); h.fireT = 0.2;
      }
    }
  }

  // ---------- Atualização geral ----------
  function update(S, dt) {
    const P = S.player;
    if (S.hurtT > 0) S.hurtT -= dt;
    if (S.mode === 'play') {
      if (P.hp < S.lastHp - 0.4 && S.hurtT <= 0) { S.hurtT = 0.3; if (!P.car && P.hp > 0) spray(S, P.x, P.y, rand(0, TAU), 4, 140); }
      S.lastHp = P.hp;
      copLogic(S, dt);
    } else S.lastHp = 100;
    updateBullets(S, dt);
    updateGrenades(S, dt);
    updatePickups(S, dt);
    updateSkids(S, dt);
    for (const d of S.decals) d.t += dt;

    let bodies = S.peds.filter(p => p.state === 'dead' && !p.dead);

  }

  // ---------- Desenho ----------
  function drawDecals(ctx, S, inV) {
    for (const s of S.skids) {
      if (!inV({ x: s.x1, y: s.y1 })) continue;
      ctx.strokeStyle = 'rgba(8,6,14,' + (0.42 * (1 - s.t / 45)).toFixed(3) + ')'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    }
    for (const d of S.decals) {
      if (!inV(d)) continue;
      if (d.kind === 'scorch') {
        ctx.fillStyle = 'rgba(10,8,8,0.30)'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(6,5,5,0.35)'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.6, 0, TAU); ctx.fill();
        continue;
      }
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot); ctx.globalAlpha = d.t < 25 ? 0.95 : 0.85;

    }
    ctx.lineCap = 'butt';
  }
  function drawPickups(ctx, S, inV, time) {
    for (const k of S.pickups) {
      if (!inV(k)) continue;
      const bob = Math.sin(time * 4 + k.x) * 1.5;
      ctx.save(); ctx.translate(k.x, k.y);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(2, 5, 8, 4, 0, 0, TAU); ctx.fill();
      ctx.translate(0, bob - 3);
      if (k.type === 'cash') { ctx.fillStyle = '#3fbf4d'; ctx.fillRect(-8, -5, 16, 10); ctx.strokeStyle = '#0a3a10'; ctx.lineWidth = 1.5; ctx.strokeRect(-8, -5, 16, 10); ctx.fillStyle = '#eaffea'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('$', 0, 3); }
      else if (k.type === 'gun') { ctx.fillStyle = 'rgba(255,230,120,0.35)'; ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.fill(); ctx.fillStyle = '#16181c'; ctx.fillRect(-7, -2, 12, 4); ctx.fillRect(-5, 1, 4, 6); ctx.fillStyle = '#8a8f99'; ctx.fillRect(3, -2, 5, 2); }
      else if (k.type === 'armor') { ctx.fillStyle = '#3a78d8'; ctx.beginPath(); ctx.moveTo(-8, -7); ctx.lineTo(8, -7); ctx.lineTo(8, 1); ctx.quadraticCurveTo(8, 8, 0, 10); ctx.quadraticCurveTo(-8, 8, -8, 1); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke(); }
      else { ctx.fillStyle = '#fff'; ctx.fillRect(-8, -8, 16, 16); ctx.fillStyle = '#e03030'; ctx.fillRect(-2, -6, 4, 12); ctx.fillRect(-6, -2, 12, 4); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.strokeRect(-8, -8, 16, 16); }
      ctx.restore();
    }
  }
  function drawAir(ctx, S, inV) {
    for (const g of S.grenades) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(g.x + 3, g.y + 4, 5, 3, 0, 0, TAU); ctx.fill();
      ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.spin); ctx.fillStyle = '#3f5a2a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#c9c9c9'; ctx.fillRect(-1, -6, 2, 3); ctx.restore();
    }
    for (const b of S.bullets) {
      if (!inV(b)) continue;
      const enemy = b.own !== 'player';
      ctx.strokeStyle = enemy ? 'rgba(255,170,140,0.95)' : 'rgba(255,236,150,0.95)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      const l = Math.hypot(b.vx, b.vy) || 1;
      ctx.beginPath(); ctx.moveTo(b.x - b.vx / l * 13, b.y - b.vy / l * 13); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }
  function drawScreen(ctx, S) {
    const P = S.player;
    let a = 0;
    if (S.hurtT > 0) a = Math.max(a, S.hurtT / 0.3 * 0.45);
    if (P.hp < 35 && P.hp > 0 && S.mode === 'play') a = Math.max(a, 0.18 + 0.12 * Math.sin(S.time * 7));
    if (a <= 0) return;
    const g = ctx.createRadialGradient(400, 300, 200, 400, 300, 520);
    g.addColorStop(0, 'rgba(160,0,0,0)'); g.addColorStop(1, 'rgba(160,0,0,' + a.toFixed(3) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 800, 600);
  }

  // ---------- Loja de armas ----------
  const PRICE_AMMO = { pistol: 36, smg: 90, shotgun: 16 };
  const ITEMS = [
    { k: 'Digit1', n: 'Taco de beisebol', p: 60, own: 'bat', f: S => giveWeapon(S, 'bat', 0) },
    { k: 'Digit2', n: 'Pistola (+36 balas)', p: 150, own: 'pistol', f: S => giveWeapon(S, 'pistol', 36) },
    { k: 'Digit3', n: 'Submetralhadora (+90 balas)', p: 450, own: 'smg', f: S => giveWeapon(S, 'smg', 90) },
    { k: 'Digit4', n: 'Escopeta (+16 cartuchos)', p: 600, own: 'shotgun', f: S => giveWeapon(S, 'shotgun', 16) },
    { k: 'Digit5', n: 'Granadas (x4)', p: 160, f: S => giveWeapon(S, 'grenade', 4) },
    { k: 'Digit6', n: 'Munição para as armas que você tem', p: 120, f: S => { const a = arms(S); let any = false; Object.keys(PRICE_AMMO).forEach(id => { if (a.own[id]) { a.ammo[id] = Math.min(MAX_AMMO, (a.ammo[id] || 0) + PRICE_AMMO[id]); any = true; } }); if (!any) return false; G.save(); G.say('Munição reabastecida.', 2); } },
    { k: 'Digit7', n: 'Colete à prova de balas', p: 250, f: S => { if (S.player.armor >= 100) return false; S.player.armor = 100; G.say('Colete vestido.', 2); } },
  ];
  function shopKey(S, code) { // retorna true se fechou a loja
    if (code === 'Escape' || code === 'KeyE' || code === 'Enter') return true;
    const it = ITEMS.find(i => i.k === code); if (!it) return false;
    const a = arms(S);
    if (it.own && a.own[it.own] && it.own !== 'pistol' && it.own !== 'smg' && it.own !== 'shotgun') { G.say('Você já tem isso.', 2); return false; }
    if (S.save.money < it.p) { G.say('Dinheiro insuficiente ($' + it.p + ').', 2); G.snd.fail(); return false; }
    if (it.f(S) === false) { G.say('Você não precisa disso agora.', 2); return false; }
    S.save.money -= it.p; G.save(); G.snd.cash();
    return false;
  }
  function drawShop(ctx, S) {
    const H = G.hud, a = arms(S);
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, 800, 600);
    ctx.fillStyle = '#1b1322'; ctx.fillRect(110, 80, 580, 440); ctx.strokeStyle = '#ff4fd8'; ctx.lineWidth = 4; ctx.strokeRect(110, 80, 580, 440);
    H.txt(ctx, 'LOJA DE ARMAS', 400, 130, 38, '#ff4fd8', 'center');
    H.txt(ctx, 'Seu dinheiro: $' + S.save.money, 400, 162, 20, '#3fdc4a', 'center');
    ITEMS.forEach((it, i) => {
      const y = 212 + i * 40, own = it.own && a.own[it.own];
      H.txt(ctx, '[' + (i + 1) + ']', 140, y, 20, '#ffe04a');
      H.txt(ctx, it.n, 190, y, 19, own && !PRICE_AMMO[it.own] ? '#8a8a8a' : '#fff');
      H.txt(ctx, own && !PRICE_AMMO[it.own] ? 'TEM' : '$' + it.p, 660, y, 19, S.save.money >= it.p ? '#3fdc4a' : '#ff6b6b', 'right');
    });
    const cur = WEAPONS[S.player.weapon];
    H.txt(ctx, 'Arma atual: ' + cur.name + (usesAmmo(cur) ? '  •  munição ' + ammoOf(S, cur.id) : ''), 400, 488, 15, '#bbb', 'center');
    H.txt(ctx, 'Aperte o número para comprar • Esc ou E para sair', 400, 510, 13, '#888', 'center');
  }

  G.combat = {
    WEAPONS, ORDER, reset, arms, ammoOf, giveWeapon, select, cycle, confiscate, playerUpdate, update, updatePed,
    hurtPed, killPed, hurtPlayer, carHit, blast, scorch, spray, addDecal, fireBullet, noise, copNear, roadblockCops, makeCop, drop,
    drawDecals, drawPickups, drawAir, drawScreen, drawShop, shopKey, blobSprite,
  };
})(window.G = window.G || {});
