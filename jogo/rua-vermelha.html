<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rua Vermelha — jogo de mundo aberto estilo GTA antigo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0814; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #000; image-rendering: auto; box-shadow: 0 0 40px rgba(0,0,0,.8); }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
/* ==== world.js ==== */
/* ============================================================
   world.js — o mapa da cidade (tiles, prédios, parques, rio)
   e o desenho do cenário no estilo GTA 1 / GTA 2.
   Tudo é desenhado por código; o cenário é "fotografado" em
   pedaços (chunks) uma vez só para o jogo ficar leve.
   ============================================================ */
(function (G) {
  'use strict';

  // ---------- Medidas do mapa ----------
  const T = 32;          // tamanho de um tile em pixels
  const ROAD = 6;        // largura da rua (tiles) = 2 faixas de 3 tiles
  const BLOCK = 12;      // lado de uma quadra (tiles)
  const PITCH = ROAD + BLOCK;
  const COLS = 6, ROWS = 4;  // quadras na horizontal / vertical
  const RIVER = 3;       // coluna de quadras ocupada pelo rio
  const MG = 6;          // margem fora das ruas (calçada + prédios)
  const INNER_W = COLS * PITCH + ROAD;
  const INNER_H = ROWS * PITCH + ROAD;
  const TW = INNER_W + MG * 2, TH = INNER_H + MG * 2;
  const W = TW * T, H = TH * T;

  // tipos de tile
  const TILE = { ROAD: 0, SIDE: 1, BUILD: 2, GRASS: 3, WATER: 4, BRIDGE: 5, CROSS: 6 };

  const tiles = new Uint8Array(TW * TH).fill(TILE.BUILD);
  const setRect = (tx, ty, tw, th, type) => {
    for (let y = ty; y < ty + th; y++) for (let x = tx; x < tx + tw; x++) tiles[y * TW + x] = type;
  };

  // ---------- Aleatório com semente (a cidade é sempre a mesma) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(19970101);

  // ---------- Coordenadas úteis ----------
  const roadLeft = i => (MG + i * PITCH) * T;           // x da borda esquerda da rua vertical i
  const roadTop = j => (MG + j * PITCH) * T;            // y da borda de cima da rua horizontal j
  const nodeX = i => (MG + i * PITCH + ROAD / 2) * T;   // centro do cruzamento
  const nodeY = j => (MG + j * PITCH + ROAD / 2) * T;
  // faixas (mão direita, como no Brasil)
  const laneV = (i, dir) => roadLeft(i) + (dir > 0 ? 1.5 : 4.5) * T;  // dir>0 = descendo
  const laneH = (j, dir) => roadTop(j) + (dir > 0 ? 4.5 : 1.5) * T;   // dir>0 = indo p/ direita

  // ---------- Estilos de telhado ----------
  const ROOFS = [
    { kind: 'flat', base: '#7b5b3f', edge: '#a58665', dark: '#5a412d' },
    { kind: 'flat', base: '#8d8d98', edge: '#b9b9c4', dark: '#6b6b77' },
    { kind: 'flat', base: '#c7b38b', edge: '#e4d5b0', dark: '#a4906a' },
    { kind: 'tile', base: '#d9782d', edge: '#f39c52', dark: '#b05713' },
    { kind: 'tile', base: '#b5382b', edge: '#da5d4c', dark: '#89231a' },
    { kind: 'tile', base: '#4a7cb3', edge: '#6b9dd2', dark: '#33587f' },
    { kind: 'tile', base: '#c4622e', edge: '#e5844f', dark: '#9b4519' },
    { kind: 'flat', base: '#6d7d6b', edge: '#93a590', dark: '#506050' },
  ];

  const buildings = [];
  const trees = [];
  const lamps = [];
  const ponds = [];
  const blocks = [];

  function addBuilding(x, y, w, h, forceRoof) {
    const p = ROOFS[forceRoof != null ? forceRoof : Math.floor(rnd() * ROOFS.length)];
    const b = { x, y, w, h, p, ridge: w >= h ? 'h' : 'v', det: [] };
    if (p.kind === 'flat') {
      const n = 1 + Math.floor(rnd() * 3);
      for (let k = 0; k < n; k++) {
        b.det.push({ fx: 0.2 + rnd() * 0.6, fy: 0.2 + rnd() * 0.6, t: ['ac', 'sky', 'tank', 'ac'][Math.floor(rnd() * 4)] });
      }
    } else if (rnd() < 0.5) {
      b.det.push({ fx: 0.25 + rnd() * 0.5, fy: 0.3 + rnd() * 0.4, t: 'chim' });
    }
    buildings.push(b);
  }

  // divide uma área (em tiles) em prédios
  function partition(tx, ty, tw, th) {
    const r = rnd();
    const add = (a, b, c, d) => addBuilding(a * T + 5, b * T + 5, c * T - 10, d * T - 10);
    if (r < 0.2) add(tx, ty, tw, th);
    else if (r < 0.4) { add(tx, ty, tw / 2, th); add(tx + tw / 2, ty, tw / 2, th); }
    else if (r < 0.6) { add(tx, ty, tw, th / 2); add(tx, ty + th / 2, tw, th / 2); }
    else if (r < 0.8) { add(tx, ty, tw / 2, th / 2); add(tx + tw / 2, ty, tw / 2, th / 2); add(tx, ty + th / 2, tw / 2, th / 2); add(tx + tw / 2, ty + th / 2, tw / 2, th / 2); }
    else { add(tx, ty, tw, th / 2); add(tx, ty + th / 2, tw / 2, th / 2); add(tx + tw / 2, ty + th / 2, tw / 2, th / 2); }
  }

  // ---------- Montagem do mapa ----------
  // calçada em volta de tudo + ruas
  setRect(MG - 2, MG - 2, INNER_W + 4, INNER_H + 4, TILE.SIDE);
  setRect(MG, MG, INNER_W, INNER_H, TILE.ROAD);

  const PARKS = [[1, 1], [5, 3]];
  for (let by = 0; by < ROWS; by++) {
    for (let bx = 0; bx < COLS; bx++) {
      const tx = MG + ROAD + bx * PITCH, ty = MG + ROAD + by * PITCH;
      let kind = 'city';
      if (bx === RIVER) kind = 'river';
      else if (PARKS.some(p => p[0] === bx && p[1] === by)) kind = 'park';
      const blk = { bx, by, tx, ty, x: tx * T, y: ty * T, w: BLOCK * T, h: BLOCK * T, kind };
      blocks.push(blk);
      if (kind === 'river') {
        setRect(tx, ty, BLOCK, BLOCK, TILE.WATER);
      } else {
        setRect(tx, ty, BLOCK, BLOCK, TILE.SIDE);
        if (kind === 'city') {
          setRect(tx + 2, ty + 2, 8, 8, TILE.BUILD);
          partition(tx + 2, ty + 2, 8, 8);
        } else {
          setRect(tx + 2, ty + 2, 8, 8, TILE.GRASS);
          // lago
          const cx = tx + 6, cy = ty + 6;
          for (let y = ty + 2; y < ty + 10; y++) for (let x = tx + 2; x < tx + 10; x++) {
            const dx = (x + 0.5 - cx) / 2.6, dy = (y + 0.5 - cy) / 2.0;
            if (dx * dx + dy * dy <= 1) tiles[y * TW + x] = TILE.WATER;
          }
          ponds.push({ x: cx * T, y: cy * T, rx: 2.6 * T, ry: 2.0 * T });
          // árvores nos cantos do parque
          const tp = [[2.9, 2.9], [9.1, 2.9], [2.9, 9.1], [9.1, 9.1], [6, 2.7], [6, 9.3]];
          tp.forEach(([a, b]) => trees.push({ x: (tx + a) * T, y: (ty + b) * T, r: 22 + rnd() * 6 }));
        }
      }
    }
  }
  // pontes e faixas de pedestre
  const rv = blocks.find(b => b.kind === 'river');
  for (let j = 0; j <= ROWS; j++) setRect(rv.tx, MG + j * PITCH, BLOCK, ROAD, TILE.BRIDGE);
  const crossings = [];
  for (let i = 0; i <= COLS; i++) for (let j = 0; j <= ROWS; j++) {
    const x0 = MG + i * PITCH, y0 = MG + j * PITCH;
    const set = (tx, ty, w, h) => {
      for (let y = ty; y < ty + h; y++) for (let x = tx; x < tx + w; x++) {
        const t = tiles[y * TW + x]; if (t === TILE.ROAD || t === TILE.BRIDGE) tiles[y * TW + x] = TILE.CROSS;
      }
    };
    if (j > 0) { set(x0, y0 - 1, ROAD, 1); crossings.push({ x: x0, y: y0 - 1, w: ROAD, h: 1, dir: 'h' }); }
    if (j < ROWS) { set(x0, y0 + ROAD, ROAD, 1); crossings.push({ x: x0, y: y0 + ROAD, w: ROAD, h: 1, dir: 'h' }); }
    if (i > 0) { set(x0 - 1, y0, 1, ROAD); crossings.push({ x: x0 - 1, y: y0, w: 1, h: ROAD, dir: 'v' }); }
    if (i < COLS) { set(x0 + ROAD, y0, 1, ROAD); crossings.push({ x: x0 + ROAD, y: y0, w: 1, h: ROAD, dir: 'v' }); }
  }
  // prédios da borda do mapa
  (function rim() {
    const d = 4; // tiles de prédio
    let x = 0;
    while (x < TW) { const w = Math.min(5 + Math.floor(rnd() * 5), TW - x); addBuilding(x * T + 4, 4, w * T - 8, d * T - 8); addBuilding(x * T + 4, (TH - d) * T + 4, w * T - 8, d * T - 8); x += w; }
    let y = d;
    while (y < TH - d) { const h = Math.min(5 + Math.floor(rnd() * 5), TH - d - y); addBuilding(4, y * T + 4, d * T - 8, h * T - 8); addBuilding((TW - d) * T + 4, y * T + 4, d * T - 8, h * T - 8); y += h; }
  })();
  // postes de luz nos cantos dos cruzamentos
  for (let i = 0; i <= COLS; i++) for (let j = 0; j <= ROWS; j++) {
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {
      const x = nodeX(i) + sx * (ROAD / 2 * T + 16), y = nodeY(j) + sy * (ROAD / 2 * T + 16);
      const t = tiles[Math.floor(y / T) * TW + Math.floor(x / T)];
      if (t === TILE.SIDE) lamps.push({ x, y });
    });
  }

  // ---------- Consultas ----------
  function tileAt(px, py) {
    const tx = Math.floor(px / T), ty = Math.floor(py / T);
    if (tx < 0 || ty < 0 || tx >= TW || ty >= TH) return TILE.BUILD;
    return tiles[ty * TW + tx];
  }
  const isSolid = (px, py) => { const t = tileAt(px, py); return t === TILE.BUILD || t === TILE.WATER; };
  function treeHit(px, py, pad) {
    for (let k = 0; k < trees.length; k++) {
      const t = trees[k], dx = px - t.x, dy = py - t.y, rr = t.r * 0.55 + (pad || 0);
      if (dx * dx + dy * dy < rr * rr) return true;
    }
    return false;
  }
  const isRoadTile = t => t === TILE.ROAD || t === TILE.BRIDGE || t === TILE.CROSS;
  const pedWalkable = t => t === TILE.SIDE || t === TILE.CROSS || t === TILE.GRASS;

  // ---------- Desenho ----------
  const tex = {};
  function makeNoise(base, n, light, dark, size) {
    const c = document.createElement('canvas'); c.width = c.height = size || 128;
    const x = c.getContext('2d'); x.fillStyle = base; x.fillRect(0, 0, c.width, c.height);
    const r = mulberry32(base.length * 977 + n);
    for (let k = 0; k < n; k++) {
      x.fillStyle = r() < 0.5 ? light : dark;
      x.fillRect(Math.floor(r() * c.width), Math.floor(r() * c.height), 1 + (r() < 0.2 ? 1 : 0), 1);
    }
    return c;
  }
  function makeTextures() {
    tex.asphalt = makeNoise('#6b6090', 2600, 'rgba(255,255,255,0.05)', 'rgba(0,0,0,0.07)');
    tex.rim = makeNoise('#3b3442', 1200, 'rgba(255,255,255,0.04)', 'rgba(0,0,0,0.12)');
    tex.grass = makeNoise('#4d9a3a', 2200, 'rgba(190,255,150,0.16)', 'rgba(0,50,0,0.18)');
    tex.water = makeNoise('#21407e', 1500, 'rgba(140,190,255,0.14)', 'rgba(0,0,30,0.2)', 128);
    tex.alley = makeNoise('#59505f', 700, 'rgba(255,255,255,0.04)', 'rgba(0,0,0,0.12)');
  }

  function rrect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  function drawRoof(ctx, b) {
    const { x, y, w, h, p } = b;
    ctx.fillStyle = p.dark; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = p.edge; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    ctx.fillStyle = p.base; ctx.fillRect(x + 6, y + 6, w - 12, h - 12);
    if (p.kind === 'tile') {
      // telhas: listras + cumeeira
      ctx.save(); ctx.beginPath(); ctx.rect(x + 6, y + 6, w - 12, h - 12); ctx.clip();
      const step = 9;
      if (b.ridge === 'h') {
        for (let yy = y + 6; yy < y + h - 6; yy += step) { ctx.fillStyle = 'rgba(0,0,0,0.13)'; ctx.fillRect(x + 6, yy + step - 2, w - 12, 2); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(x + 6, yy, w - 12, 2); }
        ctx.fillStyle = p.edge; ctx.fillRect(x + 6, y + h / 2 - 3, w - 12, 6);
        ctx.fillStyle = p.dark; ctx.fillRect(x + 6, y + h / 2 + 3, w - 12, 2);
      } else {
        for (let xx = x + 6; xx < x + w - 6; xx += step) { ctx.fillStyle = 'rgba(0,0,0,0.13)'; ctx.fillRect(xx + step - 2, y + 6, 2, h - 12); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(xx, y + 6, 2, h - 12); }
        ctx.fillStyle = p.edge; ctx.fillRect(x + w / 2 - 3, y + 6, 6, h - 12);
        ctx.fillStyle = p.dark; ctx.fillRect(x + w / 2 + 3, y + 6, 2, h - 12);
      }
      ctx.restore();
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.fillRect(x + 6, y + h - 12, w - 12, 6);
      ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1; ctx.strokeRect(x + 10.5, y + 10.5, w - 21, h - 21);
    }
    b.det.forEach(d => {
      const dx = x + 12 + d.fx * (w - 40), dy = y + 12 + d.fy * (h - 40);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(dx + 4, dy + 4, 18, 18);
      if (d.t === 'ac') { ctx.fillStyle = '#c9ccd2'; ctx.fillRect(dx, dy, 18, 18); ctx.fillStyle = '#7b7f88'; ctx.beginPath(); ctx.arc(dx + 9, dy + 9, 6, 0, 7); ctx.fill(); ctx.fillStyle = '#3a3d44'; ctx.beginPath(); ctx.arc(dx + 9, dy + 9, 3, 0, 7); ctx.fill(); }
      else if (d.t === 'sky') { ctx.fillStyle = '#9dc4d8'; ctx.fillRect(dx, dy, 20, 14); ctx.strokeStyle = '#e8f3f8'; ctx.lineWidth = 2; ctx.strokeRect(dx + 1, dy + 1, 18, 12); }
      else if (d.t === 'tank') { ctx.fillStyle = '#d8d8d8'; ctx.beginPath(); ctx.arc(dx + 10, dy + 10, 10, 0, 7); ctx.fill(); ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 2; ctx.stroke(); }
      else { ctx.fillStyle = '#8a4a3a'; ctx.fillRect(dx, dy, 12, 12); ctx.fillStyle = '#2a1a1a'; ctx.fillRect(dx + 3, dy + 3, 6, 6); }
    });
  }

  function drawBlockGround(ctx, blk) {
    const { x, y, w, h, kind } = blk;
    if (kind === 'river') {
      ctx.fillStyle = ctx.createPattern(tex.water, 'repeat'); ctx.fillRect(x, y, w, h);
      // reflexos
      ctx.fillStyle = 'rgba(180,220,255,0.10)';
      for (let k = 0; k < 40; k++) { const rx = x + ((k * 97) % w), ry = y + ((k * 61) % h); ctx.fillRect(rx, ry, 18, 2); }
      // margens de pedra
      ctx.fillStyle = '#3d4a3b'; ctx.fillRect(x, y, 10, h); ctx.fillRect(x + w - 10, y, 10, h);
      ctx.fillStyle = '#6f7d6a'; ctx.fillRect(x + 8, y, 3, h); ctx.fillRect(x + w - 11, y, 3, h);
      return;
    }
    // calçada com cantos arredondados
    ctx.save();
    rrect(ctx, x - 4, y - 4, w + 8, h + 8, 46); ctx.fillStyle = '#9d92c4'; ctx.fill(); // brilho lilás da rua
    rrect(ctx, x, y, w, h, 44); ctx.fillStyle = '#ece1a2'; ctx.fill();
    ctx.clip();
    ctx.strokeStyle = 'rgba(150,130,70,0.45)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let gx = x; gx <= x + w; gx += T) { ctx.moveTo(gx + 0.5, y); ctx.lineTo(gx + 0.5, y + h); }
    for (let gy = y; gy <= y + h; gy += T) { ctx.moveTo(x, gy + 0.5); ctx.lineTo(x + w, gy + 0.5); }
    ctx.stroke();
    // variação de cor nas lajotas
    const r = mulberry32(blk.bx * 31 + blk.by * 17 + 5);
    for (let k = 0; k < 40; k++) { ctx.fillStyle = r() < 0.5 ? 'rgba(255,255,255,0.12)' : 'rgba(120,90,40,0.10)'; ctx.fillRect(x + Math.floor(r() * 12) * T + 1, y + Math.floor(r() * 12) * T + 1, T - 2, T - 2); }
    ctx.restore();
    // meio-fio branco
    rrect(ctx, x + 2, y + 2, w - 4, h - 4, 42); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5; ctx.stroke();
    rrect(ctx, x + 6, y + 6, w - 12, h - 12, 38); ctx.strokeStyle = 'rgba(120,100,50,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();

    if (kind === 'city') {
      // "beco" escuro debaixo dos prédios
      ctx.fillStyle = ctx.createPattern(tex.alley, 'repeat'); ctx.fillRect(x + 2 * T, y + 2 * T, 8 * T, 8 * T);
    } else if (kind === 'park') {
      const gx = x + 2 * T, gy = y + 2 * T;
      rrect(ctx, gx, gy, 8 * T, 8 * T, 14); ctx.fillStyle = ctx.createPattern(tex.grass, 'repeat'); ctx.fill();
      ctx.strokeStyle = '#2f6b26'; ctx.lineWidth = 3; ctx.stroke();
      // caminhos de terra
      ctx.strokeStyle = '#b89a62'; ctx.lineWidth = 16; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(gx + 12, gy + 4 * T); ctx.lineTo(gx + 8 * T - 12, gy + 4 * T); ctx.moveTo(gx + 4 * T, gy + 12); ctx.lineTo(gx + 4 * T, gy + 8 * T - 12); ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(gx + 12, gy + 4 * T + 8); ctx.lineTo(gx + 8 * T - 12, gy + 4 * T + 8); ctx.stroke();
      ctx.lineCap = 'butt';
      ponds.forEach(p => {
        if (p.x < x || p.x > x + w || p.y < y || p.y > y + h) return;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.rx + 8, p.ry + 8, 0, 0, 7); ctx.fillStyle = '#7d8a6a'; ctx.fill();
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, 7); ctx.fillStyle = ctx.createPattern(tex.water, 'repeat'); ctx.fill();
        ctx.beginPath(); ctx.ellipse(p.x - 6, p.y - 4, p.rx * 0.6, p.ry * 0.5, 0, 0, 7); ctx.fillStyle = 'rgba(120,180,255,0.18)'; ctx.fill();
      });
      // bancos
      ctx.fillStyle = '#6b4a2a';
      [[gx + 30, gy + 4 * T - 26], [gx + 8 * T - 54, gy + 4 * T + 14], [gx + 4 * T + 14, gy + 30], [gx + 4 * T - 26, gy + 8 * T - 54]].forEach(([bx, by]) => { ctx.fillRect(bx, by, 24, 8); ctx.fillStyle = '#4a321c'; ctx.fillRect(bx, by + 6, 24, 2); ctx.fillStyle = '#6b4a2a'; });
    }
  }

  function drawTree(ctx, t) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(t.x + 9, t.y + 11, t.r, t.r * 0.92, 0, 0, 7); ctx.fill();
    const g = ctx.createRadialGradient(t.x - t.r * 0.3, t.y - t.r * 0.3, 2, t.x, t.y, t.r);
    g.addColorStop(0, '#6fc24b'); g.addColorStop(0.6, '#2f8a2a'); g.addColorStop(1, '#1b5a1d');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#123f14'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(200,255,150,0.25)';
    for (let k = 0; k < 5; k++) { const a = k * 1.3 + t.x; ctx.beginPath(); ctx.arc(t.x + Math.cos(a) * t.r * 0.45, t.y + Math.sin(a) * t.r * 0.45, t.r * 0.2, 0, 7); ctx.fill(); }
  }

  function drawStatic(ctx, x0, y0, x1, y1) {
    const hit = (x, y, w, h) => x < x1 && x + w > x0 && y < y1 && y + h > y0;
    // 1) fundo (borda da cidade)
    ctx.fillStyle = ctx.createPattern(tex.rim, 'repeat'); ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    // calçada externa
    const ox = (MG - 2) * T, oy = (MG - 2) * T, ow = (INNER_W + 4) * T, oh = (INNER_H + 4) * T;
    if (hit(ox, oy, ow, oh)) {
      rrect(ctx, ox, oy, ow, oh, 60); ctx.fillStyle = '#ece1a2'; ctx.fill();
      ctx.save(); rrect(ctx, ox, oy, ow, oh, 60); ctx.clip();
      ctx.strokeStyle = 'rgba(150,130,70,0.45)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let gx = ox; gx <= ox + ow; gx += T) { ctx.moveTo(gx + 0.5, oy); ctx.lineTo(gx + 0.5, oy + oh); }
      for (let gy = oy; gy <= oy + oh; gy += T) { ctx.moveTo(ox, gy + 0.5); ctx.lineTo(ox + ow, gy + 0.5); }
      ctx.stroke(); ctx.restore();
    }

    if (axis === 'v') { nav.ni = idx; nav.nj = clamp(n, 0, ROWS); } else { nav.nj = idx; nav.ni = clamp(n, 0, COLS); }
    return nav;
  }

  function chooseManeuver(car) {
    const n = car.nav, i = n.ni, j = n.nj, d = n.dir, opts = [];
    if (n.axis === 'v') {
      if (d > 0 ? j < ROWS : j > 0) opts.push({ k: 's', ni: i, nj: j + d });
      const rh = d > 0 ? -1 : 1;
      [[rh, 'r'], [-rh, 'l']].forEach(([hd, k]) => { if (hd > 0 ? i < COLS : i > 0) opts.push({ k, axis: 'h', dir: hd, ni: i + hd, nj: j, trig: W.laneH(j, hd) }); });
    } else {
      if (d > 0 ? i < COLS : i > 0) opts.push({ k: 's', ni: i + d, nj: j });
      const rv = d > 0 ? 1 : -1;
      [[rv, 'r'], [-rv, 'l']].forEach(([vd, k]) => { if (vd > 0 ? j < ROWS : j > 0) opts.push({ k, axis: 'v', dir: vd, ni: i, nj: j + vd, trig: W.laneV(i, vd) }); });
    }
    let m;
    if (n.mode === 'goto' && n.target) {
      let best = 1e9;
      opts.forEach(o => { const sc = Math.abs(o.ni - n.target.i) + Math.abs(o.nj - n.target.j) + Math.random() * 0.3; if (sc < best) { best = sc; m = o; } });
    } else {
      const wt = { s: 0.56, r: 0.22, l: 0.22 };
      let tot = 0; opts.forEach(o => tot += wt[o.k]);
      let r = Math.random() * tot;
      for (const o of opts) { r -= wt[o.k]; if (r <= 0) { m = o; break; } }
      if (!m) m = opts[0];
    }
    m = Object.assign({}, m);
    if (m.k === 's') m.trig = nodeCoord(n);
    return m;
  }
  function applyManeuver(car) {
    const n = car.nav, m = n.m;
    if (m.k === 's') { n.ni = m.ni; n.nj = m.nj; }
    else { n.axis = m.axis; n.dir = m.dir; n.idx = m.axis === 'v' ? n.ni : n.nj; n.ni = m.ni; n.nj = m.nj; }
    n.m = null;
  }

  function aheadGap(car, S, look) {
    const fx = car.fx, fy = car.fy, rx = Math.cos(car.a), ry = Math.sin(car.a);
    let best = 1e9;
    const test = (o, len, latMax) => {
      const dx = o.x - car.x, dy = o.y - car.y;
      if (dx > look + 120 || dx < -look - 120 || dy > look + 120 || dy < -look - 120) return;
      const al = dx * fx + dy * fy, lat = dx * rx + dy * ry;
      if (al > 10 && al < look + len && Math.abs(lat) < latMax) best = Math.min(best, al - len);
    };
    for (const o of S.cars) { if (o === car) continue; if (o.dead && car.stuckT > 5) continue; test(o, G.sprites.CAR_L * 0.55, 34); }
    for (const p of S.peds) if (p.state !== 'down') test(p, 14, 26);
    if (!S.player.car) test(S.player, 14, 26);
    return best;
  }

  function driveTraffic(car, dt, S) {
    const n = car.nav; if (!n) return;
    const pos = alongOf(n, car);
    const nc = nodeCoord(n);
    const toNode = (nc - pos) * n.dir;
    if (!n.m && toNode < 340) n.m = chooseManeuver(car);
    if (n.m && (pos - n.m.trig) * n.dir >= -(n.m.k === 's' ? 0 : n.m.k === 'r' ? 34 : 70)) applyManeuver(car);
    // ponto de mira
    const lc = laneCoord(n);
    const tx = n.axis === 'v' ? lc : car.x + n.dir * 150, ty = n.axis === 'v' ? car.y + n.dir * 150 : lc;
    const want = Math.atan2(tx - car.x, -(ty - car.y));
    let steer = clamp(wrap(want - car.a) * 2.6, -1, 1);
    // velocidade desejada
    let v = car.cruise;
    if (n.m && n.m.k !== 's' && toNode < 260) v = Math.min(v, n.m.k === 'l' ? 105 : 95);
    // semáforo
    if (!car.ignoreLights) {
      const stopAt = (nc - n.dir * (ROAD_HALF() + 14));
      const rem = (stopAt - pos) * n.dir;
      const st = lightState(n.axis, S.time);
      if (st !== 'g' && rem > -6 && rem < 260) {
        const brakeD = Math.max(0, rem - 6);
        if (st === 'r' || brakeD > car.vf * car.vf / 500) v = Math.min(v, Math.sqrt(2 * 240 * brakeD));
      }
    }
    // cruzamento: não invadir se estiver ocupado e ceder na conversão à esquerda
    if (toNode > 70 && toNode < 330 && !car.ignoreLights) {
      const nx = W.nodeX(n.ni), ny = W.nodeY(n.nj), hb = ROAD_HALF() + 6;
      let block = false;
      for (const o of S.cars) {
        if (o === car) continue;
        const ox = o.x - nx, oy = o.y - ny, dot = o.fx * car.fx + o.fy * car.fy;
        if (Math.abs(ox) < hb && Math.abs(oy) < hb) {
          if (toNode > hb - 12 && (Math.abs(dot) < 0.5 || (dot < -0.7 && n.m && n.m.k === 'l') || o.speed < 40)) { block = true; break; }
        } else if (n.m && n.m.k === 'l' && dot < -0.7 && o.speed > 40 && Math.hypot(ox, oy) < 330 && toNode < 260) {
          if (!(o.nav && o.nav.m && o.nav.m.k === 'l') || o.id < car.id) { block = true; break; }
        }
      }
      if (block) v = Math.min(v, Math.max(0, toNode - (ROAD_HALF() + 14)) * 1.7);
    }
    // carro / pessoa na frente
    const look = 70 + Math.max(0, car.vf) * 0.9;
    const gap = aheadGap(car, S, look);
    if (gap < 1e8) v = Math.min(v, Math.max(0, gap - 26) * 1.7);
    // controle
    const vf = car.vf, err = v - vf;
    car.hb = false;
    if (car.hold > 0) { car.hold -= dt; v = 0; }
    if (err > 8) car.thr = clamp(err / 45, 0.3, 1);
    else if (err < -14) car.thr = -clamp(-err / 60, 0.35, 1);
    else car.thr = 0;
    if (v < 4 && Math.abs(vf) < 40) { car.thr = 0; car.hb = true; }
    // destravar
    if (v > 40 && Math.abs(vf) < 6) car.stuckT += dt; else if (car.revT <= 0) car.stuckT = Math.max(0, car.stuckT - dt);
    if (car.stuckT > 2.5 && car.revT <= 0) { car.revT = 1.1; car.stuckT = 0; }
    if (car.revT > 0) { car.revT -= dt; car.thr = -1; steer = -steer; car.hb = false; }
    car.steer = steer;
  }

  function directPursuit(car, dt, S) {
    const P = S.player, tg = P.car || P;
    const tvx = tg.vx || 0, tvy = tg.vy || 0;
    const dxp = tg.x + tvx * 0.4 - car.x, dyp = tg.y + tvy * 0.4 - car.y;
    const dist = Math.hypot(tg.x - car.x, tg.y - car.y);
    let want = Math.atan2(dxp, -dyp);
    if (car.mode === 'leave') want = Math.atan2(car.x - tg.x, -(car.y - tg.y));
    let diff = wrap(want - car.a);
    let bias = 0;
    const probe = ang => W.isSolid(car.x + Math.sin(ang) * 90, car.y - Math.cos(ang) * 90);
    if (probe(car.a + 0.5)) bias -= 0.9; if (probe(car.a - 0.5)) bias += 0.9;
    if (probe(car.a)) bias += (diff >= 0 ? 0.8 : -0.8);
    let steer = clamp(diff * 2.4 + bias, -1, 1);
    let thr = 1;
    if (car.mode !== 'leave') {
      if (dist < 90 && (!P.car || P.car.speed < 60)) thr = 0.15;
      if (Math.abs(diff) > 2.3 && dist < 350) thr = 0.5;
    }
    if (Math.abs(car.vf) < 14 && thr > 0.3 && car.revT <= 0) car.stuckT += dt; else if (car.revT <= 0) car.stuckT = 0;
    if (car.stuckT > 0.9 && car.revT <= 0) { car.revT = 0.9; car.stuckT = 0; }
    car.hb = false;
    if (car.revT > 0) { car.revT -= dt; thr = -1; steer = -steer; }
    car.thr = thr * (car.chaseScale || 1); if (thr < 0) car.thr = thr;
    car.steer = steer;
  }

  // a polícia segue as ruas e só parte direto para cima quando enxerga o alvo
  function lineClear(ax, ay, bx, by) {
    const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / 36);
    for (let k = 1; k < n; k++) { const t = k / n; if (W.isSolid(ax + (bx - ax) * t, ay + (by - ay) * t)) return false; }
    return true;
  }
  function resnap(car) {
    const cx = Math.round((car.x / T - MG - 3) / PITCH), cy = Math.round((car.y / T - MG - 3) / PITCH);
    const i = clamp(cx, 0, COLS), j = clamp(cy, 0, ROWS);
    const dv = Math.abs(car.x - W.nodeX(i)), dh = Math.abs(car.y - W.nodeY(j));
    if (Math.min(dv, dh) > 110) return false;
    if (dv <= dh) car.nav = initNav('v', i, car.fy > 0 ? 1 : -1, car.y); else car.nav = initNav('h', j, car.fx > 0 ? 1 : -1, car.x);
    return true;
  }
  function driveChase(car, dt, S) {
    const P = S.player, tg = P.car || P;
    const dist = Math.hypot(tg.x - car.x, tg.y - car.y);
    const direct = car.mode === 'chase' && dist < 650 && lineClear(car.x, car.y, tg.x, tg.y);
    if (direct) { car.navDirect = true; return directPursuit(car, dt, S); }
    if (car.navDirect || !car.nav) { car.navDirect = false; if (!resnap(car)) return directPursuit(car, dt, S); }
    const n = car.nav;
    if (car.mode === 'chase') {
      n.mode = 'goto'; n.target = { i: clamp(Math.round((tg.x / T - MG - 3) / PITCH), 0, COLS), j: clamp(Math.round((tg.y / T - MG - 3) / PITCH), 0, ROWS) };
      car.cruise = 300 * (car.chaseScale || 1);
    } else { n.mode = 'wander'; car.cruise = 250; }
    car.ignoreLights = true;
    driveTraffic(car, dt, S);
  }

  // ---------- Pontos aleatórios nas ruas ----------
  function randomRoadPoint(cx, cy, minD, maxD, tries) {
    for (let t = 0; t < (tries || 30); t++) {
      const axis = Math.random() < 0.5 ? 'v' : 'h', dir = Math.random() < 0.5 ? 1 : -1;
      let idx, along;
      const ang = Math.random() * TAU, d = rand(minD, maxD);
      const px = cx + Math.cos(ang) * d, py = cy + Math.sin(ang) * d;
      if (axis === 'v') {
        idx = clamp(Math.round((px / T - MG - 3) / PITCH), 0, COLS);
        along = py;
        const k = clamp(Math.round((along / T - MG - 3) / PITCH), 0, ROWS), nyy = W.nodeY(k);
        if (Math.abs(along - nyy) < 300) along = nyy + (along >= nyy ? 1 : -1) * 320;
        along = clamp(along, W.nodeY(0) + 200, W.nodeY(ROWS) - 200);
      } else {
        idx = clamp(Math.round((py / T - MG - 3) / PITCH), 0, ROWS);
        along = px;
        const k = clamp(Math.round((along / T - MG - 3) / PITCH), 0, COLS), nxx = W.nodeX(k);
        if (Math.abs(along - nxx) < 300) along = nxx + (along >= nxx ? 1 : -1) * 320;
        along = clamp(along, W.nodeX(0) + 200, W.nodeX(COLS) - 200);
      }
      const x = axis === 'v' ? W.laneV(idx, dir) : along, y = axis === 'v' ? along : W.laneH(idx, dir);
      const dd = Math.hypot(x - cx, y - cy);
      if (dd < minD * 0.8 || dd > maxD * 1.2) continue;
      if (W.isSolid(x, y)) continue;
      return { x, y, a: angFor(axis, dir), axis, idx, dir, along };
    }
    return null;
  }

  const CAR_COLORS = ['#2f8a3c', '#2e5fb5', '#e8e8ea', '#8a8a96', '#8a2a3a', '#2a8a8a', '#c47a1e', '#6a3fa0', '#d8d04a'];
  function spawnTraffic(S, kindForce) {
    const P = S.player;
    const pt = randomRoadPoint(P.x, P.y, 620, 1150);
    if (!pt) return null;
    for (const o of S.cars) if (Math.abs(o.x - pt.x) < 140 && Math.abs(o.y - pt.y) < 140) return null;
    let kind = kindForce || (Math.random() < 0.16 ? 'taxi' : 'sedan');
    if (kind === 'police' && S.cars.filter(c => c.kind === 'police' && c.mode === 'wander').length >= 2) kind = 'sedan';
    const car = new G.Car({ x: pt.x, y: pt.y, a: pt.a, kind, color: kind === 'police' ? '#ffffff' : kind === 'taxi' ? '#f2c42a' : pick(CAR_COLORS), driver: 'ai', mode: 'wander' });
    car.cruise = rand(150, 235); car.nav = initNav(pt.axis, pt.idx, pt.dir, pt.along);
    car.vx = car.fx * 120; car.vy = car.fy * 120;
    S.cars.push(car); return car;
  }

  function spawnPolice(S, n) {
    const P = S.player, tg = P.car || P;
    for (let k = 0; k < n; k++) {
      const pt = randomRoadPoint(tg.x, tg.y, 650, 950);
      if (!pt) continue;
      let ok = true; for (const o of S.cars) if (Math.abs(o.x - pt.x) < 140 && Math.abs(o.y - pt.y) < 140) ok = false;
      if (!ok) continue;
      const c = new G.Car({ x: pt.x, y: pt.y, a: pt.a, kind: 'police', color: '#ffffff', driver: 'ai', mode: 'chase', mass: 1.15 });
      c.siren = true; c.chaseScale = 0.92 + S.heatLevel * 0.02; c.max = 330 + S.heatLevel * 18;
      c.nav = initNav(pt.axis, pt.idx, pt.dir, pt.along); c.cruise = 300;
      c.vx = c.fx * 150; c.vy = c.fy * 150;
      S.cars.push(c);
    }
  }
  function spawnRoadblock(S) {
    const P = S.player, tg = P.car || P;
    const pt = randomRoadPoint(tg.x + (tg.vx || 0) * 2, tg.y + (tg.vy || 0) * 2, 700, 1000);
    if (!pt) return;
    const mid = pt.axis === 'v' ? W.roadLeft(pt.idx) + 3 * T : W.roadTop(pt.idx) + 3 * T;
    [-1, 1].forEach(s => {
      const cx = pt.axis === 'v' ? mid + s * 48 : pt.along, cy = pt.axis === 'v' ? pt.along : mid + s * 48;
      const c = new G.Car({ x: cx, y: cy, a: pt.a + Math.PI / 2 + s * 0.12, kind: 'police', color: '#ffffff', driver: 'none', mode: 'block', mass: 3 });
      c.siren = true; c.born = S.time; S.cars.push(c);
    });
  }

  // ---------- Pedestres ----------
  const DIRS = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
  function makePed(x, y) {
    const look = G.sprites.randomLook();
    const d = Math.floor(Math.random() * 4);
    return Object.assign({ x, y, h: DIRS[d] + Math.PI / 2, d, speed: rand(38, 62), state: 'walk', walk: Math.random() * 6, timer: rand(2, 6), downT: 0, vx: 0, vy: 0, fleeT: 0 }, look);
  }
  const pedOk = (x, y) => { const t = W.tileAt(x, y); return W.pedWalkable(t) && !W.treeHit(x, y, 4); };
  function updatePed(p, dt, S) {
    if (p.state === 'down') { p.downT += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; if (p.downT > 1.9) p.dead = true; return; }
    if (p.punchT > 0) p.punchT -= dt;
    // susto com carros rápidos
    if (p.state === 'walk') for (const c of S.cars) {
      if (Math.abs(c.x - p.x) > 80 || Math.abs(c.y - p.y) > 80) continue;
      if (c.speed > 150 && Math.hypot(c.x - p.x, c.y - p.y) < 70) { p.state = 'flee'; p.fleeT = rand(1.5, 3); p.threat = { x: c.x, y: c.y }; break; }
    }
    if (p.state === 'flee') {
      p.fleeT -= dt;
      const t = p.threat || S.player;
      const ang = Math.atan2(p.y - t.y, p.x - t.x);
      const sp = 115, vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp;
      if (!W.isSolid(p.x + vx * dt * 2, p.y) && !W.treeHit(p.x + vx * dt * 2, p.y, 3)) p.x += vx * dt;
      if (!W.isSolid(p.x, p.y + vy * dt * 2) && !W.treeHit(p.x, p.y + vy * dt * 2, 3)) p.y += vy * dt;
      p.h += wrap(ang + Math.PI / 2 - p.h) * Math.min(1, 10 * dt); p.walk += sp * dt * 0.22;
      if (p.fleeT <= 0) { p.state = 'walk'; p.d = Math.round(((ang % TAU) + TAU) % TAU / (Math.PI / 2)) % 4; }
      return;
    }
    // andando
    const ang = DIRS[p.d];
    const vx = Math.cos(ang) * p.speed, vy = Math.sin(ang) * p.speed;
    const lx = p.x + Math.cos(ang) * 14, ly = p.y + Math.sin(ang) * 14;
    const here = W.tileAt(p.x, p.y);
    if (!pedOk(lx, ly) && W.pedWalkable(here)) {
      const opts = [0, 1, 2, 3].filter(d => d !== p.d && pedOk(p.x + Math.cos(DIRS[d]) * 14, p.y + Math.sin(DIRS[d]) * 14));
      if (opts.length) { const side = opts.filter(d => Math.abs(d - p.d) !== 2); p.d = pick(side.length ? side : opts); }
      else p.d = (p.d + 2) % 4;
    } else if (W.isSolid(lx, ly)) p.d = (p.d + 2) % 4;
    else { p.x += vx * dt; p.y += vy * dt; p.walk += p.speed * dt * 0.22; }
    p.timer -= dt;
    if (p.timer <= 0) {
      p.timer = rand(2.5, 7);
      if (here !== W.TILE.CROSS && Math.random() < 0.6) {
        const opts = [(p.d + 1) % 4, (p.d + 3) % 4].filter(d => pedOk(p.x + Math.cos(DIRS[d]) * 24, p.y + Math.sin(DIRS[d]) * 24));
        if (opts.length) p.d = pick(opts);
      }
    }
    p.h += wrap(DIRS[p.d] + Math.PI / 2 - p.h) * Math.min(1, 8 * dt);
  }
  // h = direção do corpo: o sprite "olha" para -y, então h = ang + PI/2

  function spawnPed(S) {
    const P = S.player;
    for (let t = 0; t < 12; t++) {
      const a = Math.random() * TAU, d = rand(520, 1000);
      const x = P.x + Math.cos(a) * d, y = P.y + Math.sin(a) * d;
      const tt = W.tileAt(x, y);
      if (tt !== W.TILE.SIDE || !pedOk(x, y)) continue;
      const p = makePed(x, y); p.h = DIRS[p.d] + Math.PI / 2; S.peds.push(p); return p;
    }
    return null;
  }

  // ---------- Helicóptero ----------
  function updateHeli(S, dt) {
    const h = S.heli; if (!h) return;
    const tg = S.player.car || S.player;
    const dx = tg.x - h.x, dy = tg.y - h.y, d = Math.hypot(dx, dy) || 1;
    const sp = Math.min(330, d * 1.4 + 40);
    h.vx += (dx / d * sp - h.vx) * Math.min(1, 1.6 * dt); h.vy += (dy / d * sp - h.vy) * Math.min(1, 1.6 * dt);
    h.x += h.vx * dt; h.y += h.vy * dt; h.rot += dt * 30; h.life -= dt;
    h.a = Math.atan2(h.vx, -h.vy);
    if (h.life <= 0 && S.heatLevel < 5) S.heli = null;
  }

  G.ai = {
    lightState, drawLights, initNav, driveTraffic, driveChase, randomRoadPoint, spawnTraffic, spawnPolice, spawnRoadblock,
    makePed, updatePed, spawnPed, updateHeli, angFor, wrap, clamp, rand, pick, pedOk, CAR_COLORS,
  };
})(window.G = window.G || {});

(function (G) {
  'use strict';
  const W = G.world, T = W.T;
  const TAU = Math.PI * 2;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- Lugares ----------
  const POI = {

    oficina: Object.assign(W.sidePoint(2, 2, 'top', 0.5), { r: 52, name: 'OFICINA' }),

  // ---------- Definições das 10 missões ----------
  const DEFS = [
