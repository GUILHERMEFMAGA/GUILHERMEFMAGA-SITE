<script>
/* ============================================================
   missions.js — telefones públicos, missões e lugares da cidade
   (entrega, táxi, roubo de carro, corrida, fuga e acerto de contas)
   ============================================================ */
(function (G) {
  'use strict';
  const W = G.world, T = W.T;
  const TAU = Math.PI * 2;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- Lugares ----------
  // hospital e delegacia agora são os prédios grandes do mapa (world.js: places do tipo 'hospital' e 'delegacia')
  const ponto = (tipo, padrao) => { const p = W.places.find(q => q.tipo === tipo); return p ? { x: p.x, y: p.y + 40 } : padrao; };
  const POI = {
    garage: Object.assign(W.sidePoint(0, 0, 'bottom', 0.5), { r: 52, name: 'GARAGEM' }),
    oficina: Object.assign(W.sidePoint(2, 2, 'top', 0.5), { r: 52, name: 'OFICINA' }),
    hospital: Object.assign({}, ponto('hospital', W.sidePoint(4, 1, 'bottom', 0.5)), { r: 44, name: 'HOSPITAL' }),
    delegacia: Object.assign({}, ponto('delegacia', W.sidePoint(1, 3, 'right', 0.5)), { r: 44, name: 'DELEGACIA' }),
    armas: Object.assign(W.sidePoint(1, 0, 'bottom', 0.5), { r: 46, name: 'LOJA DE ARMAS' }),
  };
  // telefone no meio da calçada, mas nunca em cima da porta de uma casa/loja (senão a tecla E fica confusa)
  const portasDoMapa = () => W.places.concat(W.casas.filter(c => !c.b.place));
  function tel(bx, by, side, t) {
    const portas = portasDoMapa();
    for (const dt of [0, 0.06, -0.06, 0.12, -0.12, 0.18, -0.18, 0.24, -0.24, 0.3, -0.3, 0.36, -0.36, 0.42, -0.42]) {
      const p = W.sidePoint(bx, by, side, Math.max(0.08, Math.min(0.92, t + dt)));
      if (!portas.some(q => Math.hypot(q.x - p.x, q.y - p.y) < 72)) return p;
    }
    return W.sidePoint(bx, by, side, t);
  }
  const PHONES = [
    tel(0, 2, 'right', 0.3), tel(2, 0, 'bottom', 0.7),
    tel(4, 3, 'top', 0.3), tel(5, 1, 'left', 0.6),
    // telefones dos bairros novos (mapa dobrado)
    tel(7, 0, 'bottom', 0.4), tel(8, 2, 'left', 0.5), tel(2, 5, 'top', 0.6), tel(6, 4, 'right', 0.5), tel(4, 5, 'left', 0.4),
  ].map(p => Object.assign(p, { r: 40 }));

  // agora que os telefones e lugares fixos existem, nascem as lojas (longe deles)
  W.gerarLojas(Object.values(POI).concat(PHONES));

  // ---------- Definições das 12 missões ----------
  const DEFS = [
    { type: 'delivery', name: 'Pacote do Seu Zé', pay: 250, slack: 1.9, brief: 'Seu Zé: Pegue o pacote no ponto marcado e leve até o destino antes que esfrie. Sem pressa... quase!' },
    { type: 'taxi', name: 'Dona Marta', pay: 300, brief: 'Dona Marta precisa ir ao mercado. Busque a passageira e dirija com jeitinho. Batida desconta da gorjeta!' },
    { type: 'steal', name: 'O Fusca Verde', pay: 350, car: { kind: 'sedan', color: '#2f8a3c', label: 'sedã verde' }, brief: 'Um cliente quer um sedã verde. Encontre o carro marcado e leve até o desmanche. Cuidado com a polícia!' },
    { type: 'race', name: 'Racha da Avenida', pay: 500, cps: 5, rivals: 2, brief: 'Racha valendo grana! Vá até a linha de largada, passe pelos cruzamentos marcados e chegue antes dos rivais.' },
    { type: 'hit', name: 'Cobrança', pay: 450, weapons: ['pistol', 'bat', 'pistol'], give: { pistol: 48 }, brief: 'Uns caras devem dinheiro ao chefe e não querem pagar. Peguei uma pistola para você. Vá até a área marcada e elimine os três. Eles vão atirar de volta!' },
    { type: 'escape', name: 'Deu Ruim', pay: 400, level: 3, brief: 'Fizeram alguma coisa e a polícia quer você! Despiste as viaturas e volte para a garagem!' },
    { type: 'delivery', name: 'Entrega Relâmpago', pay: 450, slack: 1.25, brief: 'Entrega urgente do Seu Zé. Dessa vez o tempo é curto. Pé embaixo!' },
    { type: 'taxi', name: 'Passageiro VIP', pay: 500, vip: true, brief: 'Um figurão quer chegar inteiro. Dirija suave: qualquer batida estraga a corrida.' },
    { type: 'steal', name: 'Táxi Amarelo', pay: 550, car: { kind: 'taxi', color: '#f2c42a', label: 'táxi amarelo' }, wanted: 1, brief: 'Preciso de um táxi amarelo com urgência. Pegue o marcado e entregue no desmanche.' },
    { type: 'hit', name: 'Guerra de Gangues', pay: 850, weapons: ['smg', 'pistol', 'pistol', 'bat', 'smg'], give: { smg: 120 }, brief: 'A gangue rival tomou o bairro. Deixei uma submetralhadora para você. São cinco armados: use a cobertura, colete e não fique parado!' },
    { type: 'race', name: 'Grande Prêmio', pay: 700, cps: 7, rivals: 3, brief: 'Grande Prêmio da cidade! Sete pontos, três rivais. Só o primeiro leva a bolada.' },
    { type: 'escape', name: 'Fuga Final', pay: 650, level: 4, brief: 'A cidade inteira está atrás de você. Sobreviva à perseguição e chegue à garagem!' },
  ];
  const RANKS = ['Motorista Novato', 'Entregador', 'Piloto de Fuga', 'Mestre do Asfalto', 'Lenda da Rua', 'Rei da Cidade'];
  const GOAL = 4000;
  const rankIdx = done => Math.min(5, Math.floor(done / 2));

  function randSpot(S, minD, maxD, from) {
    const f = from || S.player;
    const rib = W.spots.filter(p => p.x < W.roadLeft(9));   // as missões ficam em Ribeirão
    const c = rib.filter(p => { const d = Math.hypot(p.x - f.x, p.y - f.y); return d >= minD && d <= maxD; });
    const arr = c.length ? c : rib;
    const p = arr[Math.floor(Math.random() * arr.length)];
    return { x: p.x, y: p.y };
  }

  const M = { POI, PHONES, DEFS, RANKS, GOAL, TOTAL: DEFS.length, active: null };

  M.rank = done => RANKS[rankIdx(done)];
  M.mult = done => 1 + 0.1 * rankIdx(done);

  M.startNext = function (S, ph) {
    if (M.active) return;
    const n = S.save.done;
    const def = DEFS[n % DEFS.length];
    const m = { def, type: def.type, stage: 0, markers: [], timeLeft: null, hint: '', n };
    const from = ph || S.player;
    if (def.type === 'delivery') {
      m.A = randSpot(S, 500, 1100, from); m.B = randSpot(S, 900, 1900, m.A);
      m.markers = [{ x: m.A.x, y: m.A.y, r: 48, label: 'PACOTE' }];
      m.hint = 'Pegue o pacote';
    } else if (def.type === 'taxi') {
      m.A = randSpot(S, 500, 1100, from); m.B = randSpot(S, 900, 1900, m.A);
      const p = G.ai.makePed(m.A.x, m.A.y); p.state = 'wait'; p.mission = true; p.shirt = def.vip ? '#111' : '#e8d8f0'; p.h = rand(0, TAU);
      S.peds.push(p); m.ped = p; m.comfort = 100;
      m.markers = [{ x: m.A.x, y: m.A.y, r: 52, label: 'PASSAGEIRO' }];
      m.hint = 'Busque o passageiro (de carro!)';
    } else if (def.type === 'steal') {
      const pt = G.ai.randomRoadPoint(from.x, from.y, 600, 1200);
      const c = new G.Car({ x: pt.x, y: pt.y, a: pt.a, kind: def.car.kind, color: def.car.color, driver: 'none', mode: 'parked', tag: 'mission' });
      S.cars.push(c); m.car = c; m.B = randSpot(S, 900, 1900, pt);
      m.markers = [{ x: c.x, y: c.y, r: 60, label: def.car.label.toUpperCase(), follow: c }];
      m.hint = 'Encontre o ' + def.car.label;
    } else if (def.type === 'race') {
      const i0 = 1 + Math.floor(Math.random() * 8), j0 = 1 + Math.floor(Math.random() * (W.ROWS - 1));
      m.start = { i: i0, j: j0 }; m.cps = []; let ci = i0, cj = j0;
      for (let k = 0; k < def.cps; k++) {
        let t = 0, ni, nj;
        do { ni = ci + (Math.floor(Math.random() * 5) - 2); nj = cj + (Math.floor(Math.random() * 3) - 1); t++; }
        while (t < 30 && (ni < 0 || nj < 0 || ni > 9 || nj > W.ROWS || (ni === ci && nj === cj) || Math.abs(ni - ci) + Math.abs(nj - cj) < 2));
        if (ni < 0 || nj < 0 || ni > 9 || nj > W.ROWS) { ni = ci; nj = cj === 0 ? 2 : cj - 2; }
        m.cps.push({ i: ni, j: nj }); ci = ni; cj = nj;
      }
      m.cp = 0; m.cd = 0; m.rivals = []; m.racing = false; m.placed = 0;
      m.markers = [{ x: W.nodeX(i0), y: W.nodeY(j0), r: 80, label: 'LARGADA' }];
      m.hint = 'Vá até a linha de largada';
    } else if (def.type === 'hit') {
      const spot = randSpot(S, 900, 1900, from);
      S.thugAlert = false; m.thugs = [];
      def.weapons.forEach((w, k) => {
        let x = spot.x, y = spot.y;
        for (let t = 0; t < 30; t++) { const a = rand(0, TAU), d = rand(25, 95), qx = spot.x + Math.cos(a) * d, qy = spot.y + Math.sin(a) * d; if (!W.isSolid(qx, qy) && !W.treeHit(qx, qy, 4) && W.tileAt(qx, qy) !== W.TILE.ROAD) { x = qx; y = qy; break; } }
        const p = G.ai.makePed(x, y);
        Object.assign(p, { kind: 'thug', target: true, state: 'guard', weapon: w, armed: true, hp: w === 'bat' ? 70 : 60, shirt: k % 2 ? '#2b2b33' : '#7a1c1c', hair: '#111', cap: null, h: rand(0, TAU) });
        S.peds.push(p); m.thugs.push(p);
      });
      m.spot = spot;
      m.markers = [{ x: spot.x, y: spot.y, r: 150, label: 'ALVOS' }];
      m.hint = 'Elimine os ' + m.thugs.length + ' alvos';
      Object.keys(def.give || {}).forEach(id => { if (!G.combat.arms(S).own[id] || G.combat.ammoOf(S, id) < 20) G.combat.giveWeapon(S, id, def.give[id], true); });
      G.combat.select(S, def.weapons.includes('smg') ? 'smg' : 'pistol');
    } else if (def.type === 'escape') {
      S.heat = def.level * 20 - 4; m.hint = 'Despiste a polícia! Volte à garagem';
      m.markers = [{ x: POI.garage.x, y: POI.garage.y, r: 70, label: 'GARAGEM' }];
    }
    M.active = m;
    G.say(def.brief, 9);
    G.banner('MISSÃO ' + (n + 1), def.name.toUpperCase());
    G.snd.pick();
  };

  M.fail = function (S, why) {
    const m = M.active; if (!m) return;
    if (m.ped) m.ped.dead = true;
    M.cleanup(S, m);
    M.active = null;
    G.say('MISSÃO FALHOU: ' + why, 6);
    G.banner('MISSÃO FALHOU', why.toUpperCase(), true);
    G.snd.fail();
  };
  M.cleanup = function (S, m) {
    if (m.rivals) m.rivals.forEach(r => { r.car.mode = 'wander'; r.car.nav.mode = 'wander'; r.car.ignoreLights = false; r.car.cruise = rand(170, 230); r.car.hold = 0; });
    if (m.car && m.car.mode !== 'player') m.car.tag = '';
    if (m.thugs) m.thugs.forEach(p => { if (p.state !== 'dead') { p.dead = true; } else p.target = false; });
  };
  M.complete = function (S, pay, extra) {
    const m = M.active; if (!m) return;
    const total = Math.round(pay * M.mult(S.save.done));
    S.save.money += total; S.save.done++;
    G.save();
    M.cleanup(S, m);
    M.active = null;
    G.snd.win(); setTimeout(() => G.snd.cash(), 500);
    const king = S.save.done >= M.TOTAL && S.save.money >= GOAL;
    G.banner(king ? 'REI DA CIDADE!' : 'MISSÃO CUMPRIDA', '+$' + total + (extra ? '  ' + extra : ''));
    let msg = m.def.name + ' concluída! +$' + total + '.';
    if (king && !S.save.king) { S.save.king = true; G.save(); msg = 'VOCÊ É O REI DA CIDADE! Campanha completa. Continue no modo livre!'; }

<script>

     2) neblina          -> nuvens de névoa que andam devagar (volumétrica)

                            postes, janelas, sirenes e explosões

     6) cor de cinema    -> contraste e tom azul/laranja

  // ---- textura de neblina que se repete sem emendas ----

<script>
/* =====================================================================
   DETALHES.JS — pequenos detalhes que dão vida à cidade
     - pombos nas calçadas (bicam o chão e voam quando você chega perto)
     - fumaça saindo dos bueiros
   ===================================================================== */
(function (G) {

  // ponto da calçada longe do jogador, para um pombo novo aparecer
  function novoPombo(S, W, ref) {

  function update(S, W, dt) {
    const ref = { x: S.cam.x, y: S.cam.y };
    // ---- pombos ----
    if (!S.pombos) S.pombos = [];
    const pl = S.player.car || S.player;
    S.pombos.forEach(p => {
      p.t += dt;
      if (p.st === 'chao') {
        const sp = pl.speed ? Math.abs(pl.speed) : 0;
        const dist = Math.hypot(pl.x - p.x, pl.y - p.y);
        const peds = S.peds.some(q => q.state !== 'dead' && Math.abs(q.x - p.x) < 28 && Math.abs(q.y - p.y) < 28);
        if (dist < 70 + sp * 0.2 || peds || S.particles.some(q => q.col === 'flash' && Math.hypot(q.x - p.x, q.y - p.y) < 300)) {
          p.st = 'voa'; p.fly = 0; const a = Math.atan2(p.y - pl.y, p.x - pl.x) + rand(-0.8, 0.8);
          p.a = a; p.vx = Math.cos(a) * rand(120, 170); p.vy = Math.sin(a) * rand(120, 170) - 10;
        } else if (Math.random() < dt * 0.4) { p.a += rand(-1.2, 1.2); }   // vira a cabeça
        if (p.st === 'chao' && Math.random() < dt * 0.15) { p.x += Math.cos(p.a) * 3; p.y += Math.sin(p.a) * 3; } // dá uns passinhos
      } else {
        p.fly += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.h = Math.min(46, p.h + 60 * dt);
      }
    });
    S.pombos = S.pombos.filter(p => p.fly < 3 && Math.hypot(p.x - ref.x, p.y - ref.y) < 900);
    if (S.pombos.length < MAX_POMBOS && Math.random() < dt * 2) { const n = novoPombo(S, W, ref); if (n) S.pombos.push(n); }

    // ---- fumaça dos bueiros ----
    bueirosT -= dt;
    if (bueirosT <= 0) { bueirosT = 1.5; bueiros = W.manholes(ref.x - 500, ref.y - 400, ref.x + 500, ref.y + 400).filter(b => ((b.x * 7 + b.y * 13) | 0) % 5 < 2); }
    bueiros.forEach(b => {
      if (Math.random() < dt * 2.2) G.particle({ x: b.x + rand(-2, 2), y: b.y + rand(-2, 2), vx: rand(-5, 5), vy: rand(-14, -6), life: rand(1.6, 2.4), size: rand(3, 5), col: 'smoke', tint: '#e6eaf2', a: 0.2 });
    });
  }

  function draw(ctx, S, inV) {
    if (!S.pombos) return;
    S.pombos.forEach(p => {
      if (!inV(p)) return;
      // sombra no chão
      ctx.save(); ctx.translate(p.x + 2 + p.h * 0.3, p.y + 2 + p.h * 0.4); ctx.rotate(p.a); ctx.fillStyle = 'rgba(0,0,10,' + (0.28 - p.h * 0.003) + ')';
      ctx.beginPath(); ctx.ellipse(0, 0, 5, 3, 0, 0, TAU); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(p.x, p.y - p.h); ctx.rotate(p.a);
      const voando = p.st === 'voa', bat = voando ? Math.sin(p.t * 34) : 0;
      if (voando) { ctx.fillStyle = p.cor; ctx.beginPath(); ctx.ellipse(-1, 0, 2.4, 6.5 + bat * 2.5, 0, 0, TAU); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(-1, 0, 1.4, 5 + bat * 2, 0, 0, TAU); ctx.fill(); }
      ctx.fillStyle = p.cor; ctx.beginPath(); ctx.ellipse(0, 0, 4.6, 2.9, 0, 0, TAU); ctx.fill();      // corpo
      ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(-1.6, 0, 2.6, 2.3, 0, 0, TAU); ctx.fill();   // asas fechadas
      ctx.fillStyle = '#3a8a6a'; ctx.beginPath(); ctx.ellipse(2.8, 0, 1.6, 1.8, 0, 0, TAU); ctx.fill();  // pescoço verde-roxo
      ctx.fillStyle = '#7a7e8c'; ctx.beginPath(); ctx.arc(4.4, voando ? 0 : Math.sin(p.t * 5 + p.x) > 0.7 ? 0.6 : 0, 1.5, 0, TAU); ctx.fill();  // cabeça
      ctx.fillStyle = '#e8a050'; ctx.fillRect(5.6, -0.3, 1.4, 0.7);                                      // bico
      ctx.restore();
    });
  }

  G.detalhes = { update, draw };
})(window.G = window.G || {});

</script>
<script>
/* =====================================================================
   LUGARES.JS — a nossa cidade tem lugares para ENTRAR e objetos para USAR
     Fora:   prédios com letreiro (Pinguim, Mercadão, Teatro...), hidrantes,
             lixeiras, bancos, caixas de correio, bancas, máquinas, ônibus
             e pessoas para conversar (elas dão dicas e mostram o caminho)
     Dentro: salas desenhadas por código, com atendente e objetos para usar
   Tudo aqui usa E (interagir). Dentro dos lugares, ESC também sai.
   ===================================================================== */
(function (G) {
  'use strict';
  const SP = G.sprites, W = G.world, TAU = Math.PI * 2;
  const VW = 800, VH = 600;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const shade = SP.shade;
  const L = G.lugares = { PLACES: W.places };

  // ---------- visual do personagem (barbearia e loja de roupas mudam isso) ----------
  const CORTES = ['topete', 'curto', 'raspado', 'careca', 'afro', 'longo', 'rabo', 'coque'];
  const CORES_CAB = ['#1a1208', '#3a2412', '#7a5a2a', '#c9a24a', '#111111', '#8a8a8a', '#b3361e', '#3a6ad0'];
  const ROUPAS = [
    { shirt: '#e8832a', pat: 'hawaii', sleeve: 'curta' }, { shirt: '#1c1c22', pat: 'jaqueta', sleeve: 'longa' },
    { shirt: '#d33a3a', pat: 'liso', sleeve: 'curta' }, { shirt: '#3a7ad3', pat: 'listra', sleeve: 'curta' },
    { shirt: '#e8e8e8', pat: 'liso', sleeve: 'regata' }, { shirt: '#2f7a3a', pat: 'xadrez', sleeve: 'longa' },
    { shirt: '#8a4fc2', pat: 'liso', sleeve: 'curta' }, { shirt: '#e0b32a', pat: 'listra', sleeve: 'regata' }
  ];
  const CALCAS = ['#2f4f86', '#1c1c20', '#4a3a2a', '#6a5a46', '#3a3a3f', '#56688a', '#23232c'];
  const TENIS = ['#f2f2f2', '#121216', '#d33a3a', '#2a5ac8', '#3a2412', '#e0b32a'];
  const ACESS = [{ acc: 'shades', accCol: '#000000' }, { acc: 'none', accCol: '#000000' }, { acc: 'cap', accCol: '#d33a3a' }, { acc: 'cap', accCol: '#2a2a30' }, { acc: 'beanie', accCol: '#3a7ad3' }, { acc: 'hat', accCol: '#d2b074' }];
  L.aplicarLook = function (S) {
    S.save.forca = S.save.forca || 0;
    const lk = S.save.look = Object.assign({ corte: 0, cor: 0, roupa: 0, calca: 0, tenis: 0, acess: 0 }, S.save.look || {});
    const P = S.player, r = ROUPAS[lk.roupa % ROUPAS.length], a = ACESS[lk.acess % ACESS.length];
    Object.assign(P, { hairStyle: CORTES[lk.corte % CORTES.length], hair: CORES_CAB[lk.cor % CORES_CAB.length], shirt: r.shirt, pat: r.pat, sleeve: r.sleeve, pants: CALCAS[lk.calca % CALCAS.length], shoe: TENIS[lk.tenis % TENIS.length], acc: a.acc, accCol: a.accCol });
  };
  function mudaLook(S, campo, n) { S.save.look[campo] = ((S.save.look[campo] || 0) + 1) % n; L.aplicarLook(S); G.save(); }

  // ---------- dinheiro e vida ----------
  function gasta(S, v) {
    if (S.save.money < v) { G.say('Dinheiro insuficiente ($' + v + ').', 2.5); return false; }
    S.save.money -= v; G.snd.cash(); G.save(); return true;
  }
  function cura(S, n) { S.player.hp = Math.min(100, S.player.hp + n); }

  // ---------- falas (pessoas e atendentes) ----------
  const FALAS = [
    'Calor de Ribeirão não perdoa, hein?', 'Já tomou um chopp no Pinguim hoje?', 'Terra roxa, cana e sertanejo: isso aqui é Ribeirão!',
    'Cuidado com os carros por aí!', 'Esse trânsito está uma loucura...', 'Se estiver machucado, vá ao hospital.', 'A polícia anda de olho, viu?',
    'Que dia bonito!', 'Dizem que o Rei da Cidade tem quatro mil no bolso.', 'Passa no Mercadão, o pastel é bom demais!',
    'Vai ao Theatro Pedro II, é lindo!', 'Quer ficar forte? A academia tem esteira nova.', 'Sou daqui desde sempre. Ribeirão é a melhor!',
    'Se precisa de dinheiro, atenda os telefones amarelos.', 'Tem hidrante aberto? Aproveita e se refresca!'
  ];
  const DICAS = [
    'Dica: sente num banco da calçada para recuperar a vida.', 'Dica: as máquinas de refrigerante curam um pouquinho.',
    'Dica: nos pontos de ônibus você viaja pela cidade por $5.', 'Dica: a barbearia e o shopping mudam o seu visual.',
    'Dica: durma em casa para salvar o jogo e passar a noite.', 'Dica: fale com o padre para despistar a polícia.',
    'Dica: remexer lixeira às vezes rende uns trocados.', 'Dica: a academia aumenta a força dos seus socos.'
  ];
  const SAUDACOES = ['Opa!', 'Fala, campeão!', 'E aí?', 'Tudo bem?', 'Oi!', 'Eaí, parceiro!'];
  const MANCHETES = ['MANCHETE: Chopp do Pinguim é eleito o mais gelado do interior!', 'MANCHETE: Prefeitura promete menos buracos (de novo).', 'MANCHETE: Motorista de fusca verde é visto em alta velocidade.', 'MANCHETE: Theatro Pedro II tem sessão lotada.', 'MANCHETE: Pombos tomam conta da praça!', 'MANCHETE: Calor passa dos 38 graus em Ribeirão.', 'MANCHETE: Polícia reforça patrulhas à noite.'];

  const PONTOS = ['norte', 'nordeste', 'leste', 'sudeste', 'sul', 'sudoeste', 'oeste', 'noroeste'];
  function direcao(from, to) {
    const dx = to.x - from.x, dy = to.y - from.y, d = Math.hypot(dx, dy);
    const k = Math.round((Math.atan2(dx, -dy) + TAU) % TAU / (TAU / 8)) % 8;
    return { nome: PONTOS[k], m: Math.round(d / 4 / 10) * 10 };
  }

  // balão de fala
  function bolha(p, txt, secs) { p.bub = { txt, t: secs || 3.5 }; }
  function desenhaBolha(ctx, x, y, txt, alpha) {
    ctx.save(); ctx.font = 'bold 10px Arial, sans-serif';
    const palavras = txt.split(' '), linhas = []; let cur = '';
    palavras.forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > 120 && cur) { linhas.push(cur); cur = w; } else cur = t; });
    linhas.push(cur);
    const w = Math.max(...linhas.map(l => ctx.measureText(l).width)) + 12, h = linhas.length * 12 + 8, bx = x - w / 2, by = y - 26 - h;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; W.rrect(ctx, bx + 2, by + 3, w, h, 5); ctx.fill();
    ctx.fillStyle = '#ffffff'; W.rrect(ctx, bx, by, w, h, 5); ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 4, by + h - 0.5); ctx.lineTo(x, by + h + 6); ctx.lineTo(x + 4, by + h - 0.5); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.fillStyle = '#111'; ctx.textAlign = 'center'; linhas.forEach((l, i) => ctx.fillText(l, x, by + 13 + i * 12));
    ctx.restore();
  }

  // ---------- transição (tela preta rápida) ----------
  L.trans = function (S, cb) { if (S.trans) return; S.trans = { t: 0, cb, feito: false }; };
  L.atualizarTrans = function (S, dt) {
    const T = S.trans; if (!T) return;
    T.t += dt / 0.26;
    if (!T.feito && T.t >= 1) { T.feito = true; T.cb(); }
    if (T.t >= 2) S.trans = null;
  };
  L.desenharTrans = function (ctx, S) {
    const T = S.trans; if (!T) return;
    ctx.fillStyle = 'rgba(0,0,0,' + clamp(T.t < 1 ? T.t : 2 - T.t, 0, 1) + ')'; ctx.fillRect(0, 0, VW, VH);
  };

  // =====================================================================
  //  FORA: objetos da cidade, pessoas e lugares
  // =====================================================================
  const INTERATIVOS = { hidrante: 'ABRIR HIDRANTE', lixeira: 'REMEXER LIXEIRA', banco: 'SENTAR NO BANCO', correio: 'ABRIR CAIXA DE CORREIO', banca: 'COMPRAR JORNAL ($2)', maquina: 'COMPRAR REFRIGERANTE ($4)', ponto: 'PEGAR ÔNIBUS ($5)' };
  const nomeAqui = (x, y) => { let best = null, bd = 1e9; W.places.forEach(p => { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p; } }); return best ? 'perto de ' + best.nome : 'na cidade'; };

  function entrar(S, pl) {
    if (S.heatLevel > 0 && pl.id !== 'catedral' && !pl.livre) { G.say('Com a polícia atrás de você? Só a igreja serve de abrigo!', 3); return; }
    if (pl.horario) { const h = L.hora(S); if (h < pl.horario[0] || h >= pl.horario[1]) { G.say(pl.nome + ' está FECHADO agora. Abre às ' + pl.horario[0] + 'h e fecha às ' + pl.horario[1] + 'h.', 4); return; } }
    G.snd.door();
    L.trans(S, () => { if (S.mode !== 'play') return; S.mode = 'inside'; S.inside = montar(pl); S.prompt = ''; });
  }

  function falar(S, p) {
    const P = S.player;
    p.talkT = 5; p.h = Math.atan2(P.y - p.y, P.x - p.x) + Math.PI / 2;
    const r = Math.random();
    if (r < 0.25 && W.places.length) {
      const pl = pick(W.places), d = direcao(p, pl);
      bolha(p, 'O ' + pl.nome + ' fica uns ' + d.m + ' metros para o ' + d.nome + '. Vou te mostrar!', 5);
      S.guia = { id: pl.id, t: 45 }; G.say('Guia ligado: siga a seta até ' + pl.nome + '.', 3.5);
    } else if (r < 0.42) bolha(p, pick(DICAS), 5); else if (r < 0.7 && G.vida) bolha(p, pick(G.vida.fraseRua(L.hora(S))), 5); else bolha(p, pick(FALAS), 4);
  }

  L.extrasAcao = []; L.extrasDesenho = []; L.extrasAtualizar = [];   // outros arquivos (casas, mercados...) se penduram aqui
  L.entrar = (S, pl) => entrar(S, pl);
  L.acao = function (S, raioMax) {
    if (S.mode !== 'play' || S.trans) return null;
    const P = S.player; if (P.car || P.hp <= 0) return null;
    if (S.sentado) return { t: 'lugar', s: 'E: LEVANTAR (recuperando vida...)', run: () => { S.sentado = null; } };
    for (const pl of W.places) if (Math.hypot(pl.x - P.x, pl.y - P.y) < (raioMax ? Math.min(pl.r, raioMax) : pl.r)) return { t: 'lugar', s: 'E: ENTRAR — ' + pl.nome, run: () => entrar(S, pl) };
    for (const f of L.extrasAcao) { const a = f(S, P); if (a) return a; }
    let bp = null, bd = 26;
    for (const pr of W.propList) {
      if (!INTERATIVOS[pr.tipo] || Math.abs(pr.x - P.x) > 30 || Math.abs(pr.y - P.y) > 30) continue;
      const d = Math.hypot(pr.x - P.x, pr.y - P.y); if (d < bd) { bd = d; bp = pr; }
    }
    if (bp) return { t: 'lugar', s: 'E: ' + INTERATIVOS[bp.tipo], run: () => usaProp(S, bp) };
    let pp = null; bd = 40;
    for (const p of S.peds) {
      if (p.kind !== 'civ' || p.state === 'dead' || p.state === 'down' || p.state === 'flee' || p.state === 'fight' || p.mission || p.target) continue;
      const d = Math.hypot(p.x - P.x, p.y - P.y); if (d < bd) { bd = d; pp = p; }
    }
    if (pp) return { t: 'lugar', s: 'E: CONVERSAR', run: () => falar(S, pp) };
    return null;
  };

  function usaProp(S, pr) {
    const P = S.player; S.prop = S.prop || {}; const st = S.prop[pr.id] = S.prop[pr.id] || {};
    if (pr.tipo === 'hidrante') { st.ate = S.time + 9; G.say('Hidrante aberto! Que refresco...', 3); G.snd.door(); }
    else if (pr.tipo === 'lixeira') {
      if (st.t && S.time - st.t < 120) { G.say('Você já remexeu aqui. Só sobrou lixo.', 2.5); return; }
      st.t = S.time; const r = Math.random();
      if (r < 0.3) { const v = 5 + Math.floor(Math.random() * 26); S.save.money += v; G.save(); G.snd.cash(); G.say('Achou uns trocados na lixeira: $' + v + '!', 3); }
      else if (r < 0.4) { P.hp = Math.max(1, P.hp - 4); G.say('Um rato pulou da lixeira! Que susto!', 3); G.snd.beep(); }
      else if (r < 0.5) { cura(S, 8); G.say('Meia pizza ainda boa... você comeu (+vida).', 3); }
      else G.say('Só lixo e papel amassado.', 2.5);
    } else if (pr.tipo === 'banco') {
      S.sentado = { x: pr.x, y: pr.y }; P.x = pr.x; P.y = pr.y; P.h = pr.rot; P.vx = P.vy = 0; G.say('Você sentou para descansar. Aperte E para levantar.', 3);
    } else if (pr.tipo === 'correio') {
      if (st.t && S.time - st.t < 150) { G.say('A caixa está vazia.', 2); return; }
      st.t = S.time;
      if (Math.random() < 0.35) { const v = 5 + Math.floor(Math.random() * 20); S.save.money += v; G.save(); G.snd.cash(); G.say('Uma carta esquecida com $' + v + ' dentro!', 3); } else G.say('Só contas e propaganda...', 2.5);
    } else if (pr.tipo === 'banca') { if (gasta(S, 2)) G.say((G.crimes && G.crimes.manchete(S)) || pick(MANCHETES), 5); }
    else if (pr.tipo === 'maquina') {
      if (!gasta(S, 4)) return;
      if (Math.random() < 0.2) G.say('A máquina engoliu seu dinheiro e não deu nada!', 3); else { cura(S, 12); G.say('Refrigerante gelado! (+vida)', 2.5); }
    } else if (pr.tipo === 'ponto') {
      const outros = W.propList.filter(q => q.tipo === 'ponto' && Math.hypot(q.x - pr.x, q.y - pr.y) > 500);
      if (!outros.length) { G.say('Não tem outro ponto de ônibus por perto.', 2.5); return; }
      if (!gasta(S, 5)) return;
      const dst = pick(outros); G.snd.door();
      L.trans(S, () => { P.x = dst.x; P.y = dst.y; S.cam.x = P.x; S.cam.y = P.y; G.say('Você desceu do ônibus ' + nomeAqui(dst.x, dst.y) + '.', 3.5); });
    }
  }

  // ---------- atualizações do mundo (hidrantes, balões, saudações, sentar, guia) ----------
  L.atualizar = function (S, dt) {
    const P = S.player; if (S.bebado > 0) S.bebado -= dt; if (S.energia > 0) S.energia -= dt;
    // hidrantes abertos jorram água
    if (S.prop) for (const id in S.prop) {
      const st = S.prop[id]; if (!st.ate || S.time > st.ate) continue;
      const pr = W.propList.find(q => q.id === id); if (!pr || Math.hypot(pr.x - P.x, pr.y - P.y) > 700) continue;
      for (let k = 0; k < 2; k++) { const a = rand(0, TAU), v = rand(30, 95); G.particle({ x: pr.x, y: pr.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.5, 0.9), size: rand(1.5, 2.5), col: 'smoke', tint: '#bfe4ff', a: 0.6 }); }
    }
    // sentado: recupera vida
    if (S.sentado) { P.vx = P.vy = 0; P.hp = Math.min(100, P.hp + 5 * dt); if (P.hp >= 100 && !S.sentado.avisou) { S.sentado.avisou = true; G.say('Vida cheia! Aperte E para levantar.', 2.5); } }
    // balões e saudações
    for (const p of S.peds) {
      if (p.bub) { p.bub.t -= dt; if (p.bub.t <= 0) p.bub = null; }
      if (p.talkT > 0) p.talkT -= dt;
      if (!p.saudou && p.kind === 'civ' && p.state !== 'dead' && p.state !== 'down' && !P.car && Math.hypot(p.x - P.x, p.y - P.y) < 52) {
        p.saudou = true;
        if (Math.random() < 0.45) {
          const arma = P.weapon === 'pistol' || P.weapon === 'smg' || P.weapon === 'shotgun';
          bolha(p, arma ? pick(['Calma aí, amigão!', 'Ai! Uma arma!', 'Não quero confusão!']) : pick(SAUDACOES), 2.6);
        }
      }
    }
    L.extrasAtualizar.forEach(f => f(S, dt));
    // guia (seta para um lugar)
    if (S.guia) { S.guia.t -= dt; const pl = W.places.find(q => q.id === S.guia.id); if (!pl || S.guia.t <= 0 || Math.hypot(pl.x - P.x, pl.y - P.y) < 70) S.guia = null; }
  };

  // ---------- desenho no mundo: marcadores, balões, seta do guia ----------
  L.desenhar = function (ctx, S, inV) {
    const t = S.time;
    W.places.forEach(pl => {
      if (!inV(pl)) return;
      if (pl.tipo === 'loja' && Math.hypot(pl.x - S.player.x, pl.y - S.player.y) > 230) return;   // lojas comuns só mostram o marcador quando você chega perto
      const k = 1 + 0.12 * Math.sin(t * 3 + pl.x);
      ctx.save(); ctx.translate(pl.x, pl.y);
      ctx.fillStyle = pl.cor; ctx.globalAlpha = 0.28; ctx.beginPath(); ctx.arc(0, 0, 17 * k, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
      ctx.setLineDash([5, 4]); ctx.lineDashOffset = -t * 12; ctx.strokeStyle = pl.cor; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 19 * k, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(7, 4); ctx.lineTo(0, 1); ctx.lineTo(-7, 4); ctx.closePath(); ctx.fill();   // seta "entrar"
      ctx.restore();
    });
    L.extrasDesenho.forEach(f => f(ctx, S, inV));

  L.construtores = {};        // id do lugar -> { criar(idSala, lugar) }  (casas.js, mercados.js, hoteis.js...)

  // cria uma sala vazia com o tamanho do chão (w x h) e a barreira da parede de trás
  L.novaSala = function (o) {
    const w = o.w || 660, h = o.h || 395;
    const R = Object.assign({ objs: [], npcs: [], preview: false, bg: null, ph: Math.PI, walk: 0, piso: 'ladrilho', pisoCores: ['#dddddd', '#aaaaaa'], parede: '#888888', nome: '', cor: '#888888' }, o);
    R.x0 = 70; R.y0 = 150; R.x1 = 70 + w; R.y1 = 150 + h; R.W = R.x1 + 70; R.H = R.y1 + 55;
    R.portaX = o.portaX || (R.x0 + R.x1) / 2;
    R.px = R.portaX; R.py = R.y1 - 40;
    R.luzes = o.luzes || [{ x: R.x0 + w / 2, y: R.y0 + h * 0.45, r: Math.max(330, w * 0.45) }];
    R.objs.push(O('barreira', R.x0 - 10, R.y0 - 30, w + 20, 70, { invisivel: true }));
    return R;
  };

  function montar(pl) {
    const cons = L.construtores[pl.id] || L.construtores['tipo:' + pl.tipo];
    let R;
    if (cons) { const lg = { id: pl.id, place: pl, salas: {}, estado: {}, criar: cons.criar }; R = lg.criar('entrada', lg); R.lugar = lg; R.id = R.id || 'entrada'; lg.salas[R.id] = R; }
    else { R = montarLegado(pl); R.lugar = { id: pl.id, place: pl, salas: { entrada: R }, estado: {} }; R.id = 'entrada'; }
    R.place = R.place || pl; R.dentroDesde = G.S ? G.S.time : 0;
    if (R.aoEntrar) R.aoEntrar(G.S, R);
    centraCam(R);
    return R;
  }
  function centraCam(R) { R.cx = clamp(R.px - VW / 2, 0, Math.max(0, R.W - VW)); R.cy = clamp(R.py - 350, 0, Math.max(0, R.H - VH)); }

  // trocar de sala dentro do mesmo lugar (elevador, corredor, piscina, cozinha...)
  L.irSala = function (S, id, px, py, ph) {
    const R0 = S.inside; if (!R0 || S.trans) return;
    G.snd.door();
    L.trans(S, () => {
      const lg = R0.lugar; let R = lg.salas[id];
      if (!R) { R = lg.salas[id] = lg.criar(id, lg); R.lugar = lg; R.id = id; R.place = R.place || lg.place; }
      if (R.aoEntrar) R.aoEntrar(S, R);
      R.px = px != null ? px : R.px; R.py = py != null ? py : R.py; R.ph = ph != null ? ph : Math.PI; R.sentado = null; R.menu = null; R.mini = null;
      S.inside = R; centraCam(R);
    });
  };

  function sair(S) {
    const R = S.inside; if (!R || S.trans) return;
    if (R.aoSair && R.aoSair(S, R) === false) return;
    G.snd.door();
    L.trans(S, () => {
      const P = S.player, pl = R.lugar.place;
      S.mode = 'play'; S.inside = null; P.x = pl.x; P.y = pl.y + 12; P.vx = P.vy = 0; P.h = Math.PI; S.cam.x = P.x; S.cam.y = P.y; S.prompt = '';
    });
  }
  function saidaDaSala(S) { const R = S.inside; if (R.porta && R.porta.para) L.irSala(S, R.porta.para, R.porta.px, R.porta.py, R.porta.ph); else sair(S); }

  function distRect(px, py, o) {
    const z = o.zona || [o.x, o.y - (o.e || 0), o.w, o.h + (o.e || 0)];
    const dx = Math.max(z[0] - px, 0, px - (z[0] + z[2])), dy = Math.max(z[1] - py, 0, py - (z[1] + z[3]));
    return Math.hypot(dx, dy);
  }

  // ---------- atualização de uma sala ----------
  L.atualizarDentro = function (S, dt, K, Kp) {

    S.time += dt; S.dayT += dt / 420; S.prompt = '';
    R.t = (R.t || 0) + dt;
    for (const n of R.npcs) { if (n.p.bub) { n.p.bub.t -= dt; if (n.p.bub.t <= 0) n.p.bub = null; } andaNpc(n, dt); if (n.assustado > 0) n.assustado -= dt; }

      for (const o of R.objs) if (o.solid && x > o.x - 10 && x < o.x + o.w + 10 && y > o.y - (o.e || 0) * 0.35 - 8 && y < o.y + o.h + 8) return false;

  // ---------- as salas ----------
  const ESTILOS = {
    simples: { piso: 'ladrilho', pc: ['#d8d0bc', '#c4bba4'], parede: '#c8c0a8', q: 'ladrilho', qc: ['#cfc6b0', '#bdb49e'] },
    media: { piso: 'madeira', pc: ['#9a7650', '#7e5c3a'], parede: '#d8cdb0', q: 'carpete', qc: ['#8a9ab8', '#7a8aa8'] },
    rica: { piso: 'madeira', pc: ['#5a3a24', '#47301c'], parede: '#e6dcc4', q: 'carpete', qc: ['#7a2a3a', '#6a2232'] }
  };
  function nomeCasa(S, c) { return dono(S, c) ? 'SUA CASA' : aVenda(S, c) ? 'CASA À VENDA' : c.fam ? 'CASA DA FAMÍLIA ' + c.fam.sob.toUpperCase() : 'CASA'; }

  function loot(S, R, o, chave, min, max, msg, ruidoP, extra) {
    const lg = R.lugar, c = lg.casa; c.achados = c.achados || {};
    if (c.achados[chave]) { G.say('Já vasculhei isso aqui. Nada de novo.', 2.2); return; }
    c.achados[chave] = true; const v = money(rand(min, max));
    if (v) { S.save.money += v; G.save(); G.snd.cash(); }
    G.say(msg.replace('$$', '$' + v), 3.5); if (extra) extra(); ruido(S, R, ruidoP);
    if (c.fam && !lg.alarmeFeito) { const acordado = c.fam.membros.find(m => m.n && !m.n.dorme && m.sala === R.id); if (acordado && Math.hypot(acordado.n.x - o.x, acordado.n.y - o.y) < 160) { K.bolha(acordado.n.p, 'EI! O que você está fazendo?! Largue isso!', 4); K.chamaPolicia(S, R, 9); } }
  }

  function salaCasa(S, lg, c) {
    const est = ESTILOS[nivel(c)], v = aVenda(S, c), d = dono(S, c);
    const R = L.novaSala({ w: 600, h: 380, nome: nomeCasa(S, c), cor: d ? '#2e8b3e' : v ? '#d9242a' : '#c8a060', piso: est.piso, pisoCores: est.pc, parede: est.parede });

    if (v) {
      // casa vazia, à venda

    } else {
      add(O('tapete', 110, 270, 240, 120, { solid: false, k: -50 }));
      add(O('tv', 150, 175, 110, 34, { e: 34, label: d ? 'LIGAR A TV' : 'ROUBAR A TV', act: (S, R2, o) => { if (d) { G.say(pick(['Noticiário: a polícia procura um motorista de fuga vermelho...', 'Novela das 8: ela descobriu tudo!']), 4); return; } loot(S, R2, o, 'tv', 70, 200, 'Você levou a TV nos braços e vendeu na hora: $$.', 0.85); } }));
      add(O('sofa', 140, 372, 180, 46, { e: 18, r: 30, label: 'SENTAR NO SOFÁ', act: S => { K.cura(S, 8); G.say('Você relaxou no sofá. (+8 vida)', 2.5); } }));
      add(O('poltrona', 380, 300, 50, 50, { e: 20, r: 28, label: 'SENTAR NA POLTRONA', act: S => { K.cura(S, 5); G.say('Poltrona confortável. (+5 vida)', 2.5); } }));
      add(O('geladeira', 590, 165, 60, 44, { e: 56, label: d ? 'ABRIR A GELADEIRA' : 'MEXER NA GELADEIRA', act: (S, R2) => {
        const st = c.est = c.est || {}; const dia = Math.floor(S.dayT);
        if (d) { if (st.dia === dia) { G.say('Você já pegou comida hoje. Volte amanhã!', 2.8); return; } st.dia = dia; const a = pick(['marmita', 'pao', 'maca', 'guarana', 'linguica']); L.dar(S, a, 2); G.save(); G.say('Você pegou ' + L.ALIM[a].n + ' (x2) na geladeira. Aperte X para comer.', 3.5); return; }
        if (st.lootDia === dia) { G.say('A geladeira já foi esvaziada.', 2.2); return; } st.lootDia = dia; const a = pick(['pao', 'maca', 'banana', 'marmita', 'coxinha', 'guarana', 'cerveja']); L.dar(S, a, 1); G.save(); G.say('Você roubou: ' + L.ALIM[a].n + '. (X para comer)', 3); ruido(S, R2, 0.2);
      } }));
      add(O('fogao', 520, 170, 56, 40, { e: 30, ligado: true }), O('pia', 440, 170, 70, 40, { e: 30 }));

      add(O('cadeira_rest', 430, 335, 22, 26, {}), O('cadeira_rest', 590, 335, 22, 26, {}), O('cadeira_rest', 505, 405, 26, 22, {}));

      if (!d) add(O('bloco', 280, 175, 70, 26, { e: 26, top: '#7a5230', front: '#5a3a22', label: 'VASCULHAR O APARADOR', r: 36, act: (S, R2, o) => loot(S, R2, o, 'aparador', 8, 70, 'Achou trocados na gaveta: $$.', 0.3) }));

      R.deco = x => {
        K.janela(x, 170, 80, 70, 54); K.janela(x, 470, 80, 70, 54);

      };
    }

    R.aoEntrar = (S2, R2) => {
      povoar(S2, R2);
      const lg2 = R2.lugar; if (lg2.avisou || v || d) return; lg2.avisou = true;
      lg2.avisoT = K.armado(S2) ? 1.5 : 4.5;
    };
    R.onUpdate = onUpdate;
    return R;
  }

  function quartosCasa(S, lg, c) {
    const est = ESTILOS[nivel(c)], v = aVenda(S, c), d = dono(S, c);
    const R = L.novaSala({ w: 520, h: 340, nome: nomeCasa(S, c) + ' — QUARTOS', cor: d ? '#2e8b3e' : '#c8a060', piso: est.q, pisoCores: est.qc, parede: est.parede });
    R.casa = c; R.porta = { para: 'entrada', px: 370, py: 200, ph: Math.PI, label: 'VOLTAR PARA A SALA', rotulo: 'SALA' };
    R.portaX = 330; R.px = 330; R.py = R.y1 - 40;
    const add = (...a) => R.objs.push(...a);
    if (v) { add(O('pilha_caixas', 120, 180, 60, 44, { e: 26 })); }
    else {
      add(O('tapete', 220, 300, 200, 90, { solid: false, k: -50 }));
      add(O('cama2', 110, 185, 130, 90, { cor: d ? '#2e8b5e' : '#4a78c8', e: 0, label: d ? 'DORMIR ATÉ AMANHECER (SALVA O JOGO)' : 'DESCANSAR NA CAMA', r: 40, act: S => {
        if (!d) { K.cura(S, 5); G.say('Você deitou na cama dos outros. Que sem-vergonha! (+5 vida)', 3); ruido(S, R, 0.5); return; }

      } }));
      if (!d) {
        const nf = c.fam ? c.fam.membros.length : 0;
        add(O('cama2', 290, 185, 76, 80, { cor: '#e8a040' }), O('cama2', 380, 185, 76, 80, { cor: '#40b8a0' }), O('cama2', 470, 185, 76, 80, { cor: '#b84a8a' }));

        add(O('armario', 110, 400, 110, 44, { e: 64, label: 'VASCULHAR O GUARDA-ROUPA', r: 40, act: (S, R2, o) => loot(S, R2, o, 'armario', 10, nivel(c) === 'rica' ? 160 : 70, 'Escondido entre as roupas: $$.', 0.5) }));
        if (nivel(c) !== 'simples') add(O('cofre', 520, 400, 52, 40, { e: 40, label: 'ARROMBAR O COFRE (TIMING)', r: 40, act: (S, R2, o) => {
          if (c.achados && c.achados.cofre) { G.say('O cofre já foi arrombado.', 2.2); return; }
          L.miniTiming(S, { titulo: 'ARROMBANDO O COFRE', reps: 3, v: 1.3, zona: 0.16, cb: (S3, R3, ok, tot) => {
            if (ok >= 2) { c.achados = c.achados || {}; c.achados.cofre = true; o.aberto = true; const v2 = money(nivel(c) === 'rica' ? rand(300, 900) : rand(120, 380)); S3.save.money += v2; G.save(); G.snd.cash(); G.say('COFRE ABERTO! Você levou $' + v2 + '.', 4); ruido(S3, R3, 0.6); }
            else { G.say('Você errou a combinação. O alarme do cofre disparou!', 3.5); G.snd.beep(); K.chamaPolicia(S3, R3, 8); }
          } });
        } }));
      } else {
        add(O('armario', 110, 400, 110, 44, { e: 64, label: 'ABRIR O GUARDA-ROUPA', act: S => G.say('Suas roupas estão aqui. (Mude o visual na barbearia ou no shopping.)', 3.5) }));
        add(O('bloco', 248, 190, 30, 30, { e: 18, top: '#7a5230', front: '#5a3a22' }));
      }
      add(O('planta', 540, 440, 36, 44, {}));
    }
    R.deco = x => { K.janela(x, 330, 80, 70, 54); x.fillStyle = 'rgba(0,0,0,0.2)'; x.fillRect(70, 138, 520, 6); };
    R.luzes.push({ x: 330, y: 330, r: 260 });
    R.aoEntrar = (S2, R2) => povoar(S2, R2);
    R.onUpdate = onUpdate;
    return R;
  }

  function onUpdate(S, R, dt) {
    const lg = R.lugar; lg.sinc = (lg.sinc || 0) - dt;
    if (lg.sinc <= 0) { lg.sinc = 1.2; sincroniza(S, lg, false); }
    if (lg.avisoT > 0) {
      lg.avisoT -= dt;
      if (lg.avisoT <= 0) {
        const acordado = lg.casa.fam && lg.casa.fam.membros.find(m => m.n && !m.n.dorme && m.sala);
        if (acordado) { K.bolha(acordado.n.p, pick(['QUEM É VOCÊ?! SOCORRO! LADRÃO!', 'O QUE VOCÊ FAZ NA MINHA CASA?! VOU CHAMAR A POLÍCIA!']), 4.5); K.chamaPolicia(S, R, 11); G.say('Os moradores viram você! A polícia vai ser chamada!', 4); G.snd.beep(); }
      }
    }
  }

  function comprar(S, R) {
    const c = R.lugar.casa;
    if (!K.gasta(S, c.preco)) return;
    S.save.casas = S.save.casas || {}; S.save.casas[c.id] = true; G.save();
    G.snd.win && G.snd.win(); G.say('PARABÉNS! Você comprou esta casa por $' + c.preco + '. Agora ela é SUA: durma na cama para salvar!', 6);
    const lg = R.lugar; lg.salas = {}; const R2 = lg.criar('entrada', lg); R2.lugar = lg; R2.id = 'entrada'; R2.place = lg.place; R2.px = R.px; R2.py = R.py; R2.aoEntrar && R2.aoEntrar(S, R2); S.inside = R2;
  }

  // tipos novos usados aqui
  K.tipos.placa_venda = (ctx, o, t) => {
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(o.x + 6, o.y + 14, o.w, 20); ctx.fillStyle = '#7a5a3a'; ctx.fillRect(o.x + 20, o.y + 10, 6, 34); ctx.fillRect(o.x + o.w - 26, o.y + 10, 6, 34);
    ctx.fillStyle = '#d9242a'; ctx.fillRect(o.x, o.y - 12, o.w, 34); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(o.x + 2, o.y - 10, o.w - 4, 30);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 15px Arial'; ctx.fillText('À VENDA', o.x + o.w / 2, o.y + 4); ctx.font = 'bold 11px Arial'; ctx.fillStyle = '#ffe04a'; ctx.fillText('$' + (o.preco || ''), o.x + o.w / 2, o.y + 16); ctx.textAlign = 'left';
  };

  L.construtores['tipo:casa'] = {
    criar(id, lg) {
      const S = G.S, c = lg.place.casa; lg.casa = c;
      if (!lg.ini) { lg.ini = true; iniciaFamilia(S, lg); }
      const R = id === 'entrada' ? salaCasa(S, lg, c) : quartosCasa(S, lg, c);
      R.objs.forEach(o => { if (o.t === 'placa_venda') o.preco = c.preco; });
      return R;
    }
  };

  // usado pelo save: casas compradas aparecem no minimapa
  G.casasDoJogador = S => W.casas.filter(c => dono(S, c));
})(window.G = window.G || {});

</script>
<script>
/* =====================================================================
   MERCADOS.JS — supermercados GIGANTES (Mercadão e Atacadão)
     Por dentro: sala enorme que rola com a câmera. Pegue um CARRINHO, escolha produtos nas
       gôndolas (frutas, doces, bebidas, padaria, congelados...), pague no CAIXA e coma depois (tecla X).
       Sair sem pagar é FURTO: a polícia é chamada. Com uma arma, dá para ameaçar os caixas!
     Por fora: ESTACIONAMENTO de verdade. Carros chegam, estacionam, os donos andam até a porta;
       clientes saem, voltam para o carro e vão embora. Tudo segue o horário do mercado.
   ===================================================================== */
(function (G) {
  'use strict';
  const L = G.lugares, K = L.kit, W = G.world, SP = G.sprites, ALIM = L.ALIM;
  const O = K.O, pick = K.pick, rand = K.rand, TAU = Math.PI * 2;
  const wrap = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };

  // ---------- produtos: preço e categorias ----------
  const PRECO = { banana: 3, maca: 3, laranja: 3, pao: 2, paoqueijo: 4, bolo: 12, coxinha: 5, linguica: 15, espetinho: 8, chocolate: 5, bala: 2, sorvete: 6, brigadeiro: 3, pirulito: 2, agua: 2, guarana: 4, suco: 5, cerveja: 6, energetico: 12, pizza: 18, lasanha: 22, marmita: 14 };
  const CAT = {
    frutas: { t: 'HORTIFRÚTI', ids: ['banana', 'maca', 'laranja'], cores: ['#f2d84a', '#d33a3a', '#f08a1a', '#3a9a3a'] },
    padaria: { t: 'PADARIA', ids: ['pao', 'paoqueijo', 'bolo', 'coxinha'], cores: ['#d8a860', '#e8c070', '#5a3220', '#d89a40'] },
    carnes: { t: 'AÇOUGUE E FRIOS', ids: ['linguica', 'espetinho'], cores: ['#c0504a', '#a8452a', '#e8a0a0', '#d86a5a'] },
    doces: { t: 'DOCES', ids: ['chocolate', 'bala', 'brigadeiro', 'pirulito', 'sorvete'], cores: ['#e84a8a', '#5a3220', '#f8c8e0', '#e8402a', '#f2d02a'] },
    bebidas: { t: 'BEBIDAS', ids: ['agua', 'guarana', 'suco', 'cerveja', 'energetico'], cores: ['#8ac8f0', '#3a9a3a', '#7a3a9a', '#e8b830', '#2ae0e8'] },
    congelados: { t: 'CONGELADOS', ids: ['pizza', 'lasanha', 'marmita'], cores: ['#e8a040', '#d8782a', '#8a6a3a', '#f0f0f0'] },
    sorvetes: { t: 'SORVETES', ids: ['sorvete', 'chocolate'], cores: ['#f8c8e0', '#c8f0c8', '#fff0a0', '#a8d0f8'] },
    limpeza: { t: 'LIMPEZA', ids: [], cores: ['#2a8ae0', '#e8e8f0', '#40c8a0', '#e8d02a'] },
    higiene: { t: 'HIGIENE', ids: [], cores: ['#e8a0c8', '#a0e0f0', '#f8f8f8', '#a0d890'] },
    enlatados: { t: 'MERCEARIA', ids: [], cores: ['#d03a2a', '#e8c030', '#3a7a3a', '#a85a2a'] }
  };
  const GRADE = [['doces', 'doces', 'enlatados', 'bebidas'], ['bebidas', 'higiene', 'congelados', 'congelados'], ['frutas', 'limpeza', 'padaria', 'doces'], ['enlatados', 'limpeza', 'higiene', 'bebidas']];

  const preco = (R, id) => Math.max(1, Math.round(PRECO[id] * R.mult));
  const totalCesta = R => R.cesta.itens.reduce((s, id) => s + preco(R, id), 0);
  function colocar(S, R, id) {
    const cap = R.carrinho ? 24 : 4;
    if (R.cesta.itens.length >= cap) { G.say(R.carrinho ? 'O carrinho está lotado!' : 'Suas mãos estão cheias! Pegue um CARRINHO na entrada.', 3); return; }
    R.cesta.itens.push(id); G.snd.pick && G.snd.pick(); G.say(ALIM[id].n + ' colocado ' + (R.carrinho ? 'no carrinho' : 'na mão') + '. Cesta: $' + totalCesta(R), 2);
  }
  function menuCat(S, R, cat) {
    const c = CAT[cat];
    L.abrirMenu(S, { titulo: c.t, info: (S2, R2) => 'CESTA: ' + R2.cesta.itens.length + ' itens — $' + totalCesta(R2), rodape: 'W/S escolher  ·  E colocar na cesta  ·  ESC fechar',
      itens: c.ids.map(id => ({ n: ALIM[id].n, cor: ALIM[id].cor, desc: 'Recupera ' + ALIM[id].hp + ' de vida' + (ALIM[id].energia ? ' + energia (corre mais)' : '') + (ALIM[id].bebado ? ' (álcool)' : ''), preco: preco(R, id), fn: (S2, R2) => colocar(S2, R2, id) })) });
  }
  function menuCaixa(S, R) {
    const tot = totalCesta(R);
    L.abrirMenu(S, { titulo: 'CAIXA — ' + R.nome, info: () => 'TOTAL $' + totalCesta(R), rodape: 'E confirmar  ·  ESC voltar às compras',
      itens: [
        { n: 'PAGAR TUDO', desc: R.cesta.itens.length + ' itens na cesta', preco: tot, fn: (S2, R2) => {

          if (!K.gasta(S2, t)) return;

          G.say('Compra paga: ' + n + ' itens por $' + t + '. Está na MOCHILA — aperte X para comer!', 5); return 'fechar';
        } },
        { n: 'DEVOLVER TUDO ÀS PRATELEIRAS', fn: (S2, R2) => { R2.cesta.itens.length = 0; G.say('Você devolveu tudo.', 2.5); return 'fechar'; } }
      ] });

  // ---------- por dentro ----------
  const sala = { w: 1100, h: 700 };
  function criarSala(id, lg) {

    R.mult = pl.id === 'atacadao' ? 0.8 : 1; R.cesta = { itens: [] }; R.carrinho = null;
    R.hudTxt = (S2, R2) => (R2.cesta.itens.length ? 'CESTA: ' + R2.cesta.itens.length + ' itens — $' + totalCesta(R2) + (R2.carrinho ? '  (carrinho)' : '  (mãos)') : '');
    const add = (...a) => R.objs.push(...a);
    // seções do fundo
    add(O('balcao_padaria', 120, 195, 220, 30, { e: 28, label: 'COMPRAR NA PADARIA', r: 40, act: S2 => menuCat(S2, R, 'padaria') }));

    if (p.rev) { c.vx = -Math.sin(c.a) * v; c.vy = Math.cos(c.a) * v; c.x += c.vx * dt; c.y += c.vy * dt; c.steer = 0; }

      // limpa carros que sumiram
      m.carros = m.carros.filter(c => S.cars.includes(c) && !c.removeMe);

      // chegadas

        const livres = m.vagas.map((v, k) => k).filter(k => m.vagaLivre[k]); if (!livres.length) return;
        const k = pick(livres), v = m.vagas[k], c = new G.Car({ x: m.gateX + 700, y: m.laneY, a: -Math.PI / 2, kind: Math.random() < 0.12 ? 'taxi' : 'sedan', color: pick(CORES), driver: 'ai', mode: 'script' });
        c.vx = -80; c.vy = 0; c.vaga = k; m.vagaLivre[k] = false; criaScript(S, m, c, pontosChegada(m, v), 'chega', k); m.carros.push(c);
      }
    });
  });
})(window.G = window.G || {});

  // ---------- quartos alugados ----------
  const reservaDe = (S, id) => { const q = S.save.quartos && S.save.quartos[id]; return q && S.dayT <= q.ate ? q : null; };
  function alugar(S, R, hotel, tipo, nome, preco) {
    if (reservaDe(S, hotel.id)) { G.say('Você já tem um quarto aqui (nº ' + reservaDe(S, hotel.id).n + '). Suba pelo elevador.', 3.5); return; }

    S.save.quartos[hotel.id] = { n, tipo, nome, ate: Math.ceil(S.dayT) + 0.1667 }; G.save();
    G.say('Quarto ' + n + ' (' + nome + ') alugado por $' + preco + '! Use o ELEVADOR. Vale até as 10h de amanhã.', 6); G.snd.cash();
  }
  function menuRecepcao(S, R, hotel, nv) {
    const q = reservaDe(S, hotel.id);
    const itens = nv.quartos.map(([tipo, nome, preco]) => ({ n: nome, preco, desc: 'check-out às 10h do dia seguinte' + (tipo === 'suite' ? ' · jacuzzi e vista' : tipo === 'pensao' ? ' · sem comentários...' : ''), fn: (S2, R2) => { alugar(S2, R2, hotel, tipo, nome, preco); return 'fechar'; } }));
    L.abrirMenu(S, { titulo: 'RECEPÇÃO — ' + hotel.nome, itens, info: q ? 'SEU QUARTO: ' + q.n : '', rodape: 'E alugar  ·  ESC sair' });
  }

  // ---------- hóspedes com rotina ----------
  function gerarHospedes(pl, nv) {
    const r = W.mulberry32(pl.nome.length * 977 + 11), n = nv.hospedes, g = [];
    const perfis = ['turista', 'executivo', 'noturno'];
    for (let i = 0; i < n; i++) {
      const fem = r() < 0.45, lk = SP.randomLook(); lk.fem = fem; lk.dress = fem && r() < 0.5;
      g.push({ i, nome: pick(fem ? V.NOMES_F : V.NOMES_M) + ' ' + pick(V.SOBRENOMES), p: lk, perfil: perfis[Math.floor(r() * 3)], quarto: i, dinheiro: Math.round((40 + r() * (pl.nivel === 'luxo' ? 400 : 120)) / 5) * 5, sala: null, n: null, at: null });
    }
    return g;
  }
  function atividade(g, h, nv) {
    const e = (a, b) => a <= b ? h >= a && h < b : h >= a || h < b;
    const lazer = nv.piscina ? 'piscina' : 'saguao';
    switch (g.perfil) {
      case 'executivo': return e(6, 7.5) ? 'comer' : e(7.5, 18) ? 'fora' : e(18, 19.5) ? 'saguao' : e(19.5, 21) ? 'comer' : 'quarto';
      case 'noturno': return e(6, 14) ? 'quarto' : e(14, 17) ? lazer : e(17, 19) ? 'saguao' : e(19, 24) ? 'comer' : e(0, 3) ? 'saguao' : 'quarto';
      default: return e(6, 7) ? 'quarto' : e(7, 10) ? 'comer' : e(10, 15) ? lazer : e(15, 17) ? 'saguao' : e(17, 21.5) ? 'comer' : 'quarto';
    }
  }
  const TXT_AT = { comer: 'no restaurante', piscina: 'na piscina', saguao: 'no saguão', quarto: 'no quarto', fora: 'passeando pela cidade' };
  function destino(lg, g, at, S) {
    const salas = lg.salas;
    if (at === 'quarto' || at === 'fora') return null;
    if (at === 'comer') { const n = lg.nCad || 24; const k = (g.i * 3 + 1) % n; return { sala: 'restaurante', cad: k, sentado: true }; }
    if (at === 'piscina') { const k = g.i % 6; return { sala: 'piscina', x: 150 + (k % 3) * 120 + 20, y: k < 3 ? 222 : 492, sentado: true, h: 0 }; }
    return { sala: 'lobby', x: pick([160, 220, 660, 720, 300, 450, 600]), y: pick([420, 420, 330, 300]), h: Math.PI };
  }
  function npcDe(g) { return { x: 0, y: 0, p: g.p, nome: g.nome, dinheiro: g.dinheiro, falas: falasHospede(g), h: Math.PI, g, v: 56 }; }
  function falasHospede(g) {
    const a = ['Estou hospedado aqui há ' + (2 + g.i) + ' dias.', 'Este hotel é ótimo para descansar.', 'Cuidado com o chão molhado perto da piscina!', 'Já provou o café da manhã daqui?', g.perfil === 'executivo' ? 'Viajo a trabalho. Reunião às 9h.' : g.perfil === 'noturno' ? 'Sou de ficar acordado até tarde...' : 'Estou de férias! A cidade é linda.'];
    return a;
  }
  function sincroniza(S, lg, R, snap) {
    const nv = lg.nv, h = L.hora(S);
    lg.hospedes.forEach(g => {
      const at = atividade(g, h, nv); if (g.at === at && !snap) return; g.at = at;
      const d = destino(lg, g, at, S), antes = g.sala; g.dest = d; g.sala = d ? d.sala : null;
      if (snap || !R) { g.n = null; return; }
      const i = R.npcs.indexOf(g.n);
      if (antes === R.id && g.sala !== R.id) { // some pela porta mais próxima
        if (g.n && i >= 0) { const n = g.n; n.semColisao = true; K.rota(n, [{ x: R.chegada.x, y: R.chegada.y }], nn => { const j = R.npcs.indexOf(nn); if (j >= 0) R.npcs.splice(j, 1); }); }
        g.n = null; return;
      }
      if (g.sala === R.id) {
        let n = g.n; if (!n || i < 0) { n = npcDe(g); n.x = R.chegada.x; n.y = R.chegada.y; g.n = n; R.npcs.push(n); }
        coloca(R, g, n, false);
      }
    });
  }
  // põe o hóspede no seu lugar final (snap) ou manda andar até lá
  function coloca(R, g, n, snap) {
    const d = g.dest; let x = d.x, y = d.y;
    if (d.cad != null) { const c = R.cadeiras[d.cad % R.cadeiras.length]; if (R.sentado && R.sentado.o === c) return; x = c.x + c.w / 2; y = c.y + c.h / 2 - 2; n.cad = c; d.h = c.h2; }
    n.sentado = false; n.semColisao = !!d.sentado;
    const fim = nn => { nn.sentado = !!d.sentado; if (d.h != null) nn.h = d.h; if (d.cad != null) nn.leva = Math.random() < 0.6 ? '#c8782a' : null; };
    if (snap) { n.x = x; n.y = y; fim(n); return; }
    const lane = R.id === 'restaurante' ? 235 : R.id === 'piscina' ? 235 : 255;
    K.rota(n, [{ x: n.x, y: lane }, { x, y: lane }, { x, y }], fim);
  }
  function povoar(S, R) {
    const lg = R.lugar; R.npcs.length = 0; R.npcs.push(...(R.fixos || []));
    lg.hospedes.forEach(g => { if (g.sala === R.id && g.dest) { const n = npcDe(g); g.n = n; R.npcs.push(n); coloca(R, g, n, true); } else if (g.n) g.n = null; });
  }

  // ---------- as salas ----------
  const porta = (x, y, w, o) => O('porta', x, y, w, 54, Object.assign({ solid: false, k: 10, r: 50 }, o));
  const lookStaff = o => Object.assign(SP.randomLook(), { acc: 'none' }, o);
  function nova(lg, id, o) {
    const nv = lg.nv, R = L.novaSala(Object.assign({ place: lg.place, nome: lg.place.nome, cor: lg.place.cor, piso: nv.piso, pisoCores: nv.pc, parede: nv.parede }, o));
    R.chegada = { x: R.portaX, y: R.y1 - 30 }; R.fixos = []; R.id = id;
    R.aoEntrar = (S, R2) => { povoar(S, R2); };
    R.onUpdate = (S, R2, dt) => { const g = R2.lugar; g.sinc = (g.sinc || 0) - dt; if (g.sinc <= 0) { g.sinc = 1.5; sincroniza(S, g, R2, false); } if (R2.extra) R2.extra(S, R2, dt); };

  const fixo = (R, n) => { R.fixos.push(n); R.npcs.push(n); return n; };

    if (nv.piscina) add(porta(730, 96, 60, { estilo: 'vai-vem', placa: 'PISCINA', label: 'IR À PISCINA', act: S2 => L.irSala(S2, 'piscina', 160, 590, Math.PI) }));
    add(O('sofa', 110, 420, 170, 44, { e: 18, r: 30, label: 'SENTAR NO SOFÁ', act: S2 => { K.cura(S2, 6); G.say('Sofá macio. (+6 vida)', 2.5); } }), O('sofa', 620, 420, 170, 44, { e: 18, r: 30, label: 'SENTAR NO SOFÁ', act: S2 => { K.cura(S2, 6); G.say('Sofá macio. (+6 vida)', 2.5); } }));
    add(O('planta', 90, 190, 40, 50, {}), O('planta', 780, 330, 40, 50, {}), O('planta', 90, 330, 40, 50, {}));
    if (luxo) add(O('planta', 270, 250, 36, 44, {}), O('planta', 600, 250, 36, 44, {}));
    add(O('bloco', 780, 440, 40, 40, { e: 40, top: '#c8a24a', front: '#a8822a', label: 'PEGAR UM CARRINHO DE BAGAGEM', act: S2 => G.say('Para quê? Você viaja com pouca bagagem...', 2.5) }));

      if (!luxo && pl.nivel === 'feio') { x.fillStyle = 'rgba(0,0,0,0.25)'; for (let k = 0; k < 7; k++) x.fillRect(110 + k * 91, 70 + (k * 37) % 50, 5 + k % 3 * 6, 18 + k % 4 * 7); x.fillStyle = 'rgba(0,0,0,0.12)'; x.fillRect(70, 150, 760, 420); }
      K.cartaz(x, 300, 74, 54, 44, '#e8e0d0', ['RECEPÇÃO']);

    const rec = fixo(R, { x: 450, y: 172, p: lookStaff({ shirt: luxo ? '#1a1a2e' : '#2a58b8', pat: 'liso', sleeve: 'longa', fem: true, hairStyle: 'coque' }), falas: ['Bem-vindo ao ' + pl.nome + '!', 'Posso ajudar? Temos quartos disponíveis.'], h: Math.PI, nome: 'Recepcionista', label: 'ALUGAR UM QUARTO', act: S2 => menuRecepcao(S2, R, pl, nv), ameacavel: true, dinheiro: Math.round(rand(100, luxo ? 700 : 250)), semColisao: true });
    rec.ameaca = (S2, R2, n) => { if (n.roubado) { K.bolha(n.p, 'O caixa está vazio!', 3); return; } n.roubado = true; K.bolha(n.p, 'Pega! Pega tudo! Não me machuca!', 4); S2.save.money += n.dinheiro; G.save(); G.snd.cash(); G.say('ASSALTO À RECEPÇÃO! Você levou $' + n.dinheiro + '.', 4); K.chamaPolicia(S2, R2, 5); };
    fixo(R, { x: 450, y: 520, p: lookStaff({ shirt: '#8a1f3a', pat: 'liso', sleeve: 'longa', acc: 'cap', accCol: '#8a1f3a', fem: false }), falas: ['Boa estadia, senhor!', 'O restaurante fica à esquerda e o elevador à direita.', 'Precisa de ajuda com as malas?'], h: Math.PI, nome: 'Porteiro' });
    return R;
  }

  function restaurante(S, lg) {
    const pl = lg.place, nv = lg.nv, luxo = pl.nivel === 'luxo', menu = menuComida(pl.nivel, nv);
    const R = nova(lg, 'restaurante', { w: 920, h: 460, portaX: 220, nome: pl.nome + ' — RESTAURANTE', cor: pl.cor });
    R.porta = { para: 'lobby', px: 160, py: 210, ph: Math.PI, label: 'VOLTAR AO SAGUÃO', rotulo: 'SAGUÃO' };
    R.chegada = { x: 220, y: 580 }; R.cadeiras = []; R.mesas = [];
    const add = (...a) => R.objs.push(...a);
    const toalha = luxo ? '#f4ecd8' : pl.nivel === 'feio' ? '#b8a888' : '#e8e4d8';
    const cols = [150, 370, 590, 810], rows = [290, 410, 530];
    let ci = 0;
    rows.forEach((y, j) => cols.forEach((x, i) => {
      if (x < 300 && y > 480) return;   // espaço da porta
      const mesa = O('mesa_rest', x, y, 90, 60, { e: 16, toalha, cor: luxo ? '#c8a24a' : '#c8302a' }); R.mesas.push(mesa); add(mesa);
      [[x - 32, y + 14, Math.PI / 2 * 1], [x + 98, y + 14, -Math.PI / 2]].forEach(([cx, cy, ph], k) => {
        const c = O('cadeira_rest', cx, cy, 24, 28, { solid: false, cor: luxo ? '#7a2a3a' : '#5a4a3a', ph: k ? -Math.PI / 2 : Math.PI / 2, h2: k ? -Math.PI / 2 : Math.PI / 2, mesa, label: 'SENTAR À MESA', r: 30, sai: { x: cx + 12, y: cy + 44 }, menuLabel: 'ABRIR O CARDÁPIO' });
        c.act = S2 => { if (R.npcs.some(n => n.cad === c && n.sentado)) { G.say('Esta cadeira está ocupada.', 2); return; } L.kit.sentar(S2, c); };
        c.menu = S2 => menuCardapio(S2, R, c, menu, pl);
        R.cadeiras.push(c); add(c); ci++;
      });
    }));
    lg.nCad = R.cadeiras.length;
    add(porta(850, 96, 64, { estilo: 'vai-vem', placa: 'COZINHA', label: 'ENTRAR NA COZINHA', act: S2 => L.irSala(S2, 'cozinha', 500, 640, Math.PI) }));
    add(O('planta', 90, 190, 40, 50, {}), O('planta', 930, 560, 40, 50, {}));
    R.deco = x => {
      K.neon(x, 'RESTAURANTE', 400, 110, 24, luxo ? '#ffd24a' : '#ff8a6a');
      for (let k = 0; k < 4; k++) K.janela(x, 120 + k * 150, 76, 70, 56);
      if (luxo) { x.fillStyle = 'rgba(200,162,74,0.5)'; x.fillRect(70, 138, 920, 5); }
    };
    R.luzes = luxo ? [{ x: 300, y: 380, r: 300 }, { x: 700, y: 380, r: 300 }] : [{ x: 500, y: 380, r: 380 * nv.luz }];
    // garçons
    const gar = (x, y) => fixo(R, { x, y, p: lookStaff({ shirt: '#f4f4f4', pat: 'liso', sleeve: 'longa', pants: '#16161a', fem: false, hairStyle: 'curto' }), falas: ['O cardápio está na mesa. É só sentar!', 'Hoje o prato do dia está ótimo.', 'Com licença!'], h: Math.PI, nome: 'Garçom', home: { x, y }, v: 130, semColisao: true, livre: true, ameacavel: true, dinheiro: Math.round(rand(20, 90)) });
    R.garcons = [gar(760, 215), gar(690, 215)];
    R.pedido = null;
    R.extra = (S2, R2, dt) => garcom(S2, R2, dt);
    R.cozPt = { x: 880, y: 205 };

  }
  function menuCardapio(S, R, cadeira, menu, pl) {
    const h = L.hora(S);
    L.abrirMenu(S, { titulo: 'CARDÁPIO — ' + pl.nome, info: () => R.pedido ? 'Seu pedido está sendo preparado...' : '', rodape: 'W/S escolher  ·  E pedir  ·  ESC fechar',
      itens: menu.map(it => ({ n: it.n, cor: it.cor, desc: (it.h ? it.desc + ' · ' : '') + 'recupera ' + it.hp + ' de vida' + (it.bebado ? ' (álcool)' : '') + (it.energia ? ' + energia' : ''), preco: it.preco, fn: (S2, R2) => {
        if (R2.pedido) { G.say('Calma! Seu pedido anterior ainda não chegou.', 2.5); return; }
        if (it.h && (h < it.h[0] || h >= it.h[1])) { G.say('O ' + it.n + ' é servido só até às ' + Math.floor(it.h[1]) + 'h.', 3); return; }
        if (S2.player.hp >= 100 && !it.bebado && !it.energia) { G.say('Você está com a vida cheia, mas pode pedir assim mesmo.', 2); }
        if (!K.gasta(S2, it.preco)) return;
        const g = R2.garcons.find(w => !w.ocupado) || R2.garcons[0]; g.ocupado = true;
        R2.pedido = { cad: cadeira, it, w: g, est: 'vindo', t: 0 };
        const cx = cadeira.x + cadeira.w / 2, cy = cadeira.y + cadeira.h + 18;
        K.rota(g, [{ x: g.x, y: 235 }, { x: cx, y: 235 }, { x: cx, y: cy }], () => { R2.pedido.est = 'anota'; R2.pedido.t = 1.5; g.h = Math.atan2(cadeira.x - g.x, 0); K.bolha(g.p, 'Boa escolha! Já volto com o seu pedido.', 3); });
        G.say('Pedido feito: ' + it.n + ' ($' + it.preco + '). O garçom já vem anotar...', 3.5); return 'fechar';
      } })) });
  }
  // máquina de estados do garçom: vindo -> anota -> cozinha -> prepara -> entrega -> servido
  function garcom(S, R, dt) {
    for (const w of R.garcons) if (!w.ocupado && (!w.rota || !w.rota.length) && !w.alvo && Math.hypot(w.x - w.home.x, w.y - w.home.y) > 6) K.rota(w, [{ x: w.x, y: 235 }, { x: w.home.x, y: 235 }, w.home]);
    const p = R.pedido; if (!p) return;
    const g = p.w, cad = p.cad; p.t -= dt;
    const cx = cad.x + cad.w / 2, cy = cad.y + cad.h + 18;
    if (p.est === 'anota' && p.t <= 0) { p.est = 'cozinha'; K.rota(g, [{ x: g.x, y: 235 }, { x: R.cozPt.x, y: 235 }, R.cozPt], () => { p.est = 'prepara'; p.t = 3.5; K.bolha(g.p, 'Mesa ' + (R.cadeiras.indexOf(cad) + 1) + ': ' + p.it.n + '!', 3); }); }
    else if (p.est === 'prepara' && p.t <= 0) { p.est = 'entrega'; g.leva = p.it.cor; K.rota(g, [{ x: g.x, y: 235 }, { x: cx, y: 235 }, { x: cx, y: cy }], () => { p.est = 'servido'; p.t = 0.5; }); }
    else if (p.est === 'servido' && p.t <= 0) {
      g.leva = null; g.h = Math.atan2(cad.x - g.x, 0);
      const sentado = R.sentado && R.sentado.o === cad;
      if (sentado) {
        const it = p.it; K.cura(S, it.hp); if (it.bebado) S.bebado = (S.bebado || 0) + it.bebado; if (it.energia) S.energia = (S.energia || 0) + it.energia;
        K.bolha(g.p, 'Aqui está! Bom apetite!', 3.5); G.say('Você comeu: ' + it.n + '  (+' + it.hp + ' vida)', 4); cad.mesa.prato = it.cor; cad.mesa.pratoAte = R.t + 14;
      } else { S.save.money += p.it.preco; G.save(); K.bolha(g.p, 'Ué, o cliente foi embora... valor devolvido.', 3.5); G.say('Você saiu da mesa: o pedido foi cancelado e devolvido ($' + p.it.preco + ').', 4); }
      g.ocupado = false; R.pedido = null;
    }
    R.mesas.forEach(m => { if (m.prato && R.t > m.pratoAte) m.prato = null; });
  }

      add(O('sofa', x0 + 40, y0 + tp.h - 80, 170, 44, { e: 18, r: 30, label: 'SENTAR NO SOFÁ', act: S2 => { K.cura(S2, 8); G.say('Sofá de couro. (+8 vida)', 2.5); } }));
      add(O('poltrona', x0 + w - 130, y0 + tp.h - 100, 50, 50, { e: 20, r: 28, label: 'SENTAR NA POLTRONA', act: S2 => { K.cura(S2, 5); G.say('Muito confortável. (+5 vida)', 2.5); } }));

  K.tipos.cadeira_rest = K.tipos.cadeira_rest;   // (já definido em moveis.js)

<script>
/* =====================================================================
   ACADEMIA.JS — academia que FUNCIONA: compre o passe, treine e fique mais forte!
     • PASSE DO DIA na recepção ($15) — vale 24 horas do jogo
     • esteira = FÔLEGO (você corre mais rápido) · supino, halteres e saco de pancada = FORÇA (socos mais fortes)
     • cada treino é um mini-jogo: aperte E quando o ponteiro estiver na faixa verde
     • treinar cansa! Depois de 4 treinos seguidos beba água para descansar
     • tem instrutor, frequentadores treinando e uma lanchonete de suplementos
   ===================================================================== */
(function (G) {
  'use strict';
  const L = G.lugares, K = L.kit, W = G.world, SP = G.sprites, ALIM = L.ALIM;
  const O = K.O, pick = K.pick, rand = K.rand, TAU = Math.PI * 2;
  const ac = W.places.find(p => p.id === 'academia'); if (ac) ac.horario = [5, 23];
  const passe = S => S.save.passe && S.dayT < S.save.passe;

  // o saco de pancada
  K.tipos.saco = (ctx, o, t) => {
    const bal = Math.sin(t * 2 + o.x) * (o.bate > 0 ? 6 : 1.5), cx = o.x + o.w / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(cx + 4, o.y + o.h + 4, 14, 7, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#999'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, o.y - 58); ctx.lineTo(cx + bal * 0.4, o.y - 40); ctx.stroke();
    const g = ctx.createLinearGradient(cx - 12, 0, cx + 12, 0); g.addColorStop(0, '#d03a2a'); g.addColorStop(0.5, '#f06a4a'); g.addColorStop(1, '#8a1f14');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx - 11 + bal * 0.4, o.y - 40); ctx.lineTo(cx + 11 + bal * 0.4, o.y - 40); ctx.lineTo(cx + 10 + bal, o.y + 2); ctx.lineTo(cx - 10 + bal, o.y + 2); ctx.closePath(); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#222'; ctx.fillRect(cx - 11 + bal * 0.3, o.y - 24, 22, 3);
  };
  K.tipos.espelho = (ctx, o) => { ctx.fillStyle = '#0a0c12'; ctx.fillRect(o.x - 3, o.y - 3, o.w + 6, o.h + 6); const g = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y + o.h); g.addColorStop(0, '#a8c8e0'); g.addColorStop(0.5, '#e8f4ff'); g.addColorStop(1, '#88a8c8'); ctx.fillStyle = g; ctx.fillRect(o.x, o.y, o.w, o.h); };

  function cansa(S, R) { R.fadiga = (R.fadiga || 0) + 1; }
  function treinar(S, R, o, tipo) {
    if (!passe(S)) { G.say('Você precisa do PASSE DO DIA ($15). Fale com a recepcionista.', 3.5); return; }
    if ((R.fadiga || 0) >= 4) { G.say('Você está EXAUSTO! Beba água no bebedouro para recuperar o fôlego.', 3.5); return; }
    const forca = tipo !== 'cardio', max = 5, atual = forca ? (S.save.forca || 0) : (S.save.folego || 0);
    if (atual >= max) { G.say(forca ? 'Força no máximo! Você já é um touro (5/5).' : 'Fôlego no máximo (5/5)! Você corre como um atleta.', 3.5); return; }
    const cfg = { cardio: { t: 'CORRIDA NA ESTEIRA', reps: 4, v: 1.5, zona: 0.15, ok: 3 }, peso: { t: 'LEVANTAMENTO DE PESO', reps: 3, v: 1.3, zona: 0.16, ok: 2 }, saco: { t: 'SACO DE PANCADA', reps: 5, v: 1.7, zona: 0.14, ok: 4 } }[tipo];
    L.miniTiming(S, { titulo: cfg.t + '  —  ' + (forca ? 'Força ' : 'Fôlego ') + atual + '/5', reps: cfg.reps, v: cfg.v, zona: cfg.zona, cb: (S2, R2, ok) => {
      cansa(S2, R2); S2.player.hp = Math.max(1, S2.player.hp - 4);
      if (o) o.bate = 1.2;
      if (ok >= cfg.ok) { if (forca) S2.save.forca = (S2.save.forca || 0) + 1; else S2.save.folego = (S2.save.folego || 0) + 1; G.save(); G.snd.win && G.snd.win(); G.say('BOM TREINO! ' + (forca ? 'Força ' + S2.save.forca + '/5 — socos mais fortes!' : 'Fôlego ' + S2.save.folego + '/5 — você corre mais!'), 4.5); }

    } });
  }
  function menuLanche(S, R) {

    L.abrirMenu(S, { titulo: 'LANCHONETE FIT', rodape: 'E comprar (vai para a mochila)  ·  ESC sair', itens: itens.map(([id, p]) => ({ n: ALIM[id].n, preco: p, cor: ALIM[id].cor, desc: 'recupera ' + ALIM[id].hp + ' de vida' + (ALIM[id].energia ? ' + energia (corre mais por um tempo)' : ''), fn: S2 => { if (!K.gasta(S2, p)) return; L.dar(S2, id, 1); G.save(); G.say(ALIM[id].n + ' na mochila (X para consumir).', 2.5); } })) });
  }

  L.construtores.academia = {
    criar(id, lg) {
      const pl = lg.place, S = G.S;
      const R = L.novaSala({ place: pl, w: 860, h: 480, nome: pl.nome, cor: pl.cor, piso: 'borracha', pisoCores: ['#2a2a32', '#3c3c46'], parede: '#34343f', portaX: 480, subtitulo: 'aberta das 5h às 23h' });
      R.fadiga = 0; R.chegada = { x: 480, y: 600 };

    add(O('balcao', 230, 190, 260, 40, { e: 28, itens: c.balcao, label: c.label, r: 46, act: menu }));
    c.extras(R, add, pl);
    R.deco = x => { c.deco && c.deco(x, pl); letreiro(x, pl, c.neon); };
    const at = { k: 232, x: 360, y: 206, p: look(c.atendente), falas: c.falas, h: Math.PI, fixo: true, nome: pick(['Seu Carlos', 'Dona Rita', 'Marcos', 'Luana', 'Seu Antônio', 'Fátima', 'Rogério', 'Camila']), dinheiro: Math.round(rand(60, 220)), label: 'CONVERSAR / ASSALTAR' };

<script>
/* ============================================================
   overlay.js — telas por cima do jogo (Central de Câmeras, painel do Olho de Deus...)
   Qualquer arquivo pode registrar uma tela e um atalho de teclado.
   O game.js chama G.overlay.quadro() uma vez por quadro.
   ============================================================ */
(function (G) {
  'use strict';
  const O = G.overlay = {
    atual: null,          // a tela aberta agora (ou null)
    atalhos: {},          // 'KeyC' -> função(S) que abre uma tela
    teclas: null          // o game.js coloca aqui o objeto das teclas apertadas neste quadro
  };
  O.abrir = function (tela) { if (O.atual && O.atual.fecha) O.atual.fecha(); O.atual = tela; if (tela && tela.abre) tela.abre(G.S); };
  O.fechar = function () { const t = O.atual; O.atual = null; if (t && t.fecha) t.fecha(); };
  // o jogo fica bloqueado (sem teclas) enquanto uma tela está aberta
  O.bloqueado = () => !!O.atual;
  // pode abrir telas agora? (não no título, nem no meio de uma transição, nem com menu aberto)
  O.podeAbrir = function (S) {
    if (!S || S.trans) return false;
    if (S.mode === 'play') return true;
    if (S.mode === 'inside') { const R = S.inside; return !!R && !R.menu && !R.mini && !R.sentado; }
    return false;
  };
  // chamado pelo game.js no começo de cada quadro (depois do título)
  O.entrada = function (S, pressed) {
    if (O.atual) {
      for (const k in pressed) { if (O.atual.tecla) O.atual.tecla(k, S); if (!O.atual) break; }
      for (const k in pressed) delete pressed[k];   // o jogo não vê essas teclas
      return;
    }
    for (const k in pressed) {
      if (O.atalhos[k] && O.podeAbrir(S)) { O.atalhos[k](S); delete pressed[k]; }
    }
  };
  // chamado pelo game.js no fim do quadro, desenha por cima de tudo
  O.desenhar = function (ctx, S, dt) {
    if (O.atual && O.atual.desenha) O.atual.desenha(ctx, S, dt);
    else if (O.hudFns) for (const f of O.hudFns) f(ctx, S);
  };
  // lista de rotinas que rodam todo quadro (jogando ou dentro de lugares): pedágio, câmeras, Olho, FBI...
  G.extras = {
    lista: [],
    add(f) { this.lista.push(f); },
    atualizar(S, dt) { for (const f of this.lista) { try { f(S, dt); } catch (e) { if (G.olho && G.olho.erro) G.olho.erro(e, 'extras'); else throw e; } } }
  };

<script>

    shopping: { tam: 'g', and: 3, dur: [740, 860], nome: () => 'SHOPPING VALE VERDE', cor: '#d07a1a', extra: 'shopping' },

<script>
/* ============================================================
   cameras.js — câmeras de segurança de VERDADE

(function (G) {

  const AVENIDAS = ['Av. Independência', 'Av. Presidente Vargas', 'Av. João Fiúza', 'Av. do Rio', 'Av. Francisco Junqueira', 'Av. Nove de Julho', 'Av. Costábile Romano', 'Av. Brasil', 'Av. Saudade', 'Av. da Ponte', 'Av. Novo Horizonte', 'Av. das Obras', 'Av. do Progresso', 'Av. Beira-Rio', 'Av. Vale Verde', 'Av. Aeroporto', 'Av. das Palmeiras', 'Av. Final'];

  // texto de localização completo: cidade + rua + quadra
  CM.onde = function (x, y) {
    const r = C.regiaoDe(x, y), bx = Math.floor((x / T - W.MG - W.ROAD) / W.PITCH), by = Math.floor((y / T - W.MG - W.ROAD) / W.PITCH);

  // ---------- câmeras dentro das salas ----------

  [[1, 1], [4, 3], [6, 2], [8, 5], [2, 5], [5, 0], [2, 7], [5, 7], [18, 2], [19, 5], [25, 3], [26, 6], [32, 2], [33, 5]].forEach(([i, j], k) => {

    abre(S) { CM.aberta = true; this.quadro = 0; },
    fecha() { CM.aberta = false; if (this.tl) { C.vel = 1; this.tl = false; } this.cheio = false; },
    lista() { const cat = FILTROS[this.filtro][1]; return CM.catalogo().filter(f => !cat || f.cat === cat); },

      ctx.fillStyle = '#7dffb0'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'left'; ctx.fillText('CENTRAL DE CÂMERAS', 14, 28);

      ctx.font = 'bold 11px Arial'; ctx.textAlign = 'left';

    }

<script>
/* ============================================================
   olho.js — O OLHO DE DEUS
   Um sistema INVISÍVEL: o jogador nunca o vê dentro do jogo. Ele observa tudo, o tempo todo,
   e só resolve problemas:
     • carros travados, fora do mapa, dentro de parede, empilhados ou com números quebrados;
     • pedestres e jogador presos em paredes; dinheiro/vida quebrados; telas inconsistentes;
     • salas com objetos inalcançáveis, NPCs presos, erros de JavaScript, queda de desempenho.
   Cada coisa achada vira um RELATÓRIO no "super cache" (guardado no navegador) com todos os detalhes
   (posição, rua, tipo do carro, estado, o que foi feito para consertar).
   F9 abre o painel para VOCÊ ler os relatórios. No console: G.olho.relatorio()  /  G.olho.exportar()
   ============================================================ */
(function (G) {
  'use strict';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  let sujo = false, salvaT = 0;
  function salva() {
    if (!sujo) return; sujo = false;
    try { localStorage.setItem(KEY, JSON.stringify({ seq: O.seq, cache: O.cache.slice(-120) })); } catch (e) { try { localStorage.setItem(KEY, JSON.stringify({ seq: O.seq, cache: O.cache.slice(-30) })); } catch (e2) { } }
  }
  carrega();

  // descreve um objeto sem pegar nada pesado (só números, textos e um nível de objetos pequenos)
  function snap(e) {
    const o = {};
    if (!e) return o;
    let n = 0;
    for (const k in e) {
      const v = e[k]; if (n > 60) break;
      if (typeof v === 'number') { o[k] = fin(v) ? Math.round(v * 100) / 100 : String(v); n++; }
      else if (typeof v === 'string' || typeof v === 'boolean') { o[k] = v; n++; }
      else if (v && typeof v === 'object' && !Array.isArray(v) && (k === 'nav' || k === 'look' || k === 'threat') && n < 50) { o[k] = {}; for (const q in v) { const w = v[q]; if (typeof w === 'number' || typeof w === 'string' || typeof w === 'boolean') o[k][q] = typeof w === 'number' && fin(w) ? Math.round(w * 100) / 100 : w; } }
    }
    return o;
  }
  function lugarDe(e) {
    if (!e || !fin(e.x) || !fin(e.y)) return { tile: null, onde: 'posição inválida' };
    const tx = Math.floor(e.x / T), ty = Math.floor(e.y / T), nomes = ['RUA', 'CALÇADA', 'PRÉDIO', 'GRAMA', 'ÁGUA', 'PONTE', 'FAIXA', 'ESTACIONAMENTO'];
    const tp = W.tileAt(e.x, e.y);

  }
  O.snap = snap; O.lugarDe = lugarDe;

  // registra um achado. r = { tipo, sev(1..3), fonte, msg, ent (entidade), detalhe, chave, corrigido, acao }
  O.registrar = function (r) {
    const S = G.S, chave = r.chave || (r.tipo + ':' + r.msg);
    let rec = O.porChave[chave];
    const agora = Date.now();
    if (rec && agora - rec.ult < 60000 && !r.forcar) {          // o mesmo problema de novo: só soma
      rec.n++; rec.ult = agora; if (r.corrigido) { rec.corrigido = true; rec.acao = r.acao || rec.acao; O.stats.consertos++; }
      if (r.fonte && rec.fontes.indexOf(r.fonte) < 0) rec.fontes.push(r.fonte);
      sujo = true; return rec;
    }
    const loc = r.ent ? lugarDe(r.ent) : { tile: null, onde: r.onde || '' };
    rec = {
      id: ++O.seq, chave, tipo: r.tipo, sev: r.sev || 1, fonte: r.fonte || 'OLHO', fontes: [r.fonte || 'OLHO'], msg: r.msg,
      hora: G.lugares ? G.lugares.horaTxt(S) : '', tempo: Math.round(S.time), real: new Date().toISOString(), n: 1, ult: agora,
      onde: r.onde || loc.onde, tile: loc.tile, ent: r.ent ? snap(r.ent) : null, detalhe: r.detalhe || null,
      mundo: { modo: S.mode, dentro: S.inside && S.inside.lugar ? S.inside.lugar.id + ':' + (S.inside.id || '') : null, carros: S.cars.length, pedestres: S.peds.length, procurado: S.heatLevel, dinheiro: S.save && S.save.money, fps: Math.round(O.stats.fps) },
      corrigido: r.corrigido === undefined && (r.sev || 1) <= 1 ? null : !!r.corrigido, acao: r.acao || ''

    O.cache.push(rec); O.porChave[chave] = rec; O.stats.achados++; if (r.corrigido) O.stats.consertos++;
    if (O.cache.length > 300) { const x = O.cache.shift(); if (O.porChave[x.chave] === x) delete O.porChave[x.chave]; }

  };

  O.obra = ev => O.registrar({ tipo: 'obra', sev: 1, fonte: 'CIDADE', msg: ev.msg, onde: ev.reg, chave: 'obra:' + ev.msg, detalhe: ev });
  O.camera = r => O.registrar({ tipo: 'camera', sev: r.sev === 'crime' ? 2 : 1, fonte: 'CÂMERAS', msg: r.msg, onde: r.onde, chave: 'cam:' + r.id, detalhe: { gravacao: r.id, hora: r.hora }, forcar: true });

  };

  // ---------- achar um lugar bom perto de (x,y) ----------
  function maisPerto(x, y, ok, raio) {
    const tx0 = clamp(Math.floor(x / T), 1, W.TW - 2), ty0 = clamp(Math.floor(y / T), 1, W.TH - 2);
    for (let r = 0; r <= (raio || 24); r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      const tx = tx0 + dx, ty = ty0 + dy; if (tx < 1 || ty < 1 || tx >= W.TW - 1 || ty >= W.TH - 1) continue;
      if (ok(W.tiles[ty * W.TW + tx])) return { x: (tx + 0.5) * T, y: (ty + 0.5) * T };
    }
    return null;
  }
  O.maisPerto = maisPerto;
  const ehVia = t => t === W.TILE.ROAD || t === W.TILE.CROSS || t === W.TILE.BRIDGE;
  const ehCalcada = t => W.pedWalkable(t) && t !== W.TILE.LOT;

  // ---------- diagnósticos (só olham, não mexem) ----------
  let uidN = 0; const uid = e => (e.uid == null ? (e.uid = ++uidN) : e.uid);
  O.diagnosticaCarro = function (c, S) {
    const out = [], p = S.player, ehJog = p.car === c;
    if (!fin(c.x) || !fin(c.y) || !fin(c.vx) || !fin(c.vy) || !fin(c.a)) { out.push({ tipo: 'carro-nan', sev: 3, msg: 'carro #' + uid(c) + ' (' + c.kind + ') com número inválido (NaN)', fix: () => removeCarro(S, c, 'carro-nan') }); return out; }
    if (c.x < 0 || c.y < 0 || c.x > W.W || c.y > W.H) out.push({ tipo: 'carro-fora', sev: 3, msg: 'carro #' + uid(c) + ' fora do mapa', fix: () => ehJog ? tpJogCarro(S, c) : removeCarro(S, c, 'fora do mapa') });
    else if (W.isSolid(c.x, c.y)) {
      c._sol = (c._sol || 0) + 1;
      if (c._sol >= 2) out.push({ tipo: 'carro-parede', sev: 3, msg: 'carro #' + uid(c) + ' (' + c.kind + ') dentro de ' + lugarDe(c).tile.tipo, fix: () => { const q = maisPerto(c.x, c.y, ehVia, 20); if (q && (ehJog || c.owned)) { c.x = q.x; c.y = q.y; c.vx = c.vy = 0; c._sol = 0; return 'reposicionado na rua mais próxima'; } removeCarro(S, c, 'dentro de parede'); return 'removido'; } });
    } else c._sol = 0;
    if (Math.hypot(c.vx, c.vy) > 1000) out.push({ tipo: 'carro-velocidade', sev: 2, msg: 'carro #' + uid(c) + ' com velocidade absurda (' + Math.round(Math.hypot(c.vx, c.vy)) + ')', fix: () => { c.vx *= 0.1; c.vy *= 0.1; return 'velocidade zerada'; } });
    // travado: carro da cidade que não sai do lugar
    if (c.driver === 'ai' && !c.dead && !c.hb && (c.mode === 'wander' || c.mode === 'goto' || c.mode === 'chase')) {
      const m = c._m || (c._m = { x: c.x, y: c.y, t: S.time });
      if (Math.hypot(c.x - m.x, c.y - m.y) > 10) { m.x = c.x; m.y = c.y; m.t = S.time; }
      else if (S.time - m.t > 16) out.push({ tipo: 'carro-travado', sev: 2, msg: 'carro #' + uid(c) + ' (' + c.kind + ') TRAVADO há ' + Math.round(S.time - m.t) + 's', fix: () => { removeCarro(S, c, 'travado'); return 'removido (o trânsito repõe outro)'; } });
    }

  };
  O.diagnosticaPed = function (p, S) {
