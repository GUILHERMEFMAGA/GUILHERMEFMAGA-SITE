      if (sc < bs) { bs = sc; best = p; }
    }
    if (best) return Math.atan2(best.y - P.y, best.x - P.x);
    return Math.atan2(fy, fx);
  }

  function melee(S, P, w) {
    P.punchT = w.id === 'bat' ? 0.4 : 0.3; P.cdT = w.cd;
    w.id === 'bat' ? G.snd.swing() : G.snd.punch();
    const fx = Math.sin(P.h), fy = -Math.cos(P.h);
    let hits = 0;
    for (const p of S.peds) {
      if (p.state === 'dead' || p.mission) continue;
      const dx = p.x - P.x, dy = p.y - P.y, d = Math.hypot(dx, dy);
      if (d < w.range && (dx * fx + dy * fy) > 0) {
        hurtPed(S, p, w.dmg * (1 + 0.18 * ((S.save && S.save.forca) || 0)) * rand(0.85, 1.25), P.x, P.y, w.id === 'bat' ? 230 : 140, 'player');
        if (w.id === 'bat') G.snd.thud();
        hits++; if (hits >= (w.id === 'bat' ? 2 : 1)) break;
      }
    }
  }

  function shoot(S, P, w) {
    const a = arms(S);
    const ang = aimAngle(S, P, w.range);
    P.h = ang + Math.PI / 2;
    const mx = P.x + Math.cos(ang) * 15, my = P.y + Math.sin(ang) * 15;
    for (let k = 0; k < w.pellets; k++) fireBullet(S, { x: mx, y: my, a: ang + rand(-1, 1) * w.spread, speed: w.speed * rand(0.92, 1.05), dmg: w.dmg, own: 'player', range: w.range });
    P.cdT = w.cd; P.flashT = 0.07; P.punchT = 0;
    a.ammo[w.id]--;
    flash(mx, my);
    G.snd.gun(w.snd, 1);
    S.shake = Math.max(S.shake, w.id === 'shotgun' ? 4 : 1.2);
    noise(S, P.x, P.y, 430);
    S.lastShot = S.time;
    if (S.time - S.shotHeatT > 1.2 && copNear(S, P.x, P.y, 650)) { G.addHeat(w.id === 'shotgun' ? 10 : 6); S.shotHeatT = S.time; }
    if (a.ammo[w.id] <= 0) { G.say(w.name + ' sem munição!', 2); P.weapon = bestFallback(S); G.save(); }
  }

  function throwGrenade(S, P, w) {
    const a = arms(S);
    const fx = Math.sin(P.h), fy = -Math.cos(P.h);
    S.grenades.push({ x: P.x + fx * 10, y: P.y + fy * 10, vx: fx * 300 + (P.vx || 0), vy: fy * 300 + (P.vy || 0), t: 1.8, spin: 0 });
    a.ammo.grenade--; P.cdT = w.cd; P.punchT = 0.25;
    G.snd.swing();
    if (a.ammo.grenade <= 0) { P.weapon = bestFallback(S); G.save(); }
  }

  function playerUpdate(S, dt, held, pressed) {
    const P = S.player;
    if (P.cdT > 0) P.cdT -= dt; if (P.flashT > 0) P.flashT -= dt;
    if (!arms(S).own[P.weapon] || !hasAmmo(S, P.weapon)) P.weapon = bestFallback(S);
    const w = WEAPONS[P.weapon];
    const want = w.auto ? held : pressed;
    if (!want || P.cdT > 0) return;
    if (w.melee) melee(S, P, w);
    else if (w.throw) throwGrenade(S, P, w);
    else shoot(S, P, w);
  }

  function updateGrenades(S, dt) {
    for (let i = S.grenades.length - 1; i >= 0; i--) {
      const g = S.grenades[i];
      g.t -= dt; g.spin += dt * 12;
      const nx = g.x + g.vx * dt, ny = g.y + g.vy * dt;
      if (W.isSolid(nx, g.y)) g.vx *= -0.4; else g.x = nx;
      if (W.isSolid(g.x, ny)) g.vy *= -0.4; else g.y = ny;
      const f = Math.pow(0.25, dt); g.vx *= f; g.vy *= f;
      if (g.t <= 0) { S.grenades.splice(i, 1); blast(S, g.x, g.y, 125, 150, 'player'); }
    }
  }

  // ---------- Itens no chão ----------
  function updatePickups(S, dt) {
    const P = S.player, ref = P.car || P, r = P.car ? 30 : 17;
    for (let i = S.pickups.length - 1; i >= 0; i--) {
      const k = S.pickups[i]; k.t += dt;
      if (k.t > 90) { S.pickups.splice(i, 1); continue; }
      if (S.mode !== 'play' || Math.hypot(k.x - ref.x, k.y - ref.y) > r) continue;
      if (k.type === 'cash') { S.save.money += k.n; G.save(); G.snd.cash(); }
      else if (k.type === 'gun') { if (P.car) continue; giveWeapon(S, k.id, k.n); G.snd.pick(); }
      else if (k.type === 'armor') { if (P.armor >= 100) continue; P.armor = Math.min(100, P.armor + k.n); G.say('Colete recolhido.', 2); G.snd.pick(); }
      else if (k.type === 'health') { if (P.hp >= 100) continue; P.hp = Math.min(100, P.hp + k.n); G.say('Kit médico: +' + k.n + ' de vida.', 2); G.snd.pick(); }
      S.pickups.splice(i, 1);
    }
  }

  // ---------- Marcas de pneu ----------
  function updateSkids(S, dt) {
    const P = S.player, ref = P.car || P;
    for (const c of S.cars) {
      if (c.dead || Math.abs(c.x - ref.x) > 700 || Math.abs(c.y - ref.y) > 700) { c._sk = null; continue; }
      const slide = !c.onGrass && c.speed > 60 && (Math.abs(c.vr) > 95 || (c.hb && c.speed > 120) || (c.thr < 0 && c.vf > 150));
      if (!slide) { c._sk = null; continue; }
      const rx = Math.cos(c.a), ry = Math.sin(c.a);
      const lx = c.x - c.fx * 24 - rx * 14, ly = c.y - c.fy * 24 - ry * 14, qx = c.x - c.fx * 24 + rx * 14, qy = c.y - c.fy * 24 + ry * 14;
      if (c._sk) {
        S.skids.push({ x1: c._sk[0], y1: c._sk[1], x2: lx, y2: ly, t: 0 }, { x1: c._sk[2], y1: c._sk[3], x2: qx, y2: qy, t: 0 });
      }
      if (Math.random() < 0.6) for (const [sx, sy] of [[lx, ly], [qx, qy]]) G.particle({ x: sx, y: sy, vx: rand(-14, 14), vy: rand(-14, 14), life: 0.9, size: 3.5, col: 'smoke', tint: '#dcdce4', a: 0.34 });
      c._sk = [lx, ly, qx, qy];
    }
    for (const s of S.skids) s.t += dt;
    if (S.skids.length > 600 || (S.skids.length && S.skids[0].t > 45)) S.skids = S.skids.filter(s => s.t < 45).slice(-600);
  }

  // ---------- Pedestres armados: atirar, perseguir, prender ----------
  const walkable = (x, y) => !W.isSolid(x, y) && !W.treeHit(x, y, 3);
  function moveToward(p, ang, sp, dt) {
    const tries = p.side ? [0, p.side * 0.7, -p.side * 0.7, p.side * 1.3, -p.side * 1.3] : [0, 0.7, -0.7, 1.3, -1.3];
    for (const off of tries) {
      const a = ang + off, nx = p.x + Math.cos(a) * sp * dt, ny = p.y + Math.sin(a) * sp * dt;
      const lx = p.x + Math.cos(a) * 12, ly = p.y + Math.sin(a) * 12;
      if (walkable(lx, ly) && walkable(nx, ny)) { p.x = nx; p.y = ny; if (off) p.side = off > 0 ? 1 : -1; p.walk += sp * dt * 0.22; return true; }
    }
    return false;
  }

  function enemyFire(S, p, tg, ang) {
    const wid = p.weapon || 'pistol', w = WEAPONS[wid], e = ENEMY[wid] || ENEMY.pistol;
    const d = Math.hypot(tg.x - p.x, tg.y - p.y);
    const lead = ang + clamp(((tg.vx || 0) * -Math.sin(ang) + (tg.vy || 0) * Math.cos(ang)) * 0.0009 * d, -0.25, 0.25);
    const sp = 0.07 + d / 3400 + (S.player.car ? 0.05 : 0);
    const mx = p.x + Math.cos(ang) * 12, my = p.y + Math.sin(ang) * 12;
    for (let k = 0; k < (w.pellets || 1); k++) fireBullet(S, { x: mx, y: my, a: lead + rand(-1, 1) * (w.pellets > 1 ? w.spread : sp), speed: w.speed * 0.72, dmg: e.dmg, own: p.kind === 'cop' ? 'cop' : 'thug', range: w.range + 60 });
    p.flashT = 0.07; flash(mx, my);
    G.snd.gun(w.snd, vol(S, p.x, p.y));
    p.burst = (p.burst || 0) + 1;
    p.fireT = wid === 'smg' ? (p.burst % 6 === 0 ? 0.9 : e.cd) : e.cd * rand(0.8, 1.3);
  }

  function fightPed(S, p, dt) {
    const P = S.player, tg = P.car || P;
    const dx = tg.x - p.x, dy = tg.y - p.y, d = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
    const wid = p.weapon || 'pistol';
    p.fireT = (p.fireT || 0) - dt; p.react = (p.react || 0) - dt;
    const wasIn = S.mode === 'play';
    const arrest = p.kind === 'cop' && S.heatLevel <= 2 && !S.copHostile && S.time - S.lastShot > 6;
    p.arresting = arrest;
    const los = d < 540 && G.ai.lineClear(p.x, p.y, tg.x, tg.y);
    p.h += wrap(ang + Math.PI / 2 - p.h) * Math.min(1, 10 * dt);
    const sp = p.kind === 'cop' ? (p.weapon === 'pistol' ? 96 : 88) : 84;
    let pref = arrest || wid === 'bat' ? 0 : wid === 'shotgun' ? 110 : wid === 'smg' ? 170 : 200;
    if (!los) pref = 0;
    let moved = false;
    if (d > pref + 26) moved = moveToward(p, ang, sp, dt);
    else if (d < pref - 60 && pref > 0) moved = moveToward(p, ang + Math.PI, sp * 0.6, dt);
    if (!moved) p.walk += 0;
    if (p.kind === 'cop' && d > 650 && P.car) { p.farT = (p.farT || 0) + dt; if (p.farT > 6) p.dead = true; } else p.farT = 0;
    if (!wasIn) return;
    if (wid === 'bat') {
      if (d < 30 && p.fireT <= 0) { p.fireT = 0.75; p.punchT = 0.35; G.snd.swing(); hurtPlayer(S, 11, p.x, p.y); }
    } else if (!arrest && los && d < (WEAPONS[wid].range + 40) && p.fireT <= 0 && p.react <= 0) enemyFire(S, p, tg, ang);
  }

  function guardPed(S, p, dt) {
    const P = S.player, tg = P.car || P;
    p.walk = 0;
    const d = Math.hypot(tg.x - p.x, tg.y - p.y);
    p.h += wrap(Math.atan2(tg.y - p.y, tg.x - p.x) + Math.PI / 2 - p.h) * Math.min(1, 2 * dt) * (d < 420 ? 1 : 0);
    if (S.thugAlert || (d < 300 && G.ai.lineClear(p.x, p.y, tg.x, tg.y)) || (S.time - S.lastShot < 1.2 && d < 600)) { p.state = 'fight'; p.react = rand(0.25, 0.7); S.thugAlert = true; }
  }

  // devolve true quando o pedestre foi tratado aqui
  function updatePed(p, dt, S) {
    if (p.flashT > 0) p.flashT -= dt;
    if (p.state === 'dead') {
      p.corpseT = (p.corpseT || 0) + dt; p.pool = Math.min(1, p.corpseT / 3.5);
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      if (!W.isSolid(nx, p.y)) p.x = nx; else p.vx = 0;
      if (!W.isSolid(p.x, ny)) p.y = ny; else p.vy = 0;
      p.vx *= 0.9; p.vy *= 0.9;
      if (p.corpseT > 80) p.dead = true;
      return true;
    }
    if (p.state === 'down') {
      p.downT += dt;
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      if (!W.isSolid(nx, p.y)) p.x = nx; else p.vx = 0;
      if (!W.isSolid(p.x, ny)) p.y = ny; else p.vy = 0;
      p.vx *= 0.9; p.vy *= 0.9;
      if (p.downT > 1.6) { if (p.armed || p.kind !== 'civ') { p.state = 'fight'; p.react = 0.4; } else { p.state = 'flee'; p.fleeT = rand(3, 5); p.threat = p.threat || { x: S.player.x, y: S.player.y }; } }
      return true;
    }
    if (p.punchT > 0) p.punchT -= dt;
    if (p.state === 'guard') { guardPed(S, p, dt); return true; }
    if (p.state === 'fight') { fightPed(S, p, dt); return true; }
    if (p.vx || p.vy) { // empurrão de tiro / pancada
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      if (!W.isSolid(nx, p.y)) p.x = nx; if (!W.isSolid(p.x, ny)) p.y = ny;
      p.vx *= 0.85; p.vy *= 0.85; if (Math.abs(p.vx) + Math.abs(p.vy) < 4) p.vx = p.vy = 0;
    }
    return false;
  }

  // ---------- Polícia a pé e tiros das viaturas ----------
  function makeCop(S, x, y, lvl) {
    const swat = lvl >= 4;
    const p = G.ai.makePed(x, y);
    Object.assign(p, {
      kind: 'cop', hp: swat ? 120 : 70, weapon: swat ? (lvl >= 5 ? 'shotgun' : 'smg') : 'pistol', armed: true,
      shirt: swat ? '#15171c' : '#1c2f6b', cap: swat ? 'swat' : 'cop', state: 'fight', react: rand(0.5, 1.1), fireT: rand(0.4, 1), vx: 0, vy: 0,
    });
    S.peds.push(p); return p;
  }
  const copCount = S => S.peds.reduce((n, p) => n + (p.kind === 'cop' && p.state !== 'dead' && !p.dead ? 1 : 0), 0);

  function dismount(S, c, lvl) {
    const n = lvl >= 3 ? 2 : 1, CW = G.sprites.CAR_W;
    for (let k = 0; k < n; k++) {
      const side = k % 2 === 0 ? 1 : -1;
      let x = c.x + Math.cos(c.a) * side * (CW / 2 + 14), y = c.y + Math.sin(c.a) * side * (CW / 2 + 14);
      if (!walkable(x, y)) { x = c.x; y = c.y; }
      makeCop(S, x, y, lvl);
    }
    c.mode = 'parked'; c.driver = 'none'; c.thr = 0; c.steer = 0; c.hb = true; c.nav = null;
  }

  function roadblockCops(S, cars) {
    const lvl = Math.max(3, S.heatLevel);
    cars.forEach(c => {
      if (copCount(S) >= 7) return;
      const x = c.x + rand(-26, 26), y = c.y + rand(-26, 26);
      makeCop(S, walkable(x, y) ? x : c.x, walkable(x, y) ? y : c.y, lvl);
    });
  }

  function copLogic(S, dt) {
    const P = S.player, tg = P.car || P, lvl = S.heatLevel;
    if (lvl === 0) {
      S.copHostile = false;
      for (const p of S.peds) if (p.kind === 'cop' && p.state === 'fight') { p.state = 'walk'; p.arresting = false; }
      return;
    }
    let cops = copCount(S);
    const slow = P.car ? P.car.speed < 110 : true;
    for (const c of S.cars) {
      if (c.kind !== 'police' || c.mode !== 'chase' || c.driver !== 'ai' || c.dead) continue;
      const d = Math.hypot(tg.x - c.x, tg.y - c.y);
      c.fireT = (c.fireT || 0) - dt;
      if (d < 240 && slow && cops < 5 && S.mode === 'play') { dismount(S, c, lvl); cops += lvl >= 3 ? 2 : 1; continue; }
      if (lvl >= 3 && d < 460 && d > 70 && c.fireT <= 0 && S.mode === 'play' && G.ai.lineClear(c.x, c.y, tg.x, tg.y)) {
        const ang = Math.atan2(tg.y + (tg.vy || 0) * 0.3 - c.y, tg.x + (tg.vx || 0) * 0.3 - c.x) + rand(-0.17, 0.17);
        fireBullet(S, { x: c.x + Math.cos(ang) * 30, y: c.y + Math.sin(ang) * 30, a: ang, speed: 640, dmg: 6, own: 'cop', range: 560, car: c });
        flash(c.x + Math.cos(ang) * 30, c.y + Math.sin(ang) * 30);
        G.snd.gun('pistol', vol(S, c.x, c.y)); c.fireT = rand(0.5, 0.95);
      }
    }
    const h = S.heli;
    if (h && lvl >= 5 && S.mode === 'play') {
      h.fireT = (h.fireT || 0) - dt;
      const d = Math.hypot(tg.x - h.x, tg.y - h.y);
      if (d < 560 && h.fireT <= 0) {
        const ang = Math.atan2(tg.y - h.y, tg.x - h.x) + rand(-0.2, 0.2);
        fireBullet(S, { x: h.x, y: h.y, a: ang, speed: 700, dmg: 4, own: 'cop', range: 620 });
        G.snd.gun('smg', vol(S, h.x, h.y) * 0.8); h.fireT = 0.2;
      }
    }
  }

  // ---------- Atualização geral ----------
  function update(S, dt) {
    const P = S.player;
    if (S.hurtT > 0) S.hurtT -= dt;
    if (S.mode === 'play') {
      if (P.hp < S.lastHp - 0.4 && S.hurtT <= 0) { S.hurtT = 0.3; if (!P.car && P.hp > 0) spray(S, P.x, P.y, rand(0, TAU), 4, 140); }
      S.lastHp = P.hp;
      copLogic(S, dt);
    } else S.lastHp = 100;
    updateBullets(S, dt);
    updateGrenades(S, dt);
    updatePickups(S, dt);
    updateSkids(S, dt);
    for (const d of S.decals) d.t += dt;
    // no máximo 28 corpos no chão: os mais velhos somem
    let bodies = S.peds.filter(p => p.state === 'dead' && !p.dead);
    if (bodies.length > 28) { bodies.sort((a, b) => b.corpseT - a.corpseT); for (let i = 0; i < bodies.length - 28; i++) bodies[i].dead = true; }
  }

  // ---------- Desenho ----------
  function drawDecals(ctx, S, inV) {
    for (const s of S.skids) {
      if (!inV({ x: s.x1, y: s.y1 })) continue;
      ctx.strokeStyle = 'rgba(8,6,14,' + (0.42 * (1 - s.t / 45)).toFixed(3) + ')'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    }
    for (const d of S.decals) {
      if (!inV(d)) continue;
      if (d.kind === 'scorch') {
        ctx.fillStyle = 'rgba(10,8,8,0.30)'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(6,5,5,0.35)'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.6, 0, TAU); ctx.fill();
        continue;
      }
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot); ctx.globalAlpha = d.t < 25 ? 0.95 : 0.85;
      ctx.drawImage(blobSprite(d.v, d.t > 25), -d.r, -d.r, d.r * 2, d.r * 2); ctx.restore();
    }
    ctx.lineCap = 'butt';
  }
  function drawPickups(ctx, S, inV, time) {
    for (const k of S.pickups) {
      if (!inV(k)) continue;
      const bob = Math.sin(time * 4 + k.x) * 1.5;
      ctx.save(); ctx.translate(k.x, k.y);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(2, 5, 8, 4, 0, 0, TAU); ctx.fill();
      ctx.translate(0, bob - 3);
      if (k.type === 'cash') { ctx.fillStyle = '#3fbf4d'; ctx.fillRect(-8, -5, 16, 10); ctx.strokeStyle = '#0a3a10'; ctx.lineWidth = 1.5; ctx.strokeRect(-8, -5, 16, 10); ctx.fillStyle = '#eaffea'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('$', 0, 3); }
      else if (k.type === 'gun') { ctx.fillStyle = 'rgba(255,230,120,0.35)'; ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.fill(); ctx.fillStyle = '#16181c'; ctx.fillRect(-7, -2, 12, 4); ctx.fillRect(-5, 1, 4, 6); ctx.fillStyle = '#8a8f99'; ctx.fillRect(3, -2, 5, 2); }
      else if (k.type === 'armor') { ctx.fillStyle = '#3a78d8'; ctx.beginPath(); ctx.moveTo(-8, -7); ctx.lineTo(8, -7); ctx.lineTo(8, 1); ctx.quadraticCurveTo(8, 8, 0, 10); ctx.quadraticCurveTo(-8, 8, -8, 1); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke(); }
      else { ctx.fillStyle = '#fff'; ctx.fillRect(-8, -8, 16, 16); ctx.fillStyle = '#e03030'; ctx.fillRect(-2, -6, 4, 12); ctx.fillRect(-6, -2, 12, 4); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.strokeRect(-8, -8, 16, 16); }
      ctx.restore();
    }
  }
  function drawAir(ctx, S, inV) {
    for (const g of S.grenades) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(g.x + 3, g.y + 4, 5, 3, 0, 0, TAU); ctx.fill();
      ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.spin); ctx.fillStyle = '#3f5a2a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#c9c9c9'; ctx.fillRect(-1, -6, 2, 3); ctx.restore();
    }
    for (const b of S.bullets) {
      if (!inV(b)) continue;
      const enemy = b.own !== 'player';
      ctx.strokeStyle = enemy ? 'rgba(255,170,140,0.95)' : 'rgba(255,236,150,0.95)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      const l = Math.hypot(b.vx, b.vy) || 1;
      ctx.beginPath(); ctx.moveTo(b.x - b.vx / l * 13, b.y - b.vy / l * 13); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }
  function drawScreen(ctx, S) {
    const P = S.player;
    let a = 0;
    if (S.hurtT > 0) a = Math.max(a, S.hurtT / 0.3 * 0.45);
    if (P.hp < 35 && P.hp > 0 && S.mode === 'play') a = Math.max(a, 0.18 + 0.12 * Math.sin(S.time * 7));
    if (a <= 0) return;
    const g = ctx.createRadialGradient(400, 300, 200, 400, 300, 520);
    g.addColorStop(0, 'rgba(160,0,0,0)'); g.addColorStop(1, 'rgba(160,0,0,' + a.toFixed(3) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 800, 600);
  }

  // ---------- Loja de armas ----------
  const PRICE_AMMO = { pistol: 36, smg: 90, shotgun: 16 };
  const ITEMS = [
    { k: 'Digit1', n: 'Taco de beisebol', p: 60, own: 'bat', f: S => giveWeapon(S, 'bat', 0) },
    { k: 'Digit2', n: 'Pistola (+36 balas)', p: 150, own: 'pistol', f: S => giveWeapon(S, 'pistol', 36) },
    { k: 'Digit3', n: 'Submetralhadora (+90 balas)', p: 450, own: 'smg', f: S => giveWeapon(S, 'smg', 90) },
    { k: 'Digit4', n: 'Escopeta (+16 cartuchos)', p: 600, own: 'shotgun', f: S => giveWeapon(S, 'shotgun', 16) },
    { k: 'Digit5', n: 'Granadas (x4)', p: 160, f: S => giveWeapon(S, 'grenade', 4) },
    { k: 'Digit6', n: 'Munição para as armas que você tem', p: 120, f: S => { const a = arms(S); let any = false; Object.keys(PRICE_AMMO).forEach(id => { if (a.own[id]) { a.ammo[id] = Math.min(MAX_AMMO, (a.ammo[id] || 0) + PRICE_AMMO[id]); any = true; } }); if (!any) return false; G.save(); G.say('Munição reabastecida.', 2); } },
    { k: 'Digit7', n: 'Colete à prova de balas', p: 250, f: S => { if (S.player.armor >= 100) return false; S.player.armor = 100; G.say('Colete vestido.', 2); } },
  ];
  function shopKey(S, code) { // retorna true se fechou a loja
    if (code === 'Escape' || code === 'KeyE' || code === 'Enter') return true;
    const it = ITEMS.find(i => i.k === code); if (!it) return false;
    const a = arms(S);
    if (it.own && a.own[it.own] && it.own !== 'pistol' && it.own !== 'smg' && it.own !== 'shotgun') { G.say('Você já tem isso.', 2); return false; }
    if (S.save.money < it.p) { G.say('Dinheiro insuficiente ($' + it.p + ').', 2); G.snd.fail(); return false; }
    if (it.f(S) === false) { G.say('Você não precisa disso agora.', 2); return false; }
    S.save.money -= it.p; G.save(); G.snd.cash();
    return false;
  }
  function drawShop(ctx, S) {
    const H = G.hud, a = arms(S);
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, 800, 600);
    ctx.fillStyle = '#1b1322'; ctx.fillRect(110, 80, 580, 440); ctx.strokeStyle = '#ff4fd8'; ctx.lineWidth = 4; ctx.strokeRect(110, 80, 580, 440);
    H.txt(ctx, 'LOJA DE ARMAS', 400, 130, 38, '#ff4fd8', 'center');
    H.txt(ctx, 'Seu dinheiro: $' + S.save.money, 400, 162, 20, '#3fdc4a', 'center');
    ITEMS.forEach((it, i) => {
      const y = 212 + i * 40, own = it.own && a.own[it.own];
      H.txt(ctx, '[' + (i + 1) + ']', 140, y, 20, '#ffe04a');
      H.txt(ctx, it.n, 190, y, 19, own && !PRICE_AMMO[it.own] ? '#8a8a8a' : '#fff');
      H.txt(ctx, own && !PRICE_AMMO[it.own] ? 'TEM' : '$' + it.p, 660, y, 19, S.save.money >= it.p ? '#3fdc4a' : '#ff6b6b', 'right');
    });
    const cur = WEAPONS[S.player.weapon];
    H.txt(ctx, 'Arma atual: ' + cur.name + (usesAmmo(cur) ? '  •  munição ' + ammoOf(S, cur.id) : ''), 400, 488, 15, '#bbb', 'center');
    H.txt(ctx, 'Aperte o número para comprar • Esc ou E para sair', 400, 510, 13, '#888', 'center');
  }

  G.combat = {
    WEAPONS, ORDER, reset, arms, ammoOf, giveWeapon, select, cycle, confiscate, playerUpdate, update, updatePed,
    hurtPed, killPed, hurtPlayer, carHit, blast, scorch, spray, addDecal, fireBullet, noise, copNear, roadblockCops, makeCop, drop,
    drawDecals, drawPickups, drawAir, drawScreen, drawShop, shopKey, blobSprite,
  };
})(window.G = window.G || {});

</script>
<script>
/* ============================================================
   missions.js — telefones públicos, missões e lugares da cidade
   (entrega, táxi, roubo de carro, corrida, fuga e acerto de contas)
   ============================================================ */
(function (G) {
  'use strict';
  const W = G.world, T = W.T;
  const TAU = Math.PI * 2;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- Lugares ----------
  const POI = {
    garage: Object.assign(W.sidePoint(0, 0, 'bottom', 0.5), { r: 52, name: 'GARAGEM' }),
    oficina: Object.assign(W.sidePoint(2, 2, 'top', 0.5), { r: 52, name: 'OFICINA' }),
    hospital: Object.assign(W.sidePoint(4, 1, 'bottom', 0.5), { r: 40, name: 'HOSPITAL' }),
    delegacia: Object.assign(W.sidePoint(1, 3, 'right', 0.5), { r: 40, name: 'DELEGACIA' }),
    armas: Object.assign(W.sidePoint(1, 0, 'bottom', 0.5), { r: 46, name: 'LOJA DE ARMAS' }),
  };
  const PHONES = [
    W.sidePoint(0, 2, 'right', 0.3), W.sidePoint(2, 0, 'bottom', 0.7),
    W.sidePoint(4, 3, 'top', 0.3), W.sidePoint(5, 1, 'left', 0.6),
    // telefones dos bairros novos (mapa dobrado)
    W.sidePoint(7, 0, 'bottom', 0.4), W.sidePoint(8, 2, 'left', 0.5), W.sidePoint(2, 5, 'top', 0.6), W.sidePoint(6, 4, 'right', 0.5), W.sidePoint(4, 5, 'left', 0.4),
  ].map(p => Object.assign(p, { r: 40 }));

  // ---------- Definições das 12 missões ----------
  const DEFS = [
    { type: 'delivery', name: 'Pacote do Seu Zé', pay: 250, slack: 1.9, brief: 'Seu Zé: Pegue o pacote no ponto marcado e leve até o destino antes que esfrie. Sem pressa... quase!' },
    { type: 'taxi', name: 'Dona Marta', pay: 300, brief: 'Dona Marta precisa ir ao mercado. Busque a passageira e dirija com jeitinho. Batida desconta da gorjeta!' },
    { type: 'steal', name: 'O Fusca Verde', pay: 350, car: { kind: 'sedan', color: '#2f8a3c', label: 'sedã verde' }, brief: 'Um cliente quer um sedã verde. Encontre o carro marcado e leve até o desmanche. Cuidado com a polícia!' },
    { type: 'race', name: 'Racha da Avenida', pay: 500, cps: 5, rivals: 2, brief: 'Racha valendo grana! Vá até a linha de largada, passe pelos cruzamentos marcados e chegue antes dos rivais.' },
    { type: 'hit', name: 'Cobrança', pay: 450, weapons: ['pistol', 'bat', 'pistol'], give: { pistol: 48 }, brief: 'Uns caras devem dinheiro ao chefe e não querem pagar. Peguei uma pistola para você. Vá até a área marcada e elimine os três. Eles vão atirar de volta!' },
    { type: 'escape', name: 'Deu Ruim', pay: 400, level: 3, brief: 'Fizeram alguma coisa e a polícia quer você! Despiste as viaturas e volte para a garagem!' },
    { type: 'delivery', name: 'Entrega Relâmpago', pay: 450, slack: 1.25, brief: 'Entrega urgente do Seu Zé. Dessa vez o tempo é curto. Pé embaixo!' },
    { type: 'taxi', name: 'Passageiro VIP', pay: 500, vip: true, brief: 'Um figurão quer chegar inteiro. Dirija suave: qualquer batida estraga a corrida.' },
    { type: 'steal', name: 'Táxi Amarelo', pay: 550, car: { kind: 'taxi', color: '#f2c42a', label: 'táxi amarelo' }, wanted: 1, brief: 'Preciso de um táxi amarelo com urgência. Pegue o marcado e entregue no desmanche.' },
    { type: 'hit', name: 'Guerra de Gangues', pay: 850, weapons: ['smg', 'pistol', 'pistol', 'bat', 'smg'], give: { smg: 120 }, brief: 'A gangue rival tomou o bairro. Deixei uma submetralhadora para você. São cinco armados: use a cobertura, colete e não fique parado!' },
    { type: 'race', name: 'Grande Prêmio', pay: 700, cps: 7, rivals: 3, brief: 'Grande Prêmio da cidade! Sete pontos, três rivais. Só o primeiro leva a bolada.' },
    { type: 'escape', name: 'Fuga Final', pay: 650, level: 4, brief: 'A cidade inteira está atrás de você. Sobreviva à perseguição e chegue à garagem!' },
  ];
  const RANKS = ['Motorista Novato', 'Entregador', 'Piloto de Fuga', 'Mestre do Asfalto', 'Lenda da Rua', 'Rei da Cidade'];
  const GOAL = 4000;
  const rankIdx = done => Math.min(5, Math.floor(done / 2));

  function randSpot(S, minD, maxD, from) {
    const f = from || S.player;
    const c = W.spots.filter(p => { const d = Math.hypot(p.x - f.x, p.y - f.y); return d >= minD && d <= maxD; });
    const arr = c.length ? c : W.spots;
    const p = arr[Math.floor(Math.random() * arr.length)];
    return { x: p.x, y: p.y };
  }

  const M = { POI, PHONES, DEFS, RANKS, GOAL, TOTAL: DEFS.length, active: null };

  M.rank = done => RANKS[rankIdx(done)];
  M.mult = done => 1 + 0.1 * rankIdx(done);

  M.startNext = function (S, ph) {
    if (M.active) return;
    const n = S.save.done;
    const def = DEFS[n % DEFS.length];
    const m = { def, type: def.type, stage: 0, markers: [], timeLeft: null, hint: '', n };
    const from = ph || S.player;
    if (def.type === 'delivery') {
      m.A = randSpot(S, 500, 1100, from); m.B = randSpot(S, 900, 1900, m.A);
      m.markers = [{ x: m.A.x, y: m.A.y, r: 48, label: 'PACOTE' }];
      m.hint = 'Pegue o pacote';
    } else if (def.type === 'taxi') {
      m.A = randSpot(S, 500, 1100, from); m.B = randSpot(S, 900, 1900, m.A);
      const p = G.ai.makePed(m.A.x, m.A.y); p.state = 'wait'; p.mission = true; p.shirt = def.vip ? '#111' : '#e8d8f0'; p.h = rand(0, TAU);
      S.peds.push(p); m.ped = p; m.comfort = 100;
      m.markers = [{ x: m.A.x, y: m.A.y, r: 52, label: 'PASSAGEIRO' }];
      m.hint = 'Busque o passageiro (de carro!)';
    } else if (def.type === 'steal') {
      const pt = G.ai.randomRoadPoint(from.x, from.y, 600, 1200);
      const c = new G.Car({ x: pt.x, y: pt.y, a: pt.a, kind: def.car.kind, color: def.car.color, driver: 'none', mode: 'parked', tag: 'mission' });
      S.cars.push(c); m.car = c; m.B = randSpot(S, 900, 1900, pt);
      m.markers = [{ x: c.x, y: c.y, r: 60, label: def.car.label.toUpperCase(), follow: c }];
      m.hint = 'Encontre o ' + def.car.label;
    } else if (def.type === 'race') {
      const i0 = 1 + Math.floor(Math.random() * (W.COLS - 1)), j0 = 1 + Math.floor(Math.random() * (W.ROWS - 1));
      m.start = { i: i0, j: j0 }; m.cps = []; let ci = i0, cj = j0;
      for (let k = 0; k < def.cps; k++) {
        let t = 0, ni, nj;
        do { ni = ci + (Math.floor(Math.random() * 5) - 2); nj = cj + (Math.floor(Math.random() * 3) - 1); t++; }
        while (t < 30 && (ni < 0 || nj < 0 || ni > W.COLS || nj > W.ROWS || (ni === ci && nj === cj) || Math.abs(ni - ci) + Math.abs(nj - cj) < 2));
        if (ni < 0 || nj < 0 || ni > W.COLS || nj > W.ROWS) { ni = ci; nj = cj === 0 ? 2 : cj - 2; }
        m.cps.push({ i: ni, j: nj }); ci = ni; cj = nj;
      }
      m.cp = 0; m.cd = 0; m.rivals = []; m.racing = false; m.placed = 0;
      m.markers = [{ x: W.nodeX(i0), y: W.nodeY(j0), r: 80, label: 'LARGADA' }];
      m.hint = 'Vá até a linha de largada';
    } else if (def.type === 'hit') {
      const spot = randSpot(S, 900, 1900, from);
      S.thugAlert = false; m.thugs = [];
      def.weapons.forEach((w, k) => {
        let x = spot.x, y = spot.y;
        for (let t = 0; t < 30; t++) { const a = rand(0, TAU), d = rand(25, 95), qx = spot.x + Math.cos(a) * d, qy = spot.y + Math.sin(a) * d; if (!W.isSolid(qx, qy) && !W.treeHit(qx, qy, 4) && W.tileAt(qx, qy) !== W.TILE.ROAD) { x = qx; y = qy; break; } }
        const p = G.ai.makePed(x, y);
        Object.assign(p, { kind: 'thug', target: true, state: 'guard', weapon: w, armed: true, hp: w === 'bat' ? 70 : 60, shirt: k % 2 ? '#2b2b33' : '#7a1c1c', hair: '#111', cap: null, h: rand(0, TAU) });
        S.peds.push(p); m.thugs.push(p);
      });
      m.spot = spot;
      m.markers = [{ x: spot.x, y: spot.y, r: 150, label: 'ALVOS' }];
      m.hint = 'Elimine os ' + m.thugs.length + ' alvos';
      Object.keys(def.give || {}).forEach(id => { if (!G.combat.arms(S).own[id] || G.combat.ammoOf(S, id) < 20) G.combat.giveWeapon(S, id, def.give[id], true); });
      G.combat.select(S, def.weapons.includes('smg') ? 'smg' : 'pistol');
    } else if (def.type === 'escape') {
      S.heat = def.level * 20 - 4; m.hint = 'Despiste a polícia! Volte à garagem';
      m.markers = [{ x: POI.garage.x, y: POI.garage.y, r: 70, label: 'GARAGEM' }];
    }
    M.active = m;
    G.say(def.brief, 9);
    G.banner('MISSÃO ' + (n + 1), def.name.toUpperCase());
    G.snd.pick();
  };

  M.fail = function (S, why) {
    const m = M.active; if (!m) return;
    if (m.ped) m.ped.dead = true;
    M.cleanup(S, m);
    M.active = null;
    G.say('MISSÃO FALHOU: ' + why, 6);
    G.banner('MISSÃO FALHOU', why.toUpperCase(), true);
    G.snd.fail();
  };
  M.cleanup = function (S, m) {
    if (m.rivals) m.rivals.forEach(r => { r.car.mode = 'wander'; r.car.nav.mode = 'wander'; r.car.ignoreLights = false; r.car.cruise = rand(170, 230); r.car.hold = 0; });
    if (m.car && m.car.mode !== 'player') m.car.tag = '';
    if (m.thugs) m.thugs.forEach(p => { if (p.state !== 'dead') { p.dead = true; } else p.target = false; });
  };
  M.complete = function (S, pay, extra) {
    const m = M.active; if (!m) return;
    const total = Math.round(pay * M.mult(S.save.done));
    S.save.money += total; S.save.done++;
    G.save();
    M.cleanup(S, m);
    M.active = null;
    G.snd.win(); setTimeout(() => G.snd.cash(), 500);
    const king = S.save.done >= M.TOTAL && S.save.money >= GOAL;
    G.banner(king ? 'REI DA CIDADE!' : 'MISSÃO CUMPRIDA', '+$' + total + (extra ? '  ' + extra : ''));
    let msg = m.def.name + ' concluída! +$' + total + '.';
    if (king && !S.save.king) { S.save.king = true; G.save(); msg = 'VOCÊ É O REI DA CIDADE! Campanha completa. Continue no modo livre!'; }
    else if (S.save.done >= M.TOTAL && S.save.money < GOAL) msg += ' Faltam $' + (GOAL - S.save.money) + ' para ser o Rei da Cidade.';
    else msg += ' Ligue em outro telefone para a próxima.';
    G.say(msg, 8);
  };

  const inCircle = (p, mk, extra) => Math.hypot(p.x - mk.x, p.y - mk.y) < mk.r + (extra || 0);

  M.update = function (S, dt) {
    const m = M.active; if (!m) return;
    const P = S.player, pc = P.car, ref = pc || P;
    m.markers.forEach(mk => { if (mk.follow) { mk.x = mk.follow.x; mk.y = mk.follow.y; } });
    if (m.timeLeft != null) {
      m.timeLeft -= dt;
      if (m.timeLeft <= 0) return M.fail(S, 'acabou o tempo');
    }
    const slow = v => !pc || pc.speed < v;
    if (m.type === 'delivery') {
      if (m.stage === 0 && inCircle(ref, m.markers[0])) {
        m.stage = 1; G.snd.pick();
        m.timeLeft = (Math.abs(m.A.x - m.B.x) + Math.abs(m.A.y - m.B.y)) / 190 * m.def.slack + 12;
        m.markers = [{ x: m.B.x, y: m.B.y, r: 52, label: 'DESTINO' }]; m.hint = 'Entregue o pacote a tempo'; G.say('Pacote na mão! Leve ao destino antes do tempo acabar.', 5);
      } else if (m.stage === 1 && inCircle(ref, m.markers[0])) M.complete(S, m.def.pay, m.timeLeft > 20 ? '(+ gorjeta)' : '');
    } else if (m.type === 'taxi') {
      if (m.stage === 0) {
        if (inCircle(ref, m.markers[0])) {
          if (!pc) { m.warn = (m.warn || 0) - dt; if (m.warn <= 0) { G.say('Você precisa estar de carro para o passageiro embarcar!', 3); m.warn = 4; } }
          else if (pc.speed < 220) {
            m.ped.dead = true; m.stage = 1; G.snd.pick(); m.comfort = 100;
            m.markers = [{ x: m.B.x, y: m.B.y, r: 55, label: 'DESTINO' }]; m.hint = 'Leve o passageiro sem bater'; G.say('Passageiro a bordo! Cuidado com as batidas.', 5);
          }
        }
      } else {
        if (!pc) { m.leaveT = (m.leaveT || 0) + dt; if (m.leaveT > 12) return M.fail(S, 'você abandonou o passageiro'); } else m.leaveT = 0;
        if (m.comfort <= 0) return M.fail(S, 'passageiro furioso');
        if (pc && inCircle(ref, m.markers[0]) && pc.speed < 250) M.complete(S, m.def.pay * (0.6 + 0.4 * m.comfort / 100), m.comfort > 80 ? '(ótima direção!)' : '');
      }
    } else if (m.type === 'steal') {
      if (m.car.dead) return M.fail(S, 'o carro foi destruído');
      if (m.stage === 0) {
        if (pc === m.car) {
          m.stage = 1; G.snd.pick();
          m.markers = [{ x: m.B.x, y: m.B.y, r: 60, label: 'DESMANCHE' }]; m.hint = 'Leve o carro ao desmanche';
          G.say('Boa! Agora leve o carro ao desmanche.', 5);
          if (m.def.wanted) G.addHeat(m.def.wanted * 20);
        }
      } else {
        if (Math.hypot(m.car.x - m.B.x, m.car.y - m.B.y) < 70 && Math.hypot(ref.x - m.B.x, ref.y - m.B.y) < 160) M.complete(S, m.def.pay);
      }
    } else if (m.type === 'hit') {
      const left = m.thugs.filter(p => p.state !== 'dead' && !p.dead).length;
      m.hint = left ? 'Elimine os alvos (faltam ' + left + ')' : 'Alvos eliminados!';
      if (left !== m.left) { if (m.left != null && left < m.left) G.snd.pick(); m.left = left; }
      if (left === 0) { m.thugs.forEach(p => { p.target = false; }); M.complete(S, m.def.pay, '(alvos eliminados)'); }
    } else if (m.type === 'race') {
      updateRace(S, m, dt);
    } else if (m.type === 'escape') {
      const g = POI.garage;
      if (inCircle(ref, m.markers[0])) {
        const cop = S.cars.some(c => c.kind === 'police' && c.mode === 'chase' && Math.hypot(c.x - ref.x, c.y - ref.y) < 300);
        if (!cop && slow(300)) { S.heat = 0; M.complete(S, m.def.pay); }
        else { m.warn = (m.warn || 0) - dt; if (m.warn <= 0) { G.say('Eles ainda estão na sua cola! Despiste as viaturas primeiro.', 3); m.warn = 4; } }
      }
    }
  };

  function updateRace(S, m, dt) {
    const P = S.player, pc = P.car, ref = pc || P;
    if (!m.racing) {
      const mk = m.markers[0];
      if (inCircle(ref, mk) && !m.done) {
        if (!m.rivals.length) spawnRivals(S, m);
        const before = Math.ceil(m.cd);
        m.cd += dt;
        const sec = 3 - Math.floor(m.cd);
        if (sec !== m.lastSec && sec > 0) { m.lastSec = sec; G.snd.count(); G.banner(String(sec), 'PREPARAR', false, 0.9); }
        if (m.cd >= 3) { m.racing = true; m.cp = 0; G.snd.go(); G.banner('VAI!', 'CORRA!', false, 1); m.t0 = S.time; m.hint = 'Passe pelos pontos!'; setCps(m); m.rivals.forEach(r => { r.car.hold = 0; r.car.mode = 'race'; }); }
      } else { m.cd = Math.max(0, m.cd - dt * 2); m.lastSec = 0; }
      if (!m.racing) m.rivals.forEach(r => { r.car.hold = 1; });
      return;
    }
    // corrida em andamento
    const cp = m.cps[m.cp];
    const cx = W.nodeX(cp.i), cy = W.nodeY(cp.j);
    if (Math.hypot(ref.x - cx, ref.y - cy) < 100) {
      m.cp++; G.snd.pick();
      if (m.cp >= m.cps.length) {
        const place = 1 + m.rivals.filter(r => r.finished).length;
        if (place === 1) M.complete(S, m.def.pay, '(1º lugar!)');
        else M.fail(S, 'você chegou em ' + place + 'º lugar');
        return;
      }
      setCps(m);
    }
    // rivais
    m.rivals.forEach(r => {
      if (r.finished) return;
      const c = m.cps[r.cp]; const x = W.nodeX(c.i), y = W.nodeY(c.j);
      if (Math.hypot(r.car.x - x, r.car.y - y) < 120) {
        r.cp++;
        if (r.cp >= m.cps.length) { r.finished = true; r.car.nav.mode = 'wander'; r.car.cruise = 200; G.say(r.name + ' cruzou a chegada!', 3); if (m.cp < m.cps.length) { const place = 1 + m.rivals.filter(q => q.finished).length; if (place > m.rivals.length) return M.fail(S, 'você foi o último'); } return; }
        const nc = m.cps[r.cp]; r.car.nav.target = { i: nc.i, j: nc.j };
      }
      // elástico para manter a corrida disputada
      const dn = Math.hypot(r.car.x - W.nodeX(m.cps[Math.min(r.cp, m.cps.length - 1)].i), r.car.y - W.nodeY(m.cps[Math.min(r.cp, m.cps.length - 1)].j));
      const pn = Math.hypot(ref.x - W.nodeX(cp.i), ref.y - W.nodeY(cp.j));

<script>
/* ============================================================
   hud.js — interface no estilo dos GTA antigos:

<script>
/* =====================================================================
   LUZ.JS — visual "cinematográfico": pixel art 2.5D com luz dinâmica
   Tudo é desenhado DEPOIS do mundo, por cima, em camadas:
     1) pixelização      -> deixa o mundo com pixels grandes (pixel art)
     2) neblina          -> nuvens de névoa que andam devagar (volumétrica)
     3) mapa de luz      -> escurece pela hora do dia e "acende" faróis,
                            postes, janelas, sirenes e explosões
     4) brilho (glow)    -> as luzes brilham e criam feixes de luz
     5) bloom            -> as partes claras "vazam" luz em volta
     6) cor de cinema    -> contraste e tom azul/laranja
     7) vinheta          -> cantos mais escuros
   Tecla V troca o nível: 2 = completo, 1 = sem pixelização, 0 = clássico.
   ===================================================================== */
(function (G) {
  'use strict';
  const VW = 800, VH = 600, TAU = Math.PI * 2;
  const L = G.luz = { nivel: 1 };   // 1 = cinema nítido (padrão)

  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---- telas auxiliares (criadas uma vez só) ----
  const luzC = mk(VW, VH), lx = luzC.getContext('2d');      // mapa de luz
  const nevC = mk(VW, VH), nx = nevC.getContext('2d');      // neblina
  const copiaC = mk(VW, VH), cx = copiaC.getContext('2d');  // cópia da imagem (cor de cinema)
  const pixC = mk(VW / 2, VH / 2), pxx = pixC.getContext('2d'); // pixelização
  const bl1 = mk(200, 150), b1x = bl1.getContext('2d');     // bloom (1/4)
  const bl2 = mk(200, 150), b2x = bl2.getContext('2d');
  const bl3 = mk(100, 75), b3x = bl3.getContext('2d');      // bloom (1/8)

  // ---- textura de neblina que se repete sem emendas ----
  function fazNeblina() {
    const c = mk(512, 512), x = c.getContext('2d'); let s = 7;
    const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let k = 0; k < 70; k++) {
      const bx = r() * 512, by = r() * 512, rad = 50 + r() * 90, a = 0.10 + r() * 0.16;
      for (const dx of [-512, 0, 512]) for (const dy of [-512, 0, 512]) {
        const g = x.createRadialGradient(bx + dx, by + dy, 1, bx + dx, by + dy, rad);
        g.addColorStop(0, 'rgba(255,255,255,' + a + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
        x.fillStyle = g; x.fillRect(bx + dx - rad, by + dy - rad, rad * 2, rad * 2);
      }
    }
    return c;
  }
  let nevPat = null;

  // ---- cor do ambiente conforme a hora (f = 0..1; 0.55-0.65 entardecer, 0.65-0.92 noite) ----
  const CORES = [
    [0.00, 236, 208, 176], [0.08, 238, 232, 220], [0.40, 238, 236, 228], [0.52, 238, 208, 166],
    [0.60, 255, 150, 110], [0.67, 84, 94, 160], [0.90, 84, 94, 160], [0.96, 190, 130, 140], [1.00, 236, 208, 176]
  ];
  function ambiente(f) {
    for (let i = 1; i < CORES.length; i++) {
      if (f <= CORES[i][0]) {
        const a = CORES[i - 1], b = CORES[i], t = (f - a[0]) / (b[0] - a[0]);
        return [a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t];
      }
    }
    return [236, 208, 176];
  }

  // altura da fachada (parede) de um prédio — usada também pelo mundo
  // ---- lista de luzes do quadro ----
  function juntarLuzes(S, W, cam, z, inV, noite) {
    const out = [];
    const add = (x, y, r, col, a, ang, spread) => out.push({ x, y, r, col, a, ang, spread });
    const vx0 = cam.x - VW / 2 / z - 160, vx1 = cam.x + VW / 2 / z + 160, vy0 = cam.y - VH / 2 / z - 160, vy1 = cam.y + VH / 2 / z + 160;
    const vis = (x, y) => x > vx0 && x < vx1 && y > vy0 && y < vy1;
    W.lamps.forEach(l => { if (vis(l.x, l.y)) add(l.x, l.y, 140, [255, 196, 110], 0.8); });
    S.cars.forEach(c => {
      if (c.dead || !vis(c.x, c.y)) return;
      const ang = Math.atan2(c.fy, c.fx);
      add(c.x + c.fx * 34, c.y + c.fy * 34, 250, [255, 240, 195], 0.78, ang, 0.3);       // feixe dos faróis
      add(c.x + c.fx * 60, c.y + c.fy * 60, 75, [255, 240, 200], 0.55);                    // poça de luz na frente
      add(c.x - c.fx * 30, c.y - c.fy * 30, c.brakeLight ? 80 : 55, [255, 40, 30], c.brakeLight ? 0.95 : 0.5);                     // lanternas
      if (c.siren) {
        const ph = Math.floor(S.time * 7 + c.x * 0.01) % 2;
        add(c.x, c.y, 190, ph ? [255, 40, 40] : [50, 90, 255], 0.95);
      }
    });
    const ref = S.player.car || S.player;
    if (vis(ref.x, ref.y)) add(ref.x, ref.y, 95, [255, 235, 200], 0.4);
    S.particles.forEach(p => {
      if (!vis(p.x, p.y)) return;
      if (p.col === 'flash') add(p.x, p.y, 130, [255, 190, 90], 1);
      else if (p.col === 'ring') add(p.x, p.y, 300, [255, 170, 80], 1);
      else if (p.col === 'fire' && p.size > 8) add(p.x, p.y, p.size * 6, [255, 130, 40], 0.5);
    });
    if (S.heli) add(ref.x, ref.y, 150, [255, 255, 235], 1);
    return out;
  }

  function gradLuz(c, l) {
    const g = c.createRadialGradient(l.x, l.y, 3, l.x, l.y, l.r);
    const k = l.col[0] + ',' + l.col[1] + ',' + l.col[2];
    g.addColorStop(0, 'rgba(' + k + ',' + l.a + ')'); g.addColorStop(0.45, 'rgba(' + k + ',' + (l.a * 0.4) + ')'); g.addColorStop(1, 'rgba(' + k + ',0)');
    c.fillStyle = g; c.beginPath();
    if (l.ang !== undefined) { c.moveTo(l.x, l.y); c.arc(l.x, l.y, l.r, l.ang - l.spread, l.ang + l.spread); c.closePath(); }
    else c.arc(l.x, l.y, l.r, 0, TAU);
    c.fill();
  }

  // ---- chamado pelo game.js depois que o mundo foi desenhado ----
  // devolve true se desenhou os efeitos (senão o game.js usa o visual clássico)
  L.desenhar = function (ctx, S, W, cam, z, inV) {
    if (L.nivel === 0) return false;
    const f = ((S.dayT % 1) + 1) % 1;
    const amb = ambiente(f);
    const lum = (amb[0] * 0.3 + amb[1] * 0.59 + amb[2] * 0.11) / 255;
    const noite = clamp(1.12 - lum * 1.28, 0, 1);            // 0 = dia claro, ~1 = noite fechada
    const t = S.time;

    // 1) pixel art: reduz pela metade e amplia sem suavizar
    if (L.nivel >= 2) {
      pxx.imageSmoothingEnabled = true; pxx.drawImage(ctx.canvas, 0, 0, VW / 2, VH / 2);
      ctx.imageSmoothingEnabled = false; ctx.drawImage(pixC, 0, 0, VW, VH); ctx.imageSmoothingEnabled = true;
    }

    // 2) neblina volumétrica (duas camadas com velocidades diferentes = profundidade)
    if (!nevPat) nevPat = nx.createPattern(fazNeblina(), 'repeat');
    const dens = 0.025 + noite * 0.10 + (f > 0.92 || f < 0.06 ? 0.06 : 0);
    nx.globalCompositeOperation = 'source-over'; nx.clearRect(0, 0, VW, VH);
    const camada = (esc, par, vel, alfa) => {
      nx.save(); nx.globalAlpha = alfa; nx.scale(esc, esc);
      const ox = (cam.x * par + t * vel), oy = (cam.y * par + t * vel * 0.4);
      nx.translate(-ox, -oy); nx.fillStyle = nevPat; nx.fillRect(ox, oy, VW / esc, VH / esc); nx.restore();
    };
    camada(1.6, 0.35, 9, 1); camada(1.0, 0.6, 18, 0.7);
    nx.globalCompositeOperation = 'source-in'; nx.fillStyle = '#c4cee4'; nx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = clamp(dens * 2, 0, 0.4); ctx.drawImage(nevC, 0, 0); ctx.globalAlpha = 1;

    // 3) mapa de luz: começa com a cor do ambiente e soma as luzes
    lx.setTransform(1, 0, 0, 1, 0, 0); lx.globalCompositeOperation = 'source-over';
    lx.fillStyle = 'rgb(' + (amb[0] | 0) + ',' + (amb[1] | 0) + ',' + (amb[2] | 0) + ')'; lx.fillRect(0, 0, VW, VH);
    const luzes = juntarLuzes(S, W, cam, z, inV, noite);
    // janelas acesas nos prédios (de noite)
    const janelas = [];
    if (noite > 0.05) {
      const vx0 = cam.x - VW / 2 / z, vx1 = cam.x + VW / 2 / z, vy0 = cam.y - VH / 2 / z, vy1 = cam.y + VH / 2 / z;
      W.buildings.forEach(b => { if (b.x < vx1 && b.x + b.w > vx0 && b.y < vy1 && b.y + b.h > vy0 && ((b.x * 7 + b.y * 3) % 10) < 7) janelas.push(b); });
    }
    lx.save(); lx.setTransform(z, 0, 0, z, VW / 2 - cam.x * z, VH / 2 - cam.y * z);
    lx.globalCompositeOperation = 'lighter';
    if (noite > 0.03) {
      luzes.forEach(l => gradLuz(lx, l));
      lx.fillStyle = 'rgba(255,190,100,0.42)';
      janelas.forEach(b => { const fh = W.fachada(b); lx.fillRect(b.x + 4, b.y + b.h - fh + 3, b.w - 8, fh - 6); });
    }
    lx.restore();
    ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(luzC, 0, 0); ctx.globalCompositeOperation = 'source-over';

    // 4) brilho das luzes por cima (feixes visíveis na neblina)
    ctx.save(); ctx.setTransform(z, 0, 0, z, VW / 2 - cam.x * z, VH / 2 - cam.y * z);
    ctx.globalCompositeOperation = 'lighter';
    const forca = 0.02 + noite * 0.09;
    luzes.forEach(l => { const a0 = l.a; l.a = a0 * forca * (l.ang !== undefined ? 0.85 : 0.7); gradLuz(ctx, l); l.a = a0; });
    ctx.restore();
    // raios de sol (só de dia): faixas diagonais bem suaves
    const sol = clamp(1 - noite * 2.2, 0, 1) * 0.035;
    if (sol > 0.004) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 4; k++) {
        const bx = ((k * 260 + t * 6 + cam.x * 0.05) % 1100) - 250, w = 70 + k * 18;
        const g = ctx.createLinearGradient(bx, 0, bx + w, 0);
        g.addColorStop(0, 'rgba(255,230,170,0)'); g.addColorStop(0.5, 'rgba(255,230,170,' + (sol * (0.6 + 0.4 * Math.sin(t * 0.5 + k))) + ')'); g.addColorStop(1, 'rgba(255,230,170,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(bx + 220, 0); ctx.lineTo(bx + 220 + w, 0); ctx.lineTo(bx + w, VH); ctx.lineTo(bx, VH); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    // 5) bloom: encolhe, "eleva" os claros (multiplicando por si mesmo) e soma de volta
    b1x.imageSmoothingEnabled = true; b1x.drawImage(ctx.canvas, 0, 0, 200, 150);
    b2x.globalCompositeOperation = 'source-over'; b2x.drawImage(bl1, 0, 0);
    b2x.globalCompositeOperation = 'multiply'; b2x.drawImage(bl1, 0, 0); b2x.drawImage(bl1, 0, 0); b2x.drawImage(bl1, 0, 0); b2x.globalCompositeOperation = 'source-over';
    b3x.drawImage(bl2, 0, 0, 100, 75);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 0.16; ctx.drawImage(bl2, 0, 0, VW, VH);
    ctx.globalAlpha = 0.24; ctx.drawImage(bl3, 0, 0, VW, VH);
    ctx.restore();

    // 6) cor de cinema: mais contraste/saturação + sombras azuis e luzes laranja
    cx.globalCompositeOperation = 'source-over'; cx.drawImage(ctx.canvas, 0, 0);
    ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = 0.3; ctx.drawImage(copiaC, 0, 0);
    ctx.globalAlpha = 0.09;
    const gr = ctx.createLinearGradient(0, 0, VW, VH); gr.addColorStop(0, '#1fa6c8'); gr.addColorStop(0.5, '#8a6fd0'); gr.addColorStop(1, '#ff9a3c');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);
    ctx.restore();

    // 7) vinheta
    const vg = ctx.createRadialGradient(VW / 2, VH / 2, 220, VW / 2, VH / 2, 590);
    vg.addColorStop(0, 'rgba(0,0,12,0)'); vg.addColorStop(1, 'rgba(0,0,14,' + (0.42 + noite * 0.12) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
    return true;
  };

  const NOMES = ['Clássico', 'Cinema nítido', 'Cinema pixel art'];
  L.alternar = function () { L.nivel = (L.nivel + 2) % 3; return 'Gráficos: ' + NOMES[L.nivel]; };
})(window.G = window.G || {});

</script>
<script>
/* =====================================================================
   DETALHES.JS — pequenos detalhes que dão vida à cidade
     - pombos nas calçadas (bicam o chão e voam quando você chega perto)
     - fumaça saindo dos bueiros
   ===================================================================== */
(function (G) {
  'use strict';
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const MAX_POMBOS = 16;
  let bueiros = [], bueirosT = 0;

  // ponto da calçada longe do jogador, para um pombo novo aparecer
  function novoPombo(S, W, ref) {
    for (let tent = 0; tent < 12; tent++) {
      const a = rand(0, TAU), d = rand(260, 620), x = ref.x + Math.cos(a) * d, y = ref.y + Math.sin(a) * d;
      if (W.tileAt(x, y) !== W.TILE.SIDE) continue;
      // fica na faixa de calçada junto das ruas (não sobre árvores)
      if (W.treeHit && W.treeHit(x, y, 6)) continue;
      return { x, y, a: rand(0, TAU), st: 'chao', h: 0, t: rand(0, 5), vx: 0, vy: 0, fly: 0, cor: Math.random() < 0.8 ? '#8b8f9c' : '#c9c9d0' };
    }
    return null;
  }

  function update(S, W, dt) {
    const ref = { x: S.cam.x, y: S.cam.y };
    // ---- pombos ----
    if (!S.pombos) S.pombos = [];
    const pl = S.player.car || S.player;
    S.pombos.forEach(p => {
      p.t += dt;
      if (p.st === 'chao') {
        const sp = pl.speed ? Math.abs(pl.speed) : 0;
        const dist = Math.hypot(pl.x - p.x, pl.y - p.y);
        const peds = S.peds.some(q => q.state !== 'dead' && Math.abs(q.x - p.x) < 28 && Math.abs(q.y - p.y) < 28);
        if (dist < 70 + sp * 0.2 || peds || S.particles.some(q => q.col === 'flash' && Math.hypot(q.x - p.x, q.y - p.y) < 300)) {
          p.st = 'voa'; p.fly = 0; const a = Math.atan2(p.y - pl.y, p.x - pl.x) + rand(-0.8, 0.8);
          p.a = a; p.vx = Math.cos(a) * rand(120, 170); p.vy = Math.sin(a) * rand(120, 170) - 10;
        } else if (Math.random() < dt * 0.4) { p.a += rand(-1.2, 1.2); }   // vira a cabeça
        if (p.st === 'chao' && Math.random() < dt * 0.15) { p.x += Math.cos(p.a) * 3; p.y += Math.sin(p.a) * 3; } // dá uns passinhos
      } else {
        p.fly += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.h = Math.min(46, p.h + 60 * dt);
      }
    });
    S.pombos = S.pombos.filter(p => p.fly < 3 && Math.hypot(p.x - ref.x, p.y - ref.y) < 900);
    if (S.pombos.length < MAX_POMBOS && Math.random() < dt * 2) { const n = novoPombo(S, W, ref); if (n) S.pombos.push(n); }

    // ---- fumaça dos bueiros ----
    bueirosT -= dt;
    if (bueirosT <= 0) { bueirosT = 1.5; bueiros = W.manholes(ref.x - 500, ref.y - 400, ref.x + 500, ref.y + 400).filter(b => ((b.x * 7 + b.y * 13) | 0) % 5 < 2); }
    bueiros.forEach(b => {
      if (Math.random() < dt * 2.2) G.particle({ x: b.x + rand(-2, 2), y: b.y + rand(-2, 2), vx: rand(-5, 5), vy: rand(-14, -6), life: rand(1.6, 2.4), size: rand(3, 5), col: 'smoke', tint: '#e6eaf2', a: 0.2 });
    });
  }

  function draw(ctx, S, inV) {
    if (!S.pombos) return;
    S.pombos.forEach(p => {
      if (!inV(p)) return;
      // sombra no chão
      ctx.save(); ctx.translate(p.x + 2 + p.h * 0.3, p.y + 2 + p.h * 0.4); ctx.rotate(p.a); ctx.fillStyle = 'rgba(0,0,10,' + (0.28 - p.h * 0.003) + ')';
      ctx.beginPath(); ctx.ellipse(0, 0, 5, 3, 0, 0, TAU); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(p.x, p.y - p.h); ctx.rotate(p.a);
      const voando = p.st === 'voa', bat = voando ? Math.sin(p.t * 34) : 0;
      if (voando) { ctx.fillStyle = p.cor; ctx.beginPath(); ctx.ellipse(-1, 0, 2.4, 6.5 + bat * 2.5, 0, 0, TAU); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(-1, 0, 1.4, 5 + bat * 2, 0, 0, TAU); ctx.fill(); }
      ctx.fillStyle = p.cor; ctx.beginPath(); ctx.ellipse(0, 0, 4.6, 2.9, 0, 0, TAU); ctx.fill();      // corpo
      ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(-1.6, 0, 2.6, 2.3, 0, 0, TAU); ctx.fill();   // asas fechadas
      ctx.fillStyle = '#3a8a6a'; ctx.beginPath(); ctx.ellipse(2.8, 0, 1.6, 1.8, 0, 0, TAU); ctx.fill();  // pescoço verde-roxo
      ctx.fillStyle = '#7a7e8c'; ctx.beginPath(); ctx.arc(4.4, voando ? 0 : Math.sin(p.t * 5 + p.x) > 0.7 ? 0.6 : 0, 1.5, 0, TAU); ctx.fill();  // cabeça
      ctx.fillStyle = '#e8a050'; ctx.fillRect(5.6, -0.3, 1.4, 0.7);                                      // bico
      ctx.restore();
    });
  }

  G.detalhes = { update, draw };
})(window.G = window.G || {});

</script>
<script>
/* =====================================================================
   LUGARES.JS — a nossa cidade tem lugares para ENTRAR e objetos para USAR
     Fora:   prédios com letreiro (Pinguim, Mercadão, Teatro...), hidrantes,
             lixeiras, bancos, caixas de correio, bancas, máquinas, ônibus
             e pessoas para conversar (elas dão dicas e mostram o caminho)
     Dentro: salas desenhadas por código, com atendente e objetos para usar
   Tudo aqui usa E (interagir). Dentro dos lugares, ESC também sai.
   ===================================================================== */
(function (G) {
  'use strict';
  const SP = G.sprites, W = G.world, TAU = Math.PI * 2;
  const VW = 800, VH = 600;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const shade = SP.shade;
  const L = G.lugares = { PLACES: W.places };

  // ---------- visual do personagem (barbearia e loja de roupas mudam isso) ----------
  const CORTES = ['topete', 'curto', 'raspado', 'careca', 'afro', 'longo', 'rabo', 'coque'];
  const CORES_CAB = ['#1a1208', '#3a2412', '#7a5a2a', '#c9a24a', '#111111', '#8a8a8a', '#b3361e', '#3a6ad0'];
  const ROUPAS = [
    { shirt: '#e8832a', pat: 'hawaii', sleeve: 'curta' }, { shirt: '#1c1c22', pat: 'jaqueta', sleeve: 'longa' },
    { shirt: '#d33a3a', pat: 'liso', sleeve: 'curta' }, { shirt: '#3a7ad3', pat: 'listra', sleeve: 'curta' },
    { shirt: '#e8e8e8', pat: 'liso', sleeve: 'regata' }, { shirt: '#2f7a3a', pat: 'xadrez', sleeve: 'longa' },
    { shirt: '#8a4fc2', pat: 'liso', sleeve: 'curta' }, { shirt: '#e0b32a', pat: 'listra', sleeve: 'regata' }
  ];
  const CALCAS = ['#2f4f86', '#1c1c20', '#4a3a2a', '#6a5a46', '#3a3a3f', '#56688a', '#23232c'];
  const TENIS = ['#f2f2f2', '#121216', '#d33a3a', '#2a5ac8', '#3a2412', '#e0b32a'];
  const ACESS = [{ acc: 'shades', accCol: '#000000' }, { acc: 'none', accCol: '#000000' }, { acc: 'cap', accCol: '#d33a3a' }, { acc: 'cap', accCol: '#2a2a30' }, { acc: 'beanie', accCol: '#3a7ad3' }, { acc: 'hat', accCol: '#d2b074' }];
  L.aplicarLook = function (S) {

    const lk = S.save.look = Object.assign({ corte: 0, cor: 0, roupa: 0, calca: 0, tenis: 0, acess: 0 }, S.save.look || {});
    const P = S.player, r = ROUPAS[lk.roupa % ROUPAS.length], a = ACESS[lk.acess % ACESS.length];
    Object.assign(P, { hairStyle: CORTES[lk.corte % CORTES.length], hair: CORES_CAB[lk.cor % CORES_CAB.length], shirt: r.shirt, pat: r.pat, sleeve: r.sleeve, pants: CALCAS[lk.calca % CALCAS.length], shoe: TENIS[lk.tenis % TENIS.length], acc: a.acc, accCol: a.accCol });
  };
  function mudaLook(S, campo, n) { S.save.look[campo] = ((S.save.look[campo] || 0) + 1) % n; L.aplicarLook(S); G.save(); }

  // ---------- dinheiro e vida ----------
  function gasta(S, v) {
    if (S.save.money < v) { G.say('Dinheiro insuficiente ($' + v + ').', 2.5); return false; }
    S.save.money -= v; G.snd.cash(); G.save(); return true;
  }
  function cura(S, n) { S.player.hp = Math.min(100, S.player.hp + n); }

  // ---------- falas (pessoas e atendentes) ----------
  const FALAS = [
    'Calor de Ribeirão não perdoa, hein?', 'Já tomou um chopp no Pinguim hoje?', 'Terra roxa, cana e sertanejo: isso aqui é Ribeirão!',
    'Cuidado com os carros por aí!', 'Esse trânsito está uma loucura...', 'Se estiver machucado, vá ao hospital.', 'A polícia anda de olho, viu?',
    'Que dia bonito!', 'Dizem que o Rei da Cidade tem quatro mil no bolso.', 'Passa no Mercadão, o pastel é bom demais!',
    'Vai ao Theatro Pedro II, é lindo!', 'Quer ficar forte? A academia tem esteira nova.', 'Sou daqui desde sempre. Ribeirão é a melhor!',

  const DICAS = [

  const PONTOS = ['norte', 'nordeste', 'leste', 'sudeste', 'sul', 'sudoeste', 'oeste', 'noroeste'];
  function direcao(from, to) {

  // balão de fala
  function bolha(p, txt, secs) { p.bub = { txt, t: secs || 3.5 }; }
  function desenhaBolha(ctx, x, y, txt, alpha) {
    ctx.save(); ctx.font = 'bold 10px Arial, sans-serif';
    const palavras = txt.split(' '), linhas = []; let cur = '';
    palavras.forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > 120 && cur) { linhas.push(cur); cur = w; } else cur = t; });
    linhas.push(cur);

  // ---------- transição (tela preta rápida) ----------

  // =====================================================================
  //  FORA: objetos da cidade, pessoas e lugares

  const nomeAqui = (x, y) => { let best = null, bd = 1e9; W.places.forEach(p => { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p; } }); return best ? 'perto de ' + best.nome : 'na cidade'; };

  function entrar(S, pl) {

    if (pl.horario) { const h = L.hora(S); if (h < pl.horario[0] || h >= pl.horario[1]) { G.say(pl.nome + ' está FECHADO agora. Abre às ' + pl.horario[0] + 'h e fecha às ' + pl.horario[1] + 'h.', 4); return; } }
    G.snd.door();
    L.trans(S, () => { if (S.mode !== 'play') return; S.mode = 'inside'; S.inside = montar(pl); S.prompt = ''; });
  }

  function falar(S, p) {
    const P = S.player;
    p.talkT = 5; p.h = Math.atan2(P.y - p.y, P.x - p.x) + Math.PI / 2;

  L.extrasAcao = []; L.extrasDesenho = []; L.extrasAtualizar = [];   // outros arquivos (casas, mercados...) se penduram aqui

  L.acao = function (S) {

    for (const pl of W.places) if (Math.hypot(pl.x - P.x, pl.y - P.y) < pl.r) return { t: 'lugar', s: 'E: ENTRAR — ' + pl.nome, run: () => entrar(S, pl) };

    let bp = null, bd = 26;
    for (const pr of W.propList) {
      if (!INTERATIVOS[pr.tipo] || Math.abs(pr.x - P.x) > 30 || Math.abs(pr.y - P.y) > 30) continue;
      const d = Math.hypot(pr.x - P.x, pr.y - P.y); if (d < bd) { bd = d; bp = pr; }
    }
    if (bp) return { t: 'lugar', s: 'E: ' + INTERATIVOS[bp.tipo], run: () => usaProp(S, bp) };
    let pp = null; bd = 40;
    for (const p of S.peds) {

    }

  };

  function usaProp(S, pr) {
    const P = S.player; S.prop = S.prop || {}; const st = S.prop[pr.id] = S.prop[pr.id] || {};
    if (pr.tipo === 'hidrante') { st.ate = S.time + 9; G.say('Hidrante aberto! Que refresco...', 3); G.snd.door(); }
    else if (pr.tipo === 'lixeira') {
      if (st.t && S.time - st.t < 120) { G.say('Você já remexeu aqui. Só sobrou lixo.', 2.5); return; }
      st.t = S.time; const r = Math.random();
      if (r < 0.3) { const v = 5 + Math.floor(Math.random() * 26); S.save.money += v; G.save(); G.snd.cash(); G.say('Achou uns trocados na lixeira: $' + v + '!', 3); }
      else if (r < 0.4) { P.hp = Math.max(1, P.hp - 4); G.say('Um rato pulou da lixeira! Que susto!', 3); G.snd.beep(); }
      else if (r < 0.5) { cura(S, 8); G.say('Meia pizza ainda boa... você comeu (+vida).', 3); }

    } else if (pr.tipo === 'ponto') {

    }
  }

  // ---------- atualizações do mundo (hidrantes, balões, saudações, sentar, guia) ----------
  L.atualizar = function (S, dt) {
    const P = S.player; if (S.bebado > 0) S.bebado -= dt; if (S.energia > 0) S.energia -= dt;
    // hidrantes abertos jorram água
    if (S.prop) for (const id in S.prop) {
      const st = S.prop[id]; if (!st.ate || S.time > st.ate) continue;
      const pr = W.propList.find(q => q.id === id); if (!pr || Math.hypot(pr.x - P.x, pr.y - P.y) > 700) continue;
      for (let k = 0; k < 2; k++) { const a = rand(0, TAU), v = rand(30, 95); G.particle({ x: pr.x, y: pr.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.5, 0.9), size: rand(1.5, 2.5), col: 'smoke', tint: '#bfe4ff', a: 0.6 }); }
    }
    // sentado: recupera vida
    if (S.sentado) { P.vx = P.vy = 0; P.hp = Math.min(100, P.hp + 5 * dt); if (P.hp >= 100 && !S.sentado.avisou) { S.sentado.avisou = true; G.say('Vida cheia! Aperte E para levantar.', 2.5); } }

    L.extrasAtualizar.forEach(f => f(S, dt));

    if (S.guia) { S.guia.t -= dt; const pl = W.places.find(q => q.id === S.guia.id); if (!pl || S.guia.t <= 0 || Math.hypot(pl.x - P.x, pl.y - P.y) < 70) S.guia = null; }
  };

  // ---------- desenho no mundo: marcadores, balões, seta do guia ----------
  L.desenhar = function (ctx, S, inV) {
    const t = S.time;
    W.places.forEach(pl => {
      if (!inV(pl)) return;
      const k = 1 + 0.12 * Math.sin(t * 3 + pl.x);
      ctx.save(); ctx.translate(pl.x, pl.y);

      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(7, 4); ctx.lineTo(0, 1); ctx.lineTo(-7, 4); ctx.closePath(); ctx.fill();   // seta "entrar"
      ctx.restore();
    });
    L.extrasDesenho.forEach(f => f(ctx, S, inV));
    // hidrantes: poça
    if (S.prop) for (const id in S.prop) {
      const st = S.prop[id]; if (!st.ate || t > st.ate + 6) continue;
      const pr = W.propList.find(q => q.id === id); if (!pr || !inV(pr)) continue;
      ctx.fillStyle = 'rgba(120,170,230,' + (0.25 * clamp((st.ate + 6 - t) / 6, 0, 1)) + ')'; ctx.beginPath(); ctx.ellipse(pr.x, pr.y, 18, 12, 0, 0, TAU); ctx.fill();

    if (S.guia) {
      const pl = W.places.find(q => q.id === S.guia.id), P = S.player;
      if (pl) {
        const a = Math.atan2(pl.y - P.y, pl.x - P.x), d = Math.hypot(pl.x - P.x, pl.y - P.y);
        ctx.save(); ctx.translate(P.x + Math.cos(a) * 46, P.y + Math.sin(a) * 46); ctx.rotate(a);
        ctx.fillStyle = pl.cor; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-6, -8); ctx.lineTo(-2, 0); ctx.lineTo(-6, 8); ctx.closePath(); ctx.fill(); ctx.stroke();

    }
  };

  // =====================================================================
  //  DENTRO: as salas
  // =====================================================================
  let FX0 = 70, FX1 = 730, FY0 = 150, FY1 = 545, PX = 400;      // chão da sala (muda a cada sala; veja usa())
  function usa(R) { FX0 = R.x0; FX1 = R.x1; FY0 = R.y0; FY1 = R.y1; PX = R.portaX; }
  const hh = (a, b) => { const v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return v - Math.floor(v); };

  // caixa em perspectiva: topo + frente (a sombra fica no chão)
  function caixa(ctx, x, y, w, h, e, cTop, cFront) {
    ctx.fillStyle = 'rgba(0,0,0,0.30)'; ctx.fillRect(x + 5, y + 7, w, h);
    if (e > 0) {
      const g = ctx.createLinearGradient(0, y + h - e, 0, y + h); g.addColorStop(0, shade(cFront, 0.06)); g.addColorStop(1, shade(cFront, -0.38));
      ctx.fillStyle = g; ctx.fillRect(x, y + h - e, w, e); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x, y + h - e, w, 1.5);
    }
    const g2 = ctx.createLinearGradient(x, y - e, x + w, y - e + h); g2.addColorStop(0, shade(cTop, 0.14)); g2.addColorStop(1, shade(cTop, -0.2));

  }
  const garrafa = (ctx, x, y, c) => { ctx.fillStyle = c; ctx.fillRect(x - 2.5, y - 12, 5, 12); ctx.fillRect(x - 1, y - 17, 2, 6); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(x - 1.8, y - 11, 1, 8); };
  const copo = (ctx, x, y, cheio) => { ctx.fillStyle = 'rgba(225,238,248,0.75)'; ctx.fillRect(x - 3, y - 9, 6, 9); if (cheio) { ctx.fillStyle = '#e8b830'; ctx.fillRect(x - 2.4, y - 7, 4.8, 6.4); ctx.fillStyle = '#fff'; ctx.fillRect(x - 2.4, y - 8.8, 4.8, 2); } ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 0.8; ctx.strokeRect(x - 3, y - 9, 6, 9); };
  const prato = (ctx, x, y, c) => { ctx.fillStyle = '#f2f2ee'; ctx.beginPath(); ctx.ellipse(x, y, 9, 4.5, 0, 0, TAU); ctx.fill(); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.lineTo(x + 6, y); ctx.lineTo(x, y - 8); ctx.closePath(); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 0.8; ctx.stroke(); };

  function drawObj(ctx, o, t) {
    const x = o.x, y = o.y, w = o.w, h = o.h, e = o.e || 0, ty = y - e;

        ctx.fillStyle = 'rgba(0,0,0,0.22)'; for (let k = x + 10; k < x + w - 20; k += 42) ctx.fillRect(k, y + h - e + 5, 32, e - 10);
        ctx.fillStyle = 'rgba(255,255,255,0.1)'; for (let k = x + 10; k < x + w - 20; k += 42) ctx.fillRect(k, y + h - e + 5, 32, 1.5);
        const my = ty + h * 0.62;
        if (o.itens === 'bar') for (let k = x + 16, i = 0; k < x + w - 10; k += 26, i++) { if (i % 3 === 1) garrafa(ctx, k, my, ['#2f8a3c', '#c8302a', '#d8a82a'][i % 3]); else copo(ctx, k, my, i % 3 === 0); }
        else if (o.itens === 'pastel') for (let k = x + 24; k < x + w - 16; k += 46) prato(ctx, k, my, '#d8a040');
        else if (o.itens === 'caldo') for (let k = x + 20; k < x + w - 12; k += 30) { ctx.fillStyle = '#a8e060'; ctx.fillRect(k - 4, my - 11, 8, 11); ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(k - 3, my - 10, 2, 8); ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.strokeRect(k - 4, my - 11, 8, 11); }
        else if (o.itens === 'colete') for (let k = x + 20; k < x + w - 20; k += 44) { ctx.fillStyle = '#2a58b8'; ctx.beginPath(); ctx.moveTo(k - 10, my - 12); ctx.lineTo(k + 10, my - 12); ctx.lineTo(k + 10, my - 2); ctx.quadraticCurveTo(k + 10, my + 4, k, my + 5); ctx.quadraticCurveTo(k - 10, my + 4, k - 10, my - 2); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#0a1a3a'; ctx.stroke(); }
        else if (o.itens === 'remedios') for (let k = x + 16; k < x + w - 14; k += 22) { ctx.fillStyle = ['#ffffff', '#e8505a', '#4aa0e0'][(k | 0) % 3]; ctx.fillRect(k - 5, my - 10, 10, 10); ctx.fillStyle = '#2f9a4a'; ctx.fillRect(k - 1, my - 8, 2, 6); ctx.fillRect(k - 3, my - 6, 6, 2); ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.strokeRect(k - 5, my - 10, 10, 10); }
        else if (o.itens === 'bilhetes') for (let k = x + 18; k < x + w - 14; k += 30) { ctx.fillStyle = '#f2d88a'; ctx.fillRect(k - 8, my - 4, 16, 7); ctx.fillStyle = '#8a1f3a'; ctx.fillRect(k - 8, my - 4, 4, 7); ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.strokeRect(k - 8, my - 4, 16, 7); }

        if (o.itens !== 'colete' && o.itens !== 'bilhetes') { ctx.fillStyle = '#2a2d36'; ctx.fillRect(x + w - 30, my - 10, 20, 12); ctx.fillStyle = '#6fe0a0'; ctx.fillRect(x + w - 27, my - 8, 14, 4); ctx.fillStyle = '#c8ccd4'; ctx.fillRect(x + w - 27, my - 2, 14, 2); }
        break;
      }
      case 'mesa': {
        const cx = x + w / 2, cy = y + h / 2;
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(cx + 5, cy + 8, w / 2, h / 2.2, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#3a2a1c'; ctx.fillRect(cx - 3, cy - 2, 6, e);
        const g = ctx.createRadialGradient(cx - 8, ty + h / 2 - 6, 2, cx, ty + h / 2, w / 2); g.addColorStop(0, '#c8955a'); g.addColorStop(1, '#7a5230');
        ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, cy - e, w / 2, h / 2.2, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.stroke();
        copo(ctx, cx - 9, cy - e + 2, true); copo(ctx, cx + 9, cy - e + 4, true); break;
      }
      case 'cadeira': {

  // =====================================================================

  L.construtores = {};        // id do lugar -> { criar(idSala, lugar) }  (casas.js, mercados.js, hoteis.js...)
  const tipos = {};           // desenhos extras de objetos (os outros arquivos registram aqui)

  // cria uma sala vazia com o tamanho do chão (w x h) e a barreira da parede de trás
  L.novaSala = function (o) {
    const w = o.w || 660, h = o.h || 395;
    const R = Object.assign({ objs: [], npcs: [], preview: false, bg: null, ph: Math.PI, walk: 0, piso: 'ladrilho', pisoCores: ['#dddddd', '#aaaaaa'], parede: '#888888', nome: '', cor: '#888888' }, o);
    R.x0 = 70; R.y0 = 150; R.x1 = 70 + w; R.y1 = 150 + h; R.W = R.x1 + 70; R.H = R.y1 + 55;
    R.portaX = o.portaX || (R.x0 + R.x1) / 2;
    R.px = R.portaX; R.py = R.y1 - 40;
    R.luzes = o.luzes || [{ x: R.x0 + w / 2, y: R.y0 + h * 0.45, r: Math.max(330, w * 0.45) }];
    R.objs.push(O('barreira', R.x0 - 10, R.y0 - 30, w + 20, 70, { invisivel: true }));
    return R;
  };

  function montar(pl) {
    const cons = L.construtores[pl.id] || L.construtores['tipo:' + pl.tipo];
    let R;
    if (cons) { const lg = { id: pl.id, place: pl, salas: {}, estado: {}, criar: cons.criar }; R = lg.criar('entrada', lg); R.lugar = lg; R.id = R.id || 'entrada'; lg.salas[R.id] = R; }
    else { R = montarLegado(pl); R.lugar = { id: pl.id, place: pl, salas: { entrada: R }, estado: {} }; R.id = 'entrada'; }
    R.place = R.place || pl; R.dentroDesde = G.S ? G.S.time : 0;
    if (R.aoEntrar) R.aoEntrar(G.S, R);
    centraCam(R);
    return R;
  }
  function centraCam(R) { R.cx = clamp(R.px - VW / 2, 0, Math.max(0, R.W - VW)); R.cy = clamp(R.py - 350, 0, Math.max(0, R.H - VH)); }

  // trocar de sala dentro do mesmo lugar (elevador, corredor, piscina, cozinha...)
  L.irSala = function (S, id, px, py, ph) {
    const R0 = S.inside; if (!R0 || S.trans) return;
    G.snd.door();
    L.trans(S, () => {
      const lg = R0.lugar; let R = lg.salas[id];
      if (!R) { R = lg.salas[id] = lg.criar(id, lg); R.lugar = lg; R.id = id; R.place = R.place || lg.place; }
      if (R.aoEntrar) R.aoEntrar(S, R);
      R.px = px != null ? px : R.px; R.py = py != null ? py : R.py; R.ph = ph != null ? ph : Math.PI; R.sentado = null; R.menu = null; R.mini = null;
      S.inside = R; centraCam(R);
    });
  };

  function sair(S) {
    const R = S.inside; if (!R || S.trans) return;
    if (R.aoSair && R.aoSair(S, R) === false) return;
    G.snd.door();
    L.trans(S, () => {
      const P = S.player, pl = R.lugar.place;
      S.mode = 'play'; S.inside = null; P.x = pl.x; P.y = pl.y + 12; P.vx = P.vy = 0; P.h = Math.PI; S.cam.x = P.x; S.cam.y = P.y; S.prompt = '';
    });
  }
  function saidaDaSala(S) { const R = S.inside; if (R.porta && R.porta.para) L.irSala(S, R.porta.para, R.porta.px, R.porta.py, R.porta.ph); else sair(S); }

  function distRect(px, py, o) {
    const z = o.zona || [o.x, o.y - (o.e || 0), o.w, o.h + (o.e || 0)];
    const dx = Math.max(z[0] - px, 0, px - (z[0] + z[2])), dy = Math.max(z[1] - py, 0, py - (z[1] + z[3]));
    return Math.hypot(dx, dy);
  }

  // ---------- hora do jogo (0 do dayT = amanhecer, 6h) ----------
  L.hora = function (S) { const f = ((S.dayT % 1) + 1) % 1; return (f * 24 + 6) % 24; };
  L.horaTxt = function (S) { const h = L.hora(S); return String(Math.floor(h)).padStart(2, '0') + ':' + String(Math.floor((h % 1) * 60)).padStart(2, '0'); };

  // ---------- mochila de comida ----------
  const ALIM = {

  };
  L.ALIM = ALIM;
  L.dar = function (S, id, q) { S.save.inv = S.save.inv || {}; S.save.inv[id] = (S.save.inv[id] || 0) + (q || 1); };
  L.totalMochila = S => { let n = 0; const inv = S.save.inv || {}; for (const k in inv) n += inv[k]; return n; };
  L.comer = function (S) {
    const P = S.player, inv = S.save.inv || {}, ids = Object.keys(inv).filter(k => inv[k] > 0 && ALIM[k]);
    if (!ids.length) { G.say('A mochila está vazia. Compre comida nos mercados!', 3); return; }
    if (P.hp >= 100) { G.say('Sua vida está cheia. Guarde a comida para depois.', 2.5); return; }
    const falta = 100 - P.hp; let best = null;
    ids.forEach(k => { const a = ALIM[k]; if (a.hp <= falta && (!best || a.hp > ALIM[best].hp)) best = k; });
    if (!best) ids.forEach(k => { if (!best || ALIM[k].hp < ALIM[best].hp) best = k; });
    const a = ALIM[best]; inv[best]--; if (inv[best] <= 0) delete inv[best];
    P.hp = Math.min(100, P.hp + a.hp);
    if (a.bebado) S.bebado = (S.bebado || 0) + a.bebado;
    if (a.energia) S.energia = (S.energia || 0) + a.energia;
    G.save(); G.snd.beep(); G.say('Você comeu: ' + a.n + ' (+' + a.hp + ' vida)' + (a.energia ? ' — energia total!' : '') + (a.bebado ? ' — cabeça rodando...' : ''), 3);
  };

  // ---------- armas, assalto e polícia ----------
  const armado = S => { const w = S.player.weapon; return w === 'pistol' || w === 'smg' || w === 'shotgun'; };
  function falaDe(S, R, n) {
    const txt = pick(n.falas || FALAS);
    n.h = Math.atan2(R.px - n.x, -(R.py - n.y));
    bolha(n.p, (n.nome ? n.nome.split(' ')[0] + ': ' : '') + txt, 4.5);
  }
  function chamaPolicia(S, R, seg) { const g = R.lugar; if (g.alarmeFeito) return; g.alarme = Math.min(g.alarme == null ? 99 : g.alarme, seg || 12); }
  function ameacar(S, R, n) {
    if (!armado(S)) { G.say('Para ameaçar alguém você precisa de uma arma na mão (aperte Q/1-6 na rua).', 3.5); return; }
    if (n.dorme) { n.dorme = false; n.acordou = true; bolha(n.p, 'AAAH! Quem é você?!', 2.5); }

    if (n.crianca) { bolha(n.p, 'Não! Por favor!', 3); n.h = Math.atan2(R.px - n.x, -(R.py - n.y)); return; }
    if (n.rendido) { bolha(n.p, 'Já dei tudo o que eu tinha!', 3); return; }
    n.rendido = true; n.h = Math.atan2(R.px - n.x, -(R.py - n.y));
    const v = n.dinheiro != null ? n.dinheiro : Math.round(rand(20, 120));
    bolha(n.p, pick(['Tá bom! Leva o dinheiro e vai embora!', 'Não atira! Pega tudo!', 'Calma! Tá aqui, é tudo que eu tenho!']), 3.5);
    if (v > 0) { S.save.money += v; G.save(); G.snd.cash(); G.say('ASSALTO! Você levou $' + v + (n.nome ? ' de ' + n.nome.split(' ')[0] : '') + '.', 4); }
    else G.say(n.nome ? n.nome.split(' ')[0] + ' está sem dinheiro.' : 'Sem dinheiro.', 3);
    R.assaltos = (R.assaltos || 0) + 1;

  // ---------- cardápios e menus ----------
  // menu = { titulo, itens:[{ n, preco, desc, fn(S,R) }], sel, rodape, info }
  L.abrirMenu = function (S, menu) { const R = S.inside; menu.sel = menu.sel || 0; R.menu = menu; };
  function usaMenu(S, R, K, Kp) {
    const m = R.menu, n = m.itens.length;
    if (Kp('Escape')) { R.menu = null; if (m.aoFechar) m.aoFechar(S, R); return; }
    if (Kp('ArrowUp', 'KeyW')) m.sel = (m.sel + n - 1) % n;
    if (Kp('ArrowDown', 'KeyS')) m.sel = (m.sel + 1) % n;
    if (Kp('Enter', 'KeyE', 'Space')) { const it = m.itens[m.sel]; const r = it.fn && it.fn(S, R, it); if (r === 'fechar') { R.menu = null; if (m.aoFechar) m.aoFechar(S, R); } else if (m.atualiza) m.atualiza(m, S, R); }
  }
  function desenhaMenu(ctx, S, R) {
    const m = R.menu, n = m.itens.length, w = 560, rh = 34, h = 84 + n * rh + (m.rodape ? 22 : 0), x = (VW - w) / 2, y = Math.max(20, (VH - h) / 2);
    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = 'rgba(12,10,22,0.96)'; W.rrect(ctx, x, y, w, h, 12); ctx.fill(); ctx.strokeStyle = R.cor || '#ffe04a'; ctx.lineWidth = 3; ctx.stroke();
    ctx.textAlign = 'left'; ctx.fillStyle = '#ffe04a'; ctx.font = 'bold 20px Arial'; ctx.fillText(m.titulo, x + 20, y + 32);
    if (m.info) { ctx.fillStyle = '#9dff9d'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'right'; ctx.fillText(typeof m.info === 'function' ? m.info(S, R) : m.info, x + w - 20, y + 30); ctx.textAlign = 'left'; }
    m.itens.forEach((it, i) => {
      const yy = y + 50 + i * rh, sel = i === m.sel;
      if (sel) { ctx.fillStyle = 'rgba(255,224,74,0.2)'; ctx.fillRect(x + 10, yy, w - 20, rh - 4); ctx.strokeStyle = '#ffe04a'; ctx.lineWidth = 1.5; ctx.strokeRect(x + 10, yy, w - 20, rh - 4); }
      if (it.cor) { ctx.fillStyle = it.cor; ctx.beginPath(); ctx.arc(x + 30, yy + 14, 7, 0, TAU); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1; ctx.stroke(); }
      ctx.fillStyle = sel ? '#fff' : '#ccc'; ctx.font = 'bold 14px Arial'; ctx.fillText(it.n, x + (it.cor ? 46 : 22), yy + 15);
      if (it.desc) { ctx.fillStyle = sel ? '#bbb' : '#888'; ctx.font = '11px Arial'; ctx.fillText(it.desc, x + (it.cor ? 46 : 22), yy + 28); }
      if (it.preco != null) { ctx.fillStyle = S.save.money >= it.preco ? '#9dff9d' : '#ff7a7a'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'right'; ctx.fillText('$' + it.preco, x + w - 22, yy + 21); ctx.textAlign = 'left'; }
    });
    ctx.fillStyle = '#aaa'; ctx.font = '11px Arial'; ctx.textAlign = 'center'; ctx.fillText(m.rodape || 'W/S escolher  ·  E confirmar  ·  ESC fechar', x + w / 2, y + h - 10);

  // ---------- mini-jogo de timing (academia) ----------
  // aperte E quando o ponteiro estiver na faixa verde
  L.miniTiming = function (S, o) { const R = S.inside; R.mini = Object.assign({ pos: 0, dir: 1, v: 1.3, zona: 0.14, rep: 0, reps: 3, acertos: 0, msg: '', fim: 0 }, o); };
  function usaMini(S, R, dt, Kp) {
    const m = R.mini;
    if (m.fim > 0) { m.fim -= dt; if (m.fim <= 0) { const cb = m.cb, ok = m.acertos, tot = m.reps; R.mini = null; if (cb) cb(S, R, ok, tot); } return; }
    m.pos += m.dir * m.v * dt; if (m.pos > 1) { m.pos = 1; m.dir = -1; } if (m.pos < 0) { m.pos = 0; m.dir = 1; }
    if (Kp('Escape')) { R.mini = null; return; }
    if (Kp('KeyE', 'Space', 'Enter')) {
      const ok = Math.abs(m.pos - m.alvo) < m.zona / 2; m.rep++; if (ok) m.acertos++;
      m.msg = ok ? 'BOA!' : 'ERROU!'; G.snd.beep(); m.alvo = 0.2 + Math.random() * 0.6; m.v *= 1.12;
      if (m.rep >= m.reps) m.fim = 0.9;
    }

  function desenhaMini(ctx, S, R) {

    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, VW, VH);
    const w = 460, x = (VW - w) / 2, y = 250;
    ctx.fillStyle = 'rgba(12,10,22,0.95)'; W.rrect(ctx, x - 20, y - 70, w + 40, 150, 12); ctx.fill(); ctx.strokeStyle = R.cor; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#ffe04a'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center'; ctx.fillText(m.titulo || 'TREINO', 400, y - 38);
    ctx.fillStyle = '#2a2a34'; ctx.fillRect(x, y, w, 26);
    ctx.fillStyle = '#3ad060'; ctx.fillRect(x + (m.alvo - m.zona / 2) * w, y, m.zona * w, 26);
    ctx.fillStyle = '#fff'; ctx.fillRect(x + m.pos * w - 3, y - 6, 6, 38);
    ctx.fillStyle = '#ddd'; ctx.font = 'bold 14px Arial'; ctx.fillText('Aperte E quando o ponteiro estiver na faixa verde  —  ' + m.rep + '/' + m.reps + ' repetições', 400, y + 56);

      ctx.fillStyle = '#e8c850'; ctx.beginPath(); ctx.arc(x + w - 8, y + h * 0.55, 3, 0, TAU); ctx.fill();

  };

  // ---------- supermercado ----------
  // gôndola: prateleira alta com produtos coloridos (o.cores = lista de cores)
  T.gondola = (ctx, o, t) => {

    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(o.x, ty, o.w, 2);
    // topo com produtos vistos de cima
    for (let k = 0; k < o.w - 6; k += 9) { ctx.fillStyle = cs[(k / 9 + 1) % cs.length | 0]; ctx.fillRect(o.x + 4 + k, ty + 3, 6, o.h - 6); }
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.strokeRect(o.x + 0.5, ty + 0.5, o.w - 1, o.h + e - 1);
    if (o.nome) { ctx.fillStyle = 'rgba(0,0,0,0.65)'; const ww = Math.min(o.w, 70); ctx.fillRect(o.x + o.w / 2 - ww / 2, ty - 11, ww, 11); ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center'; ctx.fillText(o.nome, o.x + o.w / 2, ty - 3); ctx.textAlign = 'left'; }

  // legenda de seção no teto do mercado (placa pendurada)
  T.placa_secao = (ctx, o) => { ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(o.x + 3, o.y + 5, o.w, o.h); ctx.fillStyle = o.cor || '#2e8b3e'; ctx.fillRect(o.x, o.y, o.w, o.h); ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center'; ctx.fillText(o.texto, o.x + o.w / 2, o.y + o.h / 2 + 4); ctx.textAlign = 'left'; ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.strokeRect(o.x + 0.5, o.y + 0.5, o.w - 1, o.h - 1); };
