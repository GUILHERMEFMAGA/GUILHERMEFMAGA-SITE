<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rua Vermelha — jogo de mundo aberto estilo GTA antigo (+16)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0814; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #000; image-rendering: auto; box-shadow: 0 0 40px rgba(0,0,0,.8); }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
/* ============================================================
   world.js — o mapa da cidade (tiles, prédios, parques, rio)
   e o desenho do cenário no estilo GTA 1 / GTA 2.
   Tudo é desenhado por código; o cenário é "fotografado" em
   pedaços (chunks) uma vez só para o jogo ficar leve.
   ============================================================ */
(function (G) {
  'use strict';

  // ---------- Medidas do mapa ----------
  const T = 32;          // tamanho de um tile em pixels
  const ROAD = 6;        // largura da rua (tiles) = 2 faixas de 3 tiles
  const BLOCK = 12;      // lado de uma quadra (tiles)
  const PITCH = ROAD + BLOCK;
  const COLS = 6, ROWS = 4;  // quadras na horizontal / vertical
  const RIVER = 3;       // coluna de quadras ocupada pelo rio
  const MG = 6;          // margem fora das ruas (calçada + prédios)
  const INNER_W = COLS * PITCH + ROAD;
  const INNER_H = ROWS * PITCH + ROAD;
  const TW = INNER_W + MG * 2, TH = INNER_H + MG * 2;
  const W = TW * T, H = TH * T;

  // tipos de tile
  const TILE = { ROAD: 0, SIDE: 1, BUILD: 2, GRASS: 3, WATER: 4, BRIDGE: 5, CROSS: 6 };

  const tiles = new Uint8Array(TW * TH).fill(TILE.BUILD);
  const setRect = (tx, ty, tw, th, type) => {
    for (let y = ty; y < ty + th; y++) for (let x = tx; x < tx + tw; x++) tiles[y * TW + x] = type;
  };

  // ---------- Aleatório com semente (a cidade é sempre a mesma) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(19970101);

  // ---------- Coordenadas úteis ----------
  const roadLeft = i => (MG + i * PITCH) * T;           // x da borda esquerda da rua vertical i
  const roadTop = j => (MG + j * PITCH) * T;            // y da borda de cima da rua horizontal j
  const nodeX = i => (MG + i * PITCH + ROAD / 2) * T;   // centro do cruzamento
  const nodeY = j => (MG + j * PITCH + ROAD / 2) * T;
  // faixas (mão direita, como no Brasil)
  const laneV = (i, dir) => roadLeft(i) + (dir > 0 ? 1.5 : 4.5) * T;  // dir>0 = descendo
  const laneH = (j, dir) => roadTop(j) + (dir > 0 ? 4.5 : 1.5) * T;   // dir>0 = indo p/ direita

  // ---------- Estilos de telhado ----------
  const ROOFS = [
    { kind: 'flat', base: '#7b5b3f', edge: '#a58665', dark: '#5a412d' },
    { kind: 'flat', base: '#8d8d98', edge: '#b9b9c4', dark: '#6b6b77' },
    { kind: 'flat', base: '#c7b38b', edge: '#e4d5b0', dark: '#a4906a' },
    { kind: 'tile', base: '#d9782d', edge: '#f39c52', dark: '#b05713' },
    { kind: 'tile', base: '#b5382b', edge: '#da5d4c', dark: '#89231a' },
    { kind: 'tile', base: '#4a7cb3', edge: '#6b9dd2', dark: '#33587f' },
    { kind: 'tile', base: '#c4622e', edge: '#e5844f', dark: '#9b4519' },
    { kind: 'flat', base: '#6d7d6b', edge: '#93a590', dark: '#506050' },
  ];

  const buildings = [];
  const trees = [];
  const lamps = [];
  const ponds = [];
  const blocks = [];

  function addBuilding(x, y, w, h, forceRoof) {
    const p = ROOFS[forceRoof != null ? forceRoof : Math.floor(rnd() * ROOFS.length)];
    const b = { x, y, w, h, p, ridge: w >= h ? 'h' : 'v', det: [] };
    if (p.kind === 'flat') {
      const n = 1 + Math.floor(rnd() * 3);
      for (let k = 0; k < n; k++) {
        b.det.push({ fx: 0.2 + rnd() * 0.6, fy: 0.2 + rnd() * 0.6, t: ['ac', 'sky', 'tank', 'ac'][Math.floor(rnd() * 4)] });
      }
    } else if (rnd() < 0.5) {
      b.det.push({ fx: 0.25 + rnd() * 0.5, fy: 0.3 + rnd() * 0.4, t: 'chim' });
    }
    buildings.push(b);
  }

  // divide uma área (em tiles) em prédios
  function partition(tx, ty, tw, th) {
    const r = rnd();
    const add = (a, b, c, d) => addBuilding(a * T + 5, b * T + 5, c * T - 10, d * T - 10);
    if (r < 0.2) add(tx, ty, tw, th);
    else if (r < 0.4) { add(tx, ty, tw / 2, th); add(tx + tw / 2, ty, tw / 2, th); }
    else if (r < 0.6) { add(tx, ty, tw, th / 2); add(tx, ty + th / 2, tw, th / 2); }
    else if (r < 0.8) { add(tx, ty, tw / 2, th / 2); add(tx + tw / 2, ty, tw / 2, th / 2); add(tx, ty + th / 2, tw / 2, th / 2); add(tx + tw / 2, ty + th / 2, tw / 2, th / 2); }
    else { add(tx, ty, tw, th / 2); add(tx, ty + th / 2, tw / 2, th / 2); add(tx + tw / 2, ty + th / 2, tw / 2, th / 2); }
  }

  // ---------- Montagem do mapa ----------
  // calçada em volta de tudo + ruas
  setRect(MG - 2, MG - 2, INNER_W + 4, INNER_H + 4, TILE.SIDE);
  setRect(MG, MG, INNER_W, INNER_H, TILE.ROAD);

  const PARKS = [[1, 1], [5, 3]];
  for (let by = 0; by < ROWS; by++) {
    for (let bx = 0; bx < COLS; bx++) {
      const tx = MG + ROAD + bx * PITCH, ty = MG + ROAD + by * PITCH;
      let kind = 'city';
      if (bx === RIVER) kind = 'river';
      else if (PARKS.some(p => p[0] === bx && p[1] === by)) kind = 'park';
      const blk = { bx, by, tx, ty, x: tx * T, y: ty * T, w: BLOCK * T, h: BLOCK * T, kind };
      blocks.push(blk);
      if (kind === 'river') {
        setRect(tx, ty, BLOCK, BLOCK, TILE.WATER);
      } else {
        setRect(tx, ty, BLOCK, BLOCK, TILE.SIDE);
        if (kind === 'city') {
          setRect(tx + 2, ty + 2, 8, 8, TILE.BUILD);
          partition(tx + 2, ty + 2, 8, 8);
        } else {
          setRect(tx + 2, ty + 2, 8, 8, TILE.GRASS);
          // lago
          const cx = tx + 6, cy = ty + 6;
          for (let y = ty + 2; y < ty + 10; y++) for (let x = tx + 2; x < tx + 10; x++) {
            const dx = (x + 0.5 - cx) / 2.6, dy = (y + 0.5 - cy) / 2.0;
            if (dx * dx + dy * dy <= 1) tiles[y * TW + x] = TILE.WATER;
          }
          ponds.push({ x: cx * T, y: cy * T, rx: 2.6 * T, ry: 2.0 * T });
          // árvores nos cantos do parque
          const tp = [[2.9, 2.9], [9.1, 2.9], [2.9, 9.1], [9.1, 9.1], [6, 2.7], [6, 9.3]];
          tp.forEach(([a, b]) => trees.push({ x: (tx + a) * T, y: (ty + b) * T, r: 22 + rnd() * 6 }));
        }
      }
    }
  }
  // pontes e faixas de pedestre
  const rv = blocks.find(b => b.kind === 'river');
  for (let j = 0; j <= ROWS; j++) setRect(rv.tx, MG + j * PITCH, BLOCK, ROAD, TILE.BRIDGE);
  const crossings = [];
  for (let i = 0; i <= COLS; i++) for (let j = 0; j <= ROWS; j++) {
    const x0 = MG + i * PITCH, y0 = MG + j * PITCH;
    const set = (tx, ty, w, h) => {
      for (let y = ty; y < ty + h; y++) for (let x = tx; x < tx + w; x++) {
        const t = tiles[y * TW + x]; if (t === TILE.ROAD || t === TILE.BRIDGE) tiles[y * TW + x] = TILE.CROSS;
      }
    };
    if (j > 0) { set(x0, y0 - 1, ROAD, 1); crossings.push({ x: x0, y: y0 - 1, w: ROAD, h: 1, dir: 'h' }); }
    if (j < ROWS) { set(x0, y0 + ROAD, ROAD, 1); crossings.push({ x: x0, y: y0 + ROAD, w: ROAD, h: 1, dir: 'h' }); }
    if (i > 0) { set(x0 - 1, y0, 1, ROAD); crossings.push({ x: x0 - 1, y: y0, w: 1, h: ROAD, dir: 'v' }); }
    if (i < COLS) { set(x0 + ROAD, y0, 1, ROAD); crossings.push({ x: x0 + ROAD, y: y0, w: 1, h: ROAD, dir: 'v' }); }
  }
  // prédios da borda do mapa
  (function rim() {
    const d = 4; // tiles de prédio
    let x = 0;
    while (x < TW) { const w = Math.min(5 + Math.floor(rnd() * 5), TW - x); addBuilding(x * T + 4, 4, w * T - 8, d * T - 8); addBuilding(x * T + 4, (TH - d) * T + 4, w * T - 8, d * T - 8); x += w; }
    let y = d;
    while (y < TH - d) { const h = Math.min(5 + Math.floor(rnd() * 5), TH - d - y); addBuilding(4, y * T + 4, d * T - 8, h * T - 8); addBuilding((TW - d) * T + 4, y * T + 4, d * T - 8, h * T - 8); y += h; }
  })();
  // postes de luz nos cantos dos cruzamentos
  for (let i = 0; i <= COLS; i++) for (let j = 0; j <= ROWS; j++) {
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {
      const x = nodeX(i) + sx * (ROAD / 2 * T + 16), y = nodeY(j) + sy * (ROAD / 2 * T + 16);
      const t = tiles[Math.floor(y / T) * TW + Math.floor(x / T)];
      if (t === TILE.SIDE) lamps.push({ x, y });
    });
  }

  // ---------- Consultas ----------
  function tileAt(px, py) {
    const tx = Math.floor(px / T), ty = Math.floor(py / T);
    if (tx < 0 || ty < 0 || tx >= TW || ty >= TH) return TILE.BUILD;
    return tiles[ty * TW + tx];
  }
  const isSolid = (px, py) => { const t = tileAt(px, py); return t === TILE.BUILD || t === TILE.WATER; };
  function treeHit(px, py, pad) {
    for (let k = 0; k < trees.length; k++) {
      const t = trees[k], dx = px - t.x, dy = py - t.y, rr = t.r * 0.55 + (pad || 0);
      if (dx * dx + dy * dy < rr * rr) return true;
    }
    return false;
  }
  const isRoadTile = t => t === TILE.ROAD || t === TILE.BRIDGE || t === TILE.CROSS;
  const pedWalkable = t => t === TILE.SIDE || t === TILE.CROSS || t === TILE.GRASS;

  // ---------- Desenho ----------
  const tex = {};
  function makeNoise(base, n, light, dark, size, blobs) {
    const S = size || 128;
    const c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d'); x.fillStyle = base; x.fillRect(0, 0, S, S);
    const r = mulberry32(base.length * 977 + n);
    // manchas grandes e suaves (desgaste), repetidas nas bordas para o padrão emendar
    (blobs || []).forEach(([col, cnt, r0, r1]) => {
      for (let k = 0; k < cnt; k++) {
        const bx = r() * S, by = r() * S, rad = r0 + r() * (r1 - r0);
        x.fillStyle = col;
        for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) { x.beginPath(); x.arc(bx + ox, by + oy, rad, 0, 7); x.fill(); }
      }
    });
    for (let k = 0; k < n; k++) {
      x.fillStyle = r() < 0.5 ? light : dark;
      x.fillRect(Math.floor(r() * S), Math.floor(r() * S), 1 + (r() < 0.2 ? 1 : 0), 1);
    }
    return c;
  }
  function makeTextures() {
    tex.asphalt = makeNoise('#625889', 5200, 'rgba(255,255,255,0.07)', 'rgba(0,0,0,0.10)', 256,
      [['rgba(0,0,0,0.035)', 46, 8, 28], ['rgba(255,255,255,0.03)', 34, 8, 24], ['rgba(40,20,70,0.04)', 14, 14, 40]]);
    tex.rim = makeNoise('#3b3442', 1200, 'rgba(255,255,255,0.04)', 'rgba(0,0,0,0.12)');
    tex.grass = makeNoise('#4a9038', 2600, 'rgba(190,255,150,0.16)', 'rgba(0,50,0,0.2)', 128,
      [['rgba(20,80,20,0.06)', 18, 6, 18], ['rgba(180,230,110,0.05)', 14, 6, 16]]);
    { // fios de grama
      const g = tex.grass.getContext('2d'), r = mulberry32(4242);
      for (let k = 0; k < 420; k++) { g.strokeStyle = r() < 0.5 ? 'rgba(200,255,140,0.35)' : 'rgba(10,60,10,0.35)'; g.lineWidth = 1; const gx = r() * 128, gy = r() * 128; g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx + (r() - 0.5) * 3, gy - 2 - r() * 3); g.stroke(); }
    }
    tex.water = makeNoise('#21407e', 1500, 'rgba(140,190,255,0.14)', 'rgba(0,0,30,0.2)', 128);
    tex.alley = makeNoise('#59505f', 700, 'rgba(255,255,255,0.04)', 'rgba(0,0,0,0.12)');
    { // cascalho do telhado (transparente, vai por cima da cor do telhado)
      const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), r = mulberry32(99);
      for (let k = 0; k < 1100; k++) { g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,0.16)' : 'rgba(0,0,0,0.16)'; g.fillRect(Math.floor(r() * 128), Math.floor(r() * 128), 1 + (r() < 0.3 ? 1 : 0), 1); }
      tex.gravel = c;
    }
    { // lajotas da calçada: sujeira e rachaduras
      const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), r = mulberry32(7);
      for (let k = 0; k < 500; k++) { g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,0.14)' : 'rgba(90,70,30,0.12)'; g.fillRect(Math.floor(r() * 128), Math.floor(r() * 128), 1 + (r() < 0.3 ? 1 : 0), 1); }
      tex.paving = c;
    }
  }

  function rrect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  // altura da parede (fachada) que aparece embaixo do telhado — dá o efeito 2.5D
  function fachada(b) { return b.p.kind === 'tile' ? Math.min(20, Math.floor(b.h * 0.26)) : Math.min(30, Math.floor(b.h * 0.3)); }

  // parede de frente do prédio: degradê, janelas com reflexo, porta e sombra do beiral
  function drawFacade(ctx, b, fh) {
    const { x, w, p } = b, y = b.y + b.h - fh;
    const g = ctx.createLinearGradient(0, y, 0, y + fh);
    g.addColorStop(0, p.edge); g.addColorStop(1, p.dark);
    ctx.fillStyle = g; ctx.fillRect(x, y, w, fh);
    ctx.fillStyle = 'rgba(0,0,20,0.28)'; ctx.fillRect(x, y, w, fh); // parede fica na sombra
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(x, y, w, 3);   // sombra do beiral
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(x, y + fh - 2, w, 2); // base clara
    const rs = mulberry32(Math.floor(b.x * 5 + b.y * 11));
    const ww = b.p.kind === 'tile' ? 10 : 14, wh = fh - 12, gap = ww + 9;
    for (let xx = x + 8; xx + ww < x + w - 6; xx += gap) {
      const acesa = rs() < 0.45, wy = y + 7;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(xx - 1, wy - 1, ww + 2, wh + 2);
      const gj = ctx.createLinearGradient(xx, wy, xx + ww, wy + wh);
      if (acesa) { gj.addColorStop(0, '#ffe6a0'); gj.addColorStop(1, '#e8a850'); } else { gj.addColorStop(0, '#6f93ad'); gj.addColorStop(1, '#1b2a38'); }
      ctx.fillStyle = gj; ctx.fillRect(xx, wy, ww, wh);
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(xx, wy, 2, wh);   // reflexo
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(xx + ww / 2, wy, 1, wh); // divisão do vidro
    }
    // porta no meio
    const dw = 16; ctx.fillStyle = '#1c1612'; ctx.fillRect(x + w / 2 - dw / 2 - 1, y + fh - 17, dw + 2, 17);
    ctx.fillStyle = '#5a3d28'; ctx.fillRect(x + w / 2 - dw / 2, y + fh - 16, dw, 16);
    ctx.fillStyle = '#c8a24a'; ctx.fillRect(x + w / 2 + 4, y + fh - 9, 2, 2);
  }

  function drawRoof(ctx, b) {
    const fh = fachada(b); drawFacade(ctx, b, fh);
    const { x, y, w, p } = b, h = b.h - fh;
    ctx.fillStyle = p.dark; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = p.edge; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    ctx.fillStyle = p.base; ctx.fillRect(x + 6, y + 6, w - 12, h - 12);
    // volume: borda clara em cima/esquerda, escura embaixo/direita (mureta do telhado)
    ctx.fillStyle = 'rgba(255,255,255,0.30)'; ctx.fillRect(x + 2, y + 2, w - 4, 2); ctx.fillRect(x + 2, y + 2, 2, h - 4);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x + 2, y + h - 4, w - 4, 2); ctx.fillRect(x + w - 4, y + 2, 2, h - 4);
    // textura de cascalho e luz suave vinda de cima-esquerda
    ctx.save(); ctx.beginPath(); ctx.rect(x + 6, y + 6, w - 12, h - 12); ctx.clip();
    ctx.fillStyle = ctx.createPattern(tex.gravel, 'repeat'); ctx.globalAlpha = p.kind === 'tile' ? 0.5 : 1; ctx.fillRect(x + 6, y + 6, w - 12, h - 12); ctx.globalAlpha = 1;
    const lg = ctx.createLinearGradient(x, y, x + w, y + h); lg.addColorStop(0, 'rgba(255,255,255,0.13)'); lg.addColorStop(1, 'rgba(0,0,30,0.16)');
    ctx.fillStyle = lg; ctx.fillRect(x + 6, y + 6, w - 12, h - 12);
    const rs = mulberry32(Math.floor(x * 7 + y * 13)); // manchas de infiltração
    for (let k = 0; k < 3; k++) { const sx = x + 10 + rs() * (w - 30), sy = y + 10 + rs() * (h - 30); ctx.fillStyle = 'rgba(30,20,10,0.07)'; ctx.fillRect(sx, sy, 3 + rs() * 6, 14 + rs() * 30); }
    ctx.restore();
    if (p.kind === 'tile') {
      // telhas: listras + cumeeira
      ctx.save(); ctx.beginPath(); ctx.rect(x + 6, y + 6, w - 12, h - 12); ctx.clip();
      const step = 9;
      if (b.ridge === 'h') {
        for (let yy = y + 6; yy < y + h - 6; yy += step) { ctx.fillStyle = 'rgba(0,0,0,0.13)'; ctx.fillRect(x + 6, yy + step - 2, w - 12, 2); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(x + 6, yy, w - 12, 2); }
        ctx.fillStyle = p.edge; ctx.fillRect(x + 6, y + h / 2 - 3, w - 12, 6);
        ctx.fillStyle = p.dark; ctx.fillRect(x + 6, y + h / 2 + 3, w - 12, 2);
      } else {
        for (let xx = x + 6; xx < x + w - 6; xx += step) { ctx.fillStyle = 'rgba(0,0,0,0.13)'; ctx.fillRect(xx + step - 2, y + 6, 2, h - 12); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(xx, y + 6, 2, h - 12); }
        ctx.fillStyle = p.edge; ctx.fillRect(x + w / 2 - 3, y + 6, 6, h - 12);
        ctx.fillStyle = p.dark; ctx.fillRect(x + w / 2 + 3, y + 6, 2, h - 12);
      }
      ctx.restore();
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.fillRect(x + 6, y + h - 12, w - 12, 6);
      ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1; ctx.strokeRect(x + 10.5, y + 10.5, w - 21, h - 21);
    }
    b.det.forEach(d => {
      const dx = x + 12 + d.fx * (w - 40), dy = y + 12 + d.fy * (h - 40);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(dx + 4, dy + 4, 18, 18);
      if (d.t === 'ac') { ctx.fillStyle = '#c9ccd2'; ctx.fillRect(dx, dy, 18, 18); ctx.fillStyle = '#7b7f88'; ctx.beginPath(); ctx.arc(dx + 9, dy + 9, 6, 0, 7); ctx.fill(); ctx.fillStyle = '#3a3d44'; ctx.beginPath(); ctx.arc(dx + 9, dy + 9, 3, 0, 7); ctx.fill(); }
      else if (d.t === 'sky') { ctx.fillStyle = '#9dc4d8'; ctx.fillRect(dx, dy, 20, 14); ctx.strokeStyle = '#e8f3f8'; ctx.lineWidth = 2; ctx.strokeRect(dx + 1, dy + 1, 18, 12); }
      else if (d.t === 'tank') { ctx.fillStyle = '#d8d8d8'; ctx.beginPath(); ctx.arc(dx + 10, dy + 10, 10, 0, 7); ctx.fill(); ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 2; ctx.stroke(); }
      else { ctx.fillStyle = '#8a4a3a'; ctx.fillRect(dx, dy, 12, 12); ctx.fillStyle = '#2a1a1a'; ctx.fillRect(dx + 3, dy + 3, 6, 6); }
    });
  }

  // rachaduras, remendos, manchas de óleo e bueiros (sorteados sempre do mesmo jeito)
  function drawRoadDetail(ctx, x0, y0, x1, y1) {
    const cs = 120;

  function drawBlockGround(ctx, blk) {

    rrect(ctx, x + 2, y + 2, w - 4, h - 4, 42); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5; ctx.stroke();
    rrect(ctx, x + 6, y + 6, w - 12, h - 12, 38); ctx.strokeStyle = 'rgba(120,100,50,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();

    if (kind === 'city') {
      // "beco" escuro debaixo dos prédios

      ctx.strokeStyle = '#2f6b26'; ctx.lineWidth = 3; ctx.stroke();

  function drawTree(ctx, t) {

<script>
/* ============================================================
   sprites.js — desenha carros e pedestres por código,
   vistos de cima, com brilho suave e contorno (estilo GTA 1).

(function (G) {
  'use strict';
  const CAR_W = 40, CAR_L = 82;
  const SS = 2;           // resolução extra do sprite
  const PAD = 8;

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const f = amt < 0 ? 0 : 255, p = Math.abs(amt);

  function bodyPath(ctx, W, L) {
    ctx.beginPath();

    ctx.quadraticCurveTo(W / 2, -L / 2, W / 2, -L / 2 + 11);
    ctx.lineTo(W / 2, L / 2 - 10); ctx.quadraticCurveTo(W / 2, L / 2, W / 2 - 7, L / 2);
    ctx.lineTo(-W / 2 + 7, L / 2); ctx.quadraticCurveTo(-W / 2, L / 2, -W / 2, L / 2 - 10);
    ctx.lineTo(-W / 2, -L / 2 + 11); ctx.quadraticCurveTo(-W / 2, -L / 2, -W / 2 + 9, -L / 2);
    ctx.closePath();

  // kind: coupe | sedan | taxi | police | wreck
  function makeCarSprite(kind, color) {
    const W = CAR_W, L = CAR_L;
    const c = document.createElement('canvas');
    c.width = (W + PAD * 2) * SS; c.height = (L + PAD * 2) * SS;
    const ctx = c.getContext('2d');
    ctx.scale(SS, SS); ctx.translate(c.width / SS / 2, c.height / SS / 2);
    const wreck = kind === 'wreck';
    const base = wreck ? '#2b2b2f' : (kind === 'police' ? '#f1f1f3' : kind === 'taxi' ? '#f2c42a' : color);
    const glass = wreck ? '#111' : '#1f2a33';

    // rodas
    [[-1, -L / 2 + 10], [1, -L / 2 + 10], [-1, L / 2 - 26], [1, L / 2 - 26]].forEach(([sx, y]) => {

  // ---------- Semáforos ----------
  const CYCLE = 16.4; // verde 5,5s • amarelo 1,5s • todos vermelhos 1,2s (nos dois sentidos)
  function lightState(axis, time) {

    return t < 8.2 ? 'r' : t < 13.7 ? 'g' : t < 15.2 ? 'y' : 'r';
  }
  function drawLights(ctx, x0, y0, x1, y1, time) {
    const cols = { g: '#3dff6a', y: '#ffe23d', r: '#ff3d3d' };
    const sv = lightState('v', time), sh = lightState('h', time);
    for (let i = 0; i <= COLS; i++) for (let j = 0; j <= ROWS; j++) {
      const cx = W.nodeX(i), cy = W.nodeY(j);

      const d = ROWS && (ROAD_HALF() + 14);
      [[-1, -1, sv], [1, 1, sv], [1, -1, sh], [-1, 1, sh]].forEach(([sx, sy, st]) => {

        ctx.fillStyle = '#20202a'; ctx.fillRect(x - 6, y - 6, 12, 12);
        ctx.fillStyle = cols[st]; ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fill();
        const g = ctx.createRadialGradient(x, y, 1, x, y, 16); g.addColorStop(0, st === 'g' ? 'rgba(60,255,100,0.5)' : st === 'y' ? 'rgba(255,230,60,0.5)' : 'rgba(255,60,60,0.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');

  }
  function ROAD_HALF() { return W.ROAD * T / 2; }

  // ---------- Navegação por faixas ----------
  const alongOf = (n, c) => n.axis === 'v' ? c.y : c.x;
  const nodeCoord = n => n.axis === 'v' ? W.nodeY(n.nj) : W.nodeX(n.ni);
  const laneCoord = n => n.axis === 'v' ? W.laneV(n.idx, n.dir) : W.laneH(n.idx, n.dir);
  const angFor = (axis, dir) => axis === 'v' ? (dir > 0 ? Math.PI : 0) : (dir > 0 ? Math.PI / 2 : -Math.PI / 2);

  function initNav(axis, idx, dir, along) {

    let n = dir > 0 ? Math.ceil(k - 1e-6) : Math.floor(k + 1e-6);

    return nav;
  }

  function chooseManeuver(car) {
    const n = car.nav, i = n.ni, j = n.nj, d = n.dir, opts = [];
    if (n.axis === 'v') {
      if (d > 0 ? j < ROWS : j > 0) opts.push({ k: 's', ni: i, nj: j + d });
      const rh = d > 0 ? -1 : 1;
      [[rh, 'r'], [-rh, 'l']].forEach(([hd, k]) => { if (hd > 0 ? i < COLS : i > 0) opts.push({ k, axis: 'h', dir: hd, ni: i + hd, nj: j, trig: W.laneH(j, hd) }); });
    } else {
      if (d > 0 ? i < COLS : i > 0) opts.push({ k: 's', ni: i + d, nj: j });
      const rv = d > 0 ? 1 : -1;
      [[rv, 'r'], [-rv, 'l']].forEach(([vd, k]) => { if (vd > 0 ? j < ROWS : j > 0) opts.push({ k, axis: 'v', dir: vd, ni: i, nj: j + vd, trig: W.laneV(i, vd) }); });
    }
    let m;
    if (n.mode === 'goto' && n.target) {
      let best = 1e9;
      opts.forEach(o => { const sc = Math.abs(o.ni - n.target.i) + Math.abs(o.nj - n.target.j) + Math.random() * 0.3; if (sc < best) { best = sc; m = o; } });
    } else {
      const wt = { s: 0.56, r: 0.22, l: 0.22 };
      let tot = 0; opts.forEach(o => tot += wt[o.k]);

  }
  function applyManeuver(car) {

    else { n.axis = m.axis; n.dir = m.dir; n.idx = m.axis === 'v' ? n.ni : n.nj; n.ni = m.ni; n.nj = m.nj; }
    n.m = null;
  }

  function aheadGap(car, S, look) {
    const fx = car.fx, fy = car.fy, rx = Math.cos(car.a), ry = Math.sin(car.a);
    let best = 1e9;
    const test = (o, len, latMax) => {
      const dx = o.x - car.x, dy = o.y - car.y;

    for (const o of S.cars) { if (o === car) continue; if (o.dead && car.stuckT > 5) continue; test(o, G.sprites.CAR_L * 0.55, 34); }
    for (const p of S.peds) if (p.state !== 'down' && p.state !== 'dead') test(p, 14, 26);
    if (!S.player.car) test(S.player, 14, 26);

  }

  function driveTraffic(car, dt, S) {
    const n = car.nav; if (!n) return;
    const pos = alongOf(n, car);
    const nc = nodeCoord(n);
    const toNode = (nc - pos) * n.dir;
    if (!n.m && toNode < 340) n.m = chooseManeuver(car);
    if (n.m && (pos - n.m.trig) * n.dir >= -(n.m.k === 's' ? 0 : n.m.k === 'r' ? 34 : 70)) applyManeuver(car);
    // ponto de mira
    const lc = laneCoord(n);
    const tx = n.axis === 'v' ? lc : car.x + n.dir * 150, ty = n.axis === 'v' ? car.y + n.dir * 150 : lc;
    const want = Math.atan2(tx - car.x, -(ty - car.y));
    let steer = clamp(wrap(want - car.a) * 2.6, -1, 1);
    // velocidade desejada
    let v = car.cruise;
    if (n.m && n.m.k !== 's' && toNode < 260) v = Math.min(v, n.m.k === 'l' ? 105 : 95);
    // semáforo
    if (!car.ignoreLights) {

      const rem = (stopAt - pos) * n.dir;
      const st = lightState(n.axis, S.time);
      if (st !== 'g' && rem > -6 && rem < 260) {

        if (st === 'r' || brakeD > car.vf * car.vf / 500) v = Math.min(v, Math.sqrt(2 * 240 * brakeD));

    }
    // cruzamento: não invadir se estiver ocupado e ceder na conversão à esquerda
    if (toNode > 70 && toNode < 330 && !car.ignoreLights) {
      const nx = W.nodeX(n.ni), ny = W.nodeY(n.nj), hb = ROAD_HALF() + 6;
      let block = false;
      for (const o of S.cars) {
        if (o === car) continue;
        const ox = o.x - nx, oy = o.y - ny, dot = o.fx * car.fx + o.fy * car.fy;
        if (Math.abs(ox) < hb && Math.abs(oy) < hb) {

        } else if (n.m && n.m.k === 'l' && dot < -0.7 && o.speed > 40 && Math.hypot(ox, oy) < 330 && toNode < 260) {

        }

    }

  function directPursuit(car, dt, S) {

  // a polícia segue as ruas e só parte direto para cima quando enxerga o alvo

    return true;
  }
  function resnap(car) {

    const i = clamp(cx, 0, COLS), j = clamp(cy, 0, ROWS);
    const dv = Math.abs(car.x - W.nodeX(i)), dh = Math.abs(car.y - W.nodeY(j));
    if (Math.min(dv, dh) > 110) return false;

    return true;
  }
  function driveChase(car, dt, S) {
    const P = S.player, tg = P.car || P;

  // ---------- Pontos aleatórios nas ruas ----------
  function randomRoadPoint(cx, cy, minD, maxD, tries) {
    for (let t = 0; t < (tries || 30); t++) {
      const axis = Math.random() < 0.5 ? 'v' : 'h', dir = Math.random() < 0.5 ? 1 : -1;
      let idx, along;
      const ang = Math.random() * TAU, d = rand(minD, maxD);
      const px = cx + Math.cos(ang) * d, py = cy + Math.sin(ang) * d;
      if (axis === 'v') {

        along = py;
        const k = clamp(Math.round((along / T - MG - 3) / PITCH), 0, ROWS), nyy = W.nodeY(k);
        if (Math.abs(along - nyy) < 300) along = nyy + (along >= nyy ? 1 : -1) * 320;
        along = clamp(along, W.nodeY(0) + 200, W.nodeY(ROWS) - 200);
      } else {
        idx = clamp(Math.round((py / T - MG - 3) / PITCH), 0, ROWS);
        along = px;
        const k = clamp(Math.round((along / T - MG - 3) / PITCH), 0, COLS), nxx = W.nodeX(k);
        if (Math.abs(along - nxx) < 300) along = nxx + (along >= nxx ? 1 : -1) * 320;

      }
      const x = axis === 'v' ? W.laneV(idx, dir) : along, y = axis === 'v' ? along : W.laneH(idx, dir);

    }

  }

  const CAR_COLORS = ['#2f8a3c', '#2e5fb5', '#e8e8ea', '#8a8a96', '#8a2a3a', '#2a8a8a', '#c47a1e', '#6a3fa0', '#d8d04a'];
  function spawnTraffic(S, kindForce) {
    const P = S.player;
    const pt = randomRoadPoint(P.x, P.y, 620, 1150);
    if (!pt) return null;
    for (const o of S.cars) if (Math.abs(o.x - pt.x) < 140 && Math.abs(o.y - pt.y) < 140) return null;
    let kind = kindForce || (Math.random() < 0.16 ? 'taxi' : 'sedan');
    if (kind === 'police' && S.cars.filter(c => c.kind === 'police' && c.mode === 'wander').length >= 2) kind = 'sedan';
    const car = new G.Car({ x: pt.x, y: pt.y, a: pt.a, kind, color: kind === 'police' ? '#ffffff' : kind === 'taxi' ? '#f2c42a' : pick(CAR_COLORS), driver: 'ai', mode: 'wander' });
    car.cruise = rand(150, 235); car.nav = initNav(pt.axis, pt.idx, pt.dir, pt.along);
    car.vx = car.fx * 120; car.vy = car.fy * 120;
    S.cars.push(car); return car;
  }

  function spawnPolice(S, n) {
    const P = S.player, tg = P.car || P;
    for (let k = 0; k < n; k++) {
      const pt = randomRoadPoint(tg.x, tg.y, 650, 950);
      if (!pt) continue;
      let ok = true; for (const o of S.cars) if (Math.abs(o.x - pt.x) < 140 && Math.abs(o.y - pt.y) < 140) ok = false;
      if (!ok) continue;
      const c = new G.Car({ x: pt.x, y: pt.y, a: pt.a, kind: 'police', color: '#ffffff', driver: 'ai', mode: 'chase', mass: 1.15 });
      c.siren = true; c.chaseScale = 0.92 + S.heatLevel * 0.02; c.max = 330 + S.heatLevel * 18;
      c.nav = initNav(pt.axis, pt.idx, pt.dir, pt.along); c.cruise = 300;
      c.vx = c.fx * 150; c.vy = c.fy * 150;
      S.cars.push(c);
    }
  }
  function spawnRoadblock(S) {
    const P = S.player, tg = P.car || P;
    const pt = randomRoadPoint(tg.x + (tg.vx || 0) * 2, tg.y + (tg.vy || 0) * 2, 700, 1000);
    if (!pt) return;
    const mid = pt.axis === 'v' ? W.roadLeft(pt.idx) + 3 * T : W.roadTop(pt.idx) + 3 * T;
    const made = [];
    [-1, 1].forEach(s => {
      const cx = pt.axis === 'v' ? mid + s * 48 : pt.along, cy = pt.axis === 'v' ? pt.along : mid + s * 48;
      const c = new G.Car({ x: cx, y: cy, a: pt.a + Math.PI / 2 + s * 0.12, kind: 'police', color: '#ffffff', driver: 'none', mode: 'block', mass: 3 });
      c.siren = true; c.born = S.time; S.cars.push(c); made.push(c);
    });
    if (G.combat) G.combat.roadblockCops(S, made);
  }

  // ---------- Pedestres ----------
  const DIRS = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
  function makePed(x, y) {
    const look = G.sprites.randomLook();
    const d = Math.floor(Math.random() * 4);
    const armed = Math.random() < 0.06; // alguns civis andam armados e reagem se forem atacados
    return Object.assign({ x, y, h: DIRS[d] + Math.PI / 2, d, speed: rand(38, 62), state: 'walk', walk: Math.random() * 6, timer: rand(2, 6), downT: 0, vx: 0, vy: 0, fleeT: 0, kind: 'civ', hp: Math.round(rand(34, 46)), armed, weapon: armed ? 'pistol' : null }, look);
  }
  const pedOk = (x, y) => { const t = W.tileAt(x, y); return W.pedWalkable(t) && !W.treeHit(x, y, 4); };
  function updatePed(p, dt, S) {
    // combate: mortos, caídos, atiradores e guardas são tratados em combat.js
    if (G.combat && G.combat.updatePed(p, dt, S)) return;
    // susto com carros rápidos
    if (p.state === 'walk') for (const c of S.cars) {
      if (Math.abs(c.x - p.x) > 80 || Math.abs(c.y - p.y) > 80) continue;
      if (c.speed > 150 && Math.hypot(c.x - p.x, c.y - p.y) < 70) { p.state = 'flee'; p.fleeT = rand(1.5, 3); p.threat = { x: c.x, y: c.y }; break; }
    }
    if (p.state === 'flee') {
      p.fleeT -= dt;
      const t = p.threat || S.player;
      const ang = Math.atan2(p.y - t.y, p.x - t.x);
      const sp = 115, vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp;
      if (!W.isSolid(p.x + vx * dt * 2, p.y) && !W.treeHit(p.x + vx * dt * 2, p.y, 3)) p.x += vx * dt;
      if (!W.isSolid(p.x, p.y + vy * dt * 2) && !W.treeHit(p.x, p.y + vy * dt * 2, 3)) p.y += vy * dt;
      p.h += wrap(ang + Math.PI / 2 - p.h) * Math.min(1, 10 * dt); p.walk += sp * dt * 0.22;
      if (p.fleeT <= 0) { p.state = 'walk'; p.d = Math.round(((ang % TAU) + TAU) % TAU / (Math.PI / 2)) % 4; }
      return;
    }
    // andando
    const ang = DIRS[p.d];
    const vx = Math.cos(ang) * p.speed, vy = Math.sin(ang) * p.speed;
    const lx = p.x + Math.cos(ang) * 14, ly = p.y + Math.sin(ang) * 14;
    const here = W.tileAt(p.x, p.y);
    if (!pedOk(lx, ly) && W.pedWalkable(here)) {
      const opts = [0, 1, 2, 3].filter(d => d !== p.d && pedOk(p.x + Math.cos(DIRS[d]) * 14, p.y + Math.sin(DIRS[d]) * 14));
      if (opts.length) { const side = opts.filter(d => Math.abs(d - p.d) !== 2); p.d = pick(side.length ? side : opts); }
      else p.d = (p.d + 2) % 4;
    } else if (W.isSolid(lx, ly)) p.d = (p.d + 2) % 4;
    else { p.x += vx * dt; p.y += vy * dt; p.walk += p.speed * dt * 0.22; }
    p.timer -= dt;
    if (p.timer <= 0) {
      p.timer = rand(2.5, 7);
      if (here !== W.TILE.CROSS && Math.random() < 0.6) {
        const opts = [(p.d + 1) % 4, (p.d + 3) % 4].filter(d => pedOk(p.x + Math.cos(DIRS[d]) * 24, p.y + Math.sin(DIRS[d]) * 24));
        if (opts.length) p.d = pick(opts);

  }
  // h = direção do corpo: o sprite "olha" para -y, então h = ang + PI/2

  function spawnPed(S) {
    const P = S.player;
    for (let t = 0; t < 12; t++) {
      const a = Math.random() * TAU, d = rand(520, 1000);
      const x = P.x + Math.cos(a) * d, y = P.y + Math.sin(a) * d;
      const tt = W.tileAt(x, y);
      if (tt !== W.TILE.SIDE || !pedOk(x, y)) continue;
      const p = makePed(x, y); p.h = DIRS[p.d] + Math.PI / 2; S.peds.push(p); return p;
    }
    return null;
  }

  // ---------- Helicóptero ----------
  function updateHeli(S, dt) {
    const h = S.heli; if (!h) return;
    const tg = S.player.car || S.player;
    const dx = tg.x - h.x, dy = tg.y - h.y, d = Math.hypot(dx, dy) || 1;
    const sp = Math.min(330, d * 1.4 + 40);
    h.vx += (dx / d * sp - h.vx) * Math.min(1, 1.6 * dt); h.vy += (dy / d * sp - h.vy) * Math.min(1, 1.6 * dt);
    h.x += h.vx * dt; h.y += h.vy * dt; h.rot += dt * 30; h.life -= dt;
    h.a = Math.atan2(h.vx, -h.vy);
    if (h.life <= 0 && S.heatLevel < 5) S.heli = null;

    if (!want || P.cdT > 0) return;
    if (w.melee) melee(S, P, w);
    else if (w.throw) throwGrenade(S, P, w);
    else shoot(S, P, w);
  }

  function updateGrenades(S, dt) {
    for (let i = S.grenades.length - 1; i >= 0; i--) {
      const g = S.grenades[i];
      g.t -= dt; g.spin += dt * 12;
      const nx = g.x + g.vx * dt, ny = g.y + g.vy * dt;
      if (W.isSolid(nx, g.y)) g.vx *= -0.4; else g.x = nx;
      if (W.isSolid(g.x, ny)) g.vy *= -0.4; else g.y = ny;
      const f = Math.pow(0.25, dt); g.vx *= f; g.vy *= f;
      if (g.t <= 0) { S.grenades.splice(i, 1); blast(S, g.x, g.y, 125, 150, 'player'); }
    }
  }

  // ---------- Itens no chão ----------
  function updatePickups(S, dt) {
    const P = S.player, ref = P.car || P, r = P.car ? 30 : 17;
    for (let i = S.pickups.length - 1; i >= 0; i--) {
      const k = S.pickups[i]; k.t += dt;
      if (k.t > 90) { S.pickups.splice(i, 1); continue; }
      if (S.mode !== 'play' || Math.hypot(k.x - ref.x, k.y - ref.y) > r) continue;
      if (k.type === 'cash') { S.save.money += k.n; G.save(); G.snd.cash(); }
      else if (k.type === 'gun') { if (P.car) continue; giveWeapon(S, k.id, k.n); G.snd.pick(); }
      else if (k.type === 'armor') { if (P.armor >= 100) continue; P.armor = Math.min(100, P.armor + k.n); G.say('Colete recolhido.', 2); G.snd.pick(); }
      else if (k.type === 'health') { if (P.hp >= 100) continue; P.hp = Math.min(100, P.hp + k.n); G.say('Kit médico: +' + k.n + ' de vida.', 2); G.snd.pick(); }
      S.pickups.splice(i, 1);
    }
  }

  // ---------- Marcas de pneu ----------
  function updateSkids(S, dt) {
    const P = S.player, ref = P.car || P;
    for (const c of S.cars) {
      if (c.dead || Math.abs(c.x - ref.x) > 700 || Math.abs(c.y - ref.y) > 700) { c._sk = null; continue; }
      const slide = !c.onGrass && c.speed > 60 && (Math.abs(c.vr) > 95 || (c.hb && c.speed > 120) || (c.thr < 0 && c.vf > 150));
      if (!slide) { c._sk = null; continue; }
      const rx = Math.cos(c.a), ry = Math.sin(c.a);
      const lx = c.x - c.fx * 24 - rx * 14, ly = c.y - c.fy * 24 - ry * 14, qx = c.x - c.fx * 24 + rx * 14, qy = c.y - c.fy * 24 + ry * 14;
      if (c._sk) {
        S.skids.push({ x1: c._sk[0], y1: c._sk[1], x2: lx, y2: ly, t: 0 }, { x1: c._sk[2], y1: c._sk[3], x2: qx, y2: qy, t: 0 });
      }
      if (Math.random() < 0.6) for (const [sx, sy] of [[lx, ly], [qx, qy]]) G.particle({ x: sx, y: sy, vx: rand(-14, 14), vy: rand(-14, 14), life: 0.9, size: 3.5, col: 'smoke', tint: '#dcdce4', a: 0.34 });
      c._sk = [lx, ly, qx, qy];
    }
    for (const s of S.skids) s.t += dt;
    if (S.skids.length > 600 || (S.skids.length && S.skids[0].t > 45)) S.skids = S.skids.filter(s => s.t < 45).slice(-600);
  }

  // ---------- Pedestres armados: atirar, perseguir, prender ----------
  const walkable = (x, y) => !W.isSolid(x, y) && !W.treeHit(x, y, 3);
  function moveToward(p, ang, sp, dt) {
    const tries = p.side ? [0, p.side * 0.7, -p.side * 0.7, p.side * 1.3, -p.side * 1.3] : [0, 0.7, -0.7, 1.3, -1.3];
    for (const off of tries) {
      const a = ang + off, nx = p.x + Math.cos(a) * sp * dt, ny = p.y + Math.sin(a) * sp * dt;
      const lx = p.x + Math.cos(a) * 12, ly = p.y + Math.sin(a) * 12;
      if (walkable(lx, ly) && walkable(nx, ny)) { p.x = nx; p.y = ny; if (off) p.side = off > 0 ? 1 : -1; p.walk += sp * dt * 0.22; return true; }
    }
    return false;
  }

  function enemyFire(S, p, tg, ang) {
    const wid = p.weapon || 'pistol', w = WEAPONS[wid], e = ENEMY[wid] || ENEMY.pistol;
    const d = Math.hypot(tg.x - p.x, tg.y - p.y);
    const lead = ang + clamp(((tg.vx || 0) * -Math.sin(ang) + (tg.vy || 0) * Math.cos(ang)) * 0.0009 * d, -0.25, 0.25);
    const sp = 0.07 + d / 3400 + (S.player.car ? 0.05 : 0);
    const mx = p.x + Math.cos(ang) * 12, my = p.y + Math.sin(ang) * 12;
    for (let k = 0; k < (w.pellets || 1); k++) fireBullet(S, { x: mx, y: my, a: lead + rand(-1, 1) * (w.pellets > 1 ? w.spread : sp), speed: w.speed * 0.72, dmg: e.dmg, own: p.kind === 'cop' ? 'cop' : 'thug', range: w.range + 60 });
    p.flashT = 0.07; flash(mx, my);
    G.snd.gun(w.snd, vol(S, p.x, p.y));
    p.burst = (p.burst || 0) + 1;
    p.fireT = wid === 'smg' ? (p.burst % 6 === 0 ? 0.9 : e.cd) : e.cd * rand(0.8, 1.3);
  }

  function fightPed(S, p, dt) {
    const P = S.player, tg = P.car || P;
    const dx = tg.x - p.x, dy = tg.y - p.y, d = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
    const wid = p.weapon || 'pistol';
    p.fireT = (p.fireT || 0) - dt; p.react = (p.react || 0) - dt;
    const wasIn = S.mode === 'play';
    const arrest = p.kind === 'cop' && S.heatLevel <= 2 && !S.copHostile && S.time - S.lastShot > 6;
    p.arresting = arrest;
    const los = d < 540 && G.ai.lineClear(p.x, p.y, tg.x, tg.y);
    p.h += wrap(ang + Math.PI / 2 - p.h) * Math.min(1, 10 * dt);
    const sp = p.kind === 'cop' ? (p.weapon === 'pistol' ? 96 : 88) : 84;
    let pref = arrest || wid === 'bat' ? 0 : wid === 'shotgun' ? 110 : wid === 'smg' ? 170 : 200;
    if (!los) pref = 0;
    let moved = false;
    if (d > pref + 26) moved = moveToward(p, ang, sp, dt);
    else if (d < pref - 60 && pref > 0) moved = moveToward(p, ang + Math.PI, sp * 0.6, dt);
    if (!moved) p.walk += 0;
    if (p.kind === 'cop' && d > 650 && P.car) { p.farT = (p.farT || 0) + dt; if (p.farT > 6) p.dead = true; } else p.farT = 0;
    if (!wasIn) return;
    if (wid === 'bat') {
      if (d < 30 && p.fireT <= 0) { p.fireT = 0.75; p.punchT = 0.35; G.snd.swing(); hurtPlayer(S, 11, p.x, p.y); }
    } else if (!arrest && los && d < (WEAPONS[wid].range + 40) && p.fireT <= 0 && p.react <= 0) enemyFire(S, p, tg, ang);
  }

  function guardPed(S, p, dt) {
    const P = S.player, tg = P.car || P;
    p.walk = 0;
    const d = Math.hypot(tg.x - p.x, tg.y - p.y);
    p.h += wrap(Math.atan2(tg.y - p.y, tg.x - p.x) + Math.PI / 2 - p.h) * Math.min(1, 2 * dt) * (d < 420 ? 1 : 0);
    if (S.thugAlert || (d < 300 && G.ai.lineClear(p.x, p.y, tg.x, tg.y)) || (S.time - S.lastShot < 1.2 && d < 600)) { p.state = 'fight'; p.react = rand(0.25, 0.7); S.thugAlert = true; }
  }

  // devolve true quando o pedestre foi tratado aqui
  function updatePed(p, dt, S) {
    if (p.flashT > 0) p.flashT -= dt;
    if (p.state === 'dead') {
      p.corpseT = (p.corpseT || 0) + dt; p.pool = Math.min(1, p.corpseT / 3.5);
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      if (!W.isSolid(nx, p.y)) p.x = nx; else p.vx = 0;
      if (!W.isSolid(p.x, ny)) p.y = ny; else p.vy = 0;
      p.vx *= 0.9; p.vy *= 0.9;
      if (p.corpseT > 80) p.dead = true;
      return true;
    }
    if (p.state === 'down') {
      p.downT += dt;
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      if (!W.isSolid(nx, p.y)) p.x = nx; else p.vx = 0;
      if (!W.isSolid(p.x, ny)) p.y = ny; else p.vy = 0;
      p.vx *= 0.9; p.vy *= 0.9;
      if (p.downT > 1.6) { if (p.armed || p.kind !== 'civ') { p.state = 'fight'; p.react = 0.4; } else { p.state = 'flee'; p.fleeT = rand(3, 5); p.threat = p.threat || { x: S.player.x, y: S.player.y }; } }
      return true;
    }
    if (p.punchT > 0) p.punchT -= dt;
    if (p.state === 'guard') { guardPed(S, p, dt); return true; }
    if (p.state === 'fight') { fightPed(S, p, dt); return true; }
    if (p.vx || p.vy) { // empurrão de tiro / pancada
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      if (!W.isSolid(nx, p.y)) p.x = nx; if (!W.isSolid(p.x, ny)) p.y = ny;
      p.vx *= 0.85; p.vy *= 0.85; if (Math.abs(p.vx) + Math.abs(p.vy) < 4) p.vx = p.vy = 0;
    }
    return false;
  }

  // ---------- Polícia a pé e tiros das viaturas ----------
  function makeCop(S, x, y, lvl) {
    const swat = lvl >= 4;
    const p = G.ai.makePed(x, y);
    Object.assign(p, {
      kind: 'cop', hp: swat ? 120 : 70, weapon: swat ? (lvl >= 5 ? 'shotgun' : 'smg') : 'pistol', armed: true,
      shirt: swat ? '#15171c' : '#1c2f6b', cap: swat ? 'swat' : 'cop', state: 'fight', react: rand(0.5, 1.1), fireT: rand(0.4, 1), vx: 0, vy: 0,
    });
    S.peds.push(p); return p;
  }
  const copCount = S => S.peds.reduce((n, p) => n + (p.kind === 'cop' && p.state !== 'dead' && !p.dead ? 1 : 0), 0);

  function dismount(S, c, lvl) {
    const n = lvl >= 3 ? 2 : 1, CW = G.sprites.CAR_W;
    for (let k = 0; k < n; k++) {
      const side = k % 2 === 0 ? 1 : -1;
      let x = c.x + Math.cos(c.a) * side * (CW / 2 + 14), y = c.y + Math.sin(c.a) * side * (CW / 2 + 14);
      if (!walkable(x, y)) { x = c.x; y = c.y; }
      makeCop(S, x, y, lvl);
    }
    c.mode = 'parked'; c.driver = 'none'; c.thr = 0; c.steer = 0; c.hb = true; c.nav = null;
  }

  function roadblockCops(S, cars) {
    const lvl = Math.max(3, S.heatLevel);
    cars.forEach(c => {
      if (copCount(S) >= 7) return;
      const x = c.x + rand(-26, 26), y = c.y + rand(-26, 26);
      makeCop(S, walkable(x, y) ? x : c.x, walkable(x, y) ? y : c.y, lvl);
    });
  }

  function copLogic(S, dt) {
    const P = S.player, tg = P.car || P, lvl = S.heatLevel;
    if (lvl === 0) {
      S.copHostile = false;
      for (const p of S.peds) if (p.kind === 'cop' && p.state === 'fight') { p.state = 'walk'; p.arresting = false; }
      return;
    }
    let cops = copCount(S);
    const slow = P.car ? P.car.speed < 110 : true;
    for (const c of S.cars) {
      if (c.kind !== 'police' || c.mode !== 'chase' || c.driver !== 'ai' || c.dead) continue;
      const d = Math.hypot(tg.x - c.x, tg.y - c.y);
      c.fireT = (c.fireT || 0) - dt;
      if (d < 240 && slow && cops < 5 && S.mode === 'play') { dismount(S, c, lvl); cops += lvl >= 3 ? 2 : 1; continue; }
      if (lvl >= 3 && d < 460 && d > 70 && c.fireT <= 0 && S.mode === 'play' && G.ai.lineClear(c.x, c.y, tg.x, tg.y)) {
        const ang = Math.atan2(tg.y + (tg.vy || 0) * 0.3 - c.y, tg.x + (tg.vx || 0) * 0.3 - c.x) + rand(-0.17, 0.17);
        fireBullet(S, { x: c.x + Math.cos(ang) * 30, y: c.y + Math.sin(ang) * 30, a: ang, speed: 640, dmg: 6, own: 'cop', range: 560, car: c });
        flash(c.x + Math.cos(ang) * 30, c.y + Math.sin(ang) * 30);
        G.snd.gun('pistol', vol(S, c.x, c.y)); c.fireT = rand(0.5, 0.95);
      }
    }
    const h = S.heli;
    if (h && lvl >= 5 && S.mode === 'play') {
      h.fireT = (h.fireT || 0) - dt;
      const d = Math.hypot(tg.x - h.x, tg.y - h.y);
      if (d < 560 && h.fireT <= 0) {
        const ang = Math.atan2(tg.y - h.y, tg.x - h.x) + rand(-0.2, 0.2);
        fireBullet(S, { x: h.x, y: h.y, a: ang, speed: 700, dmg: 4, own: 'cop', range: 620 });
        G.snd.gun('smg', vol(S, h.x, h.y) * 0.8); h.fireT = 0.2;
      }
    }
  }

  // ---------- Atualização geral ----------
  function update(S, dt) {
    const P = S.player;
    if (S.hurtT > 0) S.hurtT -= dt;
    if (S.mode === 'play') {
      if (P.hp < S.lastHp - 0.4 && S.hurtT <= 0) { S.hurtT = 0.3; if (!P.car && P.hp > 0) spray(S, P.x, P.y, rand(0, TAU), 4, 140); }
      S.lastHp = P.hp;
      copLogic(S, dt);
    } else S.lastHp = 100;
    updateBullets(S, dt);
    updateGrenades(S, dt);
    updatePickups(S, dt);
    updateSkids(S, dt);
    for (const d of S.decals) d.t += dt;
    // no máximo 28 corpos no chão: os mais velhos somem
    let bodies = S.peds.filter(p => p.state === 'dead' && !p.dead);
    if (bodies.length > 28) { bodies.sort((a, b) => b.corpseT - a.corpseT); for (let i = 0; i < bodies.length - 28; i++) bodies[i].dead = true; }
  }

  // ---------- Desenho ----------
  function drawDecals(ctx, S, inV) {
    for (const s of S.skids) {
      if (!inV({ x: s.x1, y: s.y1 })) continue;
      ctx.strokeStyle = 'rgba(8,6,14,' + (0.42 * (1 - s.t / 45)).toFixed(3) + ')'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    }
    for (const d of S.decals) {
      if (!inV(d)) continue;
      if (d.kind === 'scorch') {
        ctx.fillStyle = 'rgba(10,8,8,0.30)'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(6,5,5,0.35)'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.6, 0, TAU); ctx.fill();
        continue;
      }
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot); ctx.globalAlpha = d.t < 25 ? 0.95 : 0.85;
      ctx.drawImage(blobSprite(d.v, d.t > 25), -d.r, -d.r, d.r * 2, d.r * 2); ctx.restore();
    }
    ctx.lineCap = 'butt';
  }
  function drawPickups(ctx, S, inV, time) {
    for (const k of S.pickups) {
      if (!inV(k)) continue;
      const bob = Math.sin(time * 4 + k.x) * 1.5;
      ctx.save(); ctx.translate(k.x, k.y);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(2, 5, 8, 4, 0, 0, TAU); ctx.fill();
      ctx.translate(0, bob - 3);
      if (k.type === 'cash') { ctx.fillStyle = '#3fbf4d'; ctx.fillRect(-8, -5, 16, 10); ctx.strokeStyle = '#0a3a10'; ctx.lineWidth = 1.5; ctx.strokeRect(-8, -5, 16, 10); ctx.fillStyle = '#eaffea'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('$', 0, 3); }
      else if (k.type === 'gun') { ctx.fillStyle = 'rgba(255,230,120,0.35)'; ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.fill(); ctx.fillStyle = '#16181c'; ctx.fillRect(-7, -2, 12, 4); ctx.fillRect(-5, 1, 4, 6); ctx.fillStyle = '#8a8f99'; ctx.fillRect(3, -2, 5, 2); }
      else if (k.type === 'armor') { ctx.fillStyle = '#3a78d8'; ctx.beginPath(); ctx.moveTo(-8, -7); ctx.lineTo(8, -7); ctx.lineTo(8, 1); ctx.quadraticCurveTo(8, 8, 0, 10); ctx.quadraticCurveTo(-8, 8, -8, 1); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke(); }
      else { ctx.fillStyle = '#fff'; ctx.fillRect(-8, -8, 16, 16); ctx.fillStyle = '#e03030'; ctx.fillRect(-2, -6, 4, 12); ctx.fillRect(-6, -2, 12, 4); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.strokeRect(-8, -8, 16, 16); }
      ctx.restore();
    }
  }
  function drawAir(ctx, S, inV) {
    for (const g of S.grenades) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(g.x + 3, g.y + 4, 5, 3, 0, 0, TAU); ctx.fill();
      ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.spin); ctx.fillStyle = '#3f5a2a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#c9c9c9'; ctx.fillRect(-1, -6, 2, 3); ctx.restore();
    }
    for (const b of S.bullets) {
      if (!inV(b)) continue;
      const enemy = b.own !== 'player';
      ctx.strokeStyle = enemy ? 'rgba(255,170,140,0.95)' : 'rgba(255,236,150,0.95)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      const l = Math.hypot(b.vx, b.vy) || 1;
      ctx.beginPath(); ctx.moveTo(b.x - b.vx / l * 13, b.y - b.vy / l * 13); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }
  function drawScreen(ctx, S) {
    const P = S.player;
    let a = 0;
    if (S.hurtT > 0) a = Math.max(a, S.hurtT / 0.3 * 0.45);
    if (P.hp < 35 && P.hp > 0 && S.mode === 'play') a = Math.max(a, 0.18 + 0.12 * Math.sin(S.time * 7));
    if (a <= 0) return;
    const g = ctx.createRadialGradient(400, 300, 200, 400, 300, 520);
    g.addColorStop(0, 'rgba(160,0,0,0)'); g.addColorStop(1, 'rgba(160,0,0,' + a.toFixed(3) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 800, 600);
  }

  // ---------- Loja de armas ----------
  const PRICE_AMMO = { pistol: 36, smg: 90, shotgun: 16 };
  const ITEMS = [
    { k: 'Digit1', n: 'Taco de beisebol', p: 60, own: 'bat', f: S => giveWeapon(S, 'bat', 0) },
    { k: 'Digit2', n: 'Pistola (+36 balas)', p: 150, own: 'pistol', f: S => giveWeapon(S, 'pistol', 36) },
    { k: 'Digit3', n: 'Submetralhadora (+90 balas)', p: 450, own: 'smg', f: S => giveWeapon(S, 'smg', 90) },
    { k: 'Digit4', n: 'Escopeta (+16 cartuchos)', p: 600, own: 'shotgun', f: S => giveWeapon(S, 'shotgun', 16) },
    { k: 'Digit5', n: 'Granadas (x4)', p: 160, f: S => giveWeapon(S, 'grenade', 4) },
    { k: 'Digit6', n: 'Munição para as armas que você tem', p: 120, f: S => { const a = arms(S); let any = false; Object.keys(PRICE_AMMO).forEach(id => { if (a.own[id]) { a.ammo[id] = Math.min(MAX_AMMO, (a.ammo[id] || 0) + PRICE_AMMO[id]); any = true; } }); if (!any) return false; G.save(); G.say('Munição reabastecida.', 2); } },
    { k: 'Digit7', n: 'Colete à prova de balas', p: 250, f: S => { if (S.player.armor >= 100) return false; S.player.armor = 100; G.say('Colete vestido.', 2); } },
  ];
  function shopKey(S, code) { // retorna true se fechou a loja
    if (code === 'Escape' || code === 'KeyE' || code === 'Enter') return true;
    const it = ITEMS.find(i => i.k === code); if (!it) return false;
    const a = arms(S);
    if (it.own && a.own[it.own] && it.own !== 'pistol' && it.own !== 'smg' && it.own !== 'shotgun') { G.say('Você já tem isso.', 2); return false; }
    if (S.save.money < it.p) { G.say('Dinheiro insuficiente ($' + it.p + ').', 2); G.snd.fail(); return false; }
    if (it.f(S) === false) { G.say('Você não precisa disso agora.', 2); return false; }
    S.save.money -= it.p; G.save(); G.snd.cash();
    return false;
  }
  function drawShop(ctx, S) {
    const H = G.hud, a = arms(S);
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, 800, 600);
    ctx.fillStyle = '#1b1322'; ctx.fillRect(110, 80, 580, 440); ctx.strokeStyle = '#ff4fd8'; ctx.lineWidth = 4; ctx.strokeRect(110, 80, 580, 440);
    H.txt(ctx, 'LOJA DE ARMAS', 400, 130, 38, '#ff4fd8', 'center');
    H.txt(ctx, 'Seu dinheiro: $' + S.save.money, 400, 162, 20, '#3fdc4a', 'center');
    ITEMS.forEach((it, i) => {
      const y = 212 + i * 40, own = it.own && a.own[it.own];

<script>
/* =====================================================================
   LUZ.JS — visual "cinematográfico": pixel art 2.5D com luz dinâmica
   Tudo é desenhado DEPOIS do mundo, por cima, em camadas:
     1) pixelização      -> deixa o mundo com pixels grandes (pixel art)
     2) neblina          -> nuvens de névoa que andam devagar (volumétrica)
     3) mapa de luz      -> escurece pela hora do dia e "acende" faróis,
                            postes, janelas, sirenes e explosões
     4) brilho (glow)    -> as luzes brilham e criam feixes de luz
     5) bloom            -> as partes claras "vazam" luz em volta
     6) cor de cinema    -> contraste e tom azul/laranja
     7) vinheta          -> cantos mais escuros
   Tecla V troca o nível: 2 = completo, 1 = sem pixelização, 0 = clássico.
   ===================================================================== */
(function (G) {
  'use strict';
  const VW = 800, VH = 600, TAU = Math.PI * 2;

  const bl1 = mk(200, 150), b1x = bl1.getContext('2d');     // bloom (1/4)
  const bl2 = mk(200, 150), b2x = bl2.getContext('2d');
  const bl3 = mk(100, 75), b3x = bl3.getContext('2d');      // bloom (1/8)

  // ---- textura de neblina que se repete sem emendas ----
  function fazNeblina() {
    const c = mk(512, 512), x = c.getContext('2d'); let s = 7;
    const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let k = 0; k < 70; k++) {
      const bx = r() * 512, by = r() * 512, rad = 50 + r() * 90, a = 0.10 + r() * 0.16;
      for (const dx of [-512, 0, 512]) for (const dy of [-512, 0, 512]) {

  // ---- cor do ambiente conforme a hora (f = 0..1; 0.55-0.65 entardecer, 0.65-0.92 noite) ----
  const CORES = [
    [0.00, 255, 226, 190], [0.08, 255, 246, 232], [0.40, 255, 252, 244], [0.52, 255, 226, 180],
    [0.60, 255, 150, 110], [0.67, 84, 94, 160], [0.90, 84, 94, 160], [0.96, 205, 140, 150], [1.00, 255, 226, 190]
  ];
  function ambiente(f) {
    for (let i = 1; i < CORES.length; i++) {
      if (f <= CORES[i][0]) {
        const a = CORES[i - 1], b = CORES[i], t = (f - a[0]) / (b[0] - a[0]);
        return [a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t];

  // altura da fachada (parede) de um prédio — usada também pelo mundo
  // ---- lista de luzes do quadro ----
  function juntarLuzes(S, W, cam, z, inV, noite) {
    const out = [];
    const add = (x, y, r, col, a, ang, spread) => out.push({ x, y, r, col, a, ang, spread });
    const vx0 = cam.x - VW / 2 / z - 160, vx1 = cam.x + VW / 2 / z + 160, vy0 = cam.y - VH / 2 / z - 160, vy1 = cam.y + VH / 2 / z + 160;
    const vis = (x, y) => x > vx0 && x < vx1 && y > vy0 && y < vy1;
    W.lamps.forEach(l => { if (vis(l.x, l.y)) add(l.x, l.y, 150, [255, 196, 110], 0.95); });

      add(c.x + c.fx * 60, c.y + c.fy * 60, 85, [255, 240, 200], 0.7);                    // poça de luz na frente

  function gradLuz(c, l) {

  L.desenhar = function (ctx, S, W, cam, z, inV) {
    if (L.nivel === 0) return false;

    const lum = (amb[0] * 0.3 + amb[1] * 0.59 + amb[2] * 0.11) / 255;
    const noite = clamp(1 - lum * 1.15, 0, 1);            // 0 = dia claro, ~1 = noite fechada
    const t = S.time;

    // 1) pixel art: reduz pela metade e amplia sem suavizar

      ctx.imageSmoothingEnabled = false; ctx.drawImage(pixC, 0, 0, VW, VH); ctx.imageSmoothingEnabled = true;

    if (!nevPat) nevPat = nx.createPattern(fazNeblina(), 'repeat');
    const dens = 0.05 + noite * 0.14 + (f > 0.92 || f < 0.06 ? 0.10 : 0);

    nx.globalCompositeOperation = 'source-in'; nx.fillStyle = '#c4cee4'; nx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = clamp(dens * 2.2, 0, 0.55); ctx.drawImage(nevC, 0, 0); ctx.globalAlpha = 1;

    // 3) mapa de luz: começa com a cor do ambiente e soma as luzes
    lx.setTransform(1, 0, 0, 1, 0, 0); lx.globalCompositeOperation = 'source-over';
    lx.fillStyle = 'rgb(' + (amb[0] | 0) + ',' + (amb[1] | 0) + ',' + (amb[2] | 0) + ')'; lx.fillRect(0, 0, VW, VH);
    const luzes = juntarLuzes(S, W, cam, z, inV, noite);
    // janelas acesas nos prédios (de noite)
    const janelas = [];
    if (noite > 0.05) {
      const vx0 = cam.x - VW / 2 / z, vx1 = cam.x + VW / 2 / z, vy0 = cam.y - VH / 2 / z, vy1 = cam.y + VH / 2 / z;
      W.buildings.forEach(b => { if (b.x < vx1 && b.x + b.w > vx0 && b.y < vy1 && b.y + b.h > vy0 && ((b.x * 7 + b.y * 3) % 10) < 7) janelas.push(b); });
    }
    lx.save(); lx.setTransform(z, 0, 0, z, VW / 2 - cam.x * z, VH / 2 - cam.y * z);
    lx.globalCompositeOperation = 'lighter';
    if (noite > 0.03) {
      luzes.forEach(l => gradLuz(lx, l));
      lx.fillStyle = 'rgba(255,190,100,0.55)';
      janelas.forEach(b => { const fh = W.fachada(b); lx.fillRect(b.x + 4, b.y + b.h - fh + 3, b.w - 8, fh - 6); });
    }
    lx.restore();
    ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(luzC, 0, 0); ctx.globalCompositeOperation = 'source-over';

    // 4) brilho das luzes por cima (feixes visíveis na neblina)
    ctx.save(); ctx.setTransform(z, 0, 0, z, VW / 2 - cam.x * z, VH / 2 - cam.y * z);
    ctx.globalCompositeOperation = 'lighter';
    const forca = 0.04 + noite * 0.15;
    luzes.forEach(l => { const a0 = l.a; l.a = a0 * forca * (l.ang !== undefined ? 0.85 : 0.7); gradLuz(ctx, l); l.a = a0; });
    ctx.restore();
    // raios de sol (só de dia): faixas diagonais bem suaves
    const sol = clamp(1 - noite * 2.2, 0, 1) * 0.07;
    if (sol > 0.004) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 4; k++) {
        const bx = ((k * 260 + t * 6 + cam.x * 0.05) % 1100) - 250, w = 70 + k * 18;
        const g = ctx.createLinearGradient(bx, 0, bx + w, 0);
        g.addColorStop(0, 'rgba(255,230,170,0)'); g.addColorStop(0.5, 'rgba(255,230,170,' + (sol * (0.6 + 0.4 * Math.sin(t * 0.5 + k))) + ')'); g.addColorStop(1, 'rgba(255,230,170,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(bx + 220, 0); ctx.lineTo(bx + 220 + w, 0); ctx.lineTo(bx + w, VH); ctx.lineTo(bx, VH); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    // 5) bloom: encolhe, "eleva" os claros (multiplicando por si mesmo) e soma de volta
    b1x.imageSmoothingEnabled = true; b1x.drawImage(ctx.canvas, 0, 0, 200, 150);
    b2x.globalCompositeOperation = 'source-over'; b2x.drawImage(bl1, 0, 0);
    b2x.globalCompositeOperation = 'multiply'; b2x.drawImage(bl1, 0, 0); b2x.drawImage(bl1, 0, 0); b2x.drawImage(bl1, 0, 0); b2x.globalCompositeOperation = 'source-over';
    b3x.drawImage(bl2, 0, 0, 100, 75);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 0.5; ctx.drawImage(bl2, 0, 0, VW, VH);
    ctx.globalAlpha = 0.7; ctx.drawImage(bl3, 0, 0, VW, VH);
    ctx.restore();

    // 6) cor de cinema: mais contraste/saturação + sombras azuis e luzes laranja
    cx.globalCompositeOperation = 'source-over'; cx.drawImage(ctx.canvas, 0, 0);
    ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = 0.42; ctx.drawImage(copiaC, 0, 0);
    ctx.globalAlpha = 0.16;
    const gr = ctx.createLinearGradient(0, 0, VW, VH); gr.addColorStop(0, '#1fa6c8'); gr.addColorStop(0.5, '#8a6fd0'); gr.addColorStop(1, '#ff9a3c');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);
    ctx.restore();

    // 7) vinheta
    const vg = ctx.createRadialGradient(VW / 2, VH / 2, 220, VW / 2, VH / 2, 590);
    vg.addColorStop(0, 'rgba(0,0,12,0)'); vg.addColorStop(1, 'rgba(0,0,14,' + (0.42 + noite * 0.12) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
    return true;
  };

  const NOMES = ['Clássico', 'Cinema (suave)', 'Cinema pixel art'];
  L.alternar = function () { L.nivel = (L.nivel + 2) % 3; return 'Gráficos: ' + NOMES[L.nivel]; };
})(window.G = window.G || {});

<script>
/* ============================================================

(function (G) {

  const S = G.S = {
    time: 0, dayT: 0.28, cars: [], peds: [], particles: [], heat: 0, heatLevel: 0, chasers: 0,
    player: null, save: { money: 0, done: 0, paint: 0, king: false }, cam: { x: 0, y: 0, z: 1.5 },
    msg: null, ban: null, radioT: 0, prompt: '', bustT: 0, heli: null, mode: 'loading', modeT: 0,
    copT: 0, blockT: 0, spawnT: 0, pedSpawnT: 0, hornDown: false, redCar: null, shake: 0, hitCool: 0,
  };

  // ---------- Salvar / carregar ----------
  G.save = function () { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S.save)); } catch (e) { } };
  function loadSave() { try { const j = JSON.parse(localStorage.getItem(SAVE_KEY)); if (j && typeof j.money === 'number') S.save = Object.assign({ money: 0, done: 0, paint: 0, king: false }, j); } catch (e) { } }
  const hasSave = () => { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } };

  // ---------- Mensagens ----------
  G.say = function (text, secs) { S.msg = { text, t: secs || 5 }; };
  G.banner = function (title, sub, fail, dur) { S.ban = { title, sub, fail, t: dur || 2.6, dur: dur || 2.6 }; };

  G.particle = function (p) { if (S.particles.length > 420) S.particles.shift(); p.t = 0; p.max = p.life; S.particles.push(p); };

  // ---------- Procurado ----------
  G.addHeat = function (n) { S.heat = clamp(S.heat + n, 0, 100); };
  const lvlOf = h => h <= 0 ? 0 : Math.min(5, Math.ceil(h / 20));
  function copNear(x, y, r) { for (const c of S.cars) if (c.kind === 'police' && !c.dead && Math.abs(c.x - x) < r && Math.abs(c.y - y) < r && Math.hypot(c.x - x, c.y - y) < r) return true; return false; }

  // ---------- Batidas / explosões ----------
  G.carCrash = function (a, b, imp, x, y) {
    const P = S.player;
    const isP = c => c && c === P.car;

    a.hitCool = 0.12; if (b) b.hitCool = 0.12;
    if (dmg > 0) {
      const copHit = b && (a.kind === 'police' || b.kind === 'police') && (isP(a) || isP(b));
      G.carDamage(a, dmg * (copHit && isP(a) ? 0.35 : 1)); if (b) G.carDamage(b, dmg * (copHit && isP(b) ? 0.35 : 0.9));
    }
    sparks(x, y, Math.min(12, 3 + imp / 40));
    if (Math.hypot(x - P.x, y - P.y) < 600) G.snd.crash(Math.min(1, imp / 300));
    if (imp > 160) S.shake = Math.min(10, S.shake + imp / 60);
    const pc = isP(a) ? a : isP(b) ? b : null;
    if (pc) {
      M.onCrashPlayerCar(imp);
      P.hp -= dmg * 0.4; if (P.hp <= 0 && !P.dead) P.hp = 0;
      const o = pc === a ? b : a;
      if (o && o.kind === 'police' && imp > 70) G.addHeat(o.mode === 'chase' ? 3 : 18);
      else if (o && imp > 110 && copNear(pc.x, pc.y, 450)) G.addHeat(8);
    }
  };
  G.explodeCar = function (c) {
    c.dead = true; c.hp = 0; c.thr = 0;
    G.snd.boom(); S.shake = 14;
    for (let k = 0; k < 26; k++) { const a = rand(0, TAU), v = rand(30, 190); G.particle({ x: c.x, y: c.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.5, 1.2), size: rand(9, 20), col: k % 3 === 0 ? 'smoke' : 'fire' }); }
    sparks(c.x, c.y, 18);
    G.particle({ x: c.x, y: c.y, vx: 0, vy: 0, life: 0.45, size: 10, col: 'ring' });
    for (let k = 0; k < 8; k++) G.particle({ x: c.x + rand(-14, 14), y: c.y + rand(-14, 14), vx: rand(-25, 25), vy: rand(-40, -10), life: rand(2, 3.2), size: rand(10, 18), col: 'smoke' });
    const P = S.player;

      P.car = null; P.x = c.x + c.fx * 10; P.y = c.y + 50; P.hp -= 45; P.iframes = 1.5; P.vx = rand(-90, 90); P.vy = rand(60, 120);
    } else {
      const d = Math.hypot(P.x - c.x, P.y - c.y);
      if (!P.car && d < 110) { P.hp -= 40; P.iframes = 1; }

    }
    S.cars.forEach(o => { if (o !== c && Math.hypot(o.x - c.x, o.y - c.y) < 110) { G.carDamage(o, 40); const a = Math.atan2(o.y - c.y, o.x - c.x); o.vx += Math.cos(a) * 180; o.vy += Math.sin(a) * 180; } });
    S.peds.forEach(p => { if (p.state !== 'dead' && Math.hypot(p.x - c.x, p.y - c.y) < 120) G.combat.hurtPed(S, p, 90, c.x, c.y, 220, P.car === c || c.driver === 'player' ? 'player' : 'traffic'); });

  };

  // ---------- Criação do mundo ----------
  function newWorld() {
    S.cars = []; S.peds = []; S.particles = []; S.heat = 0; S.heatLevel = 0; S.heli = null; S.bustT = 0; S.time = 0;
    M.active = null;

  // ---------- Entrada (teclado) ----------

  const K = (...c) => c.some(x => keys[x]);

  // ---------- Atualização ----------

  }

  function updatePlayer(dt) {

    } else {
      // a pé
