    if (!fin(p.x) || !fin(p.y)) { out.push({ tipo: 'ped-nan', sev: 3, msg: 'pedestre #' + uid(p) + ' com posição inválida', fix: () => { S.peds.splice(S.peds.indexOf(p), 1); return 'removido'; } }); return out; }
    if (p.x < 0 || p.y < 0 || p.x > W.W || p.y > W.H || W.isSolid(p.x, p.y)) out.push({ tipo: 'ped-parede', sev: 2, msg: 'pedestre #' + uid(p) + ' preso em ' + lugarDe(p).tile.tipo, fix: () => { const q = maisPerto(p.x, p.y, ehCalcada, 20); if (q) { p.x = q.x; p.y = q.y; return 'movido para a calçada'; } S.peds.splice(S.peds.indexOf(p), 1); return 'removido'; } });
    return out;
  };
  function removeCarro(S, c, porque) { const i = S.cars.indexOf(c); if (i >= 0) S.cars.splice(i, 1); if (S.redCar === c) { /* o carro do jogador nunca some: volta para a rua */ tpJogCarro(S, c); S.cars.push(c); } }
  function tpJogCarro(S, c) { const q = maisPerto(isFinite(c.x) ? c.x : W.nodeX(2), isFinite(c.y) ? c.y : W.nodeY(2), ehVia, 40) || { x: W.nodeX(2), y: W.nodeY(2) }; c.x = q.x; c.y = q.y; c.vx = c.vy = 0; if (!fin(c.a)) c.a = 0; if (S.player.car === c) { S.player.x = q.x; S.player.y = q.y; } }

  };

  function varrer(S, dt) {

    // carros

    if (S.cars.length > 90) { const P = S.player, ord = S.cars.slice().sort((a, b) => Math.hypot(b.x - P.x, b.y - P.y) - Math.hypot(a.x - P.x, a.y - P.y)); for (let k = 0; k < S.cars.length - 90; k++) if (!ord[k].owned && ord[k] !== P.car) { const i = S.cars.indexOf(ord[k]); if (i >= 0) S.cars.splice(i, 1); } O.registrar({ tipo: 'excesso-carros', sev: 1, msg: 'mais de 90 carros no mapa: os mais distantes foram removidos', corrigido: true, acao: 'limpeza' }); }

    else if (S.mode === 'play' && !P.car && W.isSolid(P.x, P.y)) { tSol++; if (tSol >= 2) { const q = maisPerto(P.x, P.y, ehCalcada, 20); if (q) { P.x = q.x; P.y = q.y; } tSol = 0; O.registrar({ tipo: 'jogador-parede', sev: 2, msg: 'jogador ficou preso dentro de ' + lugarDe(P).tile.tipo, ent: P, corrigido: true, acao: 'movido para a calçada mais próxima' }); } }
    else { tSol = 0; if (S.mode === 'play') { ultimo = { x: P.x, y: P.y, ok: true }; } }

<script>
/* ============================================================
   fbi.js — os AGENTES DO FBI (robôs com cara de gente)
   Quatro agentes de terno e óculos escuros patrulham o mapa inteiro, cada um na sua região:
   andam pelas calçadas, ENTRAM em todos os estabelecimentos (auditoria completa da sala) e
   olham carros, pedestres, obras e pedágios. Tudo o que acham vai para o "super cache" do Olho de Deus
   (aperte F9 para ler), com detalhes: quem viu, onde (cidade, rua, quadra), qual carro, estado, posição.
   Os agentes não atrapalham o trânsito: são fantasmas para os carros (e nunca somem do mapa).
   ============================================================ */
(function (G) {
  'use strict';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // ---------- onde cada agente trabalha (colunas de quadras) ----------
  const REGIOES = [
    { b0: 0, b1: 2, nome: 'Agente Cruz', id: 'F1', setor: 'Ribeirão Oeste' },
    { b0: 4, b1: 8, nome: 'Agente Lima', id: 'F2', setor: 'Ribeirão Leste' },
    { b0: 10, b1: 15, nome: 'Agente Dias', id: 'F5', setor: 'Mata Escura' },
    { b0: 17, b1: 22, nome: 'Agente Rocha', id: 'F3', setor: 'Novo Horizonte' },
    { b0: 24, b1: 29, nome: 'Agente Duarte', id: 'F4', setor: 'Vale Verde' },
    { b0: 31, b1: 33, nome: 'Agente Sá', id: 'F6', setor: 'Porto do Sol' }

  // ---------- caminho (A* nas casas do mapa) ----------

    const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { let l = 2 * i + 1, r = l + 1, m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top[1]; };

      }
    }

  // ---------- criação dos agentes ----------

  // ---------- o que cada agente visita ----------
  function alvosDe(ag) {
    const lista = [], dentro = x => x / T >= ag.lim.x0 && x / T <= ag.lim.x1;
    W.places.forEach(pl => { if (pl.tipo !== 'casa' && pl.id !== 'casa' && dentro(pl.x)) lista.push({ tipo: 'lugar', id: 'p:' + pl.id, x: pl.x, y: pl.y + 4, pl }); });
    G.cidade.lotes.forEach(l => { if (dentro(l.cx) && l.tam !== 'p') lista.push({ tipo: 'obra', id: 'o:' + l.id, x: l.tam === 'a' ? l.x + l.w / 2 : l.cx, y: l.y + l.h + 26, lote: l }); });
    // pontos de calçada: vigilância de rua em todos os cantos da região
    W.spots.forEach((p, i) => { if (dentro(p.x) && i % 3 === 0 && caminhavel(Math.floor(p.x / T), Math.floor(p.y / T))) lista.push({ tipo: 'rua', id: 's:' + i, x: p.x, y: p.y }); });

  }

    const lista = alvosDe(ag); if (!lista.length) return null;
    let best = null, bs = 1e18;
    lista.forEach(a => { const v = ag.visitas[a.id] || 0, d = Math.hypot(a.x - ag.x, a.y - ag.y), s = v * 2200 + d + (a.tipo === 'lugar' ? -300 : a.tipo === 'obra' ? -150 : 0) + Math.random() * 80; if (s < bs) { bs = s; best = a; } });
    return best;
  }

  // ---------- auditoria completa de um estabelecimento ----------
  const palavras = s => String(s || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/[^A-Z0-9]+/).filter(w => w.length > 3);
  function auditaSala(ag, pl, sid, R) {
    const probs = [], fonte = 'FBI ' + ag.nome, ms0 = Date.now();
    const rep = (tipo, sev, msg, det) => { probs.push(tipo); F.stats.problemas++; O.registrar({ tipo, sev, fonte, msg: pl.nome + ' (' + sid + '): ' + msg, onde: G.cameras.onde(pl.x, pl.y), chave: tipo + ':' + pl.id + ':' + sid + ':' + (det && det.o || ''), detalhe: Object.assign({ lugar: pl.id, sala: sid, agente: ag.id }, det) }); };

    if (sid === 'entrada') {

    }

    let interativos = 0, alcancados = 0;
    R.objs.forEach(o => { if (!isFinite(o.x + o.y + o.w + o.h)) rep('objeto-nan', 3, 'objeto "' + o.t + '" com coordenadas inválidas', { o: o.t }); });

      if (x < R.x0 + 14 || x > R.x1 - 14 || y < R.y0 + 14) return false; if (y > R.y1 - 6 && Math.abs(x - R.portaX) > 30) return false;

    const sx0 = clamp(Math.round((R.portaX - R.x0 - 8) / 16), 0, gw - 1), sy0 = clamp(Math.round((R.y1 - 40 - R.y0 - 8) / 16), 0, gh - 1);
    if (!livre(R.portaX, R.y1 - 40)) rep('entrada-bloqueada', 3, 'o ponto de entrada da sala está bloqueado por um objeto', { x: R.portaX, y: R.y1 - 40 });
    else {
      const fila = [sy0 * gw + sx0]; vis[fila[0]] = 1;
      for (let i = 0; i < fila.length; i++) { const k = fila[i], x = k % gw, y = (k / gw) | 0; [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) return; const nk = ny * gw + nx; if (!vis[nk] && livre(cx(nk), cy(nk))) { vis[nk] = 1; fila.push(nk); } }); }

      R.objs.forEach(o => {
        if (!(o.act || o.menu || o.t === 'cofre') || o.t === 'porta' || o.invisivel) return;   // portas ficam na parede: o jogo as usa de perto interativos++;
        const z = o.zona || [o.x, o.y - (o.e || 0), o.w, o.h + (o.e || 0)];
        if (alcanca(z[0], z[1], z[2], z[3], o.r || 34)) alcancados++; else rep('objeto-inalcancavel', 2, 'objeto "' + o.t + '" não dá para alcançar', { o: o.t + '@' + Math.round(o.x) + ',' + Math.round(o.y), x: Math.round(o.x), y: Math.round(o.y) });

    }
    R.npcs.forEach(n => {
      if (!isFinite(n.x + n.y)) { rep('npc-nan', 3, 'NPC com posição inválida', { o: n.nome || 'npc' }); return; }
      if (n.x < R.x0 - 4 || n.x > R.x1 + 4 || n.y > R.y1 + 30) rep('npc-fora', 2, 'NPC fora da sala (' + (n.nome || 'sem nome') + ')', { o: n.nome || 'npc', x: Math.round(n.x), y: Math.round(n.y) });

    if (pl.tipo !== 'casa' && !cams && !/^q\d/.test(sid)) rep('sem-camera', 2, 'sala sem câmera de segurança', { o: 'cam' });

  F.auditar = function (ag, pl) {

      let R; try { R = L.salaVigiada(pl, f.sala); } catch (e) { probs++; F.stats.problemas++; O.registrar({ tipo: 'sala-erro', sev: 3, fonte: 'FBI ' + ag.nome, msg: pl.nome + ': a sala "' + f.sala + '" quebra ao abrir (' + String(e.message).slice(0, 80) + ')', onde: G.cameras.onde(pl.x, pl.y), chave: 'sala-erro:' + pl.id + ':' + f.sala, detalhe: { lugar: pl.id, sala: f.sala, pilha: String(e.stack || '').split('\n').slice(0, 5) } }); return; }

  // armado na frente de um agente (vigiado o tempo todo, não só quando ele anda)
  function vigiaArma(ag, S) {

    if (S.mode === 'play' && !P.car && (P.weapon === 'pistol' || P.weapon === 'smg' || P.weapon === 'shotgun') && Math.hypot(P.x - ag.x, P.y - ag.y) < 170 && S.time - ag.aviso > 25) {

    }
  }

  // ---------- olhar a rua (carros, gente, obras, pedágios) ----------
  function olharRua(ag, S) {
    F.stats.ruas++; const fonte = 'FBI ' + ag.nome; let vistos = 0;
    S.cars.forEach(c => { if (!isFinite(c.x) || !isFinite(c.y) || Math.hypot(c.x - ag.x, c.y - ag.y) > 420) { if (isFinite(c.x) && isFinite(c.y)) return; } vistos++; O.diagnosticaCarro(c, S).forEach(d => O.trata(d, c, fonte, true)); });

    G.pedagio.pracas.forEach(pr => { if (Math.abs((pr.x0 + pr.x1) / 2 - ag.x) < 900 && Math.abs(pr.mid - ag.y) < 700) pr.pistas.forEach(ps => { if (ps.ang != null && !isFinite(ps.ang)) O.registrar({ tipo: 'pedagio-cancela', sev: 3, fonte, msg: pr.nome + ': cancela com ângulo inválido', onde: G.cameras.onde(pr.x0, pr.mid) }); }); });
    // quebrada? só informa
    G.pedagio.pracas.forEach(pr => pr.pistas.forEach(ps => { if (ps.quebrada > 0 && Math.abs(ps.gx - ag.x) < 400 && Math.abs(pr.mid - ag.y) < 400) O.registrar({ tipo: 'pedagio-quebrado', sev: 2, fonte, msg: pr.nome + ': cancela quebrada à vista (manutenção chamada)', onde: G.cameras.onde(ps.gx, pr.mid), chave: 'pq:' + pr.nome }); }));
    return vistos;
  }

  // ---------- movimento e rotina ----------
  function atualizaAgente(ag, S, dt) {
    const p = ag.ped;
    if (ag.escondido) { ag.t -= dt; if (ag.t <= 0) { ag.escondido = false; ag.estado = 'parado'; ag.t = 0.4; p.x = ag.x; p.y = ag.y; } return; }
    if (ag.estado === 'parado') {
      ag.t -= dt; if (ag.t > 0) return;

      ag.alvo = a; ag.visitas[a.id] = (ag.visitas[a.id] || 0) + 1;
      const rota = caminho(ag.x, ag.y, a.x, a.y, ag.lim);
      if (!rota || !rota.length) { ag.visitas[a.id] += 2; ag.t = 0.3; ag.falhas = (ag.falhas || 0) + 1; if (ag.falhas === 3) O.registrar({ tipo: 'agente-preso', sev: 2, fonte: 'FBI ' + ag.nome, msg: ag.nome + ' não achou caminho até ' + (a.pl ? a.pl.nome : a.id), chave: 'ap:' + ag.id + ':' + a.id, detalhe: { de: [Math.round(ag.x), Math.round(ag.y)], para: [Math.round(a.x), Math.round(a.y)] } }); return; }

  // ---------- desenho: agentes na rua ----------
  F.desenhar = function (ctx, S, inV, t) {
    F.agentes.forEach(ag => {
      if (ag.escondido || !inV(ag)) return;
      if (!ag.ped.shirt) Object.assign(ag.ped, ag.ped.look);   // o sprite lê as cores direto do pedestre

<script>
/* =====================================================================
   JUSTICA.JS — a prisão de verdade
     Preso na rua  →  algemas  →  caminhada até a viatura  →  banco de trás
     →  viagem até a DELEGACIA GERAL (grande, com recepção, celas e escrivão)
     →  sentença que depende do MAIOR nível de procurado que você atingiu:
          nível 1-3  fica na delegacia (paga fiança ou cumpre a pena na cela)
          nível 4    PENITENCIÁRIA SERRA DURA, muito longe da cidade
          nível 5    PRISÃO DE SEGURANÇA MÁXIMA na ILHA DO SILÊNCIO (ninguém foge de lá)
   Dentro da prisão: dormir passa os dias, bom comportamento (pátio, oficina) encurta a pena.
   ===================================================================== */
(function (G) {
  'use strict';
  const W = G.world, L = G.lugares, K = L.kit, SP = G.sprites, AI = G.ai;
  const O = K.O, rand = K.rand, clamp = K.clamp, pick = K.pick, TAU = Math.PI * 2, VW = K.VW, VH = K.VH;
  const J = G.justica = {};

  // ---------- a pena de cada nível ----------
  const NIVEIS = {
    1: { nome: 'DETENÇÃO', dias: 1, fianca: 0.05, perda: 0.08, onde: 'delegacia', crime: 'Perturbação e fuga' },
    2: { nome: 'DETENÇÃO', dias: 2, fianca: 0.10, perda: 0.12, onde: 'delegacia', crime: 'Roubo e fuga da polícia' },
    3: { nome: 'PRISÃO PROVISÓRIA', dias: 3, fianca: 0.15, perda: 0.18, onde: 'delegacia', crime: 'Roubo armado e resistência à prisão' },
    4: { nome: 'PENITENCIÁRIA', dias: 6, fianca: 0, perda: 0.30, onde: 'penitenciaria', crime: 'Crimes graves e confronto com a polícia' },
    5: { nome: 'SEGURANÇA MÁXIMA', dias: 12, fianca: 0, perda: 0.45, onde: 'ilha', crime: 'Inimigo público número 1' },
  };
  J.NIVEIS = NIVEIS;
  const LOCAIS = {
    penitenciaria: { id: 'penitenciaria', nome: 'PENITENCIÁRIA SERRA DURA', km: 480, cor: '#5a6070' },
    ilha: { id: 'ilha', nome: 'PRISÃO DE SEGURANÇA MÁXIMA — ILHA DO SILÊNCIO', km: 1200, cor: '#3a4048' },
  };
  const look = o => Object.assign(SP.randomLook(), { acc: 'none' }, o);
  const policial = o => look(Object.assign({ shirt: '#1c2f6b', cap: 'cop', pat: 'liso', sleeve: 'curta', fem: false }, o));
  const preso = o => look(Object.assign({ shirt: '#e8872a', pat: 'liso', sleeve: 'curta', hairStyle: 'raspado' }, o));
  const delegaciaPlace = () => W.places.find(p => p.tipo === 'delegacia');

  // ---------- nível máximo de procurado do episódio atual ----------
  J.atualizar = function (S) {
    if (S.heatLevel > 0) S.pico = Math.max(S.pico || 0, S.heatLevel);
    else if ((S.heat || 0) <= 0) S.pico = 0;        // despistou a polícia: a ficha "zera"
  };

  // =====================================================================
  //  1) A PRISÃO NA RUA
  // =====================================================================
  J.prender = function (S) {
    const P = S.player, nivel = clamp(Math.max(S.pico || 0, S.heatLevel || 0, 1), 1, 5);
    S.justica = { fase: 'algema', t: 0, nivel, van: null, cop: null };
    S.mode = 'preso'; S.modeT = 0; S.heat = 0; S.heatLevel = 0; S.bustT = 0; S.heli = null; S.pico = 0;
    P.vx = P.vy = 0; P.iframes = 999; P.escondido = false; P.hp = Math.max(P.hp, 40);
    // as viaturas da perseguição param ao redor de você
    S.cars.forEach(c => { if (c.kind === 'police' && !c.dead && (c.mode === 'chase' || c.mode === 'block' || c.mode === 'leave')) { c.mode = 'parked'; c.driver = 'none'; c.hb = true; c.thr = 0; c.steer = 0; c.cenaPrisao = true; c.siren = true; } });
    S.peds.forEach(p => { if (p.kind === 'cop') { p.cenaPrisao = true; p.state = 'walk'; p.armed = false; p.alvoMov = null; p.vx = p.vy = 0; } });
    // o policial que vai te acompanhar
    let cop = null, bd = 1e9;

  };

  // viatura nova, parada na rua mais perto de você (é ela que vai te levar)
  function chamaViatura(S) {
    const P = S.player; let pt = null;

  const portaTraseira = c => ({ x: c.x + Math.cos(c.a) * (SP.CAR_W / 2 + 12) - c.fx * 10, y: c.y + Math.sin(c.a) * (SP.CAR_W / 2 + 12) - c.fy * 10 });
  const anda = (o, tx, ty, v, dt) => {
    const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy); if (d < 1) return 0;
    const st = Math.min(d, v * dt), nx = o.x + dx / d * st, ny = o.y + dy / d * st;

    o.h = (o.h || 0) + AI.wrap(Math.atan2(dy, dx) + Math.PI / 2 - (o.h || 0)) * Math.min(1, 10 * dt); o.walk = (o.walk || 0) + st * 0.2;
    return d;
  };

  // área de destino: porta da delegacia
  function destinoDelegacia() {
    const pl = delegaciaPlace(), T = W.T;
    let bi = 0, bj = 0, bd = 1e9;
    for (let i = 0; i <= W.COLS; i++) { const d = Math.abs(W.nodeX(i) - pl.x); if (d < bd) { bd = d; bi = i; } }
    bd = 1e9; for (let j = 0; j <= W.ROWS; j++) { const d = Math.abs(W.nodeY(j) - pl.y); if (d < bd) { bd = d; bj = j; } }
    return { i: bi, j: bj, x: pl.x, y: pl.y - 26, pl };
  }

  // roda a cena (modo 'preso') a cada quadro
  J.rodar = function (S, dt) {
    const J_ = S.justica, P = S.player; if (!J_) { S.mode = 'play'; return; }

    const fase = J_.fase;
    if (fase === 'algema') {
      P.vx = P.vy = 0;
      if (J_.cop) anda(J_.cop, P.x + 24, P.y + 6, 80, dt);
      if (J_.t > 2) { J_.van = chamaViatura(S); J_.fase = 'escolta'; J_.t = 0; if (!J_.van) { J.cenaViagem(S, 'semviatura'); } G.say('O policial leva você até a viatura...', 3); }
    } else if (fase === 'escolta') {
      const c = J_.van; if (!c || c.dead) { J_.van = chamaViatura(S); return; }
      const dp = portaTraseira(c);
      const d = anda(P, dp.x, dp.y, 78, dt);
      if (J_.cop) anda(J_.cop, P.x - Math.cos((P.h || 0) - Math.PI / 2) * 22 + 6, P.y - Math.sin((P.h || 0) - Math.PI / 2) * 22, 82, dt);
      if (d < 14 || J_.t > 9) { J_.fase = 'embarque'; J_.t = 0; G.snd.door(); }
    } else if (fase === 'embarque') {
      if (J_.t > 0.7) {
        P.escondido = true; S.peds = S.peds.filter(p => !p.cenaPrisao);
        S.cars = S.cars.filter(c => !(c.cenaPrisao && c !== J_.van));
        const c = J_.van, d = destinoDelegacia(); J_.alvo = d;
        c.mode = 'prisao'; c.driver = 'ai'; c.hb = false; c.siren = true; c.ignoreLights = true; c.cruise = 270; c.max = 310;
        c.nav = AI.initNav(c.pt.axis, c.pt.idx, c.pt.dir, c.pt.along); c.nav.mode = 'goto'; c.nav.target = { i: d.i, j: d.j };
        J_.fase = 'viagem'; J_.t = 0; G.say('No banco de trás da viatura, a caminho da delegacia... (ESPAÇO: pular viagem)', 5);
      }

  function bomComportamento(S, chave, titulo, pts, extra) {
    const d = S.detido; if (!d) return;
    if (d.feito[chave]) { G.say('Hoje você já fez isso. Durma para o dia passar.', 3.5); return; }
    L.miniTiming(S, { titulo, reps: 3, v: 1.2, zona: 0.18, cb: (S2, R2, ok, tot) => {
      d.feito[chave] = true;
      if (ok >= 2) { d.bom += pts; G.say('Bom desempenho! Comportamento +' + pts + ' (' + d.bom + '/3).' + (extra ? ' ' + extra(S2) : ''), 4.5); }
      else G.say('Você fez de qualquer jeito. Nenhum ponto de comportamento.', 3.5);
    } });
  }

    L.trans(S, () => {
      d.dias += 2; d.fugas = (d.fugas || 0) + 1; S.player.hp = Math.max(8, S.player.hp - 35);
      G.say(d.local === 'ilha' ? 'FUGA IMPOSSÍVEL: muralha de 12 metros, cães, torres e 40 km de mar bravo. Os guardas te pegaram. +2 dias e solitária.' : 'Os guardas te pegaram no arame. Muro de 9 metros e cães: +2 dias e solitária.', 8);
      const lg = S.inside.lugar; let R = lg.salas.solitaria; if (!R) { R = lg.salas.solitaria = lg.criar('solitaria', lg); R.lugar = lg; R.id = 'solitaria'; R.place = lg.place; }
      R.px = R.portaX; R.py = R.y1 - 80; if (R.aoEntrar) R.aoEntrar(S, R);
      S.inside = R; R.cx = 0; R.cy = 0;
    });
  }

  // placar da pena no canto da tela (dentro de lugares)
  L.extrasDesenho.push((ctx, S, inV) => {
    const d = S.detido; if (!d || !inV) return;
    const H = G.hud;
    ctx.save(); ctx.fillStyle = 'rgba(8,10,20,0.78)'; W.rrect(ctx, 10, 10, 250, 62, 8); ctx.fill(); ctx.strokeStyle = '#ffe04a'; ctx.lineWidth = 1.5; ctx.stroke();
    H.txt(ctx, d.nome, 20, 30, 13, '#ffe04a', 'left');
    H.txt(ctx, 'Pena: ' + Math.max(0, d.dias) + ' dia(s)   ·   Comportamento: ' + d.bom + '/3', 20, 48, 12, '#fff', 'left');
    H.txt(ctx, d.local === 'delegacia' ? 'Delegacia Geral' : d.local === 'ilha' ? 'Ilha do Silêncio' : 'Serra Dura', 20, 64, 11, '#9ab6ff', 'left');
    ctx.restore();
  });
})(window.G = window.G || {});

</script>
<script>
/* =====================================================================
   GOVERNO.JS — a PREFEITURA e a política da cidade
     • Você decide o que o prefeito faz: gabinete na Prefeitura de Ribeirão
     • Obras: manda as construtoras fazerem escola, hospital, fábrica, hotel...
       (primeiro vem o PLANEJAMENTO com a placa do projeto, depois as etapas da obra)
     • Ruas INTERDITADAS: obras grandes fecham o trecho da rua (cones, barreiras e placa);
       os carros da cidade desviam. Construtora relapsa esquece de reabrir — o prefeito resolve.
     • Orçamento (impostos, segurança, saúde, educação), pauta do dia (propina, greve, dengue...),
       aprovação popular e ELEIÇÃO a cada 10 dias.
   ===================================================================== */
(function (G) {
  'use strict';
  const W = G.world, L = G.lugares, K = L.kit, SP = G.sprites, C = G.cidade, O = K.O, rand = K.rand, clamp = K.clamp, pick = K.pick, TAU = Math.PI * 2;
  const GV = G.governo = { fechados: [] };
  const look = o => Object.assign(SP.randomLook(), { acc: 'none' }, o);
  const $ = v => '$' + Math.round(v);

  // ---------- o estado do governo (vai junto com o save) ----------
  const gov = S => {
    const s = S.save;
    if (!s.gov) s.gov = { caixa: 6000, imposto: 10, aprov: 62, dia: Math.floor(S.dayT || 0), pauta: [], hist: [], seg: 1, saude: 1, edu: 1, eleicao: 10, bloqueio: 0, corrupcao: 0, ruas: [], reabertas: {}, nomePref: 'Ademar Costa', mandatos: 1 };
    return s.gov;
  };
  GV.gov = gov;
  const nota = (g, txt) => { g.hist.unshift('Dia ' + g.dia + ': ' + txt); if (g.hist.length > 10) g.hist.pop(); };

  // ---------- as cinco cidades e seus trechos de rua ----------
  const faixa = k => ({ a: k === 0 ? 0 : W.CIDADES[k - 1].ate, b: Math.min(W.CIDADES[k].ate, W.COLS + 1), nome: W.CIDADES[k].nome });
  const regiaoDoLote = l => C.regiaoDe(l.x + l.w / 2, l.y + l.h / 2).nome;
  const esperando = l => !l.ativo && C.estadoDe(l).f < 0 && !l.encomendado && l.tam !== 'a';

  // trecho de rua entre dois cruzamentos: retângulo no mundo
  function retTrecho(axis, idx, a) {
    const T = W.T, R = W.ROAD * T;
    if (axis === 'h') return { x: W.roadLeft(a) + R, y: W.roadTop(idx), w: W.roadLeft(a + 1) - W.roadLeft(a) - R, h: R };
    return { x: W.roadLeft(idx), y: W.roadTop(a) + R, w: R, h: W.roadTop(a + 1) - W.roadTop(a) - R };
  }
  const chave = f => f.axis + f.idx + ':' + f.a;

  // ---------- relógio do governo: dias, impostos, pauta, eleição ----------
  const OBRAS = [
    { tipo: 'escola', nome: 'Escola Municipal', custo: 2500, tam: 'g', desc: 'educação: aprovação sobe quando fica pronta' },
    { tipo: 'hospital', nome: 'Hospital', custo: 4000, tam: 'g', desc: 'mais um hospital para atender acidentes' },
    { tipo: 'fabrica', nome: 'Fábrica (empregos)', custo: 3500, tam: 'g', desc: 'gera empregos e impostos' },
    { tipo: 'hotel', nome: 'Hotel (turismo)', custo: 3000, tam: 'g', desc: 'atrai turistas e impostos' },
    { tipo: 'shopping', nome: 'Shopping', custo: 5000, tam: 'g', desc: 'muitos empregos e muita receita' },
    { tipo: 'empresa', nome: 'Empresa / escritórios', custo: 3200, tam: 'g', desc: 'empregos de escritório' },
    { tipo: 'casa', nome: 'Moradia popular', custo: 700, tam: 'p', desc: 'casa nova para as famílias' },
    { tipo: 'comercio', nome: 'Incentivo ao comércio', custo: 900, tam: 'p', desc: 'uma loja nova no bairro' },
    { tipo: 'predio', nome: 'Edifício residencial', custo: 1800, tam: 'p', desc: 'prédio de apartamentos' },
  ];
  GV.OBRAS = OBRAS;

  function receita(S) {
    const g = gov(S); let prontas = 0, obras = 0;
    W.lotes.forEach(l => { if (l.ativo) prontas++; else if (l.est && l.est.f >= 0) obras++; });
    const rec = Math.round(600 + prontas * 12 * g.imposto / 10);
    const desp = Math.round(500 + obras * 60 + (g.seg - 1) * 220 + g.seg * 60 + g.saude * 100 + g.edu * 80);
    return { rec, desp, prontas, obras };
  }
  GV.receita = receita;

  const PAUTAS = [
    g => ({ t: 'A empreiteira ALFA oferece $1500 por fora para vencer a licitação de uma obra.', op: [
      { n: 'Aceitar a propina ($1500 no seu bolso)', d: 'rende dinheiro, mas se descobrirem o FBI investiga', f: S => { S.save.money += 1500; g.corrupcao++; nota(g, 'propina aceita (ninguém viu... ainda)'); } },
      { n: 'Recusar e denunciar', d: 'a população gosta de prefeito honesto', f: S => { g.aprov = clamp(g.aprov + 4, 0, 100); nota(g, 'propina recusada'); } } ] }),
    g => ({ t: 'Os vereadores querem aumentar o próprio salário.', op: [
      { n: 'Aprovar (-$400 do caixa)', d: 'os vereadores ficam do seu lado', f: S => { g.caixa -= 400; g.aprov = clamp(g.aprov - 3, 0, 100); nota(g, 'aumento dos vereadores aprovado'); } },
      { n: 'Vetar', d: 'o povo aplaude', f: S => { g.aprov = clamp(g.aprov + 2, 0, 100); nota(g, 'aumento vetado'); } } ] }),
    g => ({ t: 'Moradores reclamam do asfalto esburacado. Pedem o recapeamento de uma avenida.', op: [
      { n: 'Mandar recapear (-$900, rua interditada por um tempo)', d: 'a obra fecha um trecho de rua', f: S => { if (!GV.recapear(S, null, 900)) { g.aprov -= 2; } } },
      { n: 'Ignorar', d: 'os buracos continuam', f: S => { g.aprov = clamp(g.aprov - 3, 0, 100); nota(g, 'pedido de asfalto ignorado'); } } ] }),
    g => ({ t: 'Professores ameaçam greve por reajuste.', op: [
      { n: 'Dar o reajuste (-$600, educação sobe)', d: 'escolas funcionando', f: S => { g.caixa -= 600; g.edu = Math.min(3, g.edu + 1); g.aprov = clamp(g.aprov + 3, 0, 100); nota(g, 'reajuste dos professores'); } },
      { n: 'Negociar sem pagar', d: 'a greve pode durar', f: S => { g.aprov = clamp(g.aprov - 4, 0, 100); nota(g, 'greve dos professores'); } } ] }),
    g => ({ t: 'Surto de dengue: os postos de saúde estão lotados.', op: [
      { n: 'Fazer mutirão de saúde (-$700)', d: 'combate o mosquito e acalma a população', f: S => { g.caixa -= 700; g.aprov = clamp(g.aprov + 5, 0, 100); nota(g, 'mutirão contra a dengue'); } },
      { n: 'Não fazer nada', d: 'o hospital vai encher', f: S => { g.aprov = clamp(g.aprov - 6, 0, 100); nota(g, 'surto de dengue ignorado'); } } ] }),
    g => ({ t: 'Uma fábrica estrangeira quer se instalar na região se ganhar isenção de impostos.', op: [
      { n: 'Dar isenção (-$300 de caixa)', d: 'a fábrica vai começar a ser planejada', f: S => { g.caixa -= 300; const l = W.lotes.find(x => esperando(x) && x.tam === 'g'); if (l && C.encomenda(l, 'fabrica', 60)) nota(g, 'fábrica estrangeira em ' + regiaoDoLote(l)); else nota(g, 'não há terreno livre para a fábrica'); } },
      { n: 'Recusar', d: 'a empresa vai embora', f: S => { nota(g, 'fábrica recusada'); } } ] }),
    g => ({ t: 'O secretário de segurança pede mais viaturas e policiais.', op: [
      { n: 'Investir em segurança (-$500)', d: 'a cidade fica mais segura', f: S => { g.caixa -= 500; g.seg = Math.min(3, g.seg + 1); nota(g, 'mais policiais nas ruas'); } },
      { n: 'Segurar o dinheiro', d: 'sem investimento, o crime cresce', f: S => { g.aprov = clamp(g.aprov - 2, 0, 100); nota(g, 'orçamento da segurança mantido'); } } ] }),
  ];

  function novoDia(S, g) {
    g.dia++;
    const r = receita(S);
    g.caixa += r.rec - r.desp;
    let d = 0;
    if (g.imposto > 10) d -= (g.imposto - 10) * 0.7; else d += (10 - g.imposto) * 0.3;
    if (r.obras > 0) d += Math.min(2, r.obras * 0.3);
    d += (g.seg - 1) * 0.8 + (g.saude - 1) * 0.8 + (g.edu - 1) * 0.8;
    const abertas = GV.fechados.filter(f => f.relapsa).length; d -= abertas * 1.2;
    if (g.caixa < 0) d -= 3;
    g.aprov = clamp(g.aprov + d, 0, 100);
    nota(g, 'receita ' + $(r.rec) + ', despesa ' + $(r.desp) + ' → caixa ' + $(g.caixa));
    if (g.bloqueio > 0) g.bloqueio--;
    if (g.pauta.length < 3 && Math.random() < 0.8) { const idx = Math.floor(Math.random() * PAUTAS.length); g.pauta.push(idx); }
    // corrupção descoberta → inquérito
    if (g.corrupcao >= 3) {
      g.corrupcao = 0; g.aprov = clamp(g.aprov - 30, 0, 100); const multa = Math.round(S.save.money * 0.2); S.save.money -= multa;
      nota(g, 'FBI abre inquérito contra a prefeitura'); G.banner('OPERAÇÃO LAVA-RUA', 'O FBI abriu inquérito sobre as propinas. Multa: ' + $(multa), true, 4); G.say('O FBI descobriu as propinas da prefeitura! Você pagou multa de ' + $(multa) + '.', 8);
    }
    // eleição
    if (g.dia >= g.eleicao) {
      g.eleicao += 10;
      if (g.aprov < 40) { g.bloqueio = 3; g.mandatos = 0; g.nomePref = pick(['Dr. Gilberto Moura', 'Dra. Sônia Vaz', 'Coronel Mendes']); g.aprov = 55; nota(g, 'ELEIÇÃO: a oposição venceu (' + g.nomePref + ')'); G.banner('ELEIÇÃO!', 'A oposição venceu. ' + g.nomePref + ' é o novo prefeito.', true, 4); }
      else { g.aprov = clamp(g.aprov + 8, 0, 100); g.mandatos++; nota(g, 'ELEIÇÃO: prefeito reeleito!'); G.banner('REELEITO!', g.nomePref + ' venceu a eleição com ' + Math.round(g.aprov) + '% de aprovação.', false, 4); }
    }
    if (G.save) G.save();
  }

  // ---------- ruas interditadas ----------
  GV.recapear = function (S, nomeRegiao, custo) {
    const g = gov(S); if (g.caixa < custo) { G.say('Caixa insuficiente (' + $(g.caixa) + ').', 3); return false; }
    const cid = nomeRegiao ? W.CIDADES.findIndex(c => c.nome === nomeRegiao) : 0, k = Math.max(0, cid), fx = faixa(k);
    for (let t = 0; t < 40; t++) {
      const axis = Math.random() < 0.5 ? 'h' : 'v';
      let idx, a;
      if (axis === 'h') { idx = Math.floor(rand(1, W.ROWS)); a = Math.floor(rand(fx.a, fx.b)); if (a >= W.COLS) continue; if (!W.cruzaOk(a, idx)) continue; }
      else { idx = Math.floor(rand(Math.max(1, fx.a), Math.min(W.COLS, fx.b))); if (W.RIVERS.includes(idx)) continue; a = Math.floor(rand(0, W.ROWS)); }
      if (GV.fechados.some(f => f.axis === axis && f.idx === idx && f.a === a)) continue;
      g.caixa -= custo; g.ruas.push({ axis, idx, a, ate: C.t + 260, nome: 'RECAPEAMENTO' });
      const r = retTrecho(axis, idx, a); G.say('Obra de recapeamento começou em ' + fx.nome + '. O trecho está interditado por um tempo.', 6); nota(g, 'recapeamento em ' + fx.nome);
      sincroniza(S); return true;
    }
    G.say('Não achei um trecho livre para a obra.', 3); return false;
  };

  function sincroniza(S) {
    const g = gov(S), lista = [];
    W.lotes.forEach(l => {
      if (!l.rua || l.tam === 'a' || !l.est) return;
      const f = l.est.f, by = l.by + 1, bx = l.bx; if (by > W.ROWS) return;
      let aberta = false, relapsa = false;
      if (f >= 1 && f <= 3) aberta = true;
      else if (f >= 4 && l.neg && !g.reabertas[l.id]) { if (l.fimDia == null) l.fimDia = g.dia; if (g.dia - l.fimDia < 3) { aberta = true; relapsa = true; } }
      if (aberta) lista.push({ axis: 'h', idx: by, a: bx, motivo: relapsa ? 'OBRA ABANDONADA' : 'OBRA ' + (l.proj.nome || ''), relapsa, lote: l });
    });
    g.ruas = g.ruas.filter(r => r.ate > C.t);
    g.ruas.forEach(r => lista.push({ axis: r.axis, idx: r.idx, a: r.a, motivo: r.nome, relapsa: false, rua: r }));
    lista.forEach(f => { f.rect = retTrecho(f.axis, f.idx, f.a); f.reg = C.regiaoDe(f.rect.x + f.rect.w / 2, f.rect.y + f.rect.h / 2).nome; });
    GV.fechados = lista;
    W.fechado.clear(); lista.forEach(f => W.fechado.add(chave(f)));
  }
  GV.sincroniza = sincroniza;

  let acc = 0;
  G.extras.add((S, dt) => {
    if (!S.save) return;
    const g = gov(S);
    acc += dt; if (acc < 1) return; acc = 0;
    const dia = Math.floor(S.dayT || 0);
    let n = 0; while (g.dia < dia && n++ < 6) novoDia(S, g);
    if (g.dia > dia) { g.eleicao -= g.dia - dia; g.dia = dia; }      // jogo recarregado: o relógio do dia recomeça
    sincroniza(S);
  });

  // desenho das interdições (chamado por cidade.js)
  GV.desenhar = function (ctx, S, x0, y0, x1, y1, t) {
    GV.fechados.forEach(f => {
      const r = f.rect; if (r.x > x1 || r.x + r.w < x0 || r.y > y1 || r.y + r.h < y0) return;
      const horiz = f.axis === 'h', R = W.ROAD * W.T;
      // asfalto novo / cascalho no meio
      ctx.fillStyle = 'rgba(20,20,26,0.35)'; ctx.fillRect(r.x, r.y, r.w, r.h);
      // barreiras nas duas pontas
      const barra = (px, py) => {
        const bw = horiz ? 12 : R - 24, bh = horiz ? R - 24 : 12;
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(px - bw / 2 + 3, py - bh / 2 + 4, bw, bh);
        for (let k = 0; k < 8; k++) { ctx.fillStyle = k % 2 ? '#f2f2f2' : '#e8601a'; if (horiz) ctx.fillRect(px - bw / 2, py - bh / 2 + k * bh / 8, bw, bh / 8 + 0.5); else ctx.fillRect(px - bw / 2 + k * bw / 8, py - bh / 2, bw / 8 + 0.5, bh); }
        const on = Math.floor(t * 2.5) % 2 === 0; ctx.fillStyle = on ? '#ffb020' : '#6a4a10'; ctx.beginPath(); ctx.arc(px, py - (horiz ? bh / 2 - 4 : 0), 4, 0, TAU); ctx.fill();
        if (on) { ctx.fillStyle = 'rgba(255,170,30,0.25)'; ctx.beginPath(); ctx.arc(px, py - (horiz ? bh / 2 - 4 : 0), 14, 0, TAU); ctx.fill(); }
      };
      if (horiz) { barra(r.x + 16, r.y + r.h / 2); barra(r.x + r.w - 16, r.y + r.h / 2); } else { barra(r.x + r.w / 2, r.y + 16); barra(r.x + r.w / 2, r.y + r.h - 16); }
      // cones ao longo da pista
      const n = Math.floor((horiz ? r.w : r.h) / 90);
      for (let k = 1; k < n; k++) for (const s of [0.18, 0.82]) {
        const cx = horiz ? r.x + k * r.w / n : r.x + r.w * s, cy = horiz ? r.y + r.h * s : r.y + k * r.h / n;
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(cx + 2, cy + 3, 6, 4, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#f26a1a'; ctx.beginPath(); ctx.moveTo(cx, cy - 11); ctx.lineTo(cx + 6, cy + 3); ctx.lineTo(cx - 6, cy + 3); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(cx - 3, cy - 4, 6, 3);
      }
      // placa no meio
      const mx = r.x + r.w / 2, my = r.y + r.h / 2;
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(mx - 62, my - 14, 128, 34);
      ctx.fillStyle = f.relapsa ? '#c8302a' : '#f2c21a'; ctx.fillRect(mx - 64, my - 18, 128, 34);
      ctx.fillStyle = '#16181c'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center'; ctx.fillText('RUA INTERDITADA', mx, my - 4); ctx.font = 'bold 9px Arial'; ctx.fillText(f.motivo, mx, my + 9); ctx.textAlign = 'left';
      // operário
      ctx.fillStyle = '#f2c21a'; ctx.beginPath(); ctx.arc(mx + 80 * Math.sin(t * 0.3 + r.x), my + 24, 5, 0, TAU); ctx.fill(); ctx.fillStyle = '#e8601a'; ctx.fillRect(mx + 80 * Math.sin(t * 0.3 + r.x) - 4, my + 28, 8, 7);
    });
  };

  // =====================================================================
  //  A PREFEITURA (interior) e o menu do gabinete
  // =====================================================================
  const abre = (S, titulo, itens, info, rod) => L.abrirMenu(S, { titulo, itens, info: info || (S2 => 'Caixa: ' + $(gov(S2).caixa) + '   Aprovação: ' + Math.round(gov(S2).aprov) + '%'), rodape: rod || 'W/S escolher  ·  E confirmar  ·  ESC sair' });

  function menuPrincipal(S) {
    const g = gov(S), r = receita(S);
    if (g.bloqueio > 0) { G.say('A oposição governa a cidade por mais ' + g.bloqueio + ' dia(s). O prefeito ' + g.nomePref + ' não aceita suas ordens agora.', 5); return; }
    abre(S, 'GABINETE DO PREFEITO', [
      { n: 'Prefeito ' + g.nomePref + ' — pauta do dia (' + g.pauta.length + ' assunto' + (g.pauta.length === 1 ? '' : 's') + ')', desc: 'decida os assuntos que a secretária trouxe', fn: S2 => menuPauta(S2) },
      { n: 'Obras e projetos', desc: 'mande as construtoras construírem na cidade', fn: S2 => menuObras(S2) },
      { n: 'Ruas interditadas (' + GV.fechados.length + ')', desc: 'veja e reabra as ruas fechadas por obras', fn: S2 => menuRuas(S2) },
      { n: 'Orçamento e impostos', desc: 'imposto ' + g.imposto + '%, segurança ' + g.seg + ', saúde ' + g.saude + ', educação ' + g.edu, fn: S2 => menuOrc(S2) },
      { n: 'Relatório da cidade', desc: 'receita, despesas, obras e eleição', fn: S2 => { G.say('Receita/dia ' + $(r.rec) + ' · Despesa/dia ' + $(r.desp) + ' · ' + r.prontas + ' prédios prontos · ' + r.obras + ' obras · eleição no dia ' + g.eleicao + ' (hoje é o dia ' + g.dia + ').', 9); } },
      { n: 'Diário do prefeito', desc: g.hist[0] || 'sem notícias ainda', fn: S2 => { G.say(g.hist.slice(0, 3).join('  |  ') || 'Nada registrado ainda.', 9); } },
      { n: 'Doar $500 do seu bolso ao caixa', desc: 'ajuda a pagar as obras', fn: S2 => { if (!K.gasta(S2, 500)) return; g.caixa += 500; G.say('O caixa da prefeitura recebeu $500.', 3); } },
    ]);
  }
  const voltar = () => ({ n: '← Voltar', fn: S2 => menuPrincipal(S2) });

  function menuPauta(S) {
    const g = gov(S);
    if (!g.pauta.length) { G.say('A secretária não trouxe nenhum assunto hoje. A cidade está tranquila.', 4); return; }
    const itens = g.pauta.map((idx, k) => { const p = PAUTAS[idx](g); return { n: p.t.slice(0, 74) + (p.t.length > 74 ? '...' : ''), desc: 'E para decidir', fn: S2 => decide(S2, k) }; });
    itens.push(voltar()); abre(S, 'PAUTA DO DIA', itens);
  }
  function decide(S, k) {
    const g = gov(S), p = PAUTAS[g.pauta[k]](g);
    const itens = p.op.map(o => ({ n: o.n, desc: o.d, fn: S2 => { o.f(S2); g.pauta.splice(k, 1); G.save(); G.snd.beep(); menuPauta(S2); } }));
    itens.push({ n: '← Deixar para depois', fn: S2 => menuPauta(S2) });
    abre(S, p.t.slice(0, 60) + (p.t.length > 60 ? '...' : ''), itens, S2 => p.t.slice(0, 120));
  }

  function menuObras(S) {
    const g = gov(S);
    const itens = OBRAS.map(o => ({ n: o.nome, preco: o.custo, desc: o.desc, fn: S2 => menuLocal(S2, o) }));
    itens.push({ n: 'Recapear uma avenida', preco: 900, desc: 'interdita um trecho de rua por um tempo', fn: S2 => menuLocalRua(S2) });
    itens.push(voltar());
    abre(S, 'OBRAS — O QUE CONSTRUIR?', itens);
  }
  function menuLocal(S, o) {
    const itens = W.CIDADES.map((c, k) => { const n = W.lotes.filter(l => esperando(l) && l.tam === o.tam && regiaoDoLote(l) === c.nome).length; return { n: c.nome, desc: n ? n + ' terreno(s) livre(s)' : 'sem terreno livre', fn: S2 => construir(S2, o, c.nome) }; });
    itens.push({ n: '← Voltar', fn: S2 => menuObras(S2) });
    abre(S, o.nome.toUpperCase() + ' — EM QUAL CIDADE?', itens);
  }
  function construir(S, o, cidade) {
    const g = gov(S);
    const l = W.lotes.find(x => esperando(x) && x.tam === o.tam && regiaoDoLote(x) === cidade);
    if (!l) { G.say('Não há terreno livre em ' + cidade + ' para esse projeto.', 4); return; }
    if (g.caixa < o.custo) { G.say('O caixa só tem ' + $(g.caixa) + '. A obra custa ' + $(o.custo) + '. (Dá para doar do seu bolso.)', 5); return; }
    g.caixa -= o.custo;
    C.encomenda(l, o.tipo, 120); nota(g, o.nome + ' encomendada em ' + cidade);
    G.say('Projeto aprovado! A construtora vai PLANEJAR a obra (vai aparecer a placa do projeto) e depois começar a construir. ' + o.nome + ' em ' + cidade + '.', 8);
    G.banner('OBRA ENCOMENDADA', o.nome + ' — ' + cidade, false, 3);
    S.inside.menu = null;
    G.save();
  }
  function menuLocalRua(S) {
    const itens = W.CIDADES.map(c => ({ n: c.nome, desc: 'recapear um trecho aleatório', fn: S2 => { if (GV.recapear(S2, c.nome, 900)) S2.inside.menu = null; else menuObras(S2); } }));
    itens.push({ n: '← Voltar', fn: S2 => menuObras(S2) }); abre(S, 'RECAPEAMENTO — ONDE?', itens);
  }
  function menuRuas(S) {
    const g = gov(S);
    const itens = GV.fechados.map(f => ({ n: f.reg + ' — ' + f.motivo, desc: f.relapsa ? 'construtora abandonou a obra: multar e reabrir ($200 de multa para o caixa)' : 'em andamento (reabrir antes custa $300 do caixa)', fn: S2 => {
      const custo = f.relapsa ? 0 : 300; if (g.caixa < custo) { G.say('Caixa insuficiente.', 3); return; }
      g.caixa -= custo; if (f.relapsa) { g.caixa += 200; g.reabertas[f.lote.id] = true; nota(g, 'construtora multada e rua reaberta'); } else if (f.lote) { g.reabertas[f.lote.id] = true; f.lote.rua = false; nota(g, 'obra liberou a rua'); } else if (f.rua) { f.rua.ate = 0; nota(g, 'recapeamento encerrado'); }
      sincroniza(S2); G.say('Rua reaberta ao trânsito.', 3); menuRuas(S2);
    } }));
    if (!itens.length) itens.push({ n: 'Nenhuma rua interditada', desc: 'tudo liberado', fn: () => {} });
    itens.push(voltar()); abre(S, 'RUAS INTERDITADAS', itens);
  }
  function menuOrc(S) {
    const g = gov(S);
    const nv = (k, nome, desc, custo) => ({ n: nome + ': nível ' + g[k] + '/3', desc: desc + (g[k] < 3 ? ' (subir custa $' + custo + ' agora)' : ' (máximo)'), fn: S2 => { if (g[k] >= 3) { G.say('Já está no máximo.', 2); return; } if (g.caixa < custo) { G.say('Caixa insuficiente.', 3); return; } g.caixa -= custo; g[k]++; nota(g, nome + ' subiu para ' + g[k]); menuOrc(S2); } });
    abre(S, 'ORÇAMENTO E IMPOSTOS', [
      { n: 'Imposto: ' + g.imposto + '%  (aumentar +2)', desc: 'mais receita, menos aprovação', fn: S2 => { g.imposto = Math.min(30, g.imposto + 2); menuOrc(S2); } },
      { n: 'Imposto: ' + g.imposto + '%  (reduzir -2)', desc: 'menos receita, mais aprovação', fn: S2 => { g.imposto = Math.max(2, g.imposto - 2); menuOrc(S2); } },
      nv('seg', 'Segurança', 'menos crimes na cidade', 600), nv('saude', 'Saúde', 'hospitais melhores', 600), nv('edu', 'Educação', 'escolas melhores', 600), voltar()]);
  }

  // ---------- as salas ----------
  const porta = (x, y, w, o) => O('porta', x, y, w, 54, Object.assign({ solid: false, k: 10, r: 50 }, o));
  L.construtores['tipo:prefeitura'] = {
    criar(sid, lg) {
      const pl = lg.place;
      if (sid === 'gabinete') return gabinete(lg);
      const R = L.novaSala({ place: pl, w: 880, h: 420, nome: 'PREFEITURA DE RIBEIRÃO', cor: '#1f4f8a', piso: 'ladrilho', pisoCores: ['#e8e2d0', '#c8bfa4'], parede: '#2a4a7a', subtitulo: 'seg a sex, 8h às 18h' });
      R.chegada = { x: R.portaX, y: R.y1 + 10 };
      const add = (...a) => R.objs.push(...a);
      add(O('recepcao', 340, 220, 260, 44, { e: 30, label: 'ATENDIMENTO AO CIDADÃO', r: 60, act: S => { const g = gov(S), r = receita(S); G.say('Prefeito: ' + g.nomePref + '. Aprovação ' + Math.round(g.aprov) + '%. ' + r.prontas + ' prédios novos prontos e ' + r.obras + ' obras andando. Eleição no dia ' + g.eleicao + '.', 8); } }));
      add(porta(780, 96, 70, { cor: '#6a5a3a', placa: 'GABINETE', label: 'IR AO GABINETE DO PREFEITO', act: S => L.irSala(S, 'gabinete', 440, 300, Math.PI) }));
      add(porta(100, 96, 70, { cor: '#4a4e58', placa: 'PLENÁRIO', label: 'CÂMARA DE VEREADORES', act: S => G.say('A sessão da Câmara começa à tarde. As decisões importantes passam pelo gabinete do prefeito.', 5) }));
      add(O('banco_espera', 130, 360, 170, 26, { e: 16, label: 'SENTAR NA ESPERA', r: 30, act: S => { K.cura(S, 4); G.say('Você esperou sentado um pouco. (+4 vida)', 3); } }));
      add(O('banco_espera', 580, 360, 170, 26, { e: 16, label: 'SENTAR NA ESPERA', r: 30, act: S => { K.cura(S, 4); G.say('Você esperou sentado um pouco. (+4 vida)', 3); } }));
      add(O('planta', 90, 470, 40, 50, {}), O('planta', 860, 470, 40, 50, {}));
      R.npcs.push({ x: 470, y: 238, p: look({ shirt: '#2a4a7a', fem: true, hairStyle: 'coque' }), falas: ['Prefeitura de Ribeirão, bom dia!', 'O prefeito está no gabinete. Pode subir.', 'IPTU em dia? O dinheiro vira obra.'], h: Math.PI, fixo: true, nome: 'Secretária Lúcia', dinheiro: 40, label: 'CONVERSAR' });
      R.npcs.push({ x: 220, y: 320, p: look({ shirt: '#c8c0b0', fem: false }), falas: ['Sou vereador. Voto com quem investe na cidade.', 'Dizem que certas empreiteiras pagam por fora...'], h: 0, fixo: true, nome: 'Vereador Osmar', dinheiro: 90 });
      R.npcs.push({ x: 640, y: 320, p: look({ shirt: '#8a4a6a', fem: true }), falas: ['A rua do meu bairro está interditada há dias! Uma obra esquecida.', 'Quero falar com o prefeito sobre o asfalto.'], h: Math.PI, fixo: true, nome: 'Dona Neide', dinheiro: 30 });
      R.deco = x => {
        x.fillStyle = '#c8a24a'; x.fillRect(120, 70, 760, 3);
        x.save(); x.font = 'bold 30px Georgia'; x.textAlign = 'center'; x.fillStyle = '#f4efe0'; x.fillText('PREFEITURA MUNICIPAL', 440, 108); x.font = 'bold 13px Arial'; x.fillStyle = '#ffe04a'; x.fillText('RIBEIRÃO PRETO — TRABALHO E PROGRESSO', 440, 130); x.restore();
        [[200, 0], [680, 1]].forEach(([bx]) => { x.fillStyle = '#3a8a3a'; x.fillRect(bx, 140, 70, 12); x.fillStyle = '#f2d21a'; x.fillRect(bx + 8, 142, 54, 8); });
      };
      R.luzes.push({ x: 440, y: 330, r: 420 });
      return R;
    }
  };
  function gabinete(lg) {
    const pl = lg.place, R = L.novaSala({ place: pl, w: 760, h: 420, nome: 'GABINETE DO PREFEITO', cor: '#6a4a2a', piso: 'xadrez', pisoCores: ['#7a5a3a', '#5a3e22'], parede: '#4a3220', subtitulo: 'decisões da cidade' });
    R.chegada = { x: R.portaX, y: R.y1 + 10 };
    const add = (...a) => R.objs.push(...a);
    add(O('recepcao', 300, 230, 220, 46, { e: 30, label: 'MESA DO PREFEITO — GOVERNAR', r: 64, act: S => menuPrincipal(S) }));
    add(O('bancada', 90, 330, 190, 50, { e: 24, label: 'MAPA DA CIDADE (OBRAS)', r: 52, act: S => { const rr = receita(S); G.say('Obras em andamento: ' + rr.obras + '. Prédios prontos: ' + rr.prontas + '. Ruas interditadas: ' + GV.fechados.length + '.', 7); } }));
    add(O('planta', 90, 220, 40, 50, {}), O('planta', 780, 220, 40, 50, {}));
    add(O('estante', 620, 190, 150, 36, { e: 32, label: 'LIVROS DE LEIS', r: 40, act: S => G.say('Constituição, Código de Obras, Lei Orgânica do Município. Sem leitura, sem prefeito bom.', 5) }));
    add(porta(380, 96, 60, { cor: '#4a4e58', placa: 'SAÍDA', label: 'VOLTAR AO SAGUÃO', act: S => L.irSala(S, 'entrada', 780, 215, Math.PI) }));
    R.porta = { para: 'entrada', px: 780, py: 215, ph: Math.PI, label: 'VOLTAR AO SAGUÃO', rotulo: 'SAGUÃO' };
    R.npcs.push({ x: 410, y: 214, p: look({ shirt: '#1a1c24', pat: 'liso', sleeve: 'longa', fem: false }), falas: ['O senhor manda, eu executo.', 'A população está de olho em cada decisão.', 'Eleição a cada dez dias. Aprovação baixa, e a oposição assume!'], h: Math.PI, fixo: true, nome: 'Prefeito', dinheiro: 500, label: 'CONVERSAR' });
    R.deco = x => {
      x.save(); x.font = 'bold 22px Georgia'; x.textAlign = 'center'; x.fillStyle = '#f2d890'; x.fillText('GABINETE DO PREFEITO', 450, 86); x.restore();
      x.fillStyle = '#7a1a1a'; x.fillRect(120, 112, 80, 44); x.fillStyle = '#f2d21a'; x.fillRect(130, 120, 60, 6); x.fillRect(130, 132, 60, 6);
    };
    R.aoEntrar = S => { const g = gov(S); R.nomeP = g.nomePref; };
    R.luzes = [{ x: 420, y: 320, r: 380 }];
    return R;
  }
})(window.G = window.G || {});

</script>
<script>
/* =====================================================================
   CRIMES.JS — a vida (e a morte) da cidade, sem você precisar fazer nada
     • Crimes de NPC, raros e por probabilidade. Assaltos a lojas e bancos têm PLANEJAMENTO
       (os bandidos "estudam" o alvo por 1-2 dias) e podem dar certo ou errado.
     • Sequestros, golpes, roubo de carro, incêndio criminoso...
     • Se a polícia não prende, casos graves passam para o FBI (que também pode fracassar).
     • O ASSASSINO DA MATA ESCURA: corpos na floresta, fitas da polícia e uma cabana escondida.
     • ACIDENTES: batidas e atropelamentos chamam a AMBULÂNCIA, que leva ao hospital mais perto
       (ou ao seguinte, se o mais perto estiver lotado). Quando VOCÊ morre, vale a mesma regra.
     • O jornal da banca, o quadro de procurados da delegacia e o "PLANTÃO" mostram tudo isso.
   ===================================================================== */
(function (G) {
  'use strict';
  const W = G.world, L = G.lugares, K = L.kit, AI = G.ai, C = G.cidade;
  const rand = K.rand, clamp = K.clamp, pick = K.pick, TAU = Math.PI * 2;
  const CR = G.crimes = { ambulancias: [], cenas: [] };
  const $ = v => '$' + Math.round(v);
  const NOMES = ['Carlos', 'Marcos', 'Rita', 'Joana', 'Beto', 'Paulo', 'Luana', 'Sérgio', 'Cida', 'Tavinho', 'Dona Zefa', 'Seu Nenê'];
  const SOBRE = ['Silva', 'Souza', 'Costa', 'Lima', 'Rocha', 'Moura', 'Dias', 'Nunes'];

  const sv = S => {
    const s = S.save;
    if (!s.casos) s.casos = []; if (!s.noticias) s.noticias = [];
    if (s.crimeDia == null) s.crimeDia = Math.floor(S.dayT || 0);
    if (!s.serial) s.serial = { vitimas: 0, resolvido: false, cabana: null, corpos: [] };
    return s;
  };
  const noticia = (S, txt, plantao) => {
    const s = sv(S); s.noticias.unshift(txt); if (s.noticias.length > 14) s.noticias.pop();
    if (plantao && S.mode === 'play') G.say('PLANTÃO: ' + txt, 7);
  };
  const gov = S => (G.governo ? G.governo.gov(S) : { seg: 1 });

  // ---------- hospitais: o mais perto, ou o seguinte se estiver lotado ----------
  const hosps = () => W.hospitais;
  CR.hospitalPara = function (x, y, S) {
    const H = hosps().slice().sort((a, b) => Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y));
    for (const h of H) if (h.lot == null) h.lot = rand(0.1, 0.6);
    let pri = H[0], lotado = false;
    for (const h of H) { if (h.lot < 0.82) { pri = h; break; } lotado = true; }
    if (!pri || pri.lot >= 0.82) pri = H[H.length - 1];
    return { h: pri, lotado: lotado && pri !== H[0], perto: H[0] };
  };
  // quando você morre
  CR.respawnHospital = function (S, x, y) {
    const r = CR.hospitalPara(x, y, S); r.h.lot = Math.min(1, r.h.lot + 0.08);
    const where = { x: r.h.x, y: r.h.y + 28, r: r.h.r, nome: r.h.nome, lotado: r.lotado, perto: r.perto.nome };
    return where;
  };

  // ---------- registro de casos ----------
  const ehBanco = p => /BANCO/.test(p.nome || '');
  const alvosLoja = () => W.places.filter(p => p.tipo === 'loja' && !ehBanco(p) && p.x != null);
  function novoCaso(S) {
    const s = sv(S), g = gov(S), pesos = [['loja', 35], ['banco', 9], ['sequestro', 8], ['carro', 20], ['golpe', 15], ['incendio', 6]];
    let tot = pesos.reduce((a, p) => a + p[1], 0), r = Math.random() * tot, tipo = 'loja';
    for (const [t, p] of pesos) { r -= p; if (r <= 0) { tipo = t; break; } }
    const caso = { id: s.casos.length + 1 + Math.floor(Math.random() * 1000), tipo, estado: 'planejando', dias: 0, plano: tipo === 'carro' || tipo === 'golpe' ? 0 : 1 + Math.floor(Math.random() * 2), dica: 0, grav: { loja: 2, banco: 4, sequestro: 5, carro: 1, golpe: 1, incendio: 3 }[tipo] };
    const lojas = alvosLoja();
    if (tipo === 'loja') { const a = pick(lojas); caso.alvo = { nome: a.nome, x: a.x, y: a.y }; caso.chance = 0.6; }
    else if (tipo === 'banco') { const a = W.places.find(ehBanco) || pick(lojas); caso.alvo = { nome: a.nome, x: a.x, y: a.y }; caso.chance = 0.35; }
    else if (tipo === 'incendio') { const a = pick(lojas); caso.alvo = { nome: a.nome, x: a.x, y: a.y }; caso.chance = 0.8; }
    else if (tipo === 'sequestro') {
      const pt = pontoLivre(['floresta', 'fazenda'], Math.random() * 9999); const nm = pick(NOMES) + ' ' + pick(SOBRE);
      caso.vitima = nm; caso.resgate = Math.round(rand(8, 40)) * 1000; caso.loc = pt; caso.alvo = { nome: nm, x: pt.x, y: pt.y }; caso.chance = 0.7;
    } else { caso.alvo = { nome: pick(['Seu Nenê', 'Dona Zefa', 'um empresário', 'uma aposentada']), x: 0, y: 0 }; caso.chance = 0.7; }
    s.casos.push(caso);
    if (tipo === 'banco' || tipo === 'sequestro') noticia(S, 'Fontes da polícia dizem que um grupo criminoso anda estudando ' + (tipo === 'banco' ? 'um banco da cidade.' : 'pessoas ricas para sequestrar.'), false);
    return caso;
  }

  // ponto livre dentro de um bloco de floresta/fazenda (sem árvore em cima)
  function pontoLivre(kinds, semente) {
    const bl = W.blocks.filter(b => kinds.includes(b.kind)); const rg = W.mulberry32(Math.floor(semente) + 77);
    for (let t = 0; t < 400; t++) {
      const b = bl[Math.floor(rg() * bl.length)]; if (!b) break;
      const x = b.x + 60 + rg() * (b.w - 120), y = b.y + 60 + rg() * (b.h - 120);
      if (W.isSolid(x, y) || W.treeHit(x, y, 46) || W.tileAt(x, y) === W.TILE.WATER) continue;
      return { x, y, bloco: b.bx + ',' + b.by };
    }
    return { x: W.nodeX(12), y: W.nodeY(3) + 400, bloco: '' };
  }

  function executa(S, c) {
    const s = sv(S), g = gov(S), ok = Math.random() < c.chance;
    const seg = (g.seg || 1);
    if (c.tipo === 'loja' || c.tipo === 'banco') {
      const v = Math.round(c.tipo === 'banco' ? rand(8000, 30000) : rand(300, 2500));
      if (ok) {
        c.estado = 'aberto'; c.valor = v;
        noticia(S, (c.tipo === 'banco' ? 'ASSALTO AO BANCO' : 'ASSALTO') + ': bandidos armados levaram ' + $(v) + ' do(a) ' + c.alvo.nome + ' e fugiram.', true);
        cena(S, c, 'fuga');
        if (Math.random() < 0.25 + 0.15 * seg) { c.estado = 'resolvido'; noticia(S, 'A polícia prendeu os assaltantes do(a) ' + c.alvo.nome + ' horas depois.'); }
      } else { c.estado = 'resolvido'; noticia(S, 'Tentativa de assalto ao(à) ' + c.alvo.nome + ' fracassou: a polícia prendeu os criminosos em flagrante.', true); cena(S, c, 'flagrante'); }
    } else if (c.tipo === 'sequestro') {
      if (ok) { c.estado = 'aberto'; noticia(S, 'SEQUESTRO: ' + c.vitima + ' desapareceu. Os criminosos pedem ' + $(c.resgate) + ' de resgate.', true); }
      else { c.estado = 'resolvido'; noticia(S, 'A polícia frustrou o sequestro de ' + c.vitima + '. Criminosos presos.'); }
    } else if (c.tipo === 'incendio') {
      c.estado = ok ? 'aberto' : 'resolvido'; noticia(S, ok ? 'INCÊNDIO CRIMINOSO destruiu o(a) ' + c.alvo.nome + ' esta madrugada.' : 'Bombeiros evitaram incêndio criminoso no(a) ' + c.alvo.nome + '.', true);
    } else if (c.tipo === 'carro') { c.estado = 'aberto'; noticia(S, 'Onda de roubos de carros preocupa os moradores.', false); if (Math.random() < 0.5) c.estado = 'resolvido'; }
    else { c.estado = 'aberto'; noticia(S, 'GOLPE: ' + c.alvo.nome + ' perdeu a poupança num golpe do falso PIX.', false); if (Math.random() < 0.45) c.estado = 'resolvido'; }
  }

  function diaCrimes(S) {
    const s = sv(S), g = gov(S), seg = g.seg || 1;
    // evolução dos casos
    s.casos.forEach(c => {
      if (c.estado === 'planejando') { c.plano--; if (c.plano <= 0) executa(S, c); }
      else if (c.estado === 'aberto') {
        c.dias++;
        if (c.grav >= 3 && c.dias >= 2) { c.estado = 'fbi'; noticia(S, 'O FBI assumiu a investigação do caso: ' + titulo(c) + '.', false); }
        else if (Math.random() < (0.10 + 0.06 * seg + 0.2 * c.dica)) { c.estado = 'resolvido'; noticia(S, 'Polícia resolve o caso: ' + titulo(c) + '. Suspeitos presos.'); }
      } else if (c.estado === 'fbi') {
        c.dias++;
        if (Math.random() < 0.2 + 0.2 * c.dica) { c.estado = 'resolvido'; c.porFbi = true; noticia(S, 'Operação do FBI prende os responsáveis: ' + titulo(c) + '.'); }
        else if (c.dias > 8) { c.estado = 'arquivado'; noticia(S, 'O caso foi arquivado sem culpados: ' + titulo(c) + '.'); }
      }
    });
    s.casos = s.casos.filter(c => c.estado !== 'resolvido' || (c.dia0 = (c.dia0 || 0) + 1) < 3);
    s.casos = s.casos.filter(c => c.estado !== 'arquivado' || (c.dia1 = (c.dia1 || 0) + 1) < 3);
    // novos casos (raros, mais quando a segurança é baixa)
    const abertos = s.casos.filter(c => c.estado !== 'resolvido' && c.estado !== 'arquivado').length;
    if (abertos < 5 && Math.random() < 0.55 - 0.1 * (seg - 1)) novoCaso(S);
    // o assassino da mata
    const sr = s.serial;
    if (!sr.resolvido) {
      if (!sr.cabana) sr.cabana = pontoLivre(['floresta'], 4242);
      if (Math.random() < 0.28) {
        const pt = pontoLivre(['floresta'], Math.random() * 99999); sr.vitimas++; sr.corpos.push({ x: pt.x, y: pt.y, nome: pick(NOMES) + ' ' + pick(SOBRE) });
        if (sr.corpos.length > 6) sr.corpos.shift();
        noticia(S, 'MATA ESCURA: encontrado mais um corpo na floresta (' + sr.vitimas + ' vítimas). A polícia fala em um possível assassino em série.', true);
      }
      if (sr.vitimas >= 5 && Math.random() < 0.05) { sr.resolvido = true; noticia(S, 'FBI prende suspeito dos crimes da Mata Escura! O assassino em série foi capturado.'); }
    }
    // lotação dos hospitais varia de dia para dia
    hosps().forEach(h => { h.lot = clamp((h.lot == null ? rand(0.1, 0.6) : h.lot) + rand(-0.25, 0.22), 0.05, 1); });
    G.save();
  }

  // ---------- Batidas / explosões ----------
  G.carCrash = function (a, b, imp, x, y) {

      const copHit = b && (a.kind === 'police' || b.kind === 'police') && (isP(a) || isP(b));
      G.carDamage(a, dmg * (copHit && isP(a) ? 0.35 : 1)); if (b) G.carDamage(b, dmg * (copHit && isP(b) ? 0.35 : 0.9));
    }
    sparks(x, y, Math.min(12, 3 + imp / 40));
    if (Math.hypot(x - P.x, y - P.y) < 600) G.snd.crash(Math.min(1, imp / 300));
    if (imp > 160) S.shake = Math.min(10, S.shake + imp / 60);

      M.onCrashPlayerCar(imp);

  G.explodeCar = function (c) {

    for (let k = 0; k < 26; k++) { const a = rand(0, TAU), v = rand(30, 190); G.particle({ x: c.x, y: c.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.5, 1.2), size: rand(9, 20), col: k % 3 === 0 ? 'smoke' : 'fire' }); }

    for (let k = 0; k < 8; k++) G.particle({ x: c.x + rand(-14, 14), y: c.y + rand(-14, 14), vx: rand(-25, 25), vy: rand(-40, -10), life: rand(2, 3.2), size: rand(10, 18), col: 'smoke' });

  // ---------- Entrar / sair de carros ----------
  function enterCar(c) {
    const P = S.player;

      // carjack: o motorista sai correndo

  // ---------- Entrada (teclado) ----------
  const keys = {}, pressed = {};
  function onKey(e, down) {
    const k = e.code;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(k)) e.preventDefault();

  window.addEventListener('keyup', e => onKey(e, false));

  const K = (...c) => !(G.overlay && G.overlay.atual) && c.some(x => keys[x]);   // com uma tela por cima (câmeras, Olho), o jogo não recebe teclas
  const Kp = (...c) => c.some(x => pressed[x]);

  // ---------- Atualização ----------
  function nearestCar(x, y, r) {
    let best = null, bd = r;
    for (const c of S.cars) { if (c.dead) continue; const d = Math.hypot(c.x - x, c.y - y); if (d < bd) { bd = d; best = c; } }
    return best;
  }

  function updatePlayer(dt) {
    const P = S.player; S.prompt = '';
    if (P.iframes > 0) P.iframes -= dt;
    const pc = P.car;
    if (pc) {
      pc.thr = K('KeyW', 'ArrowUp') ? 1 : K('KeyS', 'ArrowDown') ? -1 : 0;
      pc.steer = (K('KeyD', 'ArrowRight') ? 1 : 0) - (K('KeyA', 'ArrowLeft') ? 1 : 0);
      pc.hb = K('Space');
      S.hornDown = K('KeyH');
      P.x = pc.x; P.y = pc.y; P.vx = pc.vx; P.vy = pc.vy; P.h = pc.a;
      const oF = M.POI.oficina;
      if (Math.hypot(pc.x - oF.x, pc.y - oF.y) < oF.r && pc.speed < 90) S.prompt = 'E: CONSERTAR E REPINTAR ($150)';
      else if (pc.speed < 220) S.prompt = 'E: SAIR DO CARRO';
      if (Kp('KeyE')) {
        if (Math.hypot(pc.x - oF.x, pc.y - oF.y) < oF.r && pc.speed < 90) {
          if (S.save.money >= 150) {
            S.save.money -= 150; pc.hp = 100; pc.dead = false; P.hp = 100; S.heat = 0; S.save.paint++;
            pc.color = PAINTS[S.save.paint % PAINTS.length]; G.save(); G.snd.cash();
            G.say('Carro consertado e repintado! A polícia não te reconhece mais.', 4);
          } else G.say('Dinheiro insuficiente. Conserto custa $150.', 3);
        } else if (pc.speed < 220) exitCar();
      }
    } else {
      // a pé
      const run = K('ShiftLeft', 'ShiftRight');
      const sp = (run ? 175 : 108) * (1 + 0.05 * (S.save.folego || 0)) * (S.energia > 0 ? 1.3 : 1);   // fôlego (academia) e energético deixam você mais rápido
      let dx = (K('KeyD', 'ArrowRight') ? 1 : 0) - (K('KeyA', 'ArrowLeft') ? 1 : 0), dy = (K('KeyS', 'ArrowDown') ? 1 : 0) - (K('KeyW', 'ArrowUp') ? 1 : 0);
      const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      if (S.sentado || S.trans) { dx = 0; dy = 0; }
      if (S.bebado > 0) { const b = Math.min(1, S.bebado / 3); dx += Math.sin(S.time * 2.7) * 0.55 * b; dy += Math.cos(S.time * 2.1) * 0.55 * b; }
      // empurrão de carro / explosão
      P.x += 0; let mvx = dx * sp + P.vx, mvy = dy * sp + P.vy; P.vx *= 0.88; P.vy *= 0.88;
      const okp = (x, y) => !W.isSolid(x, y) && !W.treeHit(x, y, 4);

      if (okp(P.x, P.y + mvy * dt + Math.sign(mvy) * 6)) P.y += mvy * dt;
      if (dx || dy) { P.h += wrap(Math.atan2(dy, dx) + Math.PI / 2 - P.h) * Math.min(1, 14 * dt); P.walk += sp * dt * 0.2; }

      G.combat.ORDER.forEach((id, i) => { if (Kp('Digit' + (i + 1))) { if (!G.combat.select(S, id)) G.say('Você não tem essa arma (ou está sem munição).', 2); else G.snd.beep(); } });
      if (!S.sentado && !S.trans) G.combat.playerUpdate(S, dt, K('Space'), Kp('Space'));
      // o que dá para fazer aqui?
      let action = null;
      const car = S.sentado ? null : nearestCar(P.x, P.y, 62);
      const porta = (!S.sentado && car) ? G.lugares.acao(S, 28) : null;   // carro parado na porta não pode roubar a tecla E de quem está na porta
      if (S.sentado) action = G.lugares.acao(S);
      else if (porta && porta.t === 'lugar') action = porta;

      else {
        for (const ph of M.PHONES) if (Math.hypot(ph.x - P.x, ph.y - P.y) < 50) action = { t: 'phone', s: M.active ? 'TELEFONE (MISSÃO EM ANDAMENTO)' : 'E: ATENDER TELEFONE', ph };

        if (!action && Math.hypot(hh.x - P.x, hh.y - P.y) < hh.r + 10) action = { t: 'hospital', s: P.hp < 100 ? 'E: TRATAR FERIMENTOS (GRÁTIS)' : 'HOSPITAL' };
        const ar = M.POI.armas;

            r = new G.Car({ x: g.x + 110, y: g.y, a: Math.PI / 2, kind: 'coupe', color: PAINTS[S.save.paint % PAINTS.length], driver: 'none', mode: 'parked', owned: true });
            S.cars.push(r); S.redCar = r; G.say('Seu carro foi entregue novamente na garagem.', 4);
          } else if (Math.hypot(r.x - g.x, r.y - g.y) > 300) {

  function goWasted() {

  G.respawn = (where, loss) => respawn(where, loss);
  function respawn(where, loss) {
    const P = S.player;
    S.save.money = Math.floor(S.save.money * (1 - loss)); G.save();
    P.hp = 100; P.armor = 0; P.car = null; P.x = where.x; P.y = where.y + 4; P.vx = P.vy = 0; P.iframes = 2;

  }

  // ---------- Carros (IA, física, colisões) ----------
  function updateCars(dt) {
    const P = S.player;
    for (const c of S.cars) {
      if (c.mode === 'script') { if (G.mercadosScript) G.mercadosScript(c, dt); continue; }   // carros do estacionamento (mercados.js)
      if (c.driver === 'ai') {
        if (c.mode === 'wander' || c.mode === 'race') AI.driveTraffic(c, dt, S);
        else if (c.mode === 'prisao') G.justica.dirige(c, dt, S);
        else if (c.mode === 'chase' || c.mode === 'leave') AI.driveChase(c, dt, S);
      } else if (c.driver !== 'player') { c.thr = 0; c.steer = 0; c.hb = true; }
      G.updateCar(c, dt);
    }
    // carro x carro
    const n = S.cars.length;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { if (S.cars[i].mode === 'script' || S.cars[j].mode === 'script') continue; G.carVsCar(S.cars[i], S.cars[j]); }
    // pedestres
    const hitPed = (p, c) => {
      const cc = G.carCircles(c);
      for (let k = 0; k < 2; k++) {
        const dx = p.x - cc[k][0], dy = p.y - cc[k][1], r = cc[k][2] + 3, d = Math.hypot(dx, dy);
        if (d < r) return { dx, dy, d, r };
      }
      return null;
    };
    for (const c of S.cars) {
      if (c.dead) continue;
      const sp = c.speed;
      for (const p of S.peds) {
        if (p.state === 'down' || p.state === 'dead' || Math.abs(p.x - c.x) > 70 || Math.abs(p.y - c.y) > 70) continue;
        const h = hitPed(p, c); if (!h) continue;
        if (sp > (c.driver === 'ai' && c.kind !== 'police' ? 95 : 55)) {   // motorista da cidade devagar só empurra, não atropela
          G.combat.carHit(S, p, c, sp);
          c.vx *= 0.97; c.vy *= 0.97;
          if (c === P.car) { G.addHeat(9); const m = M.active; if (m && m.type === 'taxi' && m.stage === 1) m.comfort -= m.def.vip ? 25 : 12; }
          else if (c.driver === 'ai' && c.kind === 'police') { }
        } else { const d = h.d || 1; p.x += h.dx / d * (h.r - h.d + 1); p.y += h.dy / d * (h.r - h.d + 1); }
      }
      // jogador a pé
      if (!P.car && S.mode === 'play') {
        const h = hitPed(P, c);
        if (h) {
          if (sp > 110 && P.iframes <= 0) { P.hp -= 10 + sp * 0.06; P.iframes = 0.9; P.vx = h.dx / (h.d || 1) * 220; P.vy = h.dy / (h.d || 1) * 220; G.snd.bonk(); S.shake = 5; G.combat.spray(S, P.x, P.y, Math.atan2(h.dy, h.dx), 6, 160); }
          else { const d = h.d || 1; P.x += h.dx / d * (h.r - h.d + 1); P.y += h.dy / d * (h.r - h.d + 1); }
        }
      }
    }
  }

  // ---------- Polícia ----------
  function updatePolice(dt) {
    const P = S.player, ref = P.car || P;
    const lvlBefore = S.heatLevel;
    S.heatLevel = lvlOf(S.heat);
    const chasers = S.cars.filter(c => c.kind === 'police' && c.mode === 'chase' && !c.dead);
    const copPeds = S.peds.filter(p => p.kind === 'cop' && p.state !== 'dead');
    S.chasers = chasers.length + copPeds.length;
    // esfriar
    if (S.heat > 0) {
      const near = chasers.some(c => Math.hypot(c.x - ref.x, c.y - ref.y) < 520) || copPeds.some(p => Math.hypot(p.x - ref.x, p.y - ref.y) < 520);
      const heliSees = S.heli && Math.hypot(S.heli.x - ref.x, S.heli.y - ref.y) < 300;
      if (!near) S.heat = Math.max(0, S.heat - dt * (heliSees ? 1.2 : 2.6));
    }
    if (M.active && M.active.type === 'escape' && S.heat <= 0 && false) { }
    S.heatLevel = lvlOf(S.heat);
    if (S.heatLevel === 0 && lvlBefore > 0) {
      S.cars.forEach(c => { if (c.kind === 'police' && c.mode === 'chase') c.mode = 'leave'; });
      S.heli = S.heli ? Object.assign(S.heli, { life: 0.1 }) : null;
      if (!M.active || M.active.type !== 'escape') G.say('Você despistou a polícia.', 4);
    }
    if (S.heatLevel > lvlBefore && lvlBefore === 0) G.say('A polícia está atrás de você!', 4);
    // reforços
    const target = [0, 2, 3, 4, 5, 6][S.heatLevel];
    S.copT -= dt;
    if (chasers.length < target && S.copT <= 0) { S.copT = 1.6; AI.spawnPolice(S, 1); }
    if (S.heatLevel >= 3) { S.blockT -= dt; if (S.blockT <= 0) { S.blockT = 30; AI.spawnRoadblock(S); } } else S.blockT = 8;
    if (S.heatLevel >= 4 && !S.heli) S.heli = { x: ref.x + 900, y: ref.y - 700, vx: 0, vy: 0, rot: 0, a: 0, life: 45 };
    AI.updateHeli(S, dt);
    // preso?
    if (S.mode === 'play' && S.heatLevel > 0) {
      const close = chasers.filter(c => Math.hypot(c.x - ref.x, c.y - ref.y) < (P.car ? 120 : 90));
      // policiais a pé que querem prender (só quando não estão em tiroteio) também contam
      const cuff = copPeds.filter(p => p.arresting && Math.hypot(p.x - ref.x, p.y - ref.y) < (P.car ? 55 : 42));
      const ok = P.car ? (P.car.speed < 70 && close.length + cuff.length >= 2) : (close.length >= 1 || cuff.length >= 1);
      if (ok) S.bustT += dt * (P.car ? 1 : 1.6); else S.bustT = Math.max(0, S.bustT - dt * 1.5);
      if (S.bustT > 3) goBusted();
    } else S.bustT = 0;
  }

  // ---------- Tráfego / pedestres: nascer e sumir ----------
  function managePopulation(dt) {
    const P = S.player, ref = P.car || P;
    // carros
    S.spawnT -= dt;
    const civ = S.cars.filter(c => c.driver === 'ai' && (c.mode === 'wander'));
    const fd = S.dayT - Math.floor(S.dayT), capCarros = (fd > 0.3 && fd < 0.4) || (fd > 0.68 && fd < 0.78) ? 22 : (fd < 0.16 || fd > 0.88) ? 11 : 16;   // hora do rush tem mais carros, madrugada menos
    if (civ.length < capCarros && S.spawnT <= 0) { S.spawnT = 0.5; AI.spawnTraffic(S, Math.random() < 0.06 ? 'police' : null); }
    for (const c of S.cars) { if (c.driver === 'ai' && c.mode === 'wander') { if (c.speed < 8) c.idleT += dt; else c.idleT = 0; } }
    S.cars = S.cars.filter(c => {
      if (c.idleT > 14 && Math.hypot(c.x - ref.x, c.y - ref.y) > 650) return false;
      if (c === P.car || c.owned || c.tag === 'mission' || c.tag === 'crime' || (M.active && M.active.rivals && M.active.rivals.some(r => r.car === c))) return true;
      const d = Math.hypot(c.x - ref.x, c.y - ref.y);
      if (c.mode === 'block') return d < 1700 && S.time - c.born < 70;
      if (c.mode === 'chase') return d < 1800;
      if (c.mode === 'leave') return d < 900;
      if (c.mode === 'parked' || c.mode === 'wreck') return d < 1800 || c.owned;
      return d < 1500 && !(c.dead && c.burnT > 25 && d > 700);
    });
    // pedestres
    S.pedSpawnT -= dt;
    const alive = S.peds.filter(p => !p.mission && !p.target && p.state !== 'dead').length;
    const hr = G.lugares.hora(S), capPeds = (hr >= 22 || hr < 5) ? 14 : (hr >= 6 && hr < 9) || (hr >= 12 && hr < 14) || (hr >= 17 && hr < 20) ? 40 : 30;   // a rua enche na hora do rush e esvazia de madrugada
    if (alive < capPeds && S.pedSpawnT <= 0) { S.pedSpawnT = 0.25; AI.spawnPed(S); }
    S.peds = S.peds.filter(p => !p.dead && (p.mission || p.target || Math.hypot(p.x - ref.x, p.y - ref.y) < 1150));
    for (const p of S.peds) if (p.state === 'wait') { p.walk = 0; } else AI.updatePed(p, dt, S);
  }

  // ---------- Partículas ----------
  function updateParticles(dt) {
    for (const p of S.particles) {
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.col === 'smoke') { p.size += 10 * dt; p.vx *= 0.98; } else if (p.col === 'ring') p.size += 330 * dt; else if (p.col === 'fire') { p.size -= 4 * dt; p.vy -= 10 * dt; } else { p.vx *= 0.92; p.vy *= 0.92; }
    }
    S.particles = S.particles.filter(p => p.t < p.max && p.size > 0.5);
  }

  // ---------- Câmera ----------
  function updateCamera(dt) {
    const P = S.player, ref = P.car || P;
    const sp = P.car ? P.car.speed : 0;
    const zt = P.car ? 1.6 - 0.5 * Math.min(1, sp / 380) : 1.85;
    S.cam.z += (zt - S.cam.z) * Math.min(1, 2.2 * dt);
    const tx = ref.x + (ref.vx || 0) * 0.28, ty = ref.y + (ref.vy || 0) * 0.28;
    S.cam.x += (tx - S.cam.x) * Math.min(1, 6 * dt); S.cam.y += (ty - S.cam.y) * Math.min(1, 6 * dt);
    S.shake = Math.max(0, S.shake - dt * 18);
  }

  function update(dt) {
    S.time += dt; S.dayT += dt / 420;
    G.cidade.atualizar(S, dt);
    if (G.extras) G.extras.atualizar(S, dt);
    if (S.msg) { S.msg.t -= dt; if (S.msg.t <= 0) S.msg = null; }
    if (S.ban) { S.ban.t -= dt; if (S.ban.t <= 0) S.ban = null; }
    if (S.radioT > 0) S.radioT -= dt;
    if (S.mode === 'play') {
      updatePlayer(dt);
      updateCars(dt);
      managePopulation(dt);
      G.detalhes.update(S, W, dt);
      G.lugares.atualizar(S, dt);
      updatePolice(dt);
      G.justica.atualizar(S);
      G.combat.update(S, dt);
      M.update(S, dt);
    } else if (S.mode === 'preso') {
      S.modeT += dt; G.justica.rodar(S, dt); updateCars(dt); managePopulation(dt); G.combat.update(S, dt);
    } else if (S.mode === 'wasted' || S.mode === 'busted') {
      S.modeT += dt; updateCars(dt); managePopulation(dt); G.combat.update(S, dt);
      if (S.modeT > 3.2) respawn(S.mode === 'wasted' ? (G.crimes ? G.crimes.respawnHospital(S, S.player.x, S.player.y) : M.POI.hospital) : M.POI.delegacia, S.mode === 'wasted' ? 0.1 : 0.15);
    }
    updateParticles(dt);
    updateCamera(dt);
    // som
    const ref = S.player.car || S.player;
    let sv = 0; for (const c of S.cars) if (c.kind === 'police' && c.siren && !c.dead) { const d = Math.hypot(c.x - ref.x, c.y - ref.y); sv = Math.max(sv, clamp(1 - d / 900, 0, 1)); }
    G.snd.update({ inCar: !!S.player.car, car: S.player.car, horn: S.hornDown && !!S.player.car, sirenVol: S.mode === 'play' ? sv : 0 });
  }

  // ---------- Desenho ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const darkC = document.createElement('canvas'); darkC.width = VW; darkC.height = VH;
  const dctx = darkC.getContext('2d');

  function darkness() {
    const f = ((S.dayT % 1) + 1) % 1;
    if (f < 0.55) return 0; if (f < 0.65) return (f - 0.55) / 0.1; if (f < 0.92) return 1; return 1 - (f - 0.92) / 0.08;
  }

  function drawWorld() {
    const cam = S.cam, z = cam.z;
    const sx = S.shake ? rand(-S.shake, S.shake) * 0.5 : 0, sy = S.shake ? rand(-S.shake, S.shake) * 0.5 : 0;
    ctx.save();
    ctx.translate(VW / 2 + sx, VH / 2 + sy); ctx.scale(z, z); ctx.translate(-cam.x, -cam.y);
    const vx0 = cam.x - VW / 2 / z - 40, vy0 = cam.y - VH / 2 / z - 40, vx1 = cam.x + VW / 2 / z + 40, vy1 = cam.y + VH / 2 / z + 40;
    W.drawChunks(ctx, vx0, vy0, vx1, vy1);
    W.drawWaterFx(ctx, S.time, vx0, vy0, vx1, vy1);   // brilhos na água
    G.cidade.desenhar(ctx, S, vx0, vy0, vx1, vy1, S.time);   // obras, prédios novos, pontes e aeroporto
    if (G.pedagio) G.pedagio.desenhar(ctx, S, vx0, vy0, vx1, vy1, S.time);
    const inV = o => o.x > vx0 - 80 && o.x < vx1 + 80 && o.y > vy0 - 80 && o.y < vy1 + 80;
    G.combat.drawDecals(ctx, S, inV);       // sangue, marcas de pneu e chamuscado
    M.drawWorld(ctx, S, S.time);
    G.combat.drawPickups(ctx, S, inV, S.time);
    const vis = S.peds.filter(inV);
    vis.forEach(p => { if (p.state === 'dead') SP.drawPed(ctx, p, S.time); }); // corpos ficam embaixo dos carros
    // destroços e estacionados primeiro
    const cars = S.cars.filter(inV).sort((a, b) => (a.dead ? 0 : 1) - (b.dead ? 0 : 1));
    cars.forEach(c => SP.drawCar(ctx, c, S.time));
    vis.forEach(p => { if (p.state !== 'dead') SP.drawPed(ctx, p, S.time); });
    if (G.fbi) G.fbi.desenhar(ctx, S, inV, S.time);   // agentes do FBI patrulhando
    if (!S.player.car && !S.player.escondido && S.mode !== 'title') { if (S.player.iframes > 0 && Math.floor(S.time * 14) % 2 === 0) { } else SP.drawPed(ctx, S.player, S.time); }
    G.detalhes.draw(ctx, S, inV);            // pombos
    G.lugares.desenhar(ctx, S, inV);         // marcadores dos lugares, balões de fala, seta do guia
    AI.drawLights(ctx, vx0, vy0, vx1, vy1, S.time);
    G.combat.drawAir(ctx, S, inV);          // balas e granadas
    // partículas
    S.particles.forEach(p => {
      if (!inV(p)) return;
      const k = 1 - p.t / p.max;
      ctx.save(); ctx.translate(p.x, p.y);
      if (p.col === 'smoke') { ctx.globalAlpha = (p.a || 0.55) * k; ctx.fillStyle = p.tint || '#3a3a3f'; ctx.beginPath(); ctx.arc(0, 0, p.size, 0, TAU); ctx.fill(); }
      else if (p.col === 'ring') { ctx.globalAlpha = k * 0.7; ctx.strokeStyle = '#ffe2b0'; ctx.lineWidth = 2 + 6 * k; ctx.beginPath(); ctx.arc(0, 0, p.size, 0, TAU); ctx.stroke(); }
      else if (p.col === 'fire') { ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = k > 0.6 ? '#ffe15a' : k > 0.3 ? '#ff8a1e' : '#d8321a'; ctx.beginPath(); ctx.arc(0, 0, p.size, 0, TAU); ctx.fill(); }
      else if (p.col === 'blood') { ctx.globalAlpha = Math.min(1, k * 1.8); ctx.fillStyle = '#8c0b10'; ctx.beginPath(); ctx.arc(0, 0, p.size, 0, TAU); ctx.fill(); }
      else if (p.col === 'flash') { ctx.globalAlpha = 0.95; const g = ctx.createRadialGradient(0, 0, 1, 0, 0, p.size * 2.2); g.addColorStop(0, 'rgba(255,250,200,1)'); g.addColorStop(0.5, 'rgba(255,170,50,0.7)'); g.addColorStop(1, 'rgba(255,120,0,0)'); ctx.fillStyle = g; ctx.fillRect(-p.size * 2.2, -p.size * 2.2, p.size * 4.4, p.size * 4.4); }
      else { ctx.globalAlpha = k; ctx.fillStyle = '#ffd86a'; ctx.fillRect(-1.5, -1.5, 3, 3); }
      ctx.restore();
    });
    G.cidade.desenharAlto(ctx, S, vx0, vy0, vx1, vy1, S.time);   // guindastes e aviões no ar
    W.drawBridgeHigh(ctx, vx0, vy0, vx1, vy1);   // arcos de aço das pontes principais
    if (G.pedagio) G.pedagio.desenharAlto(ctx, S, vx0, vy0, vx1, vy1, S.time);
    if (G.cameras) G.cameras.desenharRua(ctx, S, vx0, vy0, vx1, vy1, S.time);
    // helicóptero
    const h = S.heli;
    if (h) {
      const ref = S.player.car || S.player;
      ctx.save(); ctx.translate(h.x + 50, h.y + 70); ctx.rotate(h.a); ctx.fillStyle = 'rgba(0,0,10,0.3)'; ctx.beginPath(); ctx.ellipse(0, 0, 14, 34, 0, 0, TAU); ctx.fill(); ctx.restore();
      // holofote
      const g = ctx.createRadialGradient(ref.x, ref.y, 10, ref.x, ref.y, 110); g.addColorStop(0, 'rgba(255,255,220,0.45)'); g.addColorStop(1, 'rgba(255,255,220,0)');
      ctx.fillStyle = g; ctx.fillRect(ref.x - 110, ref.y - 110, 220, 220);
      ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.a);
      ctx.fillStyle = '#20232b'; ctx.beginPath(); ctx.ellipse(0, 0, 12, 26, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#9ec8ff'; ctx.beginPath(); ctx.ellipse(0, -10, 8, 10, 0, 0, TAU); ctx.fill();
      ctx.fillRect(-2, 22, 4, 26); ctx.fillStyle = '#2a2d36'; ctx.fillRect(-10, 46, 20, 3);
      ctx.rotate(h.rot); ctx.strokeStyle = 'rgba(20,20,25,0.75)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-58, 0); ctx.lineTo(58, 0); ctx.moveTo(0, -58); ctx.lineTo(0, 58); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    // noite
    const dk = G.luz.nivel > 0 ? 0 : darkness();   // com luz.js ligada, a noite vem de lá
    if (dk > 0.02) {
      dctx.globalCompositeOperation = 'source-over'; dctx.clearRect(0, 0, VW, VH);
      dctx.fillStyle = 'rgba(6,8,40,' + (0.62 * dk) + ')'; dctx.fillRect(0, 0, VW, VH);
      dctx.globalCompositeOperation = 'destination-out';
      const toS = (x, y) => [(x - cam.x) * z + VW / 2, (y - cam.y) * z + VH / 2];
      const glow = (x, y, r, a) => { const [px, py] = toS(x, y); if (px < -r || px > VW + r || py < -r || py > VH + r) return; const g = dctx.createRadialGradient(px, py, 2, px, py, r); g.addColorStop(0, 'rgba(0,0,0,' + a + ')'); g.addColorStop(1, 'rgba(0,0,0,0)'); dctx.fillStyle = g; dctx.beginPath(); dctx.arc(px, py, r, 0, TAU); dctx.fill(); };
      W.lamps.forEach(l => glow(l.x, l.y, 120 * z, 0.75));
      S.particles.forEach(p => { if (p.col === 'flash') glow(p.x, p.y, 100 * z, 0.9); });
      const cone = (x, y, ang, len, spread, a) => {
        const [px, py] = toS(x, y), L = len * z; if (px < -L || px > VW + L || py < -L || py > VH + L) return;
        const g = dctx.createRadialGradient(px, py, 4, px, py, L); g.addColorStop(0, 'rgba(0,0,0,' + a + ')'); g.addColorStop(1, 'rgba(0,0,0,0)');
        dctx.fillStyle = g; dctx.beginPath(); dctx.moveTo(px, py); dctx.arc(px, py, L, ang - spread, ang + spread); dctx.closePath(); dctx.fill();
      };
      S.particles.forEach(p => { if (p.col === 'ring') glow(p.x, p.y, 280 * z, 0.9); else if (p.col === 'fire' && p.size > 8) glow(p.x, p.y, p.size * 5 * z, 0.45); });
      S.cars.forEach(c => {
        if (c.dead || !inV(c)) return;
        if (c.lights !== false) cone(c.x + c.fx * 36, c.y + c.fy * 36, Math.atan2(c.fy, c.fx), 270, 0.34, 0.95);
        glow(c.x + c.fx * 85, c.y + c.fy * 85, 130 * z, 0.9); glow(c.x + c.fx * 40, c.y + c.fy * 40, 70 * z, 0.8); glow(c.x, c.y, 50 * z, 0.5);
      });
      const ref = S.player.car || S.player; glow(ref.x, ref.y, 70 * z, 0.5);
      dctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(darkC, 0, 0);
    }
    if (G.luz.desenhar(ctx, S, W, cam, z, inV)) { /* visual cinematográfico (luz.js) */ } else {
      const vg = ctx.createRadialGradient(400, 300, 240, 400, 300, 580); vg.addColorStop(0, 'rgba(0,0,10,0)'); vg.addColorStop(1, 'rgba(0,0,12,0.34)');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);   // vinheta (efeito de câmera)
    }
    G.combat.drawScreen(ctx, S);            // tela vermelha ao levar dano
  }

  // ---------- Telas ----------
  function drawTitle(time) {

    if (saved) H.txt(ctx, 'N: NOVO JOGO (apaga o progresso)', 400, 285, 16, '#ff9a9a', 'center');
    const L = [

    H.txt(ctx, 'Clique na tela para ativar o teclado • ATENÇÃO: violência explícita, sangue e armas (+16) • HTML5 Canvas', 400, 580, 13, '#bbb', 'center');

  function drawOverlay(title, sub, col) {
    const H = G.hud;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, VW, VH);
